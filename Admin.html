<meta charset="utf-8">
<style>
:root{
  --bg:#0a0a12; --panel:#12121f; --panel2:#16162a; --line:#22223a; --line2:#2e2e4a;
  --txt:#e8ecf6; --sub:#9aa6c4; --dim:#5a6688;
  --accent:#7aa2ff; --accent-bg:#12233f; --accent-line:#2a5590;
  --ok:#7be0a8; --okbg:#0d2618; --okline:#2a6a44;
  --warn:#ffbf6a; --warnbg:#241800; --warnline:#7a5010;
  --danger:#e79ad6; --dangerbg:#241014; --dangerline:#5a2430;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;}
.wrap{min-height:100vh;display:flex;flex-direction:column;}
.hd{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#12101c,#0c0b14);flex-wrap:wrap;}
.hd .brand{font-size:16px;font-weight:800;letter-spacing:.4px;}
.hd .brand .z{color:var(--accent);}
.hd .who{font-size:12px;color:var(--sub);font-weight:700;}
.hd .sp{flex:1;}
.tabs{display:flex;gap:5px;padding:10px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;}
.tab{padding:9px 13px;border-radius:9px 9px 0 0;border:1px solid transparent;background:transparent;color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;}
.tab.on{background:var(--panel2);border-color:var(--line2);border-bottom-color:var(--panel2);color:var(--accent);}
/* グループ行（14タブを5グループに束ねた第1階層）＝塗りpillで主役。サブタブ(.tab)は従来の下線タブのまま第2階層 */
.groups{display:flex;gap:7px;padding:12px 14px 6px;background:var(--panel);flex-wrap:wrap;align-items:center;}
.grp{padding:9px 17px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--sub);font-size:14px;font-weight:800;cursor:pointer;transition:border-color .12s,background .12s;}
.grp:hover{border-color:var(--accent);}
.grp.on{background:var(--accent);border-color:var(--accent);color:#0b0b12;}
.tabs{padding-top:2px;}
.body{flex:1;padding:16px;overflow-y:auto;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.finput{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;color:var(--txt);font-size:14px;outline:none;}
.finput.grow{min-width:200px;flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;}
.chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);}
.cnt{font-size:12px;color:var(--dim);font-weight:700;}
.sec{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.sec-t{font-size:14px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.sec-t .sub{font-size:11px;color:var(--dim);font-weight:600;}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--txt);font-size:13px;font-weight:800;cursor:pointer;}
.btn.pri{background:linear-gradient(180deg,#153a72,#0f2040);border-color:var(--accent-line);color:#dcecff;}
.btn.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok);}
.btn.warn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn);}
.btn.dng{background:var(--dangerbg);border-color:var(--dangerline);color:#f0a0b0;}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:default;}

/* staff grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.card{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.card-nm{font-size:16px;font-weight:800;flex:1;}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap;}
.badge.line-on{background:var(--okbg);border:1px solid var(--okline);color:var(--ok);}
.badge.line-off{background:#1a1013;border:1px solid #5a2430;color:#e0a0b0;}
.badge.kiosk{background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent);}
.badge.lock{background:#1c1830;border:1px solid #3a3560;color:#b9a6ff;}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.row .lbl{font-size:12px;color:var(--sub);font-weight:700;width:72px;flex-shrink:0;}
.rolesel{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:14px;font-weight:700;outline:none;}
.perms{display:flex;gap:8px;margin-top:11px;}
.toggle{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--sub);font-size:13px;font-weight:800;cursor:pointer;}
.toggle.on.admin{background:#241028;border-color:#7a3a6a;color:#f0a0e0;}
.toggle.on.safe{background:var(--warnbg);border-color:var(--warnline);color:var(--warn);}
.toggle.on.gunshi{background:#0d2233;border-color:#2a6a9a;color:#7ac8ff;}
.toggle.on.notice{background:#0d2a1a;border-color:#2a7a4a;color:#6ee0a0;}
.toggle.off.notice{background:#2a1414;border-color:#6b3a3a;color:#ff9aa0;}
.toggle.locked{opacity:.5;cursor:not-allowed;}

/* matrix / tables */
.mtx-wrap{overflow-x:auto;}
table.mtx{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;}
table.mtx th,table.mtx td{border:1px solid var(--line);padding:8px 10px;text-align:center;}
table.mtx th{background:#14142a;color:var(--sub);font-weight:800;}
table.mtx td.nm{text-align:left;font-weight:800;color:#eef;white-space:nowrap;}
table.mtx td.role{text-align:left;color:var(--sub);font-weight:700;}
table.mtx td.cell{cursor:pointer;min-width:52px;}
table.mtx td.cell:hover{background:var(--accent-bg);}
.yes{color:var(--ok);font-weight:900;} .no{color:#44506a;}
.mtx tr:nth-child(even) td{background:#101020;}
.mtx.sm th,.mtx.sm td{padding:5px 8px;font-size:12px;}
.mtx-scroll{overflow:auto;max-height:56vh;border:1px solid var(--line);border-radius:8px;}
table.mtx td.cell.pending{background:#2a1f0a;color:#e0b84a;}
table.mtx td.cell .pd{font-size:9px;background:#8a6d20;color:#fff;border-radius:3px;padding:0 3px;margin-right:2px;vertical-align:middle;}
table.mtx td.cell .cf{display:block;line-height:1.25;}
table.mtx td.cell .wi{display:block;font-size:9px;color:#7fb0e6;opacity:.9;margin-top:2px;white-space:nowrap;font-weight:600;}
table.mtx td.cell .lb{display:inline-block;font-size:8px;font-weight:700;line-height:1.4;margin-right:3px;padding:0 3px;border-radius:3px;vertical-align:middle;opacity:.9;}
table.mtx td.cell .cf .lb{background:#20406a;color:#a9cdf2;}
table.mtx td.cell .wi .lb{background:#3a3320;color:#d8cf8a;}
table.mtx tr.total-row td{background:#101a2e !important;color:#8fd0ff;font-weight:900;border-bottom:2px solid #2a5aaa;}
table.mtx tr.total-row td .tp{color:#e0b84a;font-size:10px;font-weight:800;}
#scm-wrap .scm-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;}
#scm-wrap .scm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;background:#141428;border:1px solid var(--line);border-radius:14px;padding:18px;width:min(340px,92vw);display:flex;flex-direction:column;gap:9px;box-shadow:0 12px 44px rgba(0,0,0,.55);}
#scm-wrap .scm-t{font-weight:800;font-size:16px;color:#eef;}
#scm-wrap .scm-sub{font-size:12px;color:var(--sub);margin:-4px 0 4px;}
#scm-wrap .scm .btn{width:100%;padding:12px;font-size:14px;}
#scm-wrap .shp-range{display:flex;gap:6px;align-items:center;}
#scm-wrap .shp-range select{flex:1;padding:11px 4px;background:#0f0f22;color:#eef;border:1px solid var(--line);border-radius:8px;font-size:14px;min-width:0;}
#scm-wrap .shp-range .sep{color:var(--sub);flex-shrink:0;}
#scm-wrap .shp-range .btn{width:auto;flex-shrink:0;padding:11px 14px;}
#scm-wrap .shp-rest{display:flex;gap:6px;}
#scm-wrap .shp-rest .btn{width:auto;flex:1;}
#scm-wrap .shp-step{font-size:11px;color:var(--sub);margin:6px 0 -2px;}
.mtx-scroll table.mtx{min-width:520px;}
.mtx-scroll .mtx th{position:sticky;top:0;z-index:1;}
/* 名前列を左固定（横スクロールしても名前が見える） */
.mtx-scroll .mtx td.nm{position:sticky;left:0;z-index:2;background:#0d0d1a;box-shadow:1px 0 0 var(--line);}
.mtx-scroll .mtx tr:nth-child(even) td.nm{background:#111124;}
.mtx-scroll .mtx th:first-child{left:0;z-index:3;}
/* 🧾売上伝票: 日別アコーディオン > 伝票 > 明細。色は既存のCSS変数に寄せる（portal.htmlの青系ハードコードを
   持ち込むとこの画面だけ浮くため移植時に置換した）。 */
.bill-day{border:1px solid var(--line2);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.bd-head{padding:11px 13px;background:var(--panel2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.bd-head:hover{background:#1b1b33;}
.bd-date{font-size:13px;color:var(--txt);font-weight:700;}
.bd-cnt{color:var(--sub);font-weight:400;font-size:11px;}
.bd-pend{font-size:10px;font-weight:800;color:#e0b060;border:1px solid #6a5320;background:#2a2108;border-radius:4px;padding:1px 5px;}
.bd-total{font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap;}
.bill-castrow{cursor:pointer;}
.bill-castrow:hover td{background:var(--accent-bg);}
.bill-slip{padding:9px 13px;border-top:1px solid var(--line);cursor:pointer;}
.bill-slip:hover{background:var(--panel);}
.bs-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.bs-cust{font-size:12px;color:var(--txt);min-width:0;}
.bs-meta{color:var(--sub);}
.bs-amt{font-size:13px;font-weight:700;color:#9fd0a0;white-space:nowrap;}
.bs-sub{font-size:10px;color:var(--sub);margin-top:2px;}
.bi-box{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-top:8px;}
.bi-bottle{font-size:11px;color:#e0b060;margin-bottom:7px;font-weight:600;}
.bi-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:4px 0;border-bottom:1px solid var(--line);}
.bi-row:last-child{border-bottom:0;}
.bi-nm{color:var(--sub);min-width:0;}
.bi-cat{color:var(--dim);}
.bi-amt{color:var(--txt);font-weight:600;white-space:nowrap;}
.bi-msg{font-size:11px;color:var(--sub);padding:6px 2px;}
.bi-msg.err{color:#e88;}
.bi-msg.warn{color:#c9a066;}
/* 🧮給与明細の✎列を右固定。表が15列で横スクロールする＝固定しないと初期表示に✎が1つも映らず
   「機能が無い」と読める（実際に迷わせた）。⚠️sticky セルは背景が透けると下の数字と重なる＝
   行の背景を明示する必要があり、偶数行・合計行はそれぞれ別に上書きしないと1行だけ透ける。 */
table.mtx td.kyu-act{position:sticky;right:0;z-index:2;background:var(--bg);box-shadow:-1px 0 0 var(--line);}
table.mtx th.kyu-act{position:sticky;right:0;z-index:3;background:#14142a;box-shadow:-1px 0 0 var(--line);}
.mtx tr:nth-child(even) td.kyu-act{background:#101020;}
table.mtx tr.total-row td.kyu-act{background:#101a2e !important;}
/* 役割ごとの行の色分け（キャスト=青 / 体験=緑 / 派遣=紫 / 黒服=琥珀）。名前固定列も同色に上書き */
table.mtx tbody tr.rc-cast   td{background:#0e1c30;}
table.mtx tbody tr.rc-taiken td{background:#0d2117;}
table.mtx tbody tr.rc-haken  td{background:#1c1136;}
table.mtx tbody tr.rc-kuro   td{background:#2a1e08;}
.mtx-scroll .mtx tr.rc-cast   td.nm{background:#0e1c30;}
.mtx-scroll .mtx tr.rc-taiken td.nm{background:#0d2117;}
.mtx-scroll .mtx tr.rc-haken  td.nm{background:#1c1136;}
.mtx-scroll .mtx tr.rc-kuro   td.nm{background:#2a1e08;}
.shift-filter{margin:0 0 10px;}
/* shift tab 2-col top */
.shift-top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.shift-top>.sec{flex:1;min-width:290px;margin-bottom:0;}
.sec.compact{margin-bottom:0;}
.addbar{display:flex;gap:8px;flex-wrap:wrap;}
.addbar .finput{flex:1;min-width:96px;}

/* reference */
.ref{display:flex;flex-direction:column;gap:10px;max-width:760px;}
.ref-item{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;}
.ref-item h4{margin:0 0 4px;font-size:15px;} .ref-item p{margin:0;font-size:13px;color:var(--sub);line-height:1.6;}
.ref-perm h4{color:var(--warn);}

/* generic list rows */
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap;}
.lrow .main{flex:1;min-width:160px;}
.lrow .nm{font-size:14px;font-weight:800;}
.lrow .meta{font-size:11px;color:var(--dim);margin-top:2px;}
.sw{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--sub);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
.sw.on{background:var(--okbg);border-color:var(--okline);color:var(--ok);}
.ta{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;resize:vertical;outline:none;margin-top:6px;font-family:inherit;}
.tin{width:76px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);padding:6px 8px;font-size:13px;text-align:center;outline:none;}

.empty{text-align:center;color:var(--dim);padding:40px 12px;font-size:14px;}
.gate{max-width:420px;margin:80px auto;text-align:center;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:36px 24px;}
.gate .ic{font-size:44px;} .gate h2{margin:12px 0 6px;} .gate p{color:var(--sub);font-size:13px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0d2618;border:1px solid #2a6a44;color:#9fe8c0;font-size:13px;font-weight:700;padding:11px 20px;border-radius:12px;z-index:70;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;} .toast.err{background:#241014;border-color:#5a2430;color:#e0a0b0;}
.hint{font-size:12px;color:var(--dim);margin:-4px 0 10px;}
.sss-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.sss-chip{font-size:12px;font-weight:800;color:#fff;padding:5px 12px;border-radius:20px;}
.sss-block{margin-top:8px;}
.sss-h{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:5px;}
.sss-names{display:flex;gap:6px;flex-wrap:wrap;}
.sss-n{font-size:12px;background:#2a3550;color:#cdd8ee;padding:3px 9px;border-radius:8px;}
.sss-n.ok{background:#1e3a2a;color:#a8d8b8;}
.sss-n.unreg{background:#4a2a2a;color:#e0b0b0;}
.sss-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line,#2a3550);}
.who .logout{color:var(--accent);cursor:pointer;margin-left:10px;font-weight:800;}
/* QRログインゲート */
.qrgate{max-width:400px;margin:60px auto;text-align:center;display:flex;flex-direction:column;align-items:center;}
.qrgate h2{margin:0 0 6px;font-size:22px;}
.qrsub{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:20px;}
.qrbox{width:240px;height:240px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;overflow:hidden;}
.qrbox img{display:block;width:240px;height:240px;}
.qrload{color:#8a9ac0;font-size:13px;font-weight:700;padding:20px;}
.qrhint{font-size:12px;color:var(--sub);margin-top:18px;line-height:1.6;}
/* PIN */
.pinrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.pinrow .pinlbl{font-size:12px;color:var(--sub);font-weight:800;}
.pinrow .pinstat{font-size:11px;color:var(--dim);font-weight:700;flex:1;}
.pinrow .pinstat.set{color:var(--warn);}
/* 🍶 メニュー。メニュー落ちのカードは沈めるが消さない＝現物は残っており数えて売り切る対象のまま */
.mn-grid{margin-top:10px;}
.mn-card{display:flex;flex-direction:column;gap:9px;}
.mn-card.off{opacity:.72;border-color:#4a3340;}
.mn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mn-lbl{font-size:11px;font-weight:800;color:var(--dim);white-space:nowrap;}
.mn-qty{font-size:12px;color:var(--sub);font-weight:700;margin-right:auto;}
.mn-qty b{color:var(--txt);font-size:14px;}
.mn-nolink{font-size:11px;color:var(--dim);font-weight:700;margin-right:auto;}
.mn-broken{font-size:11px;color:#ff9db4;font-weight:800;margin-right:auto;}
.mn-b-off{background:#4a3340;color:#ffb0c4;margin-left:7px;}
.mn-stop{border-color:#6a4456;color:#ffb0c4;}
.mn-del{padding:2px 9px;color:var(--dim);}
/* 価格は参照専用（会計はTRUSTが正）＝主張させない */
.mn-price{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap;margin-left:8px;}
.mn-cat{margin-bottom:14px;}
.mn-cat>summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--accent);padding:6px 0;display:flex;align-items:center;gap:8px;}
.mn-cnt{font-size:11px;font-weight:700;color:var(--dim);}
.mn-cnt.off{color:#ffb0c4;}
.mn-warn{font-size:11px;font-weight:800;color:var(--warn);}
.mn-go{border-color:var(--okline);color:var(--ok);}
.mn-bulk-ok{margin:10px 0 6px;padding:8px 10px;border-radius:8px;background:var(--okbg);border:1px solid var(--okline);color:var(--ok);font-size:12px;font-weight:700;}
.mn-bulk-err{margin:10px 0;padding:8px 10px;border-radius:8px;background:#2a1016;border:1px solid #6a4456;color:#ffb0c4;font-size:12px;font-weight:700;line-height:1.7;}
.mn-pv{display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px;}
.mn-pv-c{color:var(--accent);font-weight:800;min-width:80px;font-size:11px;}
.mn-pv-n{flex:1;color:var(--txt);font-weight:700;}
/* 🔧 重複品名。統合は不可逆なので、どちらへ寄せるかを本数とフロアを見せた上で選ばせる */
.dup-card{display:flex;flex-direction:column;gap:9px;border-color:#4a4030;}
.dup-card.sure{border-color:#6a5a2a;}
.dup-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dup-b-sure{background:#3a2f10;color:var(--warn);}
.dup-b-may{background:#1a2436;color:var(--accent);}
.dup-why{font-size:10px;color:var(--dim);font-weight:700;}
.dup-row{display:flex;align-items:stretch;gap:8px;}
.dup-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 9px;}
.dup-nm{font-size:12px;font-weight:800;color:var(--txt);word-break:break-word;}
.dup-meta{font-size:10px;color:var(--sub);font-weight:700;}
.dup-meta b{color:var(--txt);font-size:12px;}
.dup-btn{margin-top:auto;padding:5px 8px;font-size:10px;}
.dup-arrow{align-self:center;color:var(--dim);font-size:14px;}
/* 黒服タスクのメモ＝軍師のカードとLINEに同じ文面が出る。ここでも改行を保って確認できるようにする */

function pollAdminAuth(token){
  stopAAuth();

function openMendanRow(id){

function drawMendanDetail(m){

  var pl=function(l,u){ return u?('<a href="'+esc(u)+'" target="_blank" style="color:var(--accent);font-size:13px;margin-right:18px">'+l+'</a>'):('<span style="color:var(--dim);font-size:13px;margin-right:18px">'+l+'なし</span>'); };

      +R('持ち客数',num(m.holdCust,'人'))+R('見込み客数',num(m.expCust,'人'))+R('見込み売上',mendanYen_(m.expSales))

    : R('経験',m.exp||'なし');

    +'<span class="cnt" style="margin-left:auto">'+esc(m.status||'')+(m.judge?(' ／ '+esc(m.judge)):'')+'</span></div>'
    +'<div class="card" style="max-width:720px">'
    +'<div style="font-size:18px;font-weight:800;padding:2px 0 8px;color:var(--txt)">'+esc(m.name||'（無名）')+' <span style="color:var(--sub);font-weight:400;font-size:14px">'+age+'</span>'+(warn?'<span style="color:#ff9aa0">'+warn+'</span>':'')+'</div>'
    +R('フリガナ',m.kana)+R('生年月日',m.birth)+R('電話',m.tel)+R('住所',m.addr)
    +R('面談日時',m.at)+R('面談者',m.by)
    +R('希望シフト','週'+(m.days||'—')+' '+(m.weekdays||'')+(m.timeRange?('／'+m.timeRange):'')+(m.prevWeek?('／前週提出:'+m.prevWeek):''))
    +R('昼職',m.dayJob)+R('送り',(m.okuri||'')+(m.okuriArea?('（'+m.okuriArea+'）'):''))
    +R('お酒',m.drink)+R('苦手な酒',m.weak)+R('同伴',m.dohan)+R('客付き',m.customers)
    +expB
    +R('他店予定',(m.other==='あり')?('あり '+(m.otherNote||'')):(m.other||''))
    +R('黒服所感',m.memo)
    +'<div style="padding:12px 0 2px;border-top:1px solid var(--line);margin-top:6px">'+pl('🪪 身分証(表)',m.idPhoto)+pl('🪪 身分証(裏)',m.idPhotoBack)+pl('📷 顔写真',m.facePhoto)+'</div>'
    +'</div>';

/* 💳 会費更新：今月〜先の月ごとに更新期限が来る会員を一覧・検索（閲覧専用）。バックは getMemberRenewals。 */
var FR_DATA=null, FR_SEL=null, FR_Q='', FR_MODE='due'; // 'due'=会費の期限の人(未更新) / 'done'=すでに更新済み
function renderFeeRenew(){
  loading();
  gsr('getMemberRenewals').then(function(r){
    if(!r||r.ok===false){ setBody('<div class="empty">'+esc((r&&r.error)||'読み込みエラー')+'</div>'); return; }
    FR_DATA=r; if(FR_SEL===null)FR_SEL=r.todayYm; drawFeeRenew();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function frYmLabel_(ym){ var y=Math.floor((ym-1)/12), m=((ym-1)%12)+1; return y+'年'+m+'月'; }
function frStChip_(s){
  if(s==='expired')   return '<span style="background:#3a1518;color:#ff9aa0;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800">🔴更新切れ</span>';
  if(s==='thismonth') return '<span style="background:#3a2f10;color:#e6c14a;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800">🟡今月更新</span>';
  return '<span style="background:#12301f;color:#7fdca0;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800">🟢有効</span>';
}
function drawFeeRenew(){
  var r=FR_DATA||{}, today=r.todayYm||0, members=r.members||[];
  var overdue=members.filter(function(x){return x.dueYm<today;});
  var chips='<span class="chip'+(FR_SEL==='overdue'?' on':'')+'" onclick="frSel(\'overdue\')">🔴 更新切れ '+overdue.length+'</span>';
  for(var i=0;i<12;i++){ var ym=today+i; var cnt=members.filter(function(x){return x.dueYm===ym;}).length;
    var lbl=(i===0?'今月':i===1?'来月':(((ym-1)%12)+1)+'月');
    chips+='<span class="chip'+(FR_SEL===ym?' on':'')+'" onclick="frSel('+ym+')">'+lbl+' '+cnt+'</span>'; }
  var q=(FR_Q||'').replace(/\s/g,''), shown, isMonth=(FR_SEL!=='overdue');
  if(q){ shown=members.filter(function(x){return (x.name&&x.name.replace(/\s/g,'').indexOf(q)>=0)||(x.no&&String(x.no).indexOf(q)>=0);}); }
  else if(FR_SEL==='overdue'){ shown=overdue.slice(); }
  else if(FR_MODE==='done'){ shown=members.filter(function(x){return x.feeYm===FR_SEL;}); }        // その月に更新済み
  else { shown=members.filter(function(x){return x.dueYm===FR_SEL;}); }                              // その月が期限＝未更新
  shown.sort(function(a,b){ return (a.dueYm-b.dueYm)||String(a.name).localeCompare(String(b.name)); });
  var subchips='';
  if(!q && isMonth){ // 月選択時：期限の人（未更新）／すでに更新済み で絞り込み
    var dueN=members.filter(function(x){return x.dueYm===FR_SEL;}).length;
    var doneN=members.filter(function(x){return x.feeYm===FR_SEL;}).length;
    subchips='<div style="display:flex;gap:6px;margin:0 0 8px">'
      +'<span class="chip'+(FR_MODE!=='done'?' on':'')+'" onclick="frMode(\'due\')">🟡 期限の人（未更新）'+dueN+'</span>'
      +'<span class="chip'+(FR_MODE==='done'?' on':'')+'" onclick="frMode(\'done\')">🟢 すでに更新済み '+doneN+'</span></div>';
  }
  var rows=shown.map(function(c){
    var no=c.no?(' <span class="sub">#'+esc(c.no)+'</span>'):'';
    var tantou=c.tantou?('担当 '+esc(c.tantou)):'<span style="color:var(--dim)">担当なし</span>';
    return '<div class="lrow"><div class="main"><div class="nm">'+esc(c.name)+no+' '+frStChip_(c.status)
      +'</div><div class="meta">前回更新 '+esc(c.feeDate||'—')+' ・ 次回期限 '+esc(c.exp||'—')+' ・ '+tantou+'</div></div></div>';
  }).join('')||'<div class="empty" style="padding:14px">該当する会員はいません</div>';
  var head=q?('検索「'+esc(FR_Q)+'」'):(FR_SEL==='overdue'?'🔴 更新切れ':frYmLabel_(FR_SEL)+(FR_MODE==='done'?' に更新済み':'に更新期限'));
  var bar='<div class="toolbar" style="flex-wrap:wrap;gap:8px;align-items:center">'
    +'<input class="finput grow" id="fr-q" placeholder="会員名・会員番号で検索" value="'+esc(FR_Q)+'" oninput="frSearch()">'
    +'<span class="cnt">'+head+'：<b>'+shown.length+'名</b></span></div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'+chips+'</div>'+subchips;
  var hint='<div class="hint">「更新期限」＝前回更新の1年後の同月。日付が未入力の会員はここに出ません。<b>閲覧専用</b>（更新の記録は伝票検知→軍師のワンタップ、または顧客編集で）。検索時は全月から探します。</div>';
  setBody(bar+'<div class="sec">'+rows+'</div>'+hint);
  var el=document.getElementById('fr-q'); if(el&&FR_Q){ el.focus(); try{el.setSelectionRange(el.value.length,el.value.length);}catch(_){} }
}
function frSel(v){ FR_SEL=v; FR_Q=''; FR_MODE='due'; drawFeeRenew(); } // 月を変えたら「期限の人」に戻す
function frMode(m){ FR_MODE=m; drawFeeRenew(); }
function frSearch(){ var el=document.getElementById('fr-q'); FR_Q=el?el.value:''; drawFeeRenew(); }

/* ============ 👤 会員管理（お客様管理Y3のフル操作：参照・編集・新規登録） ============
 * バック: adminGetCustomers（全件・rowIdx＋全項目）／ adminUpdateCustomer ／ adminAddCustomer（すべて isAdmin_ ゲート）。
 * 編集は「変更した項目だけ」送る＝未変更列（会費更新の和暦テキスト等）を誤って上書きしない。
 * 元値は"描画後DOM値"を基準（type=date のブラウザ正規化と一致＝未変更の誤送信を防ぐ）。ポータルの会員編集と同じ流儀。 */
var MB_DATA=null, MB_Q='', MB_FILTER='', MB_ORIG={}, MB_ROWIDX=0;
var MB_FIELDS=[
  {k:'card',label:'カード記載名',type:'text'},
  {k:'name',label:'氏名',type:'text'},
  {k:'yomigana',label:'よみがな',type:'text'},
  {k:'no',label:'会員番号',type:'text',hint:'⚠️ 変更すると過去の来店・売上の紐づけに影響します'},
  {k:'tantou',label:'担当',type:'text'},
  {k:'bottle',label:'ボトル種類',type:'text'},
  {k:'pos',label:'ボトル位置',type:'text'},
  {k:'company',label:'会社名',type:'text'},
  {k:'bday',label:'誕生日',type:'date'},
  {k:'drink',label:'飲み方',type:'text'},
  {k:'tabaco',label:'タバコ',type:'text'},
  {k:'neck',label:'ネック名',type:'text'},
  {k:'ngStaff',label:'NGスタッフ',type:'text'},
  {k:'memberSince',label:'登録日（入会）',type:'date'},
  {k:'lastFeeDate',label:'最終会費更新日',type:'date'},
  {k:'ng',label:'NG行為',type:'textarea'},
  {k:'note',label:'参考情報・メモ',type:'textarea'}
];
function renderMembers(){
  loading();
  api('adminGetCustomers').then(function(r){
    if(!r||r.ok===false){ setBody('<div class="empty">'+esc((r&&r.error)||'読み込みエラー')+'</div>'); return; }
    MB_DATA=r; mbDrawList();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function mbHas_(k){ var e=MB_DATA&&MB_DATA.editHas; if(!e||e[k]===undefined)return true; return !!e[k]; }
function mbFiltered_(){
  var list=(MB_DATA&&MB_DATA.customers)||[];
  var q=(MB_Q||'').replace(/\s/g,'');
  return list.filter(function(c){
    if(MB_FILTER==='member'&&!String(c.no).trim())return false;
    if(MB_FILTER==='bottle'&&!String(c.bottle).trim())return false;
    if(!q)return true;
    return [c.name,c.card,c.no,c.company,c.tantou,c.yomigana].some(function(v){return String(v||'').replace(/\s/g,'').indexOf(q)>=0;});
  });
}
function mbDrawList(){
  var shown=mbFiltered_(), total=((MB_DATA&&MB_DATA.customers)||[]).length;
  var chip=function(key,lbl){ return '<span class="chip'+(MB_FILTER===key?' on':'')+'" onclick="mbFilter(\''+key+'\')">'+lbl+'</span>'; };

    +'<input class="finput grow" id="mb-q" placeholder="氏名・会員番号・会社・担当で検索" value="'+esc(MB_Q)+'" oninput="mbSearch()">'
    +'<button class="btn pri" onclick="mbAddForm()">＋ 新規会員を登録</button>'

    +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'+chip('','すべて')+chip('member','💳 会員番号あり')+chip('bottle','🍶 ボトルあり')+'</div>';
  var rows=shown.map(function(c){
    var no=c.no?(' <span class="sub">#'+esc(c.no)+'</span>'):'';
    var tantou=c.tantou?('担当 '+esc(c.tantou)):'<span style="color:var(--dim)">担当なし</span>';
    var extra=[c.company?('🏢'+esc(c.company)):'',c.bottle?('🍶'+esc(c.bottle)):'',c.eBday?('🎂'+esc(c.eBday)):''].filter(Boolean).join(' ・ ');
    return '<div class="lrow" style="cursor:pointer" onclick="mbEditForm('+c.rowIdx+')"><div class="main"><div class="nm">'+esc(c.name||c.card)+'様'+no
      +'</div><div class="meta">'+tantou+(extra?' ・ '+extra:'')+'</div></div><div style="color:var(--dim);font-size:12px;font-weight:700">編集 ›</div></div>';
  }).join('')||'<div class="empty" style="padding:14px">該当する会員がいません</div>';
  var hint='<div class="hint">お客様管理Y3の全会員をフル操作（参照・編集・新規登録）。編集は<b>変更した項目だけ</b>保存されます。会費更新の記録は 伝票検知→軍師ワンタップ か、この編集の「最終会費更新日」で。</div>';
  setBody(bar+'<div class="sec">'+rows+'</div>'+hint);

function mbSearch(){ var el=document.getElementById('mb-q'); MB_Q=el?el.value:''; mbDrawList(); }
function mbFilter(k){ MB_FILTER=k; mbDrawList(); }
function mbBack(){ if(MB_DATA)mbDrawList(); else renderMembers(); }
function mbFieldHtml_(f,isEdit,c){
  var v=isEdit?(f.k==='bday'?(c.eBday||''):(c[f.k]!=null?String(c[f.k]):'')):'';
  var field;
  if(f.type==='textarea') field='<textarea class="ta" id="mb-'+f.k+'" rows="2">'+esc(v)+'</textarea>';
  else if(f.type==='date') field='<input class="finput" id="mb-'+f.k+'" type="date" value="'+esc(v)+'" style="width:100%">';
  else field='<input class="finput" id="mb-'+f.k+'" type="text" value="'+esc(v)+'" style="width:100%">';
  return '<div style="'+(f.type==='textarea'?'grid-column:1/-1':'')+'"><label style="display:block;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:3px">'+f.label+'</label>'+field
    +(f.hint?'<div style="font-size:10px;color:var(--dim);margin-top:2px">'+f.hint+'</div>':'')+'</div>';
}
function mbForm_(mode,c){
  var isEdit=(mode==='edit');
  MB_ROWIDX=isEdit?(c.rowIdx||0):0;
  var fields=MB_FIELDS.filter(function(f){ return !isEdit||mbHas_(f.k); }).map(function(f){ return mbFieldHtml_(f,isEdit,c||{}); }).join('');
  var title=isEdit?(esc(c.name||c.card||'')+' 様 の会員情報を編集'):'新規会員を登録';

  var html='<div class="toolbar"><button class="btn" onclick="mbBack()">← 会員一覧へ戻る</button><span class="cnt">'+title+'</span></div>'
    +'<div class="sec"><div class="hint" style="margin:0 0 12px">'+note+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+fields+'</div>'
    +'<div class="toolbar" style="margin-top:16px"><button class="btn pri" onclick="mbSave('+(isEdit?'false':'true')+')">'+(isEdit?'💾 保存する':'＋ 登録する')+'</button></div></div>';
  setBody(html);
  MB_ORIG=isEdit?mbReadForm_():{}; // 描画後DOM値を基準（type=date正規化と一致＝未変更の誤送信を防ぐ）
}
function mbEditForm(rowIdx){ var c=((MB_DATA&&MB_DATA.customers)||[]).filter(function(x){return x.rowIdx===rowIdx;})[0]; if(c)mbForm_('edit',c); }
function mbAddForm(){ mbForm_('add',null); }
function mbReadForm_(){ var o={}; MB_FIELDS.forEach(function(f){ var el=document.getElementById('mb-'+f.k); if(el)o[f.k]=el.value; }); return o; }
function mbSave(isAdd,force){
  var cur=mbReadForm_(), payload={};
  if(isAdd){
    Object.keys(cur).forEach(function(k){ if(String(cur[k]).trim()!=='')payload[k]=cur[k]; });
    if(!String(payload.card||'').trim()&&!String(payload.name||'').trim()){ toast('カード記載名または氏名を入力してください',true); return; }
    if(force)payload.force=true;
  }else{
    Object.keys(cur).forEach(function(k){ var was=(MB_ORIG[k]==null)?'':String(MB_ORIG[k]); if(String(cur[k])!==was)payload[k]=cur[k]; });
    if(!Object.keys(payload).length){ toast('変更がありません'); return; }
  }
  var act=isAdd?'adminAddCustomer':'adminUpdateCustomer';
  var extra=isAdd?{payload:payload}:{rowIdx:MB_ROWIDX,payload:payload};
  api(act,extra).then(function(r){
    if(r&&r.ok){ toast(isAdd?'登録しました':'保存しました'); renderMembers(); return; }
    if(r&&r.duplicate&&isAdd){
      var m=r.match||{};
      if(confirm('同名のお客様が既に登録されています。\n'+(m.name||m.card||'')+(m.no?'（会員'+m.no+'）':'')+(m.tantou?' 担当'+m.tantou:'')+'\n\n別のお客様として登録しますか？')) mbSave(true,true);
      return;
    }
    toast((r&&r.error)||'保存に失敗しました',true);
  }).catch(function(){ toast('通信エラー',true); });
}

/* 🚗 送迎集計：月ごとの手段内訳（自社便◯件／ドライバー◯件）。バックは getOkuriMeansStats（管理者=全件・閲覧専用）。
   記録＝軍師シフト盤の 🚙ドライバー⇄🚶自便 トグル → 送迎ログの「手段」列に残る。ここはそれを月別で数えるだけ。 */
var OK_YM='', OK_DATA=null;
function renderOkuri(){
  loading();
  api('getOkuriMeansStats',{ym:OK_YM||''}).then(function(r){
    if(!r||r.ok===false){ setBody('<div class="empty">'+esc((r&&r.error)||'読み込みエラー')+'</div>'); return; }
    OK_DATA=r; OK_YM=r.ym||OK_YM; drawOkuri();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function okYmLabel_(ym){ var p=String(ym||'').split('-'); return (p.length===2)?(p[0]+'年'+Number(p[1])+'月'):String(ym||''); }
function okRow_(icon,label,n,col){
  return '<div class="lrow"><div class="main"><div class="nm">'+icon+' '+esc(label)+'</div></div>'
    +'<div style="font-weight:900;font-size:24px;color:'+(col||'var(--txt)')+'">'+n+'<span style="font-size:13px;font-weight:700;color:var(--dim)"> 件</span></div></div>';
}
function drawOkuri(){
  var r=OK_DATA||{}, cur=r.ym||OK_YM;
  var months=(r.months||[]).slice();
  if(cur && months.indexOf(cur)<0) months.push(cur); // データ0でも選択中の月は出す
  months.sort().reverse();
  var chips=months.slice(0,12).map(function(m){
    return '<span class="chip'+(m===cur?' on':'')+'" onclick="okSel(\''+m+'\')">'+okYmLabel_(m)+'</span>';
  }).join('')||'<span class="sub">記録がまだありません</span>';
  var jisha=Number(r.jisha||0), driver=Number(r.driver||0), unknown=Number(r.unknown||0), total=Number(r.total||0);
  var known=jisha+driver;
  var rows=okRow_('🏠','自社便',jisha,'#7fdca0')+okRow_('🚗','ドライバー',driver,'#e6c14a')
    +(unknown>0?okRow_('❔','不明（手段未記録）',unknown,'var(--dim)'):'');
  var share = known>0 ? '<div class="hint">自社便 '+Math.round(jisha/known*100)+'％ ・ ドライバー '+Math.round(driver/known*100)+'％'+(unknown>0?'（不明 '+unknown+'件は除く）':'')+'</div>' : '';
  var bar='<div class="toolbar" style="flex-wrap:wrap;gap:8px;align-items:center">'
    +'<span class="cnt">🚗 '+okYmLabel_(cur)+' の送り：<b>'+total+'件</b></span></div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'+chips+'</div>';
  var sec='<div class="sec"><div class="sec-t">🚗 送りの手段内訳 <span class="sub">自社便＝自前の車で送り／ドライバー＝外部手配</span></div>'+rows+share+'</div>';
  var hint='<div class="hint">件数＝送迎ログに残った「送り依頼」の数（キャンセルは含みません）。手段は軍師シフト盤の 🚙ドライバー ⇄ 🚶自便 トグルで記録します。この集計を入れる前の記録は手段が残っていないため「不明」に入ります。<b>閲覧専用</b>。</div>';
  setBody(bar+sec+hint);
}
function okSel(ym){ OK_YM=ym; renderOkuri(); }

function drawShift(){
  var reqPend=shiftReq.filter(function(x){return (x.status||'pending')==='pending'||!x.status;});
  var reqHtml=reqPend.length?reqPend.map(function(x){
    return '<div class="lrow"><div class="main"><div class="nm">'+esc(x.name)+'</div><div class="meta">'+esc(x.date||'')+' '+esc(x.time||'')+(x.role?' ・'+esc(x.role):'')+(x.submittedAt?' ・申請 '+esc(x.submittedAt):'')+'</div></div><button class="btn ok sm" onclick="approveShift('+x.rowIdx+',\''+jstr(x.name)+'\',\''+jstr(x.date||'')+'\',\''+jstr(x.time||'')+'\',\'承諾\')">承諾</button><button class="btn dng sm" onclick="approveShift('+x.rowIdx+',\''+jstr(x.name)+'\',\''+jstr(x.date||'')+'\',\''+jstr(x.time||'')+'\',\'却下\')">却下</button></div>';
  }).join(''):'<div class="empty" style="padding:18px">承認待ちのリクエストはありません</div>';

  var H=shiftMgmt.headers||[], R=(shiftMgmt.rows||[]).filter(function(row){return shiftRoleMatch(row.role);});
  // 並び順: ①当日(参照日=先頭列)に出勤の人 → ②翌日以降にシフトが入ってる人 → ③シフト無し。各段の中で 役割順(キャスト→体験→派遣→黒服)→勤務日数が多い順→氏名
  function _hasShift(row,day){ var v=row.cells&&row.cells[day]; if(v&&v!=='休み')return true; if(row.pending&&row.pending[day])return true; return false; }
  function _scnt(row){ var c=0; H.forEach(function(d){ if(_hasShift(row,d))c++; }); return c; }
  function _roleRank(role){ role=String(role||''); if(role==='キャスト')return 0; if(role==='体験')return 1; if(role==='派遣')return 2; if(role.indexOf('黒服')>=0)return 3; return 4; }

/* ▼ シフト時刻ピッカー（ポータルの申請UIと同じ「型」＝自由入力を廃止・保存値の書式も同一）
   opts:{role, title, sub, current, allowRest, onPick}
   onPick(v): v='20:00～24:00' / '予約出勤' / '休み' / ''(消去) 。キャンセル時は呼ばない */
function shPickTimes(sh,sm,eh,em){ var o=[],t=sh*60+sm,end=eh*60+em; for(;t<=end;t+=30){o.push(('0'+Math.floor(t/60)).slice(-2)+':'+('0'+(t%60)).slice(-2));} return o; }
function closeShPick(){ var e=document.getElementById('scm-wrap'); if(e)e.remove(); }
function openShiftPicker(opts){
  opts=opts||{}; closeShPick();
  var isKuro=String(opts.role||'').indexOf('黒服')>=0;
  var W='～'; /* U+FF5E：ポータルの保存値と同一の波ダッシュ */
  var done=function(v){ closeShPick(); if(opts.onPick)opts.onPick(v); };
  var w=document.createElement('div'); w.id='scm-wrap';
  var back=document.createElement('div'); back.className='scm-back'; back.onclick=closeShPick;
  var box=document.createElement('div'); box.className='scm';
  var h='<div class="scm-t">'+esc(opts.title||'シフト時刻')+'</div>';
  if(opts.sub)h+='<div class="scm-sub">'+esc(opts.sub)+'</div>';
  box.innerHTML=h;
  function addBtn(label,cls,fn){ var b=document.createElement('button'); b.className='btn '+(cls||''); b.textContent=label; b.onclick=fn; box.appendChild(b); }
  if(isKuro){
    addBtn('黒服フル　18:00 ～ 翌2:00','ok',function(){done('18:00'+W+'26:00');});
  }else{
    addBtn('キャストフル　20:00 ～ 24:00','ok',function(){done('20:00'+W+'24:00');});
    addBtn('予約出勤','pri',function(){done('予約出勤');});
  }
  var step=document.createElement('div'); step.className='shp-step'; step.textContent='時間を指定'; box.appendChild(step);
  var row=document.createElement('div'); row.className='shp-range';
  var startSel=document.createElement('select'), endSel=document.createElement('select');
  var starts=isKuro?shPickTimes(18,0,25,30):shPickTimes(20,0,23,30);
  var endsAll=isKuro?shPickTimes(18,30,26,0):shPickTimes(20,30,24,0);
  starts.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;startSel.appendChild(o);});
  function toMin(t){var p=t.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10);}
  function fillEnds(){ endSel.innerHTML=''; var sm2=toMin(startSel.value); endsAll.forEach(function(t){ if(toMin(t)<=sm2)return; var o=document.createElement('option');o.value=t;o.textContent=t;endSel.appendChild(o); }); }
  fillEnds(); startSel.onchange=fillEnds;
  var sep=document.createElement('span'); sep.className='sep'; sep.textContent=W;
  var ok=document.createElement('button'); ok.className='btn pri'; ok.textContent='決定'; ok.onclick=function(){ if(!endSel.value){toast('終了時刻を選んでください',true);return;} done(startSel.value+W+endSel.value); };
  row.appendChild(startSel); row.appendChild(sep); row.appendChild(endSel); row.appendChild(ok); box.appendChild(row);
  if(opts.allowRest){
    var rest=document.createElement('div'); rest.className='shp-rest';
    var b1=document.createElement('button'); b1.className='btn'; b1.textContent='休み'; b1.onclick=function(){done('休み');};
    var b2=document.createElement('button'); b2.className='btn dng'; b2.textContent='クリア（消去）'; b2.onclick=function(){done('');};
    rest.appendChild(b1); rest.appendChild(b2); box.appendChild(rest);
  }
  addBtn('キャンセル','',closeShPick);
  w.appendChild(back); w.appendChild(box); document.body.appendChild(w);
}

function admWeekOpts(){

function admMdKey(md){

  var mo=+m[1],da=+m[2],now=new Date(),y=now.getFullYear();

function notifTargetCell_(k,s){

    var opts=NOTIF_TARGETS.map(function(t){ return '<option value="'+t[0]+'"'+(s.target===t[0]?' selected':'')+'>'+esc(t[1])+'</option>'; }).join('');
    return '<span style="color:var(--accent);font-weight:700">📮 宛先</span> <select id="ntg-'+k+'" onchange="notifTargetChange(\''+jstr(k)+'\',this.value)" style="background:#1a1f2b;color:#e8eaed;border:1px solid #3a4150;border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700">'+opts+'</select>';
  }
  var fixed={
    group:'📮 '+esc(labelForTarget_(s.target))+'（宛先切替は準備中）',
    multi:'📮 複数グループへ同報（切替不可）',
    roster:'📮 対象名簿へ個別DM（退職・配信×は除外）',
    person:'📮 対象者本人へDM',
    admins:'📮 管理者へDM（固定）',
    kiosk:'🖥 軍師の要対応へ（LINE送信なし）',
    system:'⚙️ 送信なし・内部処理'
  };
  return '<span style="color:#8a8f98">'+(fixed[s.targetKind]||('📮 '+esc(s.group||'')))+'</span>';
}
function notifRow_(k){
  var s=notif[k]; var auto=(s.type==='auto'); var on=(s.enabled!==false);
  var tprefix=auto?'':'<span style="color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;margin-right:9px">'+esc(s.time||'--:--')+'</span>';
  var timeInput=auto?'<span class="badge kiosk">自動</span>':'<input class="tin" id="nt-'+k+'" value="'+esc(s.time||'')+'" style="width:64px">';
  var ed='';
  if(s.msgEditable) ed+='<textarea class="ta" id="nm-'+k+'" rows="2" placeholder="（既定文）">'+esc(s.message||'')+'</textarea>';
  if(s.staffMsgEditable){ var sv=(s.staffMessage!=null&&s.staffMessage!=='')?s.staffMessage:String(s.defaultStaffMsg||''); ed+=notifBlk_('nsm-'+k,'スタッフ向け文面',null,sv); }
  if(s.partsDef&&s.partsDef.length){ s.partsDef.forEach(function(d){ var ov=(s.parts&&s.parts[d.part]!=null&&s.parts[d.part]!=='')?s.parts[d.part]:String(d.def||''); ed+=notifBlk_('np-'+k+'-'+d.part,d.label||d.part,d.ph,ov); }); }
  var sw=s.lockOn?'<span class="sw on" style="opacity:.55;cursor:default" title="停止不可（常時ON）">🔒 ON</span>':'<span class="sw'+(on?' on':'')+'" id="ne-'+k+'" onclick="toggleNotif(\''+jstr(k)+'\')">'+(on?'ON':'OFF')+'</span>';
  return '<div class="lrow" style="align-items:flex-start"><div class="main"><div class="nm">'+tprefix+esc(s.label||k)+'</div><div class="meta">'+notifTargetCell_(k,s)+(s.desc?' <span style="color:#8a8f98">・'+esc(s.desc)+'</span>':'')+'</div>'+ed+'</div>'+timeInput+sw+'</div>';
}
function drawNotif(){
  var keys=Object.keys(notif);
  var onCount=keys.filter(function(k){return notif[k].enabled!==false;}).length, offCount=keys.length-onCount;
  function pass(k){ var en=notif[k].enabled!==false; return notifFilter==='all'||(notifFilter==='on'&&en)||(notifFilter==='off'&&!en); }
  function catOf(k){ return notif[k].category || (notif[k].type==='auto'?'watch':'scheduled'); }
  function chip(f,label){ return '<div class="chip'+(notifFilter===f?' on':'')+'" onclick="setNotifFilter(\''+f+'\')">'+label+'</div>'; }
  var filters='<div class="chips" style="margin-bottom:12px">'+chip('all','すべて '+keys.length)+chip('on','🟢 ON '+onCount)+chip('off','⚪️ OFF '+offCount)+'</div>';
  var gh=function(t){return '<div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin:16px 2px 9px">'+t+'</div>';};
  var CATS=[['scheduled','⏰ 定時通知（営業日の時系列）'],['watch','🔔 自動・監視（時刻/条件で発火）'],['event','⚡ イベント通知（発生ごと）'],['manual','✋ 手動配信']];
  var html='';
  CATS.forEach(function(c){
    var ks=keys.filter(function(k){return catOf(k)===c[0]&&pass(k);});
    if(c[0]==='scheduled') ks.sort(function(a,b){return notifBizMin_(notif[a].time)-notifBizMin_(notif[b].time);});
    else ks.sort(function(a,b){return String(notif[a].label||a).localeCompare(String(notif[b].label||b));});
    if(ks.length) html+=gh(c[1])+ks.map(notifRow_).join('');
  });
  if(!html) html='<div class="empty">該当する通知はありません</div>';
  var note='<div style="font-size:11px;color:#8a8f98;background:#161b26;border:1px solid #2a3140;border-radius:8px;padding:8px 10px;margin-bottom:12px">📮 <b>宛先</b>を切り替えられるのは配線済みの通知だけ（ドロップダウン表示）。名簿DM・本人DM・管理者DMは対象が決まっているので固定です。<br>⚠️ 宛先を大きいグループへ変える／OFFをONにすると<b>LINE通数</b>が増えます。残り枠は「🔁 再送」タブで確認できます。</div>';
  setBody('<div class="toolbar"><span class="cnt">全通知の一括管理（ON/OFF・宛先・時刻・文面）。変更後は「保存」</span><span class="sp" style="flex:1"></span><button class="btn pri" onclick="saveNotif()">💾 保存</button></div>'+note+filters+html);
}
function toggleNotif(k){ if(notif[k]&&notif[k].lockOn)return; notif[k].enabled=!(notif[k].enabled!==false); var el=document.getElementById('ne-'+k); if(el){el.classList.toggle('on',notif[k].enabled); el.textContent=notif[k].enabled?'ON':'OFF';} if(notifFilter!=='all')drawNotif(); }
function saveNotif(){
  syncNotifInputs();
  api('saveNotifSettings',{settings:notif}).then(function(r){ res(r,'通知設定を保存しました'); });
}

/* ===== 🔁 自動通知の再送（押した時点の最新データで作り直して再送）===== */
var resendState=null, resendSel={}, resendPhase='list', resendResult=null; // phase: 'list'|'confirm'|'result'
var RESEND_CATS=[['group','⏰ グループ定時配信'],['dm','📨 黒服・キャスト個別DM'],['alert','⚙️ 監視アラート（今の状態で再判定）']];
function renderResend(){
  loading(); resendSel={}; resendPhase='list'; resendResult=null;
  api('getResendableNotices').then(function(r){
    if(r&&r.ok===false){ setBody('<div class="empty">'+esc(r.error||'読み込みエラー')+'</div>'); return; }
    resendState=r||{}; drawResend();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function resendQuotaLine_(){
  var q=(resendState&&resendState.quota)||{};
  if(!q.ok) return '<span style="color:#e0564a">配信枠を確認できません</span>';
  if(q.type!=='limited') return '配信枠：無制限プラン';
  var danger=(q.remain!=null&&q.remain<=0);
  return '配信枠：残り <b style="color:'+(danger?'#e0564a':'var(--accent)')+'">'+(q.remain!=null?q.remain.toLocaleString():'?')+'</b> 通'+(q.limit?('（上限'+q.limit.toLocaleString()+'）'):'')+(danger?' <b style="color:#e0564a">⛔上限到達＝送信不可</b>':'');
}
function resendBadge_(n){
  if(n.cat==='alert') return '<span class="badge kiosk">🔁 再判定</span>';
  if(n.firedToday===true) return '<span class="badge" style="background:#15321f;color:#4ad07a">✅ 本日配信済</span>';
  if(n.firedToday===false) return '<span class="badge" style="background:#2a2350;color:#b7a6ff">⚪ 未配信</span>';
  return '';
}
function resendChk_(on){ return '<span style="width:22px;height:22px;flex:none;border-radius:6px;border:2px solid '+(on?'var(--accent)':'#444a55')+';background:'+(on?'var(--accent)':'transparent')+';color:#0b0f1a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px">'+(on?'✓':'')+'</span>'; }
function resendRow_(n){
  var on=!!resendSel[n.id];
  var dyn=n.dynamic?'<span class="badge" style="background:#12303a;color:#5fc9e6">🔄 最新データ</span>':'';
  return '<div class="lrow" onclick="resendToggle(\''+jstr(n.id)+'\')" style="cursor:pointer;align-items:center">'
    +resendChk_(on)
    +'<div class="main" style="margin-left:10px"><div class="nm">'+esc(n.label)+'</div>'
    +'<div class="meta">'+esc(n.time||'')+' ・ '+resendBadge_(n)+' '+dyn+'</div></div></div>';
}
function drawResend(){
  var list=(resendState&&resendState.list)||[];
  if(resendPhase==='result'){ drawResendResult(); return; }
  var selIds=Object.keys(resendSel).filter(function(k){return resendSel[k];});
  var body='';
  RESEND_CATS.forEach(function(c){
    var rows=list.filter(function(n){return n.cat===c[0];});
    if(!rows.length) return;
    body+='<div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin:16px 2px 8px">'+c[1]+'</div>'+rows.map(resendRow_).join('');
  });
  if(!body) body='<div class="empty">再送できる通知がありません</div>';
  var note='<div style="font-size:12px;color:#9aa0aa;line-height:1.6;margin:4px 2px 12px">押した<b>その時点の最新データ</b>で作り直して再送します（定時配信が未達だった／内容が古かった時の復旧用）。<br>⚠️退勤号令は<b>文面のみ</b>再送＝アテンドはリセットしません。監視系は今の状態で再判定＝該当がなければ送りません。</div>';
  var tools='<div class="toolbar"><span class="cnt">'+resendQuotaLine_()+'</span><span class="sp" style="flex:1"></span>'
    +'<button class="btn" onclick="resendPick(\'group\')">定時配信を選択</button>'
    +'<button class="btn" onclick="resendPick(\'all\')">全選択</button>'
    +'<button class="btn" onclick="resendPick(\'none\')">解除</button></div>';
  var confirm='';
  if(resendPhase==='confirm'){
    var labels=list.filter(function(n){return resendSel[n.id];}).map(function(n){return '・'+esc(n.label);}).join('<br>');
    confirm='<div style="border:1px solid var(--accent-line,#7a3f10);background:var(--accent-bg,#241a10);border-radius:10px;padding:14px;margin:12px 0">'
      +'<div style="font-weight:800;margin-bottom:8px">🔁 以下 '+selIds.length+' 件を最新データで再送します。よろしいですか？</div>'
      +'<div style="font-size:12px;line-height:1.7;margin-bottom:12px">'+labels+'</div>'
      +'<button class="btn pri" onclick="resendGo()">送信する</button> <button class="btn" onclick="resendPhase=\'list\';drawResend();">キャンセル</button></div>';
  }
  var actionBtn=(resendPhase==='confirm')?'':'<div style="margin-top:16px"><button class="btn pri" style="width:100%;padding:12px;font-size:15px" onclick="resendAsk()">🔁 選択した '+selIds.length+' 件を最新データで再送</button></div>';
  setBody(tools+note+body+confirm+actionBtn);
}
function resendToggle(id){ resendSel[id]=!resendSel[id]; if(resendPhase==='confirm')resendPhase='list'; drawResend(); }
function resendPick(mode){
  var list=(resendState&&resendState.list)||[];
  if(mode==='none') resendSel={};
  else list.forEach(function(n){ if(mode==='all'||n.cat===mode) resendSel[n.id]=true; });
  if(resendPhase==='confirm')resendPhase='list'; drawResend();
}
function resendAsk(){
  var selIds=Object.keys(resendSel).filter(function(k){return resendSel[k];});
  if(!selIds.length){ toast('再送する通知を選んでください',true); return; }
  resendPhase='confirm'; drawResend();
}
function resendGo(){
  var ids=Object.keys(resendSel).filter(function(k){return resendSel[k];});
  setBody('<div class="empty">再送中…</div>');
  api('resendNotices',{ids:ids}).then(function(r){ resendResult=r||{}; resendPhase='result'; drawResend(); })
    .catch(function(){ toast('再送に失敗しました',true); resendPhase='list'; drawResend(); });
}
function drawResendResult(){
  var r=resendResult||{};
  var icon={sent:'✅',skip:'⚪',failed:'⛔',error:'⛔'};
  var rows=(r.results||[]).map(function(x){
    var st=icon[x.status]||'・';
    var col=(x.status==='failed'||x.status==='error')?'#e0564a':(x.status==='skip'?'#9aa0aa':'#4ad07a');
    return '<div class="lrow" style="align-items:flex-start"><div class="main"><div class="nm">'+st+' '+esc(x.label)+'</div><div class="meta" style="color:'+col+'">'+esc(x.detail||'')+'</div></div></div>';
  }).join('');
  var head='<div style="font-weight:800;font-size:15px;margin:6px 2px 12px;color:'+(r.ok===false?'#e0564a':'inherit')+'">'+esc(r.note||'完了')+'</div>';
  setBody('<div class="toolbar"><span class="cnt">再送結果</span><span class="sp" style="flex:1"></span><button class="btn pri" onclick="renderResend()">↻ 一覧に戻る</button></div>'+head+(rows||'<div class="empty">結果なし</div>'));
}

/* ===== ✅ チェックリスト（開店前・閉店後のやること編集） ===== */
var chk=null;
function newChkId(){ return 'c'+Date.now().toString(36)+Math.floor(Math.random()*1000); }
function renderChecklist(){
  loading();
  api('getChecklistConfig').then(function(r){ chk=(r&&r.config)||{opening:[],closing:[]}; chk.opening=chk.opening||[]; chk.closing=chk.closing||[]; drawChecklist(); }).catch(function(){setBody('<div class="empty">読み込みエラー</div>');});
}
function chkMoveBtns(list,i,n){
  var b='padding:6px 10px;min-width:0;font-size:13px';
  return '<div style="display:flex;gap:4px;flex:none">'
    +'<button class="btn" style="'+b+'" '+(i===0?'disabled':'')+' onclick="chkMove(\''+list+'\','+i+',-1)">↑</button>'
    +'<button class="btn" style="'+b+'" '+(i===n-1?'disabled':'')+' onclick="chkMove(\''+list+'\','+i+',1)">↓</button>'
    +'<button class="btn" style="'+b+';color:#ff9a9a;border-color:#5a2226" onclick="chkRemove(\''+list+'\','+i+')">✕</button></div>';
}
function chkOpenRow(it,i,n){
  return '<div class="lrow" style="align-items:center;gap:8px">'
    +'<div class="main"><input class="finput" style="width:100%" value="'+esc(it.label)+'" placeholder="項目名" oninput="chk.opening['+i+'].label=this.value"></div>'
    +'<span class="chip'+(it.common?'':' on')+'" style="cursor:pointer;flex:none;white-space:nowrap" onclick="chkToggleFloor('+i+')">'+(it.common?'共通':'2F/5F別')+'</span>'
    +chkMoveBtns('opening',i,n)+'</div>';
}
function chkCloseRow(it,i,n){
  return '<div class="lrow" style="align-items:flex-start;gap:8px">'
    +'<div class="main"><input class="finput" style="width:100%;margin-bottom:5px" value="'+esc(it.label)+'" placeholder="タスク名" oninput="chk.closing['+i+'].label=this.value">'
    +'<input class="finput" style="width:100%;font-size:12px" value="'+esc(it.sub||'')+'" placeholder="補足（任意・例: 24:30までに）" oninput="chk.closing['+i+'].sub=this.value"></div>'
    +chkMoveBtns('closing',i,n)+'</div>';
}
function chkToggleFloor(i){ chk.opening[i].common=!chk.opening[i].common; drawChecklist(); }
function chkMove(list,i,dir){ var a=chk[list]; var j=i+dir; if(j<0||j>=a.length)return; var t=a[i];a[i]=a[j];a[j]=t; drawChecklist(); }
function chkRemove(list,i){ chk[list].splice(i,1); drawChecklist(); }
function chkAddOpen(){ chk.opening.push({id:newChkId(),label:'',common:false}); drawChecklist(); }
function chkAddClose(){ chk.closing.push({id:newChkId(),label:'',sub:''}); drawChecklist(); }
function drawChecklist(){
  var op=chk.opening.map(function(it,i){return chkOpenRow(it,i,chk.opening.length);}).join('')||'<div class="empty" style="padding:10px">項目なし</div>';
  var cl=chk.closing.map(function(it,i){return chkCloseRow(it,i,chk.closing.length);}).join('')||'<div class="empty" style="padding:10px">追加タスクなし</div>';
  setBody(
    '<div class="toolbar"><span class="cnt">開店前・閉店後の「やること」を編集（変更後は「保存」）</span><span class="sp" style="flex:1"></span><button class="btn pri" onclick="saveChecklist()">💾 保存</button></div>'
    +'<div class="sec"><div class="sec-t">🌅 開店前やること <span style="font-weight:400;color:var(--dim);font-size:12px">2F/5F別 or 共通・全端末同期</span></div>'
      +op+'<button class="btn" style="margin-top:8px" onclick="chkAddOpen()">＋ 項目を追加</button></div>'
    +'<div class="sec"><div class="sec-t">🌙 閉店後の追加タスク <span style="font-weight:400;color:var(--dim);font-size:12px">店全体で1つ・チェックオフ</span></div>'
      +cl+'<button class="btn" style="margin-top:8px" onclick="chkAddClose()">＋ タスクを追加</button>'
      +'<div class="hint" style="margin-top:8px">「現金締め・送り・金庫・伝票」は軍師のシステム機能なので固定です（ここには出ません）。</div></div>'
  );
}
function saveChecklist(){
  var op=chk.opening.filter(function(x){return String(x.label||'').trim();});
  var cl=chk.closing.filter(function(x){return String(x.label||'').trim();});
  api('saveChecklistConfig',{config:{opening:op,closing:cl}}).then(function(r){ res(r,'チェックリストを保存しました'); });
}

/* 📝 スキルテスト（黒服の知識関門・時給の維持/アップ資格）
   結果一覧（誰が何級合格＝時給資格）／級設定／作問。受験は軍師側。
   ⚠️合否はフラグ。基本時給は自動で書き換えない（改定は人が判断）。 */
var skAdm=null, skGEdit=null, skQEdit=null;
function renderSkillTest(){
  loading();
  api('skillAdminData',{}).then(function(r){
    if(!r||r.ok===false){ setBody('<div class="empty">'+esc((r&&r.error)||'取得できませんでした')+'</div>'); return; }
    skAdm=r;
    skGEdit=(r.grades||[]).map(function(g){ return {grade:g.grade,order:g.order,pass:g.pass,count:g.count,unlock:g.unlock,desc:g.desc,active:g.active!==false}; });
    drawSkill();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function skEligChip_(st){
  st=st||{};
  if(st.canRaise)    return '<span class="chip on" style="background:#2b2410;border-color:#c9a45c;color:#f4d98a">昇給可</span>';
  if(st.canMaintain) return '<span class="chip on">維持可</span>';
  return '<span class="chip" style="color:#ff9a9a;border-color:#5a2226">資格なし</span>';
}
function skUnlockOpts_(v){
  return '<option value=""'+(!v?' selected':'')+'>資格なし</option>'
    +'<option value="維持"'+(v==='維持'?' selected':'')+'>維持（時給を維持できる）</option>'
    +'<option value="アップ"'+(v==='アップ'?' selected':'')+'>アップ（昇給できる）</option>';
}
function drawSkill(){
  var grades=skAdm.grades||[], questions=skAdm.questions||[], results=skAdm.results||[];
  // ── 結果一覧（時給資格ボード）
  var resRows=results.length? results.map(function(x){
    var st=x.status||{}, r0=(st.recent&&st.recent[0])?st.recent[0]:null;
    var last=r0?(esc(r0.grade)+' <b style="color:'+(r0.result==='合格'?'#7fd18b':'#ff9a9a')+'">'+esc(r0.result)+'</b> '+r0.pct+'%　<span style="color:var(--dim)">'+esc(String(r0.date).slice(5,16))+'</span>'):'<span style="color:var(--dim)">未受験</span>';
    var held=(st.heldGrades&&st.heldGrades.length)?st.heldGrades.map(esc).join('・'):'<span style="color:var(--dim)">—</span>';
    return '<tr>'
      +'<td style="padding:6px 8px"><b>'+esc(x.name)+'</b></td>'
      +'<td style="padding:6px 8px;color:var(--dim)">'+esc(x.role)+'</td>'
      +'<td style="padding:6px 8px">'+held+'</td>'
      +'<td style="padding:6px 8px">'+skEligChip_(st)+'</td>'
      +'<td style="padding:6px 8px;font-size:12px">'+last+'</td></tr>';
  }).join('') : '<tr><td colspan="5" style="padding:8px;color:var(--dim)">黒服のスタッフがいません</td></tr>';
  // ── 級設定
  var gRows=(skGEdit||[]).map(function(g,i){ return skGradeRow_(g,i); }).join('')||'<div class="empty" style="padding:10px">級がありません</div>';
  // ── 問題管理（級ごと）
  var qByGrade={}; questions.forEach(function(q){ (qByGrade[q.grade]=qByGrade[q.grade]||[]).push(q); });
  var qSecs=grades.map(function(g){
    var arr=qByGrade[g.grade]||[];
    var list=arr.length? arr.map(function(q,qi){
      var ci=(q.answer||1);
      var choicesHtml=(q.choices||[]).map(function(ch,k){
        if(ch===''||ch==null) return '';
        var isC=(k+1)===ci;
        return '<div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px;margin-top:3px;'+(isC?'color:#7fd18b;font-weight:600':'color:var(--dim)')+'">'
          +'<span style="width:15px;flex:none;text-align:center">'+(isC?'✓':(k+1))+'</span><span>'+esc(ch)+'</span></div>';
      }).join('');
      return '<div class="lrow" style="align-items:flex-start;gap:8px;border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:10px;margin-bottom:2px">'

/* 🛠 問題ビルダー：下書きを1問ずつキャッチボール→確定して級へ */
function skBuilderCard_(q,num,grades){
  var stC=q.status==='確定'?'#7fd18b':(q.status==='確認中'?'#f4d98a':'#9a8f70');
  var statusChip='<span class="chip" style="border-color:'+stC+';color:'+stC+'">'+esc(q.status||'下書き')+'</span>';
  var choices=(q.choices||[]).map(function(ch,k){ if(!ch)return''; var isC=(k+1)===q.answer;
    return '<div onclick="skSetAnswer(\''+esc(q.id)+'\','+(k+1)+')" title="クリックで正解に" style="cursor:pointer;display:flex;gap:7px;align-items:flex-start;padding:7px 9px;border-radius:8px;margin-top:5px;border:1px solid '+(isC?'#3f6b3f':'rgba(255,255,255,.1)')+';background:'+(isC?'#12220f':'transparent')+';font-size:12.5px;'+(isC?'color:#7fd18b;font-weight:600':'color:#cbb98a')+'">'
      +'<span style="width:15px;flex:none;text-align:center">'+(isC?'✓':(k+1))+'</span><span>'+esc(ch)+'</span></div>';
  }).join('');
  var reviewLog=q.review ? '<div style="margin-top:9px;font-size:11.5px;color:#c3b083;background:#14110b;border:1px solid #2b2214;border-radius:8px;padding:8px 10px;white-space:pre-wrap;line-height:1.65">'+esc(q.review)+'</div>' : '';
  var gopts=(grades||[]).map(function(g){ return '<option value="'+esc(g.grade)+'">'+esc(g.grade)+'</option>'; }).join('');
  return '<div class="sec" style="border-left:3px solid #c9a45c">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div>'+statusChip+(q.cat?' <span class="chip">'+esc(q.cat)+'</span>':'')+'</div><div style="color:var(--dim);font-size:12px">#'+num+'</div></div>'
    +'<div style="font-size:13.5px;color:#f2ead9;font-weight:600;margin:8px 0 2px;line-height:1.5">'+esc(q.q)+'</div>'
    +choices
    +'<div style="font-size:11px;color:var(--dim);margin-top:4px">↑ 選択肢をクリックすると正解（✓）を切り替えます</div>'
    +reviewLog
    +'<div style="display:flex;gap:6px;margin-top:9px"><input class="finput" id="skc_'+esc(q.id)+'" style="flex:1" placeholder="コメント（例：13は幹の許可確認まで出さないでOK）"><button class="btn" onclick="skReviewNote(\''+esc(q.id)+'\')">💬 追加</button></div>'
    +'<div class="lrow" style="align-items:center;gap:8px;margin-top:9px"><select class="finput" style="width:110px" id="skf_'+esc(q.id)+'">'+gopts+'</select>'
      +'<button class="btn pri" onclick="skFinalize(\''+esc(q.id)+'\')">✅ 確定して級へ</button>'
      +'<span class="sp" style="flex:1"></span>'
      +'<button class="btn" style="padding:5px 10px;font-size:12px" onclick="skEditQ(\''+esc(q.id)+'\')">✏️ 編集</button>'
      +'<button class="btn" style="padding:5px 10px;font-size:12px;color:#ff9a9a;border-color:#5a2226" onclick="skDelQ(\''+esc(q.id)+'\')">🗑</button></div></div>';
}

/* 🗂 出勤簿（労基署対応：勤怠ログを月×個人で出退勤/拘束時間として出力・CSV/印刷） */
var kregMonth='', kregName='', kregData=null;
function kregNowMonth_(){ var d=new Date(); return d.getFullYear()+'-'+((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1); }
function kregHm_(mins){ if(mins==null) return '—'; var h=Math.floor(mins/60), m=mins%60; return h+':'+(m<10?'0':'')+m; }
function kregHdec_(mins){ return mins==null?'':(Math.round(mins/60*100)/100); }
function kregRetTxt_(p){ return p&&p.retired?('退職'+(p.retiredAt?' '+p.retiredAt:'')):''; }
function kregRetBadge_(p){ var t=kregRetTxt_(p); return t?' <span style="color:#ff9a9a;font-size:11px;font-weight:700">'+esc(t)+'</span>':''; }
function renderKintaiReg(){
  if(!kregMonth) kregMonth=kregNowMonth_();
  loading();
  api('kintaiRegister',{month:kregMonth,name:''}).then(function(r){
    if(!r||r.ok===false){ setBody('<div class="empty">'+esc((r&&r.error)||'取得できませんでした')+'</div>'); return; }
    kregData=r; kregMonth=r.month||kregMonth;
    // 選択中の人が今月いなければ全員表示に戻す
    if(kregName && !(kregData.list||[]).some(function(p){return p.name===kregName;})) kregName='';
    drawKintaiReg();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function kregShiftMonth(d){ var p=String(kregMonth).split('-'); var y=+p[0],m=+p[1]+d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} kregMonth=y+'-'+(m<10?'0':'')+m; kregName=''; renderKintaiReg(); }
function kregPick(n){ kregName=n||''; drawKintaiReg(); }
function drawKintaiReg(){
  var list=(kregData&&kregData.list)||[];
  var opts='<option value="">全員（一覧）</option>'+list.map(function(p){ return '<option value="'+esc(p.name)+'"'+(p.name===kregName?' selected':'')+'>'+esc(p.name)+(p.role?'（'+esc(p.role)+'）':'')+(p.retired?' 〔退職〕':'')+'</option>'; }).join('');
  var bar='<div class="toolbar"><button class="btn" onclick="kregShiftMonth(-1)">◀</button><span class="cnt" style="min-width:96px;text-align:center">'+esc(kregMonth)+'</span><button class="btn" onclick="kregShiftMonth(1)">▶</button>'
    +'<select class="finput" style="width:220px;margin-left:8px" onchange="kregPick(this.value)">'+opts+'</select>'
    +'<span class="sp" style="flex:1"></span>'
    +'<button class="btn" onclick="kregCsvAll()">⬇️ CSV（全員）</button>'
    +'<button class="btn" onclick="kregPrint()">🖨 印刷（出勤簿）</button></div>';
  var hint='<div class="hint">'+esc((kregData&&kregData.note)||'')+' 出勤＝最初の打刻／退勤＝最後の打刻。打刻元は iPad（軍師）または LINE の出退勤報告です。'
    +'<b style="color:#f4d98a"> 打刻漏れは「備考」に出ます</b>＝訂正は🗓シフト隣の運用でお願いします。</div>';
  if(!list.length){ setBody(bar+hint+'<div class="empty" style="padding:20px">この月の出退勤記録はありません。</div>'); return; }
  var html=bar+hint;
  if(!kregName){
    // 全員サマリー
    var rows=list.map(function(p){
      return '<tr>'
        +'<td style="padding:6px 10px"><b>'+esc(p.name)+'</b></td>'
        +'<td style="padding:6px 10px;color:var(--dim)">'+esc(p.role||'')+kregRetBadge_(p)+'</td>'
        +'<td style="padding:6px 10px;text-align:right">'+p.workDays+' 日</td>'
        +'<td style="padding:6px 10px;text-align:right">'+kregHm_(p.totalMins)+'</td>'
        +'<td style="padding:6px 10px"><button class="btn" onclick="kregPick(\''+esc(p.name).replace(/'/g,"\\'")+'\')">開く ▶</button> '
          +'<button class="btn" onclick="kregCsvPerson(\''+esc(p.name).replace(/'/g,"\\'")+'\')">CSV</button></td></tr>';
    }).join('');
    html+='<div class="sec"><div class="sec-t">👥 '+esc(kregMonth)+' 月の出勤者（'+list.length+'名）</div>'
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<thead><tr style="color:var(--dim);text-align:left"><th style="padding:6px 10px">氏名</th><th style="padding:6px 10px">役割</th><th style="padding:6px 10px;text-align:right">出勤日数</th><th style="padding:6px 10px;text-align:right">合計拘束</th><th style="padding:6px 10px">操作</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div></div>';
  } else {
    // 個人の日別出勤簿
    var p=list.filter(function(x){return x.name===kregName;})[0];
    if(!p){ kregName=''; return drawKintaiReg(); }
    var drows=(p.days||[]).map(function(d){

function kregSrc_(d){ var s=(d.inSrc||'')+(d.outSrc?('/'+d.outSrc):''); s=s.replace(/手修正:[^ ]*\s*\S*/g,'手修正'); return s.replace(/iPad/g,'iPad').replace(/LINE/g,'LINE')||''; }
function kregDownload_(fn,csv){ var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}); var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600); }
function kregCsvCell_(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

      +'<div class="lrow" style="align-items:center;gap:10px"><div class="main">投票の受付</div><select class="finput" style="width:160px" id="aw-force"><option value="">自動（当月開く）</option><option value="open"'+(cfg.vote_force==='open'?' selected':'')+'>強制オープン</option><option value="closed"'+(cfg.vote_force==='closed'?' selected':'')+'>強制クローズ</option></select></div>'
      +'<button class="btn pri" style="margin-top:8px" onclick="awSaveConfig()">💾 設定を保存</button></div>'

/* ===== 🍶 メニュー（店舗メニューの登録／メニュー落ち→在庫の仕入れ区分へ伝播） =====
   対象はボトルのみ。割り物/チャーム/果物/消耗品/名刺はメニューに一生載らないが仕入れは止められない＝巻き込まない。
   ⚠️「メニューに無いボトル」は炙り出すだけで自動では止めない。登録が終わる前に自動適用すると全ボトルが一斉に停止する。
      止めるのは管理者が押したときだけ。 */
var MENU_OFF='メニュー落ち', MENU_ON='掲載中';
var menuBoard=null;
function renderMenu(){
  if(!menuBoard){ loading(); api('getMenuBoard').then(function(r){ if(!res(r))return; menuBoard=r.board; renderMenu(); }).catch(function(e){ setBody('<div class="empty">読み込みに失敗: '+esc(e&&e.message||e)+'</div>'); }); return; }
  var b=menuBoard;
  var opts=function(sel){ return '<option value="">（紐づけなし）</option>'+b.stockNames.map(function(n){return '<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join(''); };

  // --- メニュー本体（カテゴリ別に折る。50品をフラットに並べると探せない）---
  var mnCard=function(m){
    var off=m.status===MENU_OFF;
    var qty=m.linkBroken?'<span class="mn-broken">⚠️ 在庫に「'+esc(m.stockName)+'」がありません</span>'
           :(m.stockName?'<span class="mn-qty">在庫 <b>'+(m.qty||0)+'</b> 本</span>':'<span class="mn-nolink">未紐づけ＝仕入れ判定なし</span>');
    // 価格は参照専用（会計はTRUSTが正）＝そう分かる出し方にする
    var price=m.price?'<span class="mn-price" title="参照用。会計はTRUSTが正です">¥'+Number(m.price).toLocaleString()+'</span>':'';
    return '<div class="card mn-card'+(off?' off':'')+'">'
      +'<div class="card-top"><div class="card-nm">'+esc(m.name)+(off?'<span class="badge mn-b-off">'+MENU_OFF+'</span>':'')+'</div>'
      +price+'<button class="btn mn-del" onclick="menuDelete('+m.rowIdx+',\''+jstr(m.name)+'\')">×</button></div>'
      +'<div class="mn-row"><span class="mn-lbl">在庫品名</span><select class="finput grow" onchange="menuLink('+m.rowIdx+',this.value)">'+opts(m.stockName)+'</select></div>'
      +'<div class="mn-row">'+qty
      +'<button class="btn '+(off?'':'mn-stop')+'" onclick="menuStatus('+m.rowIdx+',\''+(off?MENU_ON:MENU_OFF)+'\',\''+jstr(m.name)+'\')">'
      +(off?'↩︎ メニューに戻す':'⏸ メニュー落ちにする')+'</button></div>'
      +'</div>';
  };
  var byCat={},catOrder=[];
  b.menu.forEach(function(m){ var c=m.category||'（カテゴリなし）'; if(!byCat[c]){byCat[c]=[];catOrder.push(c);} byCat[c].push(m); });
  var rows=b.menu.length? catOrder.map(function(c){
    var items=byCat[c], nOff=items.filter(function(m){return m.status===MENU_OFF;}).length;
    var noLink=items.filter(function(m){return !m.stockName;}).length;
    return '<details class="mn-cat" open><summary>'+esc(c)+' <span class="mn-cnt">'+items.length+'品</span>'
      +(noLink?'<span class="mn-warn">未紐づけ '+noLink+'</span>':'')
      +(nOff?'<span class="mn-cnt off">メニュー落ち '+nOff+'</span>':'')
      +'</summary><div class="grid mn-grid">'+items.map(mnCard).join('')+'</div></details>';
  }).join('') : '<div class="empty">まだメニューが登録されていません。上の「一括登録」からPDFの内容を入れられます。</div>';

  // --- メニュー外の炙り出し＝この機能の目玉 ---
  var off=b.offMenu;
  var offHtml=off.length? off.map(function(o){
    return '<div class="card mn-card'+(o.stopped?' off':'')+'">'
      +'<div class="card-top"><div class="card-nm">'+esc(o.name)+(o.stopped?'<span class="badge mn-b-off">'+MENU_OFF+'</span>':'')+'</div>'

/* 🔧 重複品名の検出と統合。
   ⚠️統合は不可逆（行を消して数量を寄せる）＝どちらへ寄せるかは必ず人に選ばせる。機械に決めさせない。
   ⚠️②「似ている」はしきい値で切れない（ヴーヴ イエロー/ヴーヴクリコ イエロー=55% と 赤霧島/黒霧島=50%が5pt差）
      ＝候補を出すだけで、別の酒なら無視してもらう。 */
function dupCard(d,sure){
  var pair=function(nm,qty,fl,other){
    return '<div class="dup-side"><div class="dup-nm">'+esc(nm)+'</div><div class="dup-meta">'+esc(fl)+' ／ 合計 <b>'+qty+'</b>本</div>'
      +'<button class="btn dup-btn" onclick="dupMerge(\''+jstr(other)+'\',\''+jstr(nm)+'\')">この名前に寄せる</button></div>';
  };
  return '<div class="card dup-card'+(sure?' sure':'')+'">'
    +'<div class="dup-top">'+(sure?'<span class="badge dup-b-sure">ほぼ確実</span>':'<span class="badge dup-b-may">略称違い？</span>')
    +(sure?'<span class="dup-why">記号・長音・スペースの違いだけ＝同じ酒のはず</span>':'<span class="dup-why">片方が略した名前に見えます。別の酒なら無視してください</span>')+'</div>'
    +'<div class="dup-row">'+pair(d.a,d.aQty,d.aFloors,d.b)+'<span class="dup-arrow">⇄</span>'+pair(d.b,d.bQty,d.bFloors,d.a)+'</div></div>';
}
function dupScan(){
  var box=document.getElementById('mn-dup'); box.innerHTML='<div class="empty">探しています…</div>';
  api('findDupStockNames').then(function(r){
    if(!res(r))return;
    var n=r.sure.length+r.maybe.length;
    if(!n){ box.innerHTML='<div class="mn-bulk-ok">✅ 重複していそうな品名は見つかりませんでした</div>'; return; }
    box.innerHTML='<div class="mn-bulk-ok">'+r.sure.length+'組が「ほぼ確実」／'+r.maybe.length+'組が「略称違い？」</div>'
      +'<div class="hint" style="margin:6px 0">呼び方がまるごと違う同じ酒（例：イルボンジンロ と JINRO）は機械には見つけられません。現物を知っている黒服の報告が頼りです。</div>'
      +'<div class="grid mn-grid">'+r.sure.map(function(d){return dupCard(d,true);}).join('')+r.maybe.map(function(d){return dupCard(d,false);}).join('')+'</div>';
  }).catch(function(e){ box.innerHTML='<div class="mn-bulk-err">失敗: '+esc(e&&e.message||e)+'</div>'; });
}
function dupMerge(from,to){
  if(!confirm('「'+from+'」を「'+to+'」に寄せます。\n\n・同じフロアに両方あれば本数を足します\n・無ければ品名を変えるだけです（本数は消えません）\n・メニューの紐づけも新しい品名に付け替えます\n\n⚠️これは取り消せません。「'+from+'」という品名は無くなります。\n\nよろしいですか？'))return;
  api('mergeStockNames',{from:from,to:to}).then(function(r){
    if(!res(r))return;
    var d=[];
    if(r.renamed.length)d.push('改名 '+r.renamed.join('、'));
    if(r.mergedQty.length)d.push('本数を合算 '+r.mergedQty.join('、'));
    if(r.relinked)d.push('「'+r.relinked+'」の紐づけを付け替え');
    toast('統合しました：'+(d.join(' / ')||'変更なし'));
    menuBoard=null; renderMenu(); setTimeout(dupScan,300);   // 残りの重複を続けて潰せるように再スキャン
  }).catch(function(e){toast('統合に失敗: '+(e&&e.message||e),true);});
}

      +lines;
  }).catch(function(e){toast('プレビューに失敗: '+(e&&e.message||e),true);});

var payMonth=null, payStat=null, paySub='tatekae';
function nowMonth(){ if(!IS_GAS)return '2026-07'; var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function paySubToggle(which){
  function chip(k,label){ return '<div class="chip'+(which===k?' on':'')+'" onclick="paySwitch(\''+k+'\')">'+label+'</div>'; }
  return '<div class="chips" style="margin-bottom:12px">'+chip('tatekae','💳 立替集計')+chip('keihi','💴 経費立替')+chip('trust','📥 TRUST取込')+chip('bills','🧾 売上明細')+chip('mybills','👤 個人売上明細')+chip('kyuyo','🧮 給与明細')+chip('kotsu','🚕 交通費')+chip('bday','🎂 誕生日バック')+chip('publish','📣 公開設定')+'</div>';
}
function paySwitch(k){ paySub=k; renderPay(); }
function renderPay(){
  if(paySub==='tatekae') return renderTatekae();
  if(paySub==='keihi')   return renderKeihiTatekae();
  if(paySub==='trust')   return renderTrust();
  if(paySub==='bills')   return renderBillsAdmin('all');
  if(paySub==='mybills') return renderBillsAdmin('cast');
  if(paySub==='kyuyo')   return renderKyuyo();
  if(paySub==='kotsu')   return renderKotsu();
  if(paySub==='bday')    return renderBday();
  renderPublish();
}
/* --- 🧾 売上明細 / 👤 個人売上明細（TRUSTから取り込んだ伝票を見る） ---
   データは伝票シート＝取込済みのものを表示するだけ（TRUSTへ取りに行かない＝403でも見える）。
   画面は1つで billMode('all'|'cast')で振る舞いを変える＝日別アコーディオンの描画が完全に同じため。
   個人側はキャスト未選択のとき一覧(売上順)を出し、それ自体を入口にする＝プルダウンを開かせるより
   「誰がいくらか」が先に見える。 */
var billMonth=null, billCast='', billSeq=0, billMode='all';
/* ⚠️世代カウンタで「古い結果を捨てる」だけにする＝busyガード(読み込み中は無視)は付けないこと。
   両方を同居させると連打・高速切替で永久に読み込み中から抜けなくなる（既知の罠）。
   これが無いと、月を素早く切り替えた時に遅れて届いた前の月が最後に描画されて居座る。 */
function renderBillsAdmin(mode){
  if(mode&&mode!==billMode){ billMode=mode; billCast=''; }  // モードを跨いだら絞りは持ち越さない
  if(billMode==='all') billCast='';                          // 店全体は常に絞らない
  var my=++billSeq;
  loading();
  api('adminGetBills',{month:billMonth||nowMonth(), cast:billCast}).then(function(r){
    if(my!==billSeq)return;
    if(!res(r))return; drawBillsAdmin(r);
  }).catch(function(){
    if(my!==billSeq)return;
    setBody(paySubToggle('bills')+'<div class="empty">読み込みエラー</div>');
  });
}
function onBillMonth(){ billMonth=document.getElementById('bm').value; renderBillsAdmin(); }
function onBillCast(){ billCast=document.getElementById('bc').value; renderBillsAdmin(); }
function pickBillCast(n){ billCast=n; renderBillsAdmin(); }
function drawBillsAdmin(r){
  billMonth=r.month; billCast=r.cast||'';
  var isAll=(billMode==='all');
  var mo=(r.months||[]).map(function(m){return '<option value="'+esc(m)+'"'+(m===r.month?' selected':'')+'>'+esc(m)+'</option>';}).join('')||'<option>'+esc(r.month||'—')+'</option>';
  var head='<div class="toolbar"><span class="cnt">対象月</span><select class="finput" id="bm" onchange="onBillMonth()" style="width:120px">'+mo+'</select>';
  if(!isAll){
    // 件数と金額をプルダウンにも出す＝選び直す時に一覧へ戻らなくて済む
    head+='<span class="cnt">キャスト</span><select class="finput" id="bc" onchange="onBillCast()" style="max-width:260px">'
      +'<option value=""'+(!billCast?' selected':'')+'>（一覧から選ぶ）</option>'
      +(r.casts||[]).map(function(c){
        return '<option value="'+esc(c.name)+'"'+(c.name===billCast?' selected':'')+'>'+esc(c.name)+'（'+c.count+'件・'+fmtYen(c.total)+'）</option>';
      }).join('')+'</select>';
  }
  head+='<span class="cnt">'+(isAll?'店全体 ':'')+(r.slipCount||0)+'件 ・ 担当売上計'+fmtYen(r.monthTotal||0)+'</span></div>';
  var body;
  if(!isAll && !billCast){
    // 個人モードの入口＝キャスト一覧（売上順）。これ自体が「誰がいくら稼いだか」の表になる。
    body=(r.casts||[]).length
      ? '<div class="mtx-wrap"><table class="mtx" style="font-size:12px"><thead><tr>'
        +'<th style="text-align:left">キャスト</th><th>伝票</th><th>担当売上</th></tr></thead><tbody>'
        +(r.casts||[]).map(function(c){
          return '<tr class="bill-castrow" onclick=\'pickBillCast('+JSON.stringify(c.name)+')\'>'
            +'<td class="nm">'+esc(c.name)+'</td><td style="text-align:center;color:var(--sub)">'+c.count+'件</td>'
            +'<td style="text-align:right;font-weight:700;color:var(--accent)">'+fmtYen(c.total)+'</td></tr>';
        }).join('')
        +'</tbody></table></div><div class="hint" style="margin-top:8px">キャストをタップすると、その子の伝票が日別で開きます。'
        +'<b>(未設定)</b>＝TRUSTの担当セルから主担当を推定できなかった伝票。<br>'
        +'⚠️ここに出るのは<b>主担当ぶんだけ</b>です。ヘルプで付いた伝票はその子の売上には出ません。</div>'
      : '<div class="empty">この月の伝票データがありません。<br><small>取り込みは「📥 TRUST取込」から。</small></div>';
    setBody(paySubToggle('mybills')+head+body); return;
  }
  if(!(r.days||[]).length){
    body='<div class="empty">'+(billCast?esc(billCast)+' の伝票がこの月にありません。':'この月の伝票データがありません。')
      +'<br><small>取り込みは「📥 TRUST取込」から。</small></div>';
  } else {
    body=(r.days||[]).map(function(day){
      var slips=(day.slips||[]).map(function(s){
        return '<div class="bill-slip" onclick=\'billDetail(this,'+JSON.stringify(day.date)+','+JSON.stringify(s.uuid)+')\'>'
          +'<div class="bs-top"><span class="bs-cust">'+esc(s.cust||'（無記名）')
          +' <span class="bs-meta">卓'+esc(s.table||'-')+'・'+esc(s.guests||'-')+'名'+(s.inTime?'・'+esc(s.inTime):'')+'</span></span>'
          +'<span class="bs-amt">'+fmtYen(s.tantoAmt)+'</span></div>'
          // 主担当は「売上明細(店全体)」の時だけ出す＝個人で絞っている時は全行に同じ名前が並ぶだけで邪魔
          +(isAll?'<div class="bs-sub">主担当: '+esc(s.primary||'(未設定)')+(s.dohanCast?'　同伴: '+esc(s.dohanCast):'')+'</div>'
                 :(s.dohanCast?'<div class="bs-sub">同伴: '+esc(s.dohanCast)+'</div>':''))
          +'<div class="bill-detail" style="display:none"></div></div>';
      }).join('');

  function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  var yst=new Date();yst.setDate(yst.getDate()-1);

  var start=yst;
  var lb=trustInfo&&trustInfo.status&&trustInfo.status.latestBillDate;
  if(lb&&/^\d{4}-\d{2}-\d{2}$/.test(lb)){var d=new Date(lb+'T00:00:00');d.setDate(d.getDate()+1);start=d;}

  if(start<cap)start=cap;

async function xlsxInflateRaw_(bytes){
  var ds=new DecompressionStream('deflate-raw');
  var ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);
}
async function xlsxUnzip_(u8, wanted){

    var method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    var nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commentLen=dv.getUint16(off+32,true);
    var lho=dv.getUint32(off+42,true);

      var lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
      var start=lho+30+lNameLen+lExtraLen, comp=u8.subarray(start,start+compSize);

    }

  }
  return out;
}

function xlsxDataRows_(rows){var c=0;for(var i=0;i<rows.length;i++){var no=(rows[i][0]||'').trim(),nm=(rows[i][1]||'').trim();if(/^\d+$/.test(no)&&nm&&nm!=='合計')c++;}return c;}
async function xlsxBestSheetRows_(file){
  var u8=new Uint8Array(await file.arrayBuffer());
  var files=await xlsxUnzip_(u8,function(n){return n==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/.test(n);});
  var td=new TextDecoder();
  var sst=files['xl/sharedStrings.xml']?xlsxParseSST_(td.decode(files['xl/sharedStrings.xml'])):[];
  var best=null,score=-1;
  Object.keys(files).filter(function(n){return /worksheets/.test(n);}).sort().forEach(function(n){
    var rows=xlsxParseSheet_(td.decode(files[n]),sst),sc=xlsxDataRows_(rows);
    if(sc>score){score=sc;best=rows;}
  });
  return best||[];
}

function bdayStatusBadge(st){
  var m={
    '承認済':{t:'承認済',bg:'#0f2a18',bd:'#1f5a34',c:'#7ee0a0'},
    '申請中':{t:'承認待ち',bg:'#2a2410',bd:'#5a4e1f',c:'#e0d07e'},
    '差戻':{t:'差戻',bg:'#2a1214',bd:'#5a2226',c:'#ff9aa0'}
  }[st]||{t:esc(st),bg:'#141b2a',bd:'#2a3a55',c:'#8aabcc'};
  return '<span style="display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px;background:'+m.bg+';border:1px solid '+m.bd+';color:'+m.c+'">'+m.t+'</span>';

function approveBday(name){
  if(!confirm('【'+name+'】の誕生日週間を承認しますか？\n承認するとこの期間の担当売上に誕生日バック率が適用されます。')) return;
  loading();
  gsr('adminApproveBirthdayWeek',USER_ID,name).then(function(r){
    if(!r||r.ok===false){ toast((r&&r.error)||'承認に失敗しました',true); renderBday(); return; }
    toast(name+' の誕生日週間を承認しました（'+esc(r.start)+'〜'+esc(r.end)+'）');
    renderBday();
  }).catch(function(){ toast('承認に失敗しました',true); renderBday(); });
}
function sendbackBday(name){
  var reason=prompt('【'+name+'】の誕生日週間を差し戻します。\n差し戻し理由（本人に通知されます）:','');
  if(reason===null) return;
  loading();
  gsr('adminSendbackBirthdayWeek',USER_ID,name,String(reason||'').trim()).then(function(r){
    if(!r||r.ok===false){ toast((r&&r.error)||'差し戻しに失敗しました',true); renderBday(); return; }
    toast(name+' の誕生日週間を差し戻しました');
    renderBday();
  }).catch(function(){ toast('差し戻しに失敗しました',true); renderBday(); });
}
function prefillBday(name,mk,mmdd){
  document.getElementById('bd_name').value=name;
  var y=parseInt(String(mk).slice(0,4),10);
  var p=String(mmdd).split(/[^\d]+/).filter(Boolean),mo,da;
  if(p.length>=3&&p[0].length===4){mo=+p[1];da=+p[2];}else{mo=+p[0];da=+p[1];}
  if(mo>=1&&da>=1){
    var bd=new Date(y,mo-1,da);
    var f=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
    var s=new Date(bd);s.setDate(s.getDate()-3); var e=new Date(bd);e.setDate(e.getDate()+3);
    document.getElementById('bd_s').value=f(s); document.getElementById('bd_e').value=f(e);
  }
  document.getElementById('bd_r').value=30;
  document.getElementById('bd_name').scrollIntoView({behavior:'smooth',block:'center'});
}
function editBday(name,s,e,rate){
  document.getElementById('bd_name').value=name;
  document.getElementById('bd_s').value=s;
  document.getElementById('bd_e').value=e;
  document.getElementById('bd_r').value=rate;
  document.getElementById('bd_name').scrollIntoView({behavior:'smooth',block:'center'});
}
function saveBday(){
  var name=(document.getElementById('bd_name').value||'').trim();
  var s=document.getElementById('bd_s').value, e=document.getElementById('bd_e').value;
  var r=document.getElementById('bd_r').value;
  if(!name){ toast('キャストを選択してください',true); return; }
  if(!s||!e){ toast('開始日・終了日を選択してください',true); return; }
  if(s>e){ toast('開始日が終了日より後です',true); return; }
  loading();
  gsr('adminSetBirthdayBack',USER_ID,s.slice(0,7),name,s,e,r).then(function(rr){
    if(!rr||rr.ok===false){ toast((rr&&rr.error)||'保存に失敗しました',true); renderBday(); return; }
    toast(rr.spans ? (name+' の誕生日バックを保存（月またぎ→'+rr.months.join(' / ')+'に自動分割）') : (name+' の誕生日バックを保存しました'));
    renderBday();
  }).catch(function(){ toast('保存に失敗しました',true); renderBday(); });
}
function clearBday(name,mk){
  if(!confirm('【'+name+'】'+mk+' の誕生日バック設定を解除しますか？')) return;
  loading();
  gsr('adminSetBirthdayBack',USER_ID,mk,name,'','','').then(function(r){ if(res(r,name+' の設定を解除しました')) renderBday(); }).catch(function(){ toast('解除に失敗しました',true); renderBday(); });
}
function runBdayReminder(){
  loading();
  gsr('adminRunBirthdayReminderNow',USER_ID).then(function(r){
    if(!r||r.ok===false){ toast((r&&r.error)||'失敗しました',true); renderBday(); return; }
    toast(r.count ? ('要対応に出しました: '+r.names) : '今月は未設定の誕生日キャストがいません');
    renderBday();
  }).catch(function(){ toast('通信エラー',true); renderBday(); });
}
