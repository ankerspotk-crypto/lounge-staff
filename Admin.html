var denpyoSub='slip', denpyoDate='', receiptMonth='';
function fmtYen(n){ return '¥'+(Number(n)||0).toLocaleString('ja-JP'); }
function dpCell(c){ var s=String(c==null?'':c); if(/^https?:\/\//.test(s)) return '<a href="'+esc(s)+'" target="_blank" rel="noopener" style="color:var(--accent)">🖼 開く</a>'; return esc(s); }
function dpAddDays(ds,n){ var p=(ds||'').split('-'); var dt=(p.length===3)?new Date(+p[0],+p[1]-1,+p[2]):new Date(); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
function dpSubToggle(which){
  function chip(k,label){ return '<div class="chip'+(which===k?' on':'')+'" onclick="dpSwitch(\''+k+'\')">'+label+'</div>'; }
  return '<div class="chips" style="margin-bottom:12px">'+chip('slip','🧾 伝票（日付別）')+chip('receipt','💇 領収書（月別）')+'</div>';
}
function renderDenpyo(){ if(!IS_GAS){ setBody(dpSubToggle(denpyoSub)+'<div class="empty">（ローカルではプレビュー不可・本番でご確認ください）</div>'); return; } if(denpyoSub==='receipt') loadReceipts(); else loadSlips(); }
function dpSwitch(k){ denpyoSub=k; renderDenpyo(); }
/* --- 伝票（日付別） --- */
function loadSlips(){ loading(); gsr('adminGetDenpyoDay',USER_ID,denpyoDate).then(function(r){ if(!res(r))return; denpyoDate=r.date; drawSlips(r); }).catch(function(){setBody(dpSubToggle('slip')+'<div class="empty">読み込みエラー</div>');}); }
function drawSlips(r){
  var nav='<div class="toolbar"><button class="btn" onclick="slipDay(-1)">‹ 前日</button>'
    +'<input class="finput" id="dpd" type="date" value="'+esc(r.date)+'" onchange="slipPick()" style="width:150px">'
    +'<button class="btn" onclick="slipDay(1)">翌日 ›</button><button class="btn" onclick="slipToday()">今日</button></div>';
  var any=r.groups.some(function(g){return g.data.rows.length;});
  var body=r.groups.map(dpTable).join('');
  setBody(dpSubToggle('slip')+nav+(any?'':'<div class="hint" style="margin:2px 0 12px">この営業日に登録された伝票はありません。日付を変えてご確認ください。</div>')+body);
}
var DP_KEY_SHEET={daily:'日払い記録',receipt:'領収書記録',delivery:'納品記録'}; // 削除可能な伝票シートだけ（現金チェック等は対象外）
function dpTable(g){
  var d=g.data||{headers:[],rows:[],total:0};
  var meta=d.rows.length+'件'+(d.total?' ・ 計'+fmtYen(d.total):'');
  var del=DP_KEY_SHEET[g.key]; // 日払い/領収書/納品のみチェック削除を出す
  var h='<div class="sec"><div class="sec-t">'+g.title+' <span style="color:var(--dim);font-weight:600;font-size:12px">'+meta+'</span>'
    +((del&&d.rows.length)?' <button class="btn" onclick="dpcBulkDel(\''+g.key+'\')" style="margin-left:8px;padding:5px 11px;font-size:12px;border-color:#8a3a5a;color:#ff9ab0">🗑 選択をまとめて削除</button>':'')
    +'</div>';
  if(!d.rows.length){ return h+'<div class="empty" style="padding:12px 0">—</div></div>'; }
  h+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;min-width:100%;font-size:12px;white-space:nowrap">';
  h+='<tr>'+(del?'<th style="padding:6px 9px;border-bottom:1px solid var(--line2)"><input type="checkbox" onchange="dpcToggleAll(\''+g.key+'\',this.checked)" title="全選択"></th>':'')+d.headers.map(function(hd){return '<th style="text-align:left;padding:6px 9px;border-bottom:1px solid var(--line2);color:var(--dim);font-weight:700">'+esc(hd)+'</th>';}).join('')+'</tr>';
  h+=d.rows.map(function(row){ return '<tr>'+(del?'<td style="padding:6px 9px;border-bottom:1px solid var(--line2);text-align:center"><input type="checkbox" class="dpc-chk" data-key="'+g.key+'" data-row="'+row.rowIdx+'"></td>':'')+row.cells.map(function(c){return '<td style="padding:6px 9px;border-bottom:1px solid var(--line2)">'+dpCell(c)+'</td>';}).join('')+'</tr>'; }).join('');
  return h+'</table></div></div>';
}
function dpcToggleAll(key,on){ Array.prototype.forEach.call(document.querySelectorAll('.dpc-chk[data-key="'+key+'"]'),function(cb){cb.checked=on;}); }
function dpcBulkDel(key){
  var sheet=DP_KEY_SHEET[key]; if(!sheet)return;
  var boxes=Array.prototype.slice.call(document.querySelectorAll('.dpc-chk[data-key="'+key+'"]:checked'));
  if(!boxes.length){ toast('削除する行にチェックを入れてください',true); return; }
  var idxs=boxes.map(function(cb){ return Number(cb.getAttribute('data-row')); });
  if(!confirm(idxs.length+'件の伝票を削除しますか？（元に戻せません）'))return;
  gsr('kioskDeleteDenpyoBulk',sheet,idxs).then(function(r2){
    if(r2&&r2.ok){ toast('🗑 '+(r2.deleted||idxs.length)+'件を削除しました'); renderDenpyo(); }
    else { toast((r2&&r2.error)||'削除エラー',true); }
  }).catch(function(e){ toast('削除エラー: '+((e&&e.message)||e),true); });
}
function slipDay(n){ denpyoDate=dpAddDays(denpyoDate,n); renderDenpyo(); }

        +'<td style="padding:7px 10px;border-bottom:1px solid var(--line2)">'+(x.photoUrl?'<a href="'+esc(x.photoUrl)+'" target="_blank" rel="noopener" style="color:var(--accent)">🖼 領収書を開く</a>':'<span style="color:var(--dim)">画像なし</span>')+'</td>'
        +'</tr>'; }).join('')

var okuriMode=null, thresholds=null, seatList=null, kfTasks=[], cashStatus=null, gunshiMaint=null;
function renderOps(){
  loading();
  Promise.all([api('getOkuriMode'),api('getCashThresholds'),api('getSeatList'),api('listKurofukuTasks'),api('getCashCheckStatus').catch(function(){return null;}),gsr('getGunshiMaintenance').catch(function(){return null;})]).then(function(r){
    okuriMode=(r[0]&&r[0].mode)||'driver'; thresholds=(r[1]&&r[1].thresholds)||null; seatList=(r[2]&&r[2].seats)||[]; kfTasks=(r[3]&&r[3].tasks)||[]; cashStatus=(r[4]&&r[4].cash)||null; gunshiMaint=r[5]||{on:false};
    drawOps();
  }).catch(function(){setBody('<div class="empty">読み込みエラー</div>');});
}
function drawOps(){
  var drv=okuriMode!=='jisha';
  // 📋 黒服へタスクを送る（18時にまとめてLINE送信／18時以降は即送信。完了は軍師の「要対応」で）
  var kfList=(kfTasks||[]).map(function(t){
    // メモは別行で改行を保って出す（metaに連結すると長い手順で行が崩れて読めない）
    return '<div class="lrow"><div class="main"><div class="nm">'+esc(t.title)+'</div><div class="meta">'+(t.sent?'✅ LINE送信済み':'⏳ 18時にまとめて送信')+(t.by?' ・'+esc(t.by):'')+(t.at?' ・'+esc(t.at):'')+'</div>'
      +(t.memo?'<div class="kf-memo">'+esc(t.memo).replace(/\n/g,'<br>')+'</div>':'')
      +'</div><button class="btn dng sm" onclick="delKfTask(\''+jstr(t.id)+'\')">削除</button></div>';
  }).join('')||'<div class="empty" style="padding:14px">未完了のタスクはありません</div>';
  var kfSec='<div class="sec"><div class="sec-t">📋 黒服へタスクを送る <span class="sub">18時にまとめてLINE送信・18時以降の追加は即送信。完了は軍師の「要対応」でチケットを押す</span></div>'
    +'<div class="toolbar"><input class="finput grow" id="kf-title" placeholder="例：お土産の在庫を入力すること" onkeydown="if(event.key===\'Enter\')addKfTask()"><button class="btn pri" onclick="addKfTask()">追加</button></div>'
    // メモは軍師のタスクカードで改行を保ったまま出る＋LINEにも同じ文面が乗る＝手順はここに書けばいい
    +'<textarea class="finput" id="kf-memo" rows="3" style="width:100%;margin-top:8px" placeholder="メモ（任意・改行OK）。手順や注意点はここに。軍師のカードとLINEの両方に出ます"></textarea>'
    +'<div style="margin-top:10px">'+kfList+'</div></div>';
  var okuri='<div class="sec"><div class="sec-t">🚗 送りモード</div><div class="chips"><div class="chip'+(drv?' on':'')+'" onclick="setOkuri(\'driver\')">🚗 ドライバー手配</div><div class="chip'+(!drv?' on':'')+'" onclick="setOkuri(\'jisha\')">🏠 自社送り</div></div><div class="hint">自社送りモード中はドライバーへの通知を止めます。</div></div>';

  var seatCards=(seatList||[]).map(function(s){
    var st=s.occupied?('🟢 '+(s.cust?esc(s.cust)+'様':'稼働')+(s.casts&&s.casts.length?' / '+s.casts.map(esc).join('、'):'')):'空席';
    return '<div class="lrow"><div class="main"><div class="nm">'+esc(s.label)+'</div><div class="meta">'+st+'</div></div><button class="btn dng sm" onclick="resetSeat(\''+jstr(s.code)+'\',\''+jstr(s.label)+'\')">強制リセット</button></div>';
  }).join('')||'<div class="empty" style="padding:14px">席データなし</div>';
  var seats='<div class="sec"><div class="sec-t">🪑 席単位の強制リセット <span class="sub">その席の在席・予約・タグ等をクリア</span></div>'+seatCards+'</div>';

  var resets='<div class="sec"><div class="sec-t">♻️ 各種リセット <span class="sub">当日分・破壊的操作（確認あり）</span></div><div class="chips">'+
    '<button class="btn warn" onclick="doReset(\'resetOpeningCheck\',\'開店チェック\')">開店チェック</button>'+
    '<button class="btn warn" onclick="doReset(\'resetCashCheck\',\'閉店チェック\')">閉店チェック</button>'+
    '<button class="btn warn" onclick="doReset(\'resetSafeWithdrawalLog\',\'金庫出金ログ\')">金庫出金ログ</button>'+
    '<button class="btn dng" onclick="doReset(\'resetGunshiSettings\',\'軍師設定\')">軍師設定</button>'+
    '<button class="btn dng" onclick="doReset(\'resetGunshiSeating\',\'全席（軍師座席）\')">全席リセット</button>'+
    '</div></div>';

  var other='<div class="sec"><div class="sec-t">🔧 その他</div><div class="chips">'+
    '<button class="btn" onclick="doAction(\'syncRsrvWithReservations\',\'予約を同期しました\')">🔄 予約同期</button>'+
    '<button class="btn warn" onclick="doForceLogout()">🚪 軍師端末を強制ログアウト</button>'+
    '</div></div>';

  var th=thresholds||{till:{f5:{},f2:{}},safe:{f5:{},f2:{}}};
  function tRow(kind,floor){
    return '<tr><td class="nm">'+(kind==='till'?'レジ':'金庫')+' '+floor.toUpperCase().replace('F','F')+'</td>'+DENOMS.map(function(d){
      var o=((th[kind]||{})[floor]||{})[d.k]||{};
      var minI='<input class="tin" id="ct-'+kind+'-'+floor+'-'+d.k+'-min" value="'+(o.min!=null?o.min:'')+'" placeholder="下限">';
      var maxI=kind==='till'?'<input class="tin" id="ct-'+kind+'-'+floor+'-'+d.k+'-max" value="'+(o.max!=null?o.max:'')+'" placeholder="上限">':'<span class="no">−</span>';
      return '<td>'+minI+(kind==='till'?' 〜 '+maxI:'')+'</td>';
    }).join('')+'</tr>';
  }
  var thresholdsSec='<div class="sec"><div class="sec-t">💰 現金しきい値 <span class="sub">枚数の下限〜上限（現金チェックの警告判定）</span></div><div class="mtx-wrap"><table class="mtx"><tr><th style="text-align:left">区分</th>'+DENOMS.map(function(d){return '<th>'+d.t+'</th>';}).join('')+'</tr>'+tRow('till','f5')+tRow('till','f2')+tRow('safe','f5')+tRow('safe','f2')+'</table></div><button class="btn pri" style="margin-top:10px" onclick="saveThresholds()">💾 しきい値を保存</button></div>';

  var pinSec='<div class="sec"><div class="sec-t">🔢 軍師 マスターPIN <span class="sub">個別PIN未設定の人が使う共通PIN（4桁）</span></div><div class="toolbar"><input class="finput" id="mpin" value="'+esc(ST.masterPin||'')+'" maxlength="4" inputmode="numeric" style="width:120px" placeholder="4桁数字"><button class="btn pri" onclick="saveMasterPin()">保存</button></div><div class="hint">個別PINはスタッフタブの各カードで設定できます。</div></div>';
  var cpSet=!!(ST&&ST.consolePinSet);
  var consolePinSec='<div class="sec"><div class="sec-t">🔐 管理コンソールPIN <span class="sub">このコンソールを開くときのPIN（4〜6桁）</span></div>'
    +'<div class="toolbar"><input class="finput" id="cpin" maxlength="6" inputmode="numeric" style="width:150px" placeholder="'+(cpSet?'変更する4〜6桁':'新規4〜6桁')+'"><button class="btn pri" onclick="saveConsolePin()">'+(cpSet?'変更':'設定')+'</button>'+(cpSet?'<button class="btn dng" onclick="clearConsolePin()">解除</button>':'')+'</div>'
    +'<div class="hint">'+(cpSet?'✅ 設定済み。次回からQRの代わりにこのPINでコンソールを開けます。':'未設定（今はQRログイン）。設定するとQRの代わりにPINで開けるようになります。')+'</div></div>';
  var cashApproveSec=(function(){
    var c=cashStatus;
    var head='<div class="sec"><div class="sec-t">🌙 閉店チェックの承認 <span class="sub">黒服が提出した現金照合を管理者が承認（承認で退勤ゲート解除）</span></div>';
    if(!c||!c.reportSubmitted){
      return head+'<div class="empty" style="padding:14px">本日'+(c&&c.dateKey?'（'+esc(c.dateKey)+'）':'')+'の閉店チェックはまだ黒服から提出されていません。</div></div>';
    }
    var yen=function(n){return '¥'+Number(n||0).toLocaleString();};
    function row(l,v,col){ return '<div class="lrow" style="padding:6px 2px"><div class="main"><div class="meta">'+l+'</div></div><div style="font-weight:800;color:'+(col||'var(--txt)')+'">'+v+'</div></div>'; }
    var rows='';
    if(c.openingSubmitted){
      rows+=row('🌅 スタート',yen(c.openingTotal));
      rows+=row('＋ 現金売上',yen(c.cashSalesInput),'#7be0a8');
      rows+=row('－ 伝票 出金',yen(c.slipTotal),'#e0a060');
      rows+=row('＝ 残るはず',yen(c.expectedRemain));
      rows+=row('実測（4袋）',yen(c.actualTotal));
      var d=Number(c.diff||0), ok=!!c.within;
      rows+=row('差額',(ok?'✅ ':'⚠️ ')+yen(Math.abs(d))+(ok?'（許容内）':(d>0?' 足りない':' 多い')),ok?'#66cc88':'#e06666');
    } else {
      rows+='<div class="empty" style="padding:10px;color:#e0a060">⚠️ 開店の現金が未提出のため照合できていません（承認前に開店チェックの提出が必要）</div>';
    }
    var slips=(c.slipDetails||[]);
    var slipHtml=slips.length?('<div class="meta" style="margin-top:8px;line-height:1.6">伝票 '+slips.length+'枚：'+slips.map(function(x){return esc((x.category||'その他')+(x.payee?'/'+x.payee:'')+' ')+yen(x.amount);}).join('、')+'</div>'):'';
    var body='<div class="lrow" style="padding:6px 2px"><div class="main"><div class="nm">報告者 '+esc(c.reporterName)+'</div><div class="meta">対象日 '+esc(c.dateKey)+'</div></div></div>'+rows+slipHtml;
    if(c.approved){
      return head+body+'<div style="margin-top:12px;padding:11px 13px;border-radius:10px;background:rgba(102,204,136,.14);color:#8fe0ab;font-weight:800">✅ 承認済み　承認者 '+esc(c.approver)+'（'+esc(c.approvedAt)+'）／黒服の退勤OK</div></div>';
    }
    var btn=c.openingSubmitted
      ?'<button class="btn ok" style="width:100%;margin-top:12px;padding:12px;font-size:15px" onclick="approveCashFromConsole()">✅ この内容で承認する</button>'
      :'<div class="hint" style="margin-top:10px">開店チェックが提出されると承認できるようになります。</div>';
    return head+body+btn+'</div>';
  })();
  /* 🛠 軍師の停止 / 再開（メンテナンス）＝壊さず全端末を止めて、いつでも戻せる */
  var gm=gunshiMaint||{on:false};
  var maintSec='<div class="sec" style="'+(gm.on?'border:1px solid #7a2a2a;background:rgba(180,40,40,.10)':'')+'">'
    +'<div class="sec-t">🛠 軍師の停止 / 再開 <span class="sub">全端末を「メンテナンス中」にして入店を止める。データは動いたまま・いつでも再開できる</span></div>'
    +'<div class="lrow" style="padding:8px 2px"><div class="main"><div class="nm">現在の状態</div><div class="meta">'
      +(gm.on?'🔴 メンテナンス中（軍師は停止）'+(gm.at?' ・'+esc(gm.at):'')+(gm.by?' ・操作:'+esc(gm.by):''):'🟢 稼働中')
    +'</div></div></div>'
    +'<textarea class="finput" id="maint-msg" rows="2" style="width:100%;margin-top:8px" placeholder="停止中に軍師画面へ出す一言（任意）。例：システム更新中です。21時ごろ再開します。">'+(gm.on?esc(gm.msg||''):'')+'</textarea>'
    +'<div class="chips" style="margin-top:10px">'
      +(gm.on
         ?'<button class="btn ok" onclick="applyGunshiMaint(false)">🟢 軍師を再開する</button>'
         :'<button class="btn dng" onclick="applyGunshiMaint(true)">🔴 軍師を停止する</button>')
    +'</div>'
    +'<div class="hint" style="margin-top:8px">停止中も予約・売上のデータは動き続けます（画面を止めるだけ）。各端末への反映は最大60秒。</div></div>';
  setBody(maintSec+cashApproveSec+kfSec+okuri+pinSec+consolePinSec+seats+resets+thresholdsSec+other);
}
function applyGunshiMaint(on){
  var me=document.getElementById('maint-msg'); var msg=(me&&me.value||'').trim();
  if(on){ if(!confirm('軍師を停止します。\n全端末が「メンテナンス中」表示になり、黒服は操作できなくなります。\n（予約・売上データは動き続けます。いつでも再開できます）\nよろしいですか？'))return; }
  else  { if(!confirm('軍師を再開します。各端末は自動で通常画面に戻ります。よろしいですか？'))return; }
  if(!IS_GAS){ gunshiMaint={on:on,msg:on?msg:'',at:on?'(local)':'',by:''}; toast(on?'停止（ローカル）':'再開（ローカル）'); drawOps(); return; }
  gsr('setGunshiMaintenance',on,msg,USER_ID).then(function(r){ gunshiMaint=r||{on:on,msg:on?msg:''}; toast(on?'🔴 軍師を停止しました':'🟢 軍師を再開しました'); drawOps(); }).catch(function(){toast('通信エラー',true);});
}
function approveCashFromConsole(){
  var c=cashStatus; if(!c){toast('データがありません',true);return;}
  if(!confirm('本日（'+c.dateKey+'）の閉店チェックを承認します。\n黒服の退勤ゲートが解除され、10分後に軍師端末が自動ログアウトします。\nよろしいですか？'))return;
  api('approveCashCheck',{dateKey:c.dateKey}).then(function(r){ if(res(r,'承認しました（黒服の退勤OK）'))renderOps(); }).catch(function(){toast('通信エラー',true);});
}
function addKfTask(){
  var el=document.getElementById('kf-title'); var t=(el&&el.value||'').trim();
  var me=document.getElementById('kf-memo'); var m=(me&&me.value||'').trim();
  if(!t){toast('タスク内容を入力してください',true);return;}
  api('addKurofukuTask',{title:t,memo:m}).then(function(r){ if(res(r,(r&&r.sent)?'追加＋黒服LINEに送信しました':'追加しました（18時にまとめて送信）')){ if(el)el.value=''; if(me)me.value=''; renderOps(); } }).catch(function(){toast('通信エラー',true);});
}
function delKfTask(id){
  if(!confirm('このタスクを削除しますか？（軍師の「要対応」からも消えます）'))return;
  api('deleteKurofukuTask',{id:id}).then(function(r){ if(res(r,'削除しました'))renderOps(); }).catch(function(){toast('通信エラー',true);});
}
function setOkuri(mode){ if(okuriMode===mode)return; if(!confirm(mode==='jisha'?'自社送りモードに切替（ドライバー通知を止めます）':'ドライバー手配モードに切替'))return; api('setOkuriMode',{mode:mode}).then(function(r){ if(res(r,'送りモードを変更しました')){okuriMode=(r&&r.mode)||mode;drawOps();} }); }
function resetSeat(code,label){ if(!confirm(label+' を強制リセットします。この席の在席・予約・タグ等がクリアされます。よろしいですか？'))return; api('resetSeat',{seatCode:code}).then(function(r){ if(res(r,label+' をリセットしました'))renderOps(); }); }
function doReset(action,label){ if(!confirm('【'+label+'】を本日分リセットします。元に戻せません。実行しますか？'))return; api(action).then(function(r){ res(r,label+' をリセットしました'); }); }
function doAction(action,okmsg){ api(action).then(function(r){ res(r,okmsg); }); }
function doForceLogout(){ if(!confirm('全ての軍師端末を強制ログアウトします。よろしいですか？'))return; api('kioskForceLogout').then(function(r){ res(r,'強制ログアウトしました'); }); }
function saveThresholds(){
  var out={till:{f5:{},f2:{}},safe:{f5:{},f2:{}}};
  ['till','safe'].forEach(function(kind){ ['f5','f2'].forEach(function(fl){ DENOMS.forEach(function(d){
    var mn=document.getElementById('ct-'+kind+'-'+fl+'-'+d.k+'-min'); var o={};
    if(mn&&mn.value!=='')o.min=Number(mn.value);
    if(kind==='till'){ var mx=document.getElementById('ct-'+kind+'-'+fl+'-'+d.k+'-max'); if(mx&&mx.value!=='')o.max=Number(mx.value); }
    out[kind][fl][d.k]=o;
  }); }); });
  api('saveCashThresholds',{thresholds:out}).then(function(r){ res(r,'しきい値を保存しました'); });
}

/* ===== 📅 予約（キャスト別の予約一覧・過去/未来）=====
   帰属＝予約キャスト優先／空なら担当キャストで補完（「本日の出勤」通知と同じ規則）＋同伴キャストも拾う（ボス指定 2026-07-16）。
   判定はサーバの castRolesInRsv_ が唯一の持ち主＝ここでは絶対に数え直さない（2箇所に規則があると必ず割れる）。 */
var rsvCast='', rsvData=null, rsvShowPast=false, rsvShowCxl=false;
var rsvMx=null, rsvMxFrom='', rsvMxDays=14, rsvMxBusy=false;
var rsvLog=null, rsvLogOp='', rsvLogQ='', rsvLogBusy=false; // 🕘 予約履歴（変更/削除ログ）
function rsvCastList(){ return (ST.staff||[]).filter(function(s){ var r=String(s.role||''); return r.indexOf('キャスト')>=0||r.indexOf('体験')>=0; }); }
function rsvBizToday(){ var n=new Date(); if(n.getHours()<6)n.setDate(n.getDate()-1); return hdFmt(n); } // 営業日(6時境界)＝シフト表と同じ基準
function renderRsv(){
  var all=rsvCastList();
  var active=all.filter(function(s){return !s.retired;});
  var retired=all.filter(function(s){return s.retired;});
  if(!all.length){ setBody('<div class="empty">キャストが登録されていません</div>'); return; }
  var chip=function(s){ return '<div class="chip'+(rsvCast===s.name?' on':'')+'" onclick="rsvPick(\''+jstr(s.name)+'\')">'+esc(s.name)+(s.retired?' <span style="opacity:.6">(退職)</span>':'')+'</div>'; };
  var picker='<div class="sec compact"><div class="hint">キャストを選ぶと、その子の予約が過去・未来まとめて出ます。'
    +'<b>予約キャスト</b>／（予約キャストが空なら）<b>担当キャスト</b>／<b>同伴キャスト</b>のどれかに名前が入っていれば、その子の予約として数えます。</div>'
    +'<div class="chips" style="margin-top:10px">'+active.map(chip).join('')+'</div>'
    +(retired.length?'<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--dim);font-weight:800;font-size:12px">🗄 退職済み（'+retired.length+'名）の履歴を見る</summary><div class="chips" style="margin-top:8px">'+retired.map(chip).join('')+'</div></details>':'')
    +'</div>';
  setBody('<div id="rsv-mx"></div>'+picker+'<div id="rsv-body">'+(rsvCast?'<div class="empty">読み込み中…</div>':'<div class="empty">キャストを選んでください</div>')+'</div>');
  drawRsvMx();
  if(!rsvMx && !rsvMxBusy) loadRsvMx();
  if(rsvCast) drawRsv();
}

/* ===== 店全体の日別マトリクス（縦=キャスト・横=日付・マス=予約件数）＝シフト表と同じ見せ方（ボス指定 2026-07-16） ===== */
function loadRsvMx(){
  if(rsvMxBusy) return;
  if(!rsvMxFrom) rsvMxFrom=rsvBizToday();
  rsvMxBusy=true;
  var want=rsvMxFrom+'/'+rsvMxDays;
  // ⚠️窓が動いていたら「捨てて終わり」にせず必ず取り直す。捨てるだけだと、
  //   飛んでいた要求は古いと判定され・新しい要求は busy で弾かれ＝誰も取りに行かず「読み込み中…」で固まる（連打で踏む）。
  var done=function(fn){ return function(a){ rsvMxBusy=false; if(rsvMxFrom+'/'+rsvMxDays!==want){ loadRsvMx(); return; } fn(a); drawRsvMx(); }; };
  api('getRsvMatrix',{from:rsvMxFrom,days:rsvMxDays})
    .then(done(function(r){ rsvMx=(r&&r.ok===false)?{error:r.error||'読み込みエラー'}:r; }))
    .catch(done(function(e){ rsvMx={error:(e&&e.message)||'通信エラー'}; }));   // 握り潰さない＝原因をボスが報告できるように
}
function rsvMxNav(diff){
  var d=new Date(rsvMxFrom+'T00:00:00'); d.setDate(d.getDate()+diff*rsvMxDays);
  rsvMxFrom=hdFmt(d); rsvMx=null; drawRsvMx(); loadRsvMx();
}
function rsvMxToday(){ rsvMxFrom=rsvBizToday(); rsvMx=null; drawRsvMx(); loadRsvMx(); }
function rsvMxSetDays(n){ rsvMxDays=parseInt(n,10)||14; rsvMx=null; drawRsvMx(); loadRsvMx(); }
function rsvMxMd(ds){ var p=ds.split('-'); return parseInt(p[1],10)+'/'+parseInt(p[2],10); }
function drawRsvMx(){
  var el=document.getElementById('rsv-mx'); if(!el) return;
  var navBar='<div class="toolbar" style="margin-bottom:8px">'
    +'<button class="btn sm" onclick="rsvMxNav(-1)">‹ 前</button>'
    +'<button class="btn sm" onclick="rsvMxToday()">今日</button>'
    +'<button class="btn sm" onclick="rsvMxNav(1)">次 ›</button>'
    +'<select class="finput" style="width:auto" onchange="rsvMxSetDays(this.value)">'
    +[7,14,31].map(function(n){return '<option value="'+n+'"'+(rsvMxDays===n?' selected':'')+'>'+n+'日</option>';}).join('')
    +'</select><span class="hint" style="margin:0">'+esc(rsvMxFrom||'')+' から'+rsvMxDays+'日</span></div>';
  var head='<div class="sec-t">📅 店全体の予約（日別）</div>';
  if(!rsvMx){ el.innerHTML='<div class="sec compact">'+head+navBar+'<div class="empty" style="padding:18px">読み込み中…</div></div>'; return; }
  if(rsvMx.error){ el.innerHTML='<div class="sec compact">'+head+navBar+'<div class="empty" style="padding:18px">'+esc(rsvMx.error)+'</div></div>'; return; }
  var D=rsvMx.dates||[], C=rsvMx.casts||[], today=rsvMx.today||'';
  var thead='<tr><th style="text-align:left">名前</th>'+D.map(function(ds){
    var cl=(rsvMx.closedDays||{})[ds], wd=hdWeekday(ds), isT=(ds===today);
    var wc=cl?'#c9a8f0':(wd==='日')?'#ee6666':(wd==='土')?'#6688ee':'inherit';
    return '<th style="color:'+wc+(isT?';box-shadow:inset 0 -2px 0 var(--accent)':'')+'"'+(cl?' title="'+esc(String(cl))+'"':'')+'>'+esc(rsvMxMd(ds))
      +'<br><span style="font-size:9px;font-weight:400;opacity:.85">'+wd+'</span>'+(cl?'<br><span style="font-size:8px;color:#c9a8f0">🏖休</span>':'')+'</th>';
  }).join('')+'<th>計</th></tr>';
  // ⚠️店全体＝予約そのものの数。キャスト列を足しても一致しない（1予約が予約キャスト＋同伴で2列に立つ／誰も紐づかない予約もある）
  var grand=0; D.forEach(function(ds){ grand+=(rsvMx.totals||{})[ds]||0; });
  var totalRow='<tr class="total-row"><td class="nm">🏯 店全体</td>'+D.map(function(ds){
    var n=(rsvMx.totals||{})[ds]||0, p=(rsvMx.pax||{})[ds]||0;
    return '<td>'+(n?n+'<span style="font-size:9px;opacity:.7;font-weight:400"> '+p+'名</span>':'<span style="opacity:.25">0</span>')+'</td>';
  }).join('')+'<td>'+grand+'</td></tr>';
  var body=C.map(function(c){
    return '<tr'+(c.offRoster?' style="opacity:.7"':'')+'><td class="nm" style="cursor:pointer" onclick="rsvPickFromMx(\''+jstr(c.name)+'\')">'+esc(c.name)
      +(c.offRoster?' <span class="badge" style="background:#3a2a10;color:#ddaa44">名簿外</span>':'')+'</td>'
      +D.map(function(ds){
        var n=(c.counts||{})[ds]||0;
        return '<td class="cell" onclick="rsvPickFromMx(\''+jstr(c.name)+'\')">'+(n?n:'<span style="opacity:.2">·</span>')+'</td>';
      }).join('')+'<td style="font-weight:800">'+(c.total||0)+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="sec compact">'+head+navBar
    +'<div class="mtx-scroll"><table class="mtx sm">'+thead+totalRow+body+'</table></div>'
    +'<div class="hint" style="margin-top:8px">🏯店全体＝その日の予約そのものの件数（小さい数字＝のべ人数）。<b>キャストの行を足しても店全体には一致しません</b>：1つの予約が予約キャストと同伴キャストの2人に立つことがあり、誰も紐づいていない予約（直接来店など）はどの行にも立たないためです。名前かマスを押すと、その子の一覧が下に出ます。</div>'
    +'</div>';
}
function rsvPickFromMx(name){ rsvPick(name); var el=document.getElementById('rsv-body'); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); }
/* ⚠️「読み込み中なら無視」にしない：読み込みの最中に別の子を押したタップが黙って消える（押しても何も起きない画面になる）。
 *   常に受け付けて、古い結果は下の rsvCast!==name で捨てる＝最後に押した子が必ず勝つ。 */
function rsvPick(name){
  if(rsvCast===name){ rsvCast=''; rsvData=null; renderRsv(); return; } // もう一度押したら選択解除
  rsvCast=name; rsvData=null; rsvShowPast=false;
  renderRsv();
  var done=function(fn){ return function(a){ if(rsvCast!==name) return; fn(a); drawRsv(); }; };  // 古い子の結果は捨てる
  api('getCastReservations',{cast:name})
    .then(done(function(r){ rsvData=(!r||r.ok===false)?{error:(r&&r.error)||'読み込みエラー'}:r; }))
    .catch(done(function(e){ rsvData={error:(e&&e.message)||'通信エラー'}; }));   // 握り潰さない＝原因をボスが報告できるように
}
function rsvRoleBadges(roles){
  var col={'予約':'background:#0e2440;color:#7ab0f0','担当':'background:#2a1030;color:#bb99ff','同伴':'background:#2a1800;color:#ffaa44','同席':'background:#0d2418;color:#66cc88'};
  return (roles||[]).map(function(x){ return '<span class="badge" style="'+(col[x]||'')+'">'+esc(x)+'</span>'; }).join(' ');
}
// 一覧インライン編集：退店予定時刻（チェック予定）だけをその行から直す。予約フォームは持たない＝この1点編集で足す。
function rsvSaveCheckTime(rowIdx,v,el){
  if(!rowIdx)return;
  var stat=el&&el.parentElement?el.parentElement.querySelector('.rsv-ct-stat'):null;
  if(stat){stat.textContent='保存中…';stat.style.color='var(--dim)';}
  api('setReservationCheckTime',{rowIdx:rowIdx,checkTime:v||''})
    .then(function(d){ if(d&&d.ok===false){ if(stat){stat.textContent='✕ '+(d.error||'失敗');stat.style.color='#e07a7a';} return; } if(stat){stat.textContent='✓ 保存';stat.style.color='#7be0a8';} })
    .catch(function(){ if(stat){stat.textContent='✕ 通信エラー';stat.style.color='#e07a7a';} });
}
function rsvRowHtml(x,past){
  var cxl=x.status==='キャンセル';
  var st=cxl?'<span class="badge" style="background:#2a1418;color:#d98a96;border:1px solid #5a2a34">🚫 削除済</span>'
          :(x.status&&x.status!=='確定'?'<span class="badge" style="background:#2a2210;color:#ddaa44">'+esc(x.status)+'</span>':'');
  var nmStyle=cxl?' style="text-decoration:line-through;color:#9a8f97"':'';
  return '<div class="lrow"'+((past||cxl)?' style="opacity:.55"':'')+'>'
    +'<div class="main"><div class="nm"'+nmStyle+'>'+esc(x.date)+'（'+hdWeekday(x.date)+'）'+esc(x.time||'')+'　'+esc(x.customer)+'様</div>'
    +'<div class="meta">'+esc(x.table||'席未定')+'　'+(x.pax||1)+'名'
    +(x.tantouCast?'　担当: '+esc(x.tantouCast):'')+(x.dohanCast?'　同伴: '+esc(x.dohanCast):'')+'</div>'
    +(cxl?'':'<div class="meta" style="margin-top:5px;display:flex;align-items:center;gap:6px">🕛 チェック予定 <input type="time" value="'+esc(x.checkTime||'')+'" onchange="rsvSaveCheckTime('+(x.rowIdx||0)+',this.value,this)"'+(x.rowIdx?'':' disabled')+' style="background:#0d1526;color:#cfe0f5;border:1px solid #33406a;border-radius:6px;padding:2px 6px;font-size:12px"><span class="rsv-ct-stat" style="font-size:11px;color:var(--dim)"></span></div>')+'</div>'
    +'<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">'+rsvRoleBadges(x.roles)+st+'</div></div>';
}
function drawRsv(){
  var el=document.getElementById('rsv-body'); if(!el) return;
  if(!rsvData){ el.innerHTML='<div class="empty">読み込み中…</div>'; return; }
  if(rsvData.error){ el.innerHTML='<div class="empty">'+esc(rsvData.error)+'</div>'; return; }
  var list=rsvData.reservations||[];
  var active=list.filter(function(x){return x.status!=='キャンセル';}); // 件数集計は有効な予約だけ
  var cxl=list.filter(function(x){return x.status==='キャンセル';});     // 削除(キャンセル)済み＝グレーアウトのログ
  var future=active.filter(function(x){return x.future;});
  var past=active.filter(function(x){return !x.future;});
  var head='<div class="toolbar"><span class="cnt">'+esc(rsvCast)+'　これから '+future.length+'件 / 過去 '+past.length+'件'+(cxl.length?'　/ 🚫削除済 '+cxl.length+'件':'')+'</span></div>';
  var futureHtml='<div class="sec compact"><div style="font-weight:800;color:var(--accent);margin-bottom:8px">これから（'+future.length+'件）</div>'
    +(future.length?future.map(function(x){return rsvRowHtml(x,false);}).join(''):'<div class="empty" style="padding:14px">これからの予約はありません</div>')+'</div>';
  // 過去は畳んでおく＝在籍が長い子ほど数百件になり、これからの予約が埋もれるため
  var pastHtml=past.length
    ? '<details class="sec compact"'+(rsvShowPast?' open':'')+' ontoggle="rsvShowPast=this.open"><summary style="cursor:pointer;font-weight:800;color:var(--dim)">🗄 過去（'+past.length+'件）</summary><div style="margin-top:10px">'+past.map(function(x){return rsvRowHtml(x,true);}).join('')+'</div></details>'
    : '<div class="sec compact"><div style="color:var(--dim);font-weight:800">過去の予約はありません</div></div>';
  // 削除(キャンセル)済みは畳んでおく＝ログとして残すが有効な予約に埋もれさせない
  var cxlHtml=cxl.length
    ? '<details class="sec compact"'+(rsvShowCxl?' open':'')+' ontoggle="rsvShowCxl=this.open"><summary style="cursor:pointer;font-weight:800;color:#c98a92">🚫 削除済み（キャンセル）（'+cxl.length+'件）</summary><div style="margin-top:10px">'+cxl.map(function(x){return rsvRowHtml(x,false);}).join('')+'</div></details>'
    : '';
  el.innerHTML=head+futureHtml+pastHtml+cxlHtml;
}

/* ===== 🕘 予約履歴（変更/削除ログ）＝すべての予約の登録・変更・削除を新しい順に。予約変更ログ(getReservationLog)を読む =====
 * 予約管理シートは更新=上書き・削除=キャンセルなので、「いつ・誰が・何を・どう変えたか」はここでしか辿れない。 */
function renderRsvLog(){
  setBody('<div id="rsvlog-wrap"><div class="empty">読み込み中…</div></div>');
  drawRsvLog();
  loadRsvLog();
}
function loadRsvLog(){
  // busyの早期returnはしない（管理者の読み取り専用＝止まるより取り直す方が安全。stale-guardの罠を避ける）
  api('getReservationLog',{limit:400,op:rsvLogOp,q:rsvLogQ}).then(function(d){
    rsvLog=d; drawRsvLog();
  }).catch(function(){ rsvLog={ok:false,error:'通信エラー'}; drawRsvLog(); });
}
function rsvLogSetOp(op){ rsvLogOp=op; rsvLog=null; drawRsvLog(); loadRsvLog(); }
function rsvLogSearch(v){ rsvLogQ=v; }
function rsvLogSubmit(){ rsvLog=null; drawRsvLog(); loadRsvLog(); }
function rsvLogOpBadge(op){
  var c=op==='登録'?'background:#0d2418;color:#66cc88':op==='変更'?'background:#0e2440;color:#7ab0f0':op==='削除'?'background:#2a1418;color:#d98a96;border:1px solid #5a2a34':'background:#222;color:#aaa';
  var ic=op==='登録'?'➕':op==='変更'?'✏️':op==='削除'?'🚫':'';
  return '<span class="badge" style="'+c+'">'+ic+' '+esc(op)+'</span>';
}
function rsvLogRowHtml(e){
  var meta=esc(e.date||'')+(e.time?' '+esc(e.time):'')+'　'+esc(e.table||'席未定')+(e.pax?'　'+e.pax+'名':'')
    +(e.tantouCast?'　担当:'+esc(e.tantouCast):'')+(e.dohanCast?'　同伴:'+esc(e.dohanCast):'');
  var detail=e.op==='変更'?(e.diff?'<div class="meta" style="margin-top:4px;color:#9fb8e8">✏️ '+esc(e.diff)+'</div>':'<div class="meta" style="margin-top:4px;color:var(--dim)">（内容変更なし）</div>')
           :e.op==='削除'?'<div class="meta" style="margin-top:4px;color:#d98a96">🚫 この予約を削除しました</div>'
           :'<div class="meta" style="margin-top:4px;color:#8fd0a8">➕ 新規登録</div>';
  return '<div class="lrow">'
    +'<div class="main"><div class="nm">'+esc(e.customer||'(名無し)')+'様'+(e.memberId?' <span style="color:var(--dim);font-weight:600;font-size:12px">'+esc(e.memberId)+'</span>':'')+'</div>'
    +'<div class="meta">'+meta+'</div>'+detail+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap">'
    +rsvLogOpBadge(e.op)
    +'<span class="meta" style="color:var(--dim)">'+esc(e.at||'')+'</span>'
    +(e.actor?'<span class="meta" style="color:var(--dim)">👤 '+esc(e.actor)+'</span>':'')
    +'</div></div>';
}
function drawRsvLog(){
  var el=document.getElementById('rsvlog-wrap'); if(!el) return;
  var ops=['','登録','変更','削除'], opl={'':'すべて','登録':'➕ 登録','変更':'✏️ 変更','削除':'🚫 削除'};
  var filt='<div class="toolbar" style="gap:6px;flex-wrap:wrap;align-items:center">'
    +ops.map(function(o){return '<button class="chip'+(rsvLogOp===o?' on':'')+'" onclick="rsvLogSetOp(\''+o+'\')">'+opl[o]+'</button>';}).join('')
    +'<span style="flex:1"></span>'
    +'<input id="rsvlog-q" placeholder="客名・担当・操作者で絞込" value="'+esc(rsvLogQ)+'" oninput="rsvLogSearch(this.value)" onkeydown="if(event.key===\'Enter\')rsvLogSubmit()" style="background:#0d1526;color:#cfe0f5;border:1px solid #33406a;border-radius:6px;padding:6px 9px;font-size:12px;min-width:180px">'
    +'<button class="chip" onclick="rsvLogSubmit()">🔍 検索</button></div>';
  var bodyHtml;
  if(!rsvLog){ bodyHtml='<div class="empty">読み込み中…</div>'; }
  else if(rsvLog.ok===false){ bodyHtml='<div class="empty">'+esc(rsvLog.error||'読み込み失敗')+'</div>'; }
  else{
    var ent=rsvLog.entries||[];
    var cnt='<div class="meta" style="margin:2px 2px 8px;color:var(--dim)">'+ent.length+'件'+((rsvLog.total&&rsvLog.total>ent.length)?' 表示 / 全'+rsvLog.total+'件':'')+'（新しい順）</div>';
    bodyHtml=cnt+(ent.length?'<div class="sec compact">'+ent.map(rsvLogRowHtml).join('')+'</div>':'<div class="empty" style="padding:20px">該当する履歴はありません</div>');
  }
  el.innerHTML=filt+bodyHtml;
}

/* ===== 🏖 店休日（お盆休み・臨時休業など）===== */
var holidays=[];
function hdFmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hdToday(){ var n=new Date(); if(n.getHours()<6)n.setDate(n.getDate()-1); return hdFmt(n); } // 営業日基準(6時境界)
function hdWeekday(dateStr){ return ['日','月','火','水','木','金','土'][new Date(dateStr+'T00:00:00').getDay()]; }
function renderHolidays(){
  loading();
  api('getHolidays').then(function(r){
    if(r&&r.ok===false){ setBody('<div class="empty">'+esc(r.error||'読み込みエラー')+'</div>'); return; }
    holidays=(r&&r.holidays)||[]; drawHolidays();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function drawHolidays(){
  var tk=hdToday();
  var rows=(holidays||[]).map(function(h){
    var past=h.date<tk;
    return '<div class="lrow"'+(past?' style="opacity:.45"':'')+'><div class="main"><div class="nm">'+esc(h.date)+'（'+hdWeekday(h.date)+'）'+(past?' <span class="sub">済</span>':(h.date===tk?' <span class="sub">本日</span>':''))+'</div><div class="meta">'+(h.label?esc(h.label):'店休日')+'</div></div><button class="btn dng sm" onclick="delHoliday(\''+jstr(h.date)+'\')">削除</button></div>';
  }).join('')||'<div class="empty" style="padding:14px">店休日は登録されていません</div>';
  var form='<div class="sec"><div class="sec-t">➕ 店休日を追加 <span class="sub">単発は開始日だけ／お盆など連続は終了日まで指定</span></div>'
    +'<div class="toolbar" style="flex-wrap:wrap;gap:8px;align-items:center">'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:13px">開始 <input class="finput" type="date" id="hd-from"></label>'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:13px">終了 <input class="finput" type="date" id="hd-to"></label>'
    +'<input class="finput grow" id="hd-label" placeholder="例：お盆休み（任意）" style="min-width:150px" onkeydown="if(event.key===\'Enter\')addHoliday()">'
    +'<button class="btn pri" onclick="addHoliday()">追加</button>'
    +'</div><div class="hint">終了日を空にすると開始日のみ登録。深夜営業のため店休日は「営業日（朝6時境界）」で扱います。</div></div>';
  var listSec='<div class="sec"><div class="sec-t">📅 登録済みの店休日 <span class="sub">キャストのシフトカレンダーに表示・その日は予約受付を停止・夜間の定時通知も自動停止</span></div>'+rows+'</div>';
  setBody(form+listSec);
}
function addHoliday(){
  var f=((document.getElementById('hd-from')||{}).value||'');
  var t=((document.getElementById('hd-to')||{}).value||f)||f;
  var label=((document.getElementById('hd-label')||{}).value||'').trim();
  if(!f){ toast('開始日を選んでください',true); return; }
  if(t<f){ toast('終了日は開始日以降にしてください',true); return; }
  var add=[], cur=new Date(f+'T00:00:00'), end=new Date(t+'T00:00:00'), guard=0;
  while(cur<=end && guard++<400){ add.push({date:hdFmt(cur), label:label}); cur.setDate(cur.getDate()+1); }
  var map={}; (holidays||[]).forEach(function(h){map[h.date]=h;}); add.forEach(function(h){map[h.date]=h;});
  var merged=Object.keys(map).map(function(k){return map[k];});
  api('saveHolidays',{holidays:merged}).then(function(r){ if(res(r,add.length>1?add.length+'日ぶんの店休日を登録しました':'店休日を登録しました')){ holidays=(r&&r.holidays)||merged; var lb=document.getElementById('hd-label'); if(lb)lb.value=''; drawHolidays(); } }).catch(function(){toast('通信エラー',true);});
}
function delHoliday(date){
  if(!confirm(date+' の店休日を削除しますか？'))return;
  var merged=(holidays||[]).filter(function(h){return h.date!==date;});
  api('saveHolidays',{holidays:merged}).then(function(r){ if(res(r,'削除しました')){ holidays=(r&&r.holidays)||merged; drawHolidays(); } }).catch(function(){toast('通信エラー',true);});
}

/* ===== 🗣 現場の声（AI家康くんに届いた要望）===== */
var voiceFilter='all', voiceList=[];
var VOICE_STATUSES=['新規','対応中','反映済','却下'];
function voiceStatusColor(s){ return {'新規':'#3b82f6','対応中':'#d97706','反映済':'#16a34a','却下':'#6b7280'}[s]||'#6b7280'; }
function voicePrioColor(p){ return {'高':'#dc2626','中':'#d97706','低':'#6b7280'}[p]||'#6b7280'; }
function renderVoice(){
  loading();
  api('getIeyasuRequests').then(function(r){
    if(r&&r.ok===false){ setBody('<div class="empty">'+esc(r.error||'読み込みエラー')+'</div>'); return; }
    voiceList=(r&&r.list)||[]; drawVoice();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function drawVoice(){
  var counts={all:voiceList.length}; VOICE_STATUSES.forEach(function(s){counts[s]=0;});
  voiceList.forEach(function(v){ if(counts[v.status]!=null)counts[v.status]++; });
  var chips='<div class="chips" style="margin-bottom:12px">'
    +'<div class="chip'+(voiceFilter==='all'?' on':'')+'" onclick="setVoiceFilter(\'all\')">すべて '+counts.all+'</div>'
    +VOICE_STATUSES.map(function(s){return '<div class="chip'+(voiceFilter===s?' on':'')+'" onclick="setVoiceFilter(\''+s+'\')">'+s+' '+counts[s]+'</div>';}).join('')
    +'</div>';
  var list=voiceList.filter(function(v){ return voiceFilter==='all'||v.status===voiceFilter; });
  var cards=list.map(function(v){
    var stColor=voiceStatusColor(v.status);
    var badges='';
    if(v.category) badges+='<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2,#2a2a2a);border:1px solid var(--line2);margin-right:6px">'+esc(v.category)+'</span>';
    if(v.priority) badges+='<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;background:'+voicePrioColor(v.priority)+';margin-right:6px">優先度 '+esc(v.priority)+'</span>';
    var stBadge='<span style="display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;color:#fff;white-space:nowrap;background:'+stColor+'">'+esc(v.status)+'</span>';
    var title=v.summary||v.text||'（内容なし）';
    var quote=(v.summary&&v.text&&v.text!==v.summary)?'<div class="meta" style="margin-top:8px;padding:8px 10px;background:var(--panel2,#242424);border-radius:8px;border-left:3px solid '+stColor+'">「'+esc(v.text)+'」</div>':'';
    var btns=VOICE_STATUSES.map(function(s){ return '<button class="btn sm'+(v.status===s?' pri':'')+'" onclick="setVoiceStatus('+v.row+',\''+s+'\')"'+(v.status===s?' disabled style="opacity:.6"':'')+'>'+s+'</button>'; }).join('');
    return '<div class="sec" style="margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div class="nm" style="font-size:15px;font-weight:700;line-height:1.4">'+esc(title)+'</div>'+stBadge+'</div>'
      +(badges?'<div style="margin-top:8px">'+badges+'</div>':'')
      +quote
      +'<div class="meta" style="margin-top:8px;opacity:.75">'+esc(v.name||'（不明）')+' ・ '+esc(v.ts)+(v.type&&v.type!=='request'?' ・ '+esc(v.type):'')+'</div>'
      +'<div class="chips" style="margin-top:10px">'+btns+'</div>'

/* ===== 🙋 要望ジャッジ（黒服/スタッフ系グループLINEの発言を精査）=====
   受動ログ（Code.gs hallLogCapture_）が溜めた発言を、要望/ノイズ/別種に仕分ける観察台。
   ※軍師には未配信。ここでボスがパターンと拾い方を精査してから次を決める。 */
var hallList=[], hallStat={}, hallGroupsBreak={}, hallCand='cand', hallGroup='', hallTrunc=false, hallPickerOpen=false, hallSeen=null;
var HALL_JUDGES=['要望','ノイズ','別種'];
function hallJudgeColor(j){ return {'要望':'#16a34a','ノイズ':'#6b7280','別種':'#7c3aed'}[j]||'#3b82f6'; }
function qesc_(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function hallExChip(txt){ return '<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--panel2,#242424);border:1px solid var(--line2);margin-right:6px;margin-top:4px">'+esc(txt)+'</span>'; }
function renderHallReq(){
  loading();
  api('getHallLog',{cand:'all'}).then(function(r){
    if(r&&r.ok===false){ setBody('<div class="empty">'+esc(r.error||'読み込みエラー')+'</div>'); return; }
    hallList=(r&&r.list)||[]; hallStat=(r&&r.stat)||{}; hallGroupsBreak=(r&&r.groups)||{}; hallTrunc=!!(r&&r.truncated);
    drawHallReq();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function hallCandChip(v,label){ return '<div class="chip'+(hallCand===v?' on':'')+'" onclick="setHallCand(\''+v+'\')">'+label+'</div>'; }
function drawHallReq(){
  var st=hallStat||{};
  var pickerBtn='<button class="btn sm" onclick="toggleHallPicker()">⚙️ 捕捉対象グループ</button>';
  var trunc=hallTrunc?' <span class="meta" style="color:#d97706">※500件超は新しい500件のみ表示</span>':'';
  var picker=hallPickerOpen?drawHallPicker():'';
  var stats='<div class="chips" style="margin-bottom:10px;gap:6px">'
    +'<span class="chip" style="cursor:default">総数 '+(st.total||0)+'</span>'
    +'<span class="chip" style="cursor:default">候補 '+(st.cand||0)+'</span>'
    +'<span class="chip" style="cursor:default">判定済 '+(st.judged||0)+'</span>'
    +'<span class="chip" style="cursor:default;color:#22c55e">要望 '+(st.req||0)+'</span>'
    +'<span class="chip" style="cursor:default;color:#9aa">ノイズ '+(st.noise||0)+'</span>'
    +'<span class="chip" style="cursor:default;color:#a78bfa">別種 '+(st.other||0)+'</span>'
    +'</div>';
  var candChips='<div class="chips" style="margin-bottom:8px">'+hallCandChip('cand','候補のみ')+hallCandChip('unjudged','未判定')+hallCandChip('all','全部')+'</div>';
  var gkeys=Object.keys(hallGroupsBreak||{});
  var gChips='';
  if(gkeys.length>0){
    gChips='<div class="chips" style="margin-bottom:12px">'
      +'<div class="chip'+(hallGroup===''?' on':'')+'" onclick="setHallGroup(\'\')">全グループ</div>'
      +gkeys.map(function(g){ return '<div class="chip'+(hallGroup===g?' on':'')+'" onclick="setHallGroup(\''+qesc_(g)+'\')">'+esc(g)+' '+hallGroupsBreak[g]+'</div>'; }).join('')
      +'</div>';
  }
  var list=hallList.filter(function(o){
    if(hallGroup && o.group!==hallGroup) return false;
    if(hallCand==='cand' && !o.cand) return false;
    if(hallCand==='unjudged' && o.judge) return false;
    return true;
  });
  var cards=list.map(function(o){
    var candBadge=o.cand?'<span style="display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;color:#fff;white-space:nowrap;background:#1d4ed8">候補</span>':'<span style="display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;color:#9aa;white-space:nowrap;border:1px solid var(--line2)">対象外</span>';
    var jBadge=o.judge?'<span style="display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;color:#fff;white-space:nowrap;background:'+hallJudgeColor(o.judge)+'">'+esc(o.judge)+'</span>':'';
    var kindBadge=o.kind?'<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2,#2a2a2a);border:1px solid var(--line2);margin-right:6px">'+esc(o.kind)+'</span>':'';
    var ex='';
    if(o.seat) ex+=hallExChip('🪑 '+o.seat);
    if(o.time) ex+=hallExChip('⏰ '+o.time);
    if(o.name) ex+=hallExChip('👤 '+o.name);
    if(o.kws) ex+=hallExChip('🔍 '+o.kws);
    var btns=HALL_JUDGES.map(function(j){ return '<button class="btn sm'+(o.judge===j?' pri':'')+'" onclick="setHallJudge('+o.row+',\''+j+'\')"'+(o.judge===j?' disabled style="opacity:.6"':'')+'>'+j+'</button>'; }).join('');
    var clearBtn=o.judge?'<button class="btn sm" onclick="setHallJudge('+o.row+',\'\')">未判定に戻す</button>':'';
    return '<div class="sec" style="margin-bottom:10px'+(o.cand?'':';opacity:.68')+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div class="nm" style="font-size:15px;font-weight:700;line-height:1.5">「'+esc(o.text)+'」</div>'
      +'<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">'+(jBadge||candBadge)+'</div></div>'
      +'<div style="margin-top:8px">'+kindBadge+(o.judge?candBadge:'')+'</div>'
      +(ex?'<div style="margin-top:4px">'+ex+'</div>':'')
      +'<div class="meta" style="margin-top:8px;opacity:.75">'+esc(o.group)+' ・ '+esc(o.who)+' ・ '+esc(o.ts)+'</div>'
      +'<div class="chips" style="margin-top:10px">'+btns+(clearBtn?' '+clearBtn:'')+'</div>'
      +'</div>';
  }).join('')||'<div class="empty" style="padding:30px">'+(hallCand==='cand'?'候補の発言はまだありません。<br><span style="font-size:13px;opacity:.7">対象グループで要望・確認っぽい発言が出ると、ここに溜まります。「全部」で対象外も確認できます。</span>':'該当なし')+'</div>';
  setBody('<div class="sec-t" style="margin-bottom:8px">🙋 要望ジャッジ <span class="sub">黒服/スタッフ系グループLINEで拾った「要望・確認っぽい」発言。ノイズ/要望/別種を仕分けて、拾い方を精査する（軍師には未配信）</span></div>'
    +'<div style="margin-bottom:10px">'+pickerBtn+trunc+'</div>'+picker+stats+candChips+gChips+cards);
}
function setHallCand(f){ hallCand=f; drawHallReq(); }
function setHallGroup(g){ hallGroup=g; drawHallReq(); }
function recomputeHallStat_(){
  var s={total:hallList.length,cand:0,judged:0,req:0,noise:0,other:0};
  hallList.forEach(function(o){ if(o.cand)s.cand++; if(o.judge){s.judged++; if(o.judge==='要望')s.req++; else if(o.judge==='ノイズ')s.noise++; else if(o.judge==='別種')s.other++;} });
  if(hallStat && hallStat.total>hallList.length){ s.total=hallStat.total; s.cand=hallStat.cand; } // 500超で切れてる時は総数はサーバ値を尊重
  hallStat=s;
}
function setHallJudge(row,judge){
  api('setHallJudge',{row:row,judge:judge}).then(function(r){
    if(res(r,judge?('「'+judge+'」に判定しました'):'判定を解除しました')){
      for(var i=0;i<hallList.length;i++){ if(hallList[i].row===row){ hallList[i].judge=judge; break; } }
      recomputeHallStat_(); drawHallReq();
    }
  }).catch(function(){ toast('通信エラー',true); });
}
function toggleHallPicker(){
  hallPickerOpen=!hallPickerOpen;
  if(hallPickerOpen && !hallSeen){ loadHallSeen_(); return; }
  drawHallReq();
}
function loadHallSeen_(){
  api('getHallGroups').then(function(r){ hallSeen=(r&&r.groups)||[]; drawHallReq(); }).catch(function(){ toast('グループ取得エラー',true); });
}
function drawHallPicker(){
  if(!hallSeen) return '<div class="sec" style="margin-bottom:12px"><div class="meta">グループ読み込み中…</div></div>';
  var rows=hallSeen.map(function(g){
    return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer">'
      +'<input type="checkbox" class="hallgchk" value="'+esc(g.groupId)+'"'+(g.on?' checked':'')+' style="width:18px;height:18px">'
      +'<span style="font-weight:600">'+esc(g.label)+'</span>'
      +'<span class="meta" style="opacity:.6;font-size:12px">発言者 '+(g.members||0)+'人 ・ '+esc(g.groupId)+'</span>'
      +'</label>';
  }).join('')||'<div class="meta">botが認識しているグループがまだありません。</div>';
  return '<div class="sec" style="margin-bottom:12px">'
    +'<div class="sec-t" style="font-size:14px;margin-bottom:6px">⚙️ 捕捉対象グループ <span class="sub">チェックしたグループの発言だけログします。本日黒服/本日出勤が別グループならここで見つけて追加を。</span></div>'
    +rows
    +'<div style="margin-top:10px"><button class="btn pri sm" onclick="saveHallGroups()">保存</button> <button class="btn sm" onclick="toggleHallPicker()">閉じる</button></div>'
    +'</div>';
}
function saveHallGroups(){
  var chks=document.querySelectorAll('.hallgchk'); var arr=[];
  [].forEach.call(chks,function(c){ if(c.checked) arr.push(c.value); });
  api('setHallGroups',{groups:arr}).then(function(r){
    if(res(r,'捕捉対象を保存しました（'+arr.length+'グループ）')){ if(hallSeen){ hallSeen.forEach(function(g){ g.on=arr.indexOf(g.groupId)>=0; }); } }
  }).catch(function(){ toast('通信エラー',true); });
}

/* ===== 汎用カレンダー日付ピッカー =====
   GASの管理コンソールはクロスオリジンiframe内で動くため input[type=date] の showPicker() が
   SecurityErrorで使えない（タップしてもカレンダーが開かない）。そこで自前のカレンダーUIで代替。
   使い方: HTMLに calFieldHtml('id','placeholder') を差し込む → 値は calVal('id') で 'yyyy-MM-dd' or '' を取得。
   初期値を入れるときは描画後に calSet('id','yyyy-MM-dd')。 */
var _cal={id:null,y:0,m:0};
function _calP2(n){return (n<10?'0':'')+n;}
function calFieldHtml(id,ph){
  return '<span style="position:relative;display:inline-block">'
    +'<input type="hidden" id="'+id+'">'
    +'<button type="button" id="'+id+'-btn" onclick="calOpen(\''+id+'\')" style="min-width:170px;text-align:left;background:var(--panel2,#1a2438);border:1px solid var(--line2,#33406a);border-radius:9px;padding:9px 12px;color:var(--txt,#e8f0ff);font-size:14px;cursor:pointer">'
    +'📅 <span id="'+id+'-lbl" style="color:#8aabcc">'+(ph||'日付を選択')+'</span></button>'
    +'<div id="'+id+'-pop" style="display:none;position:fixed;z-index:9999;background:#0e1726;border:1px solid #2a4a7a;border-radius:12px;padding:12px;box-shadow:0 12px 34px rgba(0,0,0,.55);width:252px"></div>'
    +'</span>';
}
function calVal(id){var i=document.getElementById(id);return i?(i.value||''):'';}
function calSet(id,ymd){var i=document.getElementById(id);if(!i)return;i.value=ymd||'';var l=document.getElementById(id+'-lbl');if(!l)return;if(ymd){l.textContent=ymd;l.style.color='#e8f0ff';}else{l.textContent=(l.getAttribute('data-ph')||'日付を選択');l.style.color='#8aabcc';}}
function calOpen(id){
  if(_cal.id&&_cal.id!==id)calClose();
  var pop=document.getElementById(id+'-pop');
  if(pop.style.display==='block'){calClose();return;}
  // placeholderを保持（クリア時に戻すため）
  var l=document.getElementById(id+'-lbl'); if(l&&!l.getAttribute('data-ph')&&!calVal(id))l.setAttribute('data-ph',l.textContent);
  var v=calVal(id),d=v?new Date(v+'T00:00:00'):new Date();
  _cal={id:id,y:d.getFullYear(),m:d.getMonth()};
  var r=document.getElementById(id+'-btn').getBoundingClientRect();
  pop.style.top=(r.bottom+6)+'px';
  pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-260))+'px';
  pop.style.display='block';calDraw();
  setTimeout(function(){document.addEventListener('click',calOutside);},0);
}
// innerHTML再構築でクリック対象がDOMから外れても誤判定しないよう、座標でポップアップ内外を判定
function calOutside(e){if(!_cal.id)return;var pop=document.getElementById(_cal.id+'-pop'),btn=document.getElementById(_cal.id+'-btn');var inBtn=btn&&btn.contains(e.target);var inPop=false;if(pop){var r=pop.getBoundingClientRect();inPop=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}if(!inBtn&&!inPop)calClose();}
function calClose(){if(!_cal.id)return;var pop=document.getElementById(_cal.id+'-pop');if(pop)pop.style.display='none';document.removeEventListener('click',calOutside);_cal.id=null;}
function calNav(delta){_cal.m+=delta;if(_cal.m<0){_cal.m=11;_cal.y--;}if(_cal.m>11){_cal.m=0;_cal.y++;}calDraw();}
function calPick(ymd){calSet(_cal.id,ymd);calClose();}
function calClearCur(){calSet(_cal.id,'');calClose();}
function calDraw(){
  var id=_cal.id,y=_cal.y,m=_cal.m,pop=document.getElementById(id+'-pop');
  var startDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),sel=calVal(id);
  var wd=['日','月','火','水','木','金','土'];
  var nav='background:#162848;border:1px solid #2a5aaa;border-radius:8px;color:#bcd6f0;width:34px;height:30px;cursor:pointer;font-size:16px';
  var h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +'<button type="button" onclick="calNav(-1)" style="'+nav+'">‹</button>'
    +'<span style="font-weight:700;color:#e8f0ff;font-size:14px">'+y+'年 '+(m+1)+'月</span>'
    +'<button type="button" onclick="calNav(1)" style="'+nav+'">›</button></div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
  wd.forEach(function(w,i){h+='<div style="text-align:center;font-size:11px;padding:2px 0;color:'+(i===0?'#e08794':i===6?'#7ab0f0':'#8aabcc')+'">'+w+'</div>';});
  for(var i=0;i<startDow;i++)h+='<div></div>';
  for(var day=1;day<=days;day++){var ymd=y+'-'+_calP2(m+1)+'-'+_calP2(day),isSel=ymd===sel;
    h+='<button type="button" onclick="calPick(\''+ymd+'\')" style="padding:8px 0;border:none;border-radius:7px;cursor:pointer;font-size:13px;'+(isSel?'background:#1a50a0;color:#fff;font-weight:700':'background:transparent;color:#cdd8e8')+'">'+day+'</button>';}
  h+='</div><button type="button" onclick="calClearCur()" style="width:100%;margin-top:8px;padding:8px;background:transparent;border:1px solid #33406a;border-radius:8px;color:#8aabcc;font-size:12px;cursor:pointer">クリア（無期限にする）</button>';
  pop.innerHTML=h;
}

/* ===== 📢 お知らせ（作成＋配信＋既読マップ）===== */
var noticeList=[], noticeOpen={};
var NOTICE_TARGETS={all:'全員',cast:'キャスト',kurofuku:'黒服'};
function renderNotice(){
  loading();
  api('getNoticeReadMap').then(function(r){
    if(r&&r.ok===false){ setBody('<div class="empty">'+esc(r.error||'読み込みエラー')+'</div>'); return; }
    noticeList=(r&&r.list)||[]; drawNotice();
  }).catch(function(){ setBody('<div class="empty">読み込みエラー</div>'); });
}
function drawNotice(){
  var form='<div class="sec">'
    +'<div class="sec-t">➕ お知らせを配信 <span class="sub">対象者へLINE通知し、ポータルで開くと既読になります</span></div>'
    +'<textarea class="ta" id="nt-body" rows="4" placeholder="お知らせの本文を入力…" style="width:100%;box-sizing:border-box"></textarea>'
    +'<div class="toolbar" style="flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px">'
    +'<label style="font-size:13px">対象 <select class="finput" id="nt-target"><option value="all">全員</option><option value="cast">キャストのみ</option><option value="kurofuku">黒服のみ</option></select></label>'
    +'<label style="font-size:13px">重要度 <select class="finput" id="nt-imp"><option value="normal">通常</option><option value="high">重要</option><option value="urgent">📌 最重要（既読でも残る）</option></select></label>'
    +'<span style="font-size:13px;display:inline-flex;align-items:center;gap:6px">表示期限 '+calFieldHtml('nt-expire','無期限（タップで選択）')+'</span>'
    +'<button class="btn pri" onclick="submitNotice()">📢 配信する</button>'
    +'</div>'
    +'<div class="hint" style="margin-top:6px">表示期限を空にすると無期限。LINE未登録のスタッフには通知が届きませんが、ポータルには表示されます。</div>'
    +'</div>';
  var cards=noticeList.map(function(n){
    var impBadge=n.importance==='urgent'
      ? '<span style="font-size:11px;padding:2px 8px;border-radius:10px;color:#3a2600;background:#f5b942;font-weight:800">📌 最重要</span>'
      : n.importance==='high'
      ? '<span style="font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;background:#dc2626;font-weight:700">重要</span>'
      : '';
    var pct=n.total?Math.round(n.readCount/n.total*100):0;
    var barColor=pct>=100?'#16a34a':pct>=50?'#d97706':'#dc2626';
    var arch=n.status!=='active';
    var open=!!noticeOpen[n.id];
    var readNames=(n.readNames||[]).map(esc).join('、')||'—';
    var unreadNames=(n.unreadNames||[]).map(esc).join('、')||'—';
    var detail=open?('<div style="margin-top:10px;font-size:13px;line-height:1.7">'
      +'<div style="color:#16a34a">✓ 既読（'+n.readCount+'）：'+readNames+'</div>'
      +'<div style="color:#dc2626;margin-top:4px">✕ 未読（'+((n.total||0)-(n.readCount||0))+'）：'+unreadNames+'</div>'
      +'</div>'):'';
    return '<div class="sec" style="margin-bottom:10px'+(arch?';opacity:.55':'')+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +impBadge
      +'<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2,#2a2a2a);border:1px solid var(--line2)">'+(NOTICE_TARGETS[n.target]||n.target)+'</span>'
      +(arch?'<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#6b7280;color:#fff">アーカイブ済</span>':'')
      +'</div>'
      +'<span class="meta" style="opacity:.7;white-space:nowrap">'+esc(n.createdAt||'')+'</span>'
      +'</div>'
      +'<div class="nm" style="font-size:15px;font-weight:600;line-height:1.5;margin-top:8px;white-space:pre-wrap">'+esc(n.body)+'</div>'
      +'<div style="margin-top:10px;display:flex;align-items:center;gap:10px">'
      +'<div style="flex:1;height:8px;background:var(--panel2,#2a2a2a);border-radius:5px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+barColor+'"></div></div>'
      +'<span style="font-size:12px;font-weight:700;color:'+barColor+';white-space:nowrap">既読 '+n.readCount+'/'+n.total+'</span>'
      +'</div>'
      +'<div class="chips" style="margin-top:10px">'
      +'<button class="btn sm" onclick="toggleNoticeDetail(\''+jstr(n.id)+'\')">'+(open?'▲ 名簿を閉じる':'▼ 既読/未読の名簿')+'</button>'
      +(arch?'':'<button class="btn sm" onclick="repushNotice(\''+jstr(n.id)+'\')">🔔 未読へ再送</button>')
      +(arch?'':'<button class="btn sm dng" onclick="archiveNotice(\''+jstr(n.id)+'\')">アーカイブ</button>')
      +'</div>'

      +'</div>';
  }).join('')||'<div class="empty" style="padding:30px">まだお知らせはありません。上のフォームから配信できます。</div>';
  setBody(form+'<div class="sec-t" style="margin:16px 0 8px">📋 配信履歴</div>'+cards);
}
function submitNotice(){

/* 貼り付けTSVのパース。⚠️本番は parseMenuBulk_(コード.js)。ここはローカル確認用の写しでしかない */
function mnParse(text){
  var rows=[],errors=[],seen={};
  String(text||'').split(/\r?\n/).forEach(function(line,i){
    var raw=line.trim(); if(!raw||/^#/.test(raw))return;
    var c=raw.split('\t');
    if(c.length<2){errors.push((i+1)+'行目: 列が足りません（カテゴリ⇥品名⇥価格）: '+raw);return;}
    var name=String(c[1]||'').trim();
    if(!name){errors.push((i+1)+'行目: 品名が空です: '+raw);return;}
    if(seen[name]){errors.push('貼り付けた中で品名が重複: '+name);return;}
    seen[name]=1;
    rows.push({category:String(c[0]||'').trim(),name:name,price:Number(String(c[2]||'').replace(/[¥￥,\s　]/g,''))||0});
  });
  return {rows:rows,errors:errors};
}
function mnNorm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　・,、。･･()（）「」【】\-ー・_/／\\]/g,'');}

      年数が無いものはノンビンテージとして別に存在する（ボス談）＝どれも別の酒。 */
function mnKey(name,cat){ var s=String(name||'').trim(); if(String(cat||'').trim()==='焼酎')s=s.replace(/^[麦米芋]\s+/,''); return mnNorm(s); }
function mnCandidate(name,cat,stockNames){
  var key=mnKey(name,cat); if(!key)return {name:'',score:0,exact:false};
  var ex=stockNames.filter(function(n){return mnNorm(n)===key;});
  return ex.length===1?{name:ex[0],score:100,exact:true}:{name:'',score:0,exact:false};
}

  var unpaid=invs.filter(function(x){return x.status!=='入金済'&&x.status!=='取消';}).length;
  var view=invs.filter(function(x){
    if(skSenderF && x.senderId!==skSenderF) return false;
    if(skFilter==='open') return x.status!=='入金済'&&x.status!=='取消';
    if(skFilter==='overdue') return x.overdue;
    if(skFilter==='paid') return x.status==='入金済';
    return true;
  });
  var senderOpts='<option value="">すべての請求先</option>'+senders.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===skSenderF?' selected':'')+'>'+esc(s.name)+'</option>';}).join('');
  var fbtn=function(k,label){ return '<button class="skf'+(skFilter===k?' on':'')+'" onclick="skSetFilter(\''+k+'\')">'+label+'</button>'; };
  var bar='<div class="toolbar" style="flex-wrap:wrap;gap:8px;align-items:center">'
    +fbtn('open','未入金')+fbtn('overdue','期限超過')+fbtn('paid','入金済')+fbtn('all','すべて')
    +'<select class="finput" style="max-width:220px" onchange="skSenderF=this.value;drawSeikyu(skData)">'+senderOpts+'</select>'
    +'<span style="flex:1"></span>'
    +'<button class="btn" onclick="skToggleSettings()">⚙️ 発行者・振込先設定</button></div>';
  var alertHtml='';
  if(overdue||soon){ alertHtml='<div class="hint" style="border-left:3px solid #d66">⚠️ 支払期限：超過 <b>'+overdue+'</b>件'+(soon?(' ／ 7日以内 <b>'+soon+'</b>件'):'')+'</div>'; }
  var rows=view.map(function(inv){ return skRowHtml_(inv,st); }).join('')||'<div class="empty" style="padding:16px">該当する請求はありません</div>';
  var listSec='<div class="sec"><div class="sec-t">📄 請求一覧 <span class="sub">未入金 '+unpaid+'件 ／ 全'+invs.length+'件</span></div>'+rows+'</div>';
  setBody(bar+alertHtml+skSettingsPanel_(st)+listSec);
}
function skRowHtml_(inv, st){
  var rate=inv.taxRate||st.taxRate||0.10, pct=Math.round(rate*100);
  var tax=Math.floor(inv.amount*pct/(100+pct)), excl=inv.amount-tax;
  var dueColor=inv.overdue?'#e77':(inv.dueSoon?'#e8a94a':'var(--dim)');
  var sender=skSenderById_(inv.senderId);
  var meishi=(sender&&sender.meishiUrl)?'<span class="sk-chip" onclick="skViewImg(\''+esc(sender.meishiUrl)+'\')">🪪 名刺</span>':'';
  var photos=(inv.slips&&inv.slips.length)?'<span class="sk-chip" onclick="skViewPhotos(\''+esc(inv.id)+'\')">📷 対象伝票 '+inv.slips.length+'</span>':'';
  var noLine=inv.no?('請求番号 '+esc(inv.no)+' ／ 発行 '+esc(inv.issueDate)):'<span style="color:var(--dim)">請求書 未作成</span>';
  var paidLine=(inv.status==='入金済'&&inv.paidDate)?('　入金 '+esc(inv.paidDate)):'';
  return '<div class="sk-inv">'
    +'<div class="sk-inv-h"><div><b>'+esc(inv.senderName)+'</b>'+skBadge_(inv.status)+'</div><div class="sk-amt">¥'+Number(inv.amount).toLocaleString()+'</div></div>'
    +'<div class="sk-inv-m">'+esc(inv.closeMonth)+'締め ／ 支払期限 <b style="color:'+dueColor+'">'+esc(inv.due||'—')+'</b> ／ 税抜¥'+excl.toLocaleString()+'・消費税¥'+tax.toLocaleString()+'</div>'
    +'<div class="sk-inv-m" style="color:var(--dim)">'+noLine+paidLine+(inv.registeredBy?('　登録 '+esc(inv.registeredBy)):'')+(inv.note?('　📝 '+esc(inv.note)):'')+'</div>'
    +'<div class="sk-inv-a">'
      +'<button class="btn pri" onclick="skInvoice(\''+esc(inv.id)+'\')">'+(inv.no?'🖨 請求書を再表示':'📄 請求書を作成')+'</button>'
      +skStatusBtns_(inv)+meishi+photos
      +'<button class="btn" onclick="skEdit(\''+esc(inv.id)+'\')">✎ 編集</button>'
    +'</div></div>';
}
function skStatusBtns_(inv){
  var h='';
  if(inv.status==='未請求') h+='<button class="btn" onclick="skStatus(\''+esc(inv.id)+'\',\'請求済\')">請求済にする</button>';
  if(inv.status==='請求済') h+='<button class="btn" onclick="skStatus(\''+esc(inv.id)+'\',\'入金済\')">✅ 入金済にする</button>';
  if(inv.status==='入金済') h+='<button class="btn" onclick="skStatus(\''+esc(inv.id)+'\',\'請求済\')">↩ 入金取消</button>';
  if(inv.status!=='取消') h+='<button class="btn" onclick="skStatus(\''+esc(inv.id)+'\',\'取消\')">取消</button>';
  else h+='<button class="btn" onclick="skStatus(\''+esc(inv.id)+'\',\'未請求\')">復活</button>';
  return h;
}
function skStatus(id,status){
  var inv=skInvById_(id); if(!inv)return;
  var paidDate='';
  if(status==='入金済'){ paidDate=prompt('入金日（YYYY-MM-DD）',(skData&&skData.today)||'')||''; if(!paidDate)return; }
  if(status==='取消'&&!confirm('この請求を取消にしますか？'))return;
  api('seikyuSetStatus',{rowIdx:inv.rowIdx,status:status,paidDate:paidDate}).then(function(r){ if(!res(r,'ステータスを更新しました'))return; renderSeikyu(); }).catch(function(){ toast('通信エラー',true); });
}

/* 請求書(A4) 生成：ポップアップは同期で開き、採番後に書き込む（ブロッカー回避） */
function skInvoice(id){
  var inv=skInvById_(id); if(!inv)return;
  var w=window.open('','_blank');
  if(!w){ toast('ポップアップがブロックされました',true); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><body style="font-family:sans-serif;padding:40px;color:#666">請求書を生成中…</body>');
  var finish=function(){ w.document.open(); w.document.write(skInvoiceDoc_(inv)); w.document.close(); };
  api('seikyuGenerate',{rowIdx:inv.rowIdx}).then(function(r){
    if(r&&r.ok===false){ try{w.document.body.innerHTML='作成に失敗: '+esc(r.error||'');}catch(e){} toast(r.error||'作成に失敗',true); return; }
    inv.no=r.no; inv.issueDate=r.issueDate; if(inv.status==='未請求')inv.status='請求済';
    finish(); renderSeikyu();
  }).catch(function(){ try{w.document.body.innerHTML='通信エラー';}catch(e){} toast('通信エラー',true); });
}

/* 写真ビューア（制限付きDrive→GAS経由base64） */
function skImgOverlay_(inner){
  var ov=document.getElementById('skImgOv');
  if(!ov){ ov=document.createElement('div'); ov.id='skImgOv'; ov.className='sk-ov'; ov.style.cursor='zoom-out'; ov.onclick=function(e){ if(e.target===ov)skImgOverlayClose_(); }; document.body.appendChild(ov); }
  ov.innerHTML=inner; ov.style.display='flex';
}
function skImgOverlayClose_(){ var ov=document.getElementById('skImgOv'); if(ov){ov.style.display='none';ov.innerHTML='';} }
function skViewImg(url){
  if(!IS_GAS){ toast('（ローカルでは画像プレビュー不可）'); return; }
  skImgOverlay_('<div style="color:#ccd">読み込み中…</div>');
  api('seikyuImage',{ref:url}).then(function(r){ if(r&&r.ok===false){ toast(r.error||'画像取得失敗',true); skImgOverlayClose_(); return; } skImgOverlay_('<img src="'+r.dataUrl+'" style="max-width:92vw;max-height:86vh;object-fit:contain;border-radius:8px">'); }).catch(function(){ toast('画像取得失敗',true); skImgOverlayClose_(); });
}
function skViewPhotos(id){
  var inv=skInvById_(id); if(!inv||!inv.slips||!inv.slips.length){ toast('写真がありません'); return; }
  if(!IS_GAS){ toast('（ローカルでは画像プレビュー不可）'); return; }
  skImgOverlay_('<div style="color:#ccd">読み込み中…</div>');
  Promise.all(inv.slips.map(function(u){ return api('seikyuImage',{ref:u}).then(function(r){ return (r&&r.dataUrl)?r.dataUrl:null; }).catch(function(){return null;}); })).then(function(urls){
    var imgs=urls.filter(Boolean).map(function(du){ return '<img src="'+du+'" style="max-width:88vw;max-height:78vh;object-fit:contain;border-radius:8px;margin-bottom:10px;display:block">'; }).join('');
    skImgOverlay_('<div style="overflow:auto;max-height:88vh;text-align:center">'+(imgs||'画像を取得できませんでした')+'<div style="color:#889;font-size:12px;margin-top:6px">（背景タップで閉じる）</div></div>');
  });
}

/* 編集オーバーレイ（締め月・支払期限・明細・注意書き） */
function skEdit(id){

  var items=(inv.items&&inv.items.length)?inv.items.map(function(x){return {name:x.name,amount:x.amount};}):[{name:'',amount:inv.amount}];

function skEditItemsHtml_(){

      +'<input class="finput sk-iamt" type="number" inputmode="numeric" placeholder="金額" value="'+(it.amount||'')+'" oninput="skEditState.items['+i+'].amount=Number(this.value)||0;skEditTotal_()">'

function skEditTotal_(){ var t=skEditState.items.reduce(function(a,b){return a+(Number(b.amount)||0);},0); var el=document.getElementById('sk-edit-total'); if(el)el.textContent='¥'+t.toLocaleString(); }

    +'<div style="display:flex;gap:10px"><div style="flex:1"><div class="sk-fl">締め月</div><input type="month" class="finput" value="'+esc(e.close)+'" onchange="skEditState.close=this.value"></div>'
    +'<div style="flex:1"><div class="sk-fl">支払期限</div><input type="date" class="finput" value="'+esc(e.due)+'" onchange="skEditState.due=this.value"></div></div>'

  ov.innerHTML=h; ov.style.display='flex';
