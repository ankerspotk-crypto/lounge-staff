<meta charset="utf-8">
<style>
  :root{
    --bg:#080b12; --bg2:#0b1019; --panel:#0e1622; --panel2:#0c1420;
    --line:rgba(120,150,198,.14); --line2:rgba(120,150,198,.26);
    --blue:#3d7dff; --blue-bt:#6aa0ff; --blue-dim:#22457e;
    --txt:#e7edf7; --dim:#8f9fbb; --faint:#556483;
    --ok:#33d69a; --ok-dim:#155641;
    --warn:#f5b63c; --warn-dim:#7d611f;
    --crit:#ff5566; --crit-dim:#7c2731;
    --sans:-apple-system,"SF Pro Text","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  .bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(130% 100% at 50% -20%, #14203a 0%, var(--bg2) 45%, var(--bg) 100%);}
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(120,150,198,.035) 0 1px, transparent 1px 3px);}

  .app{position:relative;z-index:2;height:100dvh;height:100vh;
    display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
    gap:clamp(7px,.85vh,12px);padding:clamp(9px,1.2vh,16px);
    color:var(--txt);font-family:var(--sans);
    font-feature-settings:"tnum" 1;}

  /* label helper */
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em;
    color:var(--faint);font-size:clamp(8px,.66vw,11px);}

  /* ---------- top bar ---------- */
  .topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:clamp(14px,2vw,30px);padding:clamp(9px,1.2vh,15px) clamp(14px,1.6vw,24px);
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden;}
  .topbar::after{content:"";position:absolute;left:-25%;top:0;bottom:0;width:18%;
    background:linear-gradient(90deg,transparent,rgba(106,160,255,.07),transparent);
    animation:sweep 9s linear infinite;}
  .brand{display:flex;align-items:center;gap:clamp(10px,1vw,16px);min-width:0;}
  .shield{width:clamp(34px,3.2vw,50px);height:clamp(34px,3.2vw,50px);flex:none;}
  .brand-tx .name{font-weight:650;letter-spacing:.02em;line-height:1;
    font-size:clamp(17px,1.9vw,32px);color:var(--txt);}
  .brand-tx .sub{margin-top:.5em;}
  .sysstat{display:flex;align-items:center;gap:clamp(10px,1.4vw,26px);flex-wrap:wrap;}
  .sys-led{display:flex;align-items:center;gap:.55em;font-family:var(--mono);
    font-size:clamp(9px,.8vw,13px);letter-spacing:.14em;color:var(--ok);
    padding:.4em .8em;border:1px solid var(--ok-dim);border-radius:5px;background:rgba(51,214,154,.06);}
  .sys-led .led{width:.55em;height:.55em;border-radius:50%;background:var(--ok);
    box-shadow:0 0 9px var(--ok);animation:blink 2s infinite;}
  .mini{display:flex;gap:clamp(9px,1vw,18px);}
  .mini .m{text-align:center;}
  .mini .m b{font-family:var(--mono);font-weight:600;font-size:clamp(15px,1.6vw,26px);line-height:1;color:var(--mc,var(--txt));}
  .mini .m span{display:block;margin-top:.4em;font-size:clamp(8px,.64vw,11px);color:var(--dim);letter-spacing:.1em;}
  .clock{text-align:right;font-family:var(--mono);flex:none;}
  .clock .t{font-size:clamp(19px,2.1vw,36px);font-weight:600;line-height:1;color:var(--txt);letter-spacing:.04em;}
  .clock .d{font-size:clamp(9px,.82vw,13px);color:var(--dim);letter-spacing:.16em;margin-top:.5em;}

  /* ---------- live status strip ---------- */
  .strip{display:flex;align-items:stretch;gap:clamp(8px,1vw,16px);
    padding:clamp(6px,.8vh,11px) clamp(12px,1.4vw,20px);
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .strip-h{display:flex;flex-direction:column;justify-content:center;gap:.45em;flex:none;
    padding-right:clamp(10px,1.2vw,18px);border-right:1px solid var(--line);}
  .strip-h .jp{font-weight:600;font-size:clamp(12px,1.15vw,19px);letter-spacing:.05em;color:var(--txt);white-space:nowrap;}
  .live-tag{display:flex;align-items:center;gap:.5em;font-family:var(--mono);
    font-size:clamp(8px,.66vw,11px);letter-spacing:.16em;color:var(--faint);white-space:nowrap;}
  .live-tag::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--faint);}
  .live-tag.on{color:var(--ok);}
  .live-tag.on::before{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.5s infinite;}
  .metrics{display:flex;gap:clamp(7px,.9vw,15px);flex:1;overflow-x:auto;scrollbar-width:none;}
  .metrics::-webkit-scrollbar{display:none;}
  .metric{flex:none;min-width:clamp(62px,5.6vw,100px);padding:clamp(4px,.5vh,9px) clamp(7px,.8vw,13px);
    border-radius:6px;background:rgba(120,150,198,.05);border:1px solid var(--line);
    border-left:2px solid var(--mc,var(--blue));display:flex;flex-direction:column;gap:.3em;justify-content:center;}
  .metric .v{font-family:var(--mono);font-weight:600;line-height:1;
    font-size:clamp(18px,2vw,33px);color:var(--mc,var(--txt));}
  .metric .l{font-size:clamp(8px,.7vw,12px);letter-spacing:.06em;color:var(--dim);white-space:nowrap;}
  .metric.flash{animation:flash 1s ease;}

  /* ---------- main grid ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr) minmax(0,1.15fr);
    gap:clamp(8px,1vw,14px);min-height:0;}
  .col{display:flex;flex-direction:column;gap:clamp(8px,1vh,14px);min-height:0;}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .col-side .panel{flex:none;}
  .col-side .panel.grow{flex:1;}
  .col-agents .panel,.col-main .panel{flex:1;}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:.5em;
    padding:clamp(8px,1vh,13px) clamp(12px,1.1vw,18px);border-bottom:1px solid var(--line);flex:none;}
  .ph h2{margin:0;font-size:clamp(12px,1.15vw,19px);font-weight:600;letter-spacing:.03em;color:var(--txt);}
  .pb{padding:clamp(6px,.8vh,12px) clamp(8px,.9vw,14px);overflow:auto;min-height:0;
    scrollbar-width:thin;scrollbar-color:var(--blue-dim) transparent;}
  .pb::-webkit-scrollbar{width:6px;}
  .pb::-webkit-scrollbar-thumb{background:var(--blue-dim);border-radius:3px;}

  /* ---------- units ---------- */
  .unit{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(8px,.7vw,12px);align-items:center;
    padding:clamp(8px,1vh,13px) clamp(6px,.5vw,9px);border-bottom:1px solid rgba(120,150,198,.08);}
  .unit:last-child{border-bottom:0;}
  .unit-badge{font-family:var(--mono);font-size:clamp(8px,.66vw,11px);letter-spacing:.06em;
    padding:.4em .5em;border-radius:5px;color:var(--dim);border:1px solid var(--line2);
    background:rgba(120,150,198,.05);white-space:nowrap;flex:none;text-align:center;line-height:1.1;}
  .unit.on .unit-badge{color:var(--ok);border-color:var(--ok-dim);background:rgba(51,214,154,.07);}
  .unit-name{font-size:clamp(12px,1.05vw,18px);font-weight:550;color:var(--txt);letter-spacing:.02em;}
  .unit-code{font-family:var(--mono);font-size:clamp(8px,.62vw,11px);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;}
  .unit-task{font-size:clamp(9px,.78vw,13px);color:var(--dim);margin-top:.32em;}
  .unit-state{display:flex;align-items:center;gap:.45em;font-family:var(--mono);
    font-size:clamp(8px,.68vw,11px);letter-spacing:.1em;color:var(--faint);white-space:nowrap;}
  .unit-state .dot{width:.5em;height:.5em;border-radius:50%;background:var(--faint);}
  .unit.on .unit-state{color:var(--ok);}
  .unit.on .unit-state .dot{background:var(--ok);box-shadow:0 0 7px var(--ok);animation:blink 1.6s infinite;}

  /* ---------- cases ---------- */
  .caselist{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,15vw,230px),1fr));
    gap:clamp(8px,.85vw,13px);}
  .case{position:relative;background:rgba(120,150,198,.045);border:1px solid var(--line);
    border-left:3px solid var(--sc);border-radius:6px;padding:clamp(9px,1vh,14px) clamp(10px,.9vw,15px);
    display:flex;flex-direction:column;gap:.5em;overflow:hidden;transition:box-shadow .35s,border-color .35s;}
  .case.p-active.is-focus{box-shadow:0 0 0 1px var(--sc),0 0 22px -6px var(--sc);}
  .case-top{display:flex;align-items:center;justify-content:space-between;gap:.5em;}
  .case-id{font-family:var(--mono);font-size:clamp(8px,.62vw,11px);letter-spacing:.08em;color:var(--faint);}
  .badge{font-family:var(--mono);font-size:clamp(8px,.64vw,11px);letter-spacing:.08em;
    padding:.26em .6em;border-radius:4px;color:var(--sc);border:1px solid var(--sc);
    background:color-mix(in srgb,var(--sc) 13%,transparent);white-space:nowrap;display:flex;align-items:center;gap:.4em;}
  .badge .dot{width:.45em;height:.45em;border-radius:50%;background:var(--sc);}
  .case.p-active .badge .dot{box-shadow:0 0 6px var(--sc);animation:blink 1.5s infinite;}
  .case-name{font-size:clamp(12px,1.1vw,19px);line-height:1.3;font-weight:550;color:var(--txt);letter-spacing:.01em;text-wrap:balance;}
  .case-note{font-size:clamp(9px,.74vw,12px);color:var(--dim);line-height:1.35;}
  .bar{height:4px;border-radius:2px;background:rgba(120,150,198,.12);overflow:hidden;margin-top:auto;}
  .bar>i{display:block;height:100%;border-radius:2px;background:var(--sc);box-shadow:0 0 8px -2px var(--sc);}
  .bar.idle{background:repeating-linear-gradient(90deg,rgba(120,150,198,.22) 0 7px,transparent 7px 14px);}

  /* ---------- systems / roster / other ---------- */
  .srow{display:flex;align-items:center;gap:clamp(9px,.9vw,14px);
    padding:clamp(7px,.9vh,12px) clamp(4px,.4vw,8px);border-bottom:1px solid rgba(120,150,198,.08);}
  .srow:last-child{border-bottom:0;}
  .s-code{font-family:var(--mono);font-size:clamp(8px,.62vw,11px);letter-spacing:.1em;color:var(--faint);
    border:1px solid var(--line2);border-radius:5px;padding:.4em .5em;flex:none;min-width:clamp(46px,4.4vw,68px);text-align:center;}
  .s-name{font-size:clamp(11px,.98vw,17px);font-weight:550;color:var(--txt);}
  .s-sub{font-size:clamp(8px,.66vw,11px);color:var(--faint);margin-top:.3em;}
  .s-stat{margin-left:auto;display:flex;align-items:center;gap:.5em;font-family:var(--mono);
    font-size:clamp(8px,.66vw,11px);color:var(--ok);letter-spacing:.08em;}
  .s-stat .led{width:.5em;height:.5em;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);animation:blink 2.2s infinite;}
  .roster{display:flex;flex-wrap:wrap;gap:clamp(5px,.5vw,9px);}
  .rtag{display:flex;flex-direction:column;gap:.28em;padding:.5em .7em;border-radius:6px;
    background:rgba(120,150,198,.05);border:1px solid var(--line);min-width:0;}
  .rtag b{font-size:clamp(11px,.95vw,16px);font-weight:600;color:var(--txt);letter-spacing:.02em;}
  .rtag span{font-family:var(--mono);font-size:clamp(8px,.6vw,10px);color:var(--faint);letter-spacing:.06em;}
  .fronts{display:flex;flex-direction:column;gap:clamp(5px,.55vh,9px);}
  .front{display:flex;align-items:baseline;gap:.65em;font-size:clamp(9px,.8vw,13px);}
  .front .k{font-weight:600;color:var(--blue-bt);font-size:clamp(10px,.92vw,15px);min-width:6em;letter-spacing:.01em;}
  .front .s{color:var(--dim);}

  /* ---------- activity log ---------- */
  .logbar{display:flex;align-items:center;gap:clamp(10px,1vw,18px);
    padding:0 clamp(13px,1.4vw,20px);height:clamp(36px,4.8vh,54px);
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .log-label{font-family:var(--mono);letter-spacing:.16em;color:var(--blue-bt);flex:none;
    font-size:clamp(9px,.82vw,13px);padding-right:clamp(10px,1vw,16px);border-right:1px solid var(--line);text-transform:uppercase;}
  .log-track{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);}
  .log-run{display:inline-block;white-space:nowrap;animation:marquee 46s linear infinite;}
  .li{display:inline-flex;align-items:center;gap:.55em;margin:0 clamp(14px,1.5vw,28px);
    font-size:clamp(10px,.84vw,14px);color:var(--dim);letter-spacing:.02em;}
  .li .code{font-family:var(--mono);font-size:.82em;color:var(--blue-bt);letter-spacing:.04em;}
  .li .dot{width:.42em;height:.42em;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none;}

  @keyframes sweep{from{left:-25%}to{left:130%}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.32}}
  @keyframes flash{0%{background:rgba(61,125,255,.28)}100%{background:rgba(120,150,198,.05)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .app>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;}
  .topbar{animation-delay:.02s}.strip{animation-delay:.1s}.grid{animation-delay:.18s}.logbar{animation-delay:.28s}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;}.log-run{animation:none!important;}}
</style>

<div class="bg"></div>
<div class="scan"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="shield" viewBox="0 0 40 44" aria-hidden="true">
        <path d="M20 3 L35 9 V22 C35 33 28.5 39.5 20 42 C11.5 39.5 5 33 5 22 V9 Z"
              fill="rgba(61,125,255,.10)" stroke="var(--blue)" stroke-width="1.8" stroke-linejoin="round"/>
        <polyline points="9,23 14.5,23 17.5,15 22.5,31 25.5,23 31,23" fill="none"
              stroke="var(--blue-bt)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-tx">
        <div class="name">オペレーションセンター</div>
        <div class="sub eyebrow">Ieyasu · Operations Control</div>
      </div>
    </div>
    <div class="sysstat">
      <div class="sys-led"><span class="led"></span>SYSTEM: OPERATIONAL</div>
      <div class="mini" id="mini"></div>
    </div>
    <div class="clock">
      <div class="t" id="ck-t">--:--:--</div>
      <div class="d" id="ck-d">----</div>
    </div>
  </header>

  <section class="strip">
    <div class="strip-h"><span class="jp">現在の状況</span><span class="live-tag" id="live-tag">接続待ち</span></div>
    <div class="metrics" id="metrics"></div>
  </section>

  <main class="grid">
    <section class="col col-agents">
      <div class="panel">
        <div class="ph"><h2>ユニット</h2><span class="eyebrow">Units</span></div>
        <div class="pb" id="units"></div>
      </div>
    </section>

    <section class="col col-main">
      <div class="panel">
        <div class="ph"><h2>進行中の案件</h2><span class="eyebrow" id="cases-count">Active Cases</span></div>
        <div class="pb"><div class="caselist" id="cases"></div></div>
      </div>
    </section>

    <section class="col col-side">
      <div class="panel">
        <div class="ph"><h2>システム稼働状況</h2><span class="eyebrow">Systems</span></div>
        <div class="pb" id="systems"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>要員</h2><span class="eyebrow">Personnel</span></div>
        <div class="pb"><div class="roster" id="roster"></div></div>
      </div>
      <div class="panel grow">
        <div class="ph"><h2>その他の案件</h2><span class="eyebrow">Other</span></div>
        <div class="pb"><div class="fronts" id="fronts"></div></div>
      </div>
    </section>
  </main>

  <footer class="logbar">
    <span class="log-label">Activity Log</span>
    <div class="log-track"><span class="log-run" id="log"></span></div>
  </footer>
</div>

<script>
(function(){
  const SC={active:'var(--blue)',live:'var(--ok)',parked:'var(--faint)'};
  const LABEL={active:'進行中',live:'稼働',parked:'待機'};

  const mini=[
    {n:24,l:'稼働',c:'var(--ok)'},
    {n:4,l:'進行中',c:'var(--blue-bt)'},
    {n:3,l:'待機',c:'var(--dim)'},
  ];
  const units=[
    {badge:'U-01',name:'メインAI',code:'CLAUDE',task:'ダッシュボード構築・指揮',on:true},
    {badge:'U-02',name:'通知',code:'SIGNAL',task:'LINE配信・通達',on:true},
    {badge:'U-03',name:'探索',code:'EXPLORE',task:'コード探索・調査',on:false},
    {badge:'U-04',name:'計画',code:'PLAN',task:'実装計画の立案',on:false},
    {badge:'U-05',name:'レビュー',code:'REVIEW',task:'検証・査読',on:false},
  ];
  const cases=[
    {name:'システム的付け回し',status:'active',p:30,note:'設計段階・希望を置く盤面'},
    {name:'いえやす合戦',status:'active',p:55,note:'Phase1実装・テスト環境'},
    {name:'領収書・受領書 発行',status:'active',p:70,note:'作成中・本番未反映'},
    {name:'匿名ピア投票・表彰',status:'active',p:90,note:'本番ポータル昇格待ち'},
    {name:'面談表（面談のiPad化）',status:'live',p:100,note:'一気通貫で稼働'},
    {name:'黒服 勤怠管理＋手当',status:'live',p:100,note:'8/1施行'},
    {name:'キャスト交通費',status:'live',p:100,note:'往路自動＋復路'},
    {name:'発注済み未着アラート',status:'live',p:100,note:'終売・欠品を検知'},
    {name:'通知管理センター',status:'live',p:100,note:'44通知を一元管理'},
    {name:'ボトル棚 表示ガイド',status:'live',p:100,note:'5F実写・場所案内'},
    {name:'今月誕生日のお客様',status:'live',p:100,note:'4画面＋自動通知'},
    {name:'黒服 スキルテスト',status:'live',p:100,note:'時給ゲート'},
    {name:'送りの手段集計',status:'parked',p:0,note:'仕様から再検討'},
    {name:'連絡フロー再設計',status:'parked',p:0,note:'家康くん一本化 検討'},
    {name:'付け回しダッシュボード',status:'parked',p:0,note:'設計済・保留'},
  ];
  const systems=[
    {code:'PORTAL',name:'ポータル',sub:'キャスト向け'},
    {code:'GUNSHI',name:'軍師',sub:'店内iPad端末'},
    {code:'ADMIN',name:'管理コンソール',sub:'管理者機能'},
  ];
  const roster=[
    {b:'ボス',s:'統括'},{b:'りく',s:'副管理'},{b:'管理者',s:'管理'},
    {b:'黒服',s:'現場'},{b:'キャスト',s:'接客'},
  ];
  const fronts=[
    {k:'NOCT',s:'夜職経営OS 商品化構想'},
    {k:'キレイン',s:'清潔さ認証サービス'},
    {k:'SECRET',s:'完全招待制ラウンジ'},
    {k:'公式サイト',s:'店舗＋求人'},
    {k:'SECTION 04',s:'趣味プロジェクト'},
  ];
  const logs=[
    {code:'@746',t:'キャスト交通費 稼働'},
    {code:'@731',t:'黒服スキルテスト 稼働'},
    {code:'@727',t:'匿名ピア投票 配信'},
    {code:'@721',t:'発注未着アラート 稼働'},
    {code:'@720',t:'通知管理センター 44通知'},
    {code:'@718',t:'シャンパン在庫 稼働'},
    {code:'@716',t:'退店予定時刻 稼働'},
    {code:'149ce2e',t:'全員シフト 稼働'},
    {code:'@702',t:'黒服勤怠 8/1施行'},
    {code:'72cc20f',t:'ポータル刷新 稼働'},
  ];

  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const p2=n=>String(n).padStart(2,'0');

  $('mini').innerHTML=mini.map(m=>
    `<div class="m"><b style="color:${m.c}">${m.n}</b><span>${m.l}</span></div>`).join('');

  $('units').innerHTML=units.map(u=>
    `<div class="unit ${u.on?'on':''}">
       <div class="unit-badge">${esc(u.badge)}</div>
       <div><div class="unit-name">${esc(u.name)} <span class="unit-code">${esc(u.code)}</span></div>
       <div class="unit-task">${esc(u.task)}</div></div>
       <div class="unit-state"><span class="dot"></span>${u.on?'稼働':'待機'}</div>
     </div>`).join('');

  $('cases').innerHTML=cases.map((c,i)=>
    `<div class="case p-${c.status}" data-i="${i}" style="--sc:${SC[c.status]}">
       <div class="case-top"><span class="case-id">CASE-${p2(i+1)}</span>
         <span class="badge"><span class="dot"></span>${LABEL[c.status]}</span></div>
       <div class="case-name">${esc(c.name)}</div>
       <div class="case-note">${esc(c.note)}</div>
       <div class="bar ${c.status==='parked'?'idle':''}">${c.status!=='parked'?`<i style="width:${c.p}%"></i>`:''}</div>
     </div>`).join('');
  $('cases-count').textContent=cases.length+' CASES';

  $('systems').innerHTML=systems.map(s=>
    `<div class="srow"><div class="s-code">${esc(s.code)}</div>
       <div><div class="s-name">${esc(s.name)}</div><div class="s-sub">${esc(s.sub)}</div></div>
       <div class="s-stat"><span class="led"></span>正常</div></div>`).join('');

  $('roster').innerHTML=roster.map(r=>
    `<div class="rtag"><b>${esc(r.b)}</b><span>${esc(r.s)}</span></div>`).join('');

  $('fronts').innerHTML=fronts.map(f=>
    `<div class="front"><span class="k">${esc(f.k)}</span><span class="s">${esc(f.s)}</span></div>`).join('');

  const logHtml=logs.map(w=>
    `<span class="li"><span class="dot"></span><span class="code">${esc(w.code)}</span>${esc(w.t)}</span>`).join('');
  $('log').innerHTML=logHtml+logHtml;

  // clock
  const WD=['日','月','火','水','木','金','土'];
  function tick(){const d=new Date();
    $('ck-t').textContent=`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
    $('ck-d').textContent=`${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}  ${WD[d.getDay()]}`;
  }
  tick();setInterval(tick,1000);

  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // roving focus on active cases
  if(!reduce){
    const act=[...document.querySelectorAll('.case.p-active')];
    let fi=0;
    if(act.length){const rove=()=>{act.forEach(c=>c.classList.remove('is-focus'));
      act[fi%act.length].classList.add('is-focus');fi++;};rove();setInterval(rove,3400);}
  }

  /* ============ ライブ配線 — 現在の状況 ============ */
  const P=new URLSearchParams(location.search);
  const GAS_URL=P.get('api')||'https://script.google.com/macros/s/AKfycbxG4IdWtMdU-81wfQUvTg6nYqKboK9wWB-XcfFYI8w0KRUrSpZmwJyb9jBYuMUP5K1q4g/exec';
  let KIOSK_KEY=P.get('key')||'';
  try{ if(P.get('key'))localStorage.setItem('wc_key',P.get('key')); else KIOSK_KEY=localStorage.getItem('wc_key')||''; }catch(_){}
  const DEMO=P.get('demo')==='1';
  const REFRESH_MS=60000;

  const TILES=[
    {k:'workingCasts',l:'出勤',good:true},
    {k:'reservations',l:'予約'},
    {k:'seatedTables',l:'在席'},
    {k:'tsukemawashi',l:'付け回し'},
    {k:'openTasks',l:'未対応'},
    {k:'orderAlerts',l:'アラート',alert:true},
    {k:'birthdays',l:'今月誕生日'},
  ];
  const DEMO_LIVE={workingCasts:9,reservations:4,seatedTables:0,tsukemawashi:0,openTasks:1,orderAlerts:3,birthdays:29};
  const prev={},metricsEl=$('metrics'),liveTag=$('live-tag');

  function draw(live){
    metricsEl.innerHTML=TILES.map(t=>{
      const has=live&&live[t.k]!=null, v=has?live[t.k]:'—';
      const mc=(t.alert&&has&&+v>0)?'var(--crit)':(t.good&&has?'var(--ok)':'var(--blue-bt)');
      const fl=(has&&prev[t.k]!=null&&prev[t.k]!==v)?'flash':'';
      if(has)prev[t.k]=v;
      return `<div class="metric ${fl}" style="--mc:${mc}"><span class="v">${esc(v)}</span><span class="l">${esc(t.l)}</span></div>`;
    }).join('');
  }
  function setLive(on,ts){
    liveTag.classList.toggle('on',!!on);
    if(on){const d=ts?new Date(ts):new Date();
      liveTag.textContent='LIVE · 更新 '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
    else liveTag.textContent='接続待ち — 記録値を表示中';
  }
  function gsrPost(fn){const a=[].slice.call(arguments,1);
    return fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'gunshi',key:KIOSK_KEY,fn:fn,args:a})})
      .then(r=>r.json()).then(j=>{if(j&&j.__ok===false)throw new Error(j.error||'server');return j?j.data:j;});
  }
  function poll(){
    if(DEMO){draw(DEMO_LIVE);setLive(true);return;}
    gsrPost('getWarCouncil')
      .then(d=>{draw(d&&d.live?d.live:null);setLive(true,d&&d.ts);})
      .catch(()=>{draw(null);setLive(false);});
  }
  draw(DEMO?DEMO_LIVE:null); setLive(DEMO);
  poll(); setInterval(poll,REFRESH_MS);
})();
</script>
