var selCast=null, moveMode=false, combineMode=false, combinePrimary=null;
var tableMoveMode=false, tableMoveFrom=null;
var CAST_PALETTE=['#7ab0f0','#66cc88','#e6b23a','#e08ad0','#8fb0ff','#6fd0c0','#f0a060','#b090f0','#f08a8a','#9d90ee','#7cd0a0','#d0b060'];
function castColor(n){var s=0;for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);return CAST_PALETTE[s%CAST_PALETTE.length];}
function castHere(s,name){return name&&(s.casts||[]).some(function(c){return c.n===name;});}
function chipHtml(name,ci,si,opts){
  opts=opts||{};
  var col=castColor(name);
  var sel=(selCast&&selCast.si===si&&selCast.ci===ci)?' sel':'';
  var role=opts.tantou?'<span class="role">担当</span>':'';
  /* notime＝残り時間を出さない。マップのカウンター用＝時間は席の右肩(mini-t)に出ているので重複させない */
  var tm=(opts.away||opts.notime)?'':'<span class="tm">'+(opts.wait?(opts.mins+'分待機'):(opts.mins<0?'超'+(-opts.mins)+'分':'残'+opts.mins+'分'))+'</span>';
  var cls=(opts.away?'castchip awaychip':'castchip '+(opts.status==='over'?'s-over':opts.status==='warn'?'s-warn':'s-ok'))+(opts.tantou?' tantou':'')+sel;
  var onclick=opts.away?'onclick="tapAway(event)"':'onclick="tapCast('+si+','+ci+',event)"';
  var av=opts.away?'#8a7038':col;
  var awayLbl=opts.away?'<span class="role">担当</span><span class="awaytm">抜けて'+(opts.awayMin!=null?opts.awayMin:0)+'分</span>':'';
  return '<span class="'+cls+'" '+onclick+'><span class="ava" style="background:'+av+'">'+esc(name.charAt(0))+'</span><span class="cn">'+esc(name)+'</span>'+castBadge(name)+role+awayLbl+tm+'</span>';
}
function seatInfoLine(s){
  var p=[];
  if(s.bottle) p.push('🍶'+esc(s.bottle)+(s.bottlePos?'<span class="bp">'+esc(s.bottlePos)+'</span>':''));
  if(s.member) p.push('会員'+esc(s.member));
  if(s.bday) p.push('🎂'+esc(s.bday));
  return p.length?'<div class="seat-info">'+p.join('<span class="dot">・</span>')+'</div>':'';
}
/* 席の客名の横に出す「予約キャスト・担当キャスト」コンテキスト（実際の在席とは別） */
function seatCustKey_(x){ return String(x||'').replace(/様/g,'').replace(/\s/g,''); }
function seatRsvFor(s){ if(!s.cust)return null; var k=seatCustKey_(s.cust); return (RSV||[]).find(function(r){return r.cust&&r.status!=='キャンセル'&&seatCustKey_(r.cust)===k;})||null; }
function seatCastCtx(s){
  var parts=[], r=seatRsvFor(s);
  var yoyaku=r&&r.yoyaku?r.yoyaku:'';
  if(yoyaku){
    var yhere=castHere(s,yoyaku), away='';
    if(!yhere){ var m=(s.recentLeft&&s.recentLeft[yoyaku]); away=(m!=null)?'<span class="sctx-away"> 抜'+m+'分</span>':'<span class="sctx-away"> 離席中</span>'; }
    parts.push('<span class="sctx y">予約 '+esc(yoyaku)+away+'</span>');
  }
  if(s.tantou) parts.push('<span class="sctx t">担当 '+esc(s.tantou)+'</span>');
  return parts.length?'<div class="sctx-row">'+parts.join('')+'</div>':'';
}
function seatHtml(s){
  var st=seatStatus(s), idx=seatIdx(s), nm=shortNm(s.name);
  var oc='onclick="onSeatClick('+idx+')"';
  // 結合の子（他席へ結合済み）
  if(s.mergedTo!=null){
    var pn=shortNm(SEATS[s.mergedTo].name);
    return '<div class="seat mergedcell" '+oc+'><div style="text-align:center"><div class="grp-badge">🔗 結合中</div><div style="font-size:11px;margin-top:6px;color:#9ad0d0;font-weight:700">'+esc(nm)+' → '+esc(pn)+'</div></div></div>';
  }
  var isPrimary=s.mergeWith&&s.mergeWith.length;
  var dispNm=isPrimary?nm+'＋'+s.mergeWith.map(function(mi){return shortNm(SEATS[mi].name);}).join('＋'):nm;
  var grpBadge=isPrimary?'<span class="grp-badge">🔗'+(s.mergeWith.length+1)+'席</span>':'';
  var coSeat=(s.occupants&&s.occupants.length>1); // 相席（同一卓に複数予約）
  var coBadge=coSeat?'<span class="grp-badge" style="background:#3a2a12;color:#ffc98a">👥'+s.occupants.length+'組</span>':'';
  var paxDisp=coSeat?s.occupants.reduce(function(a,o){return a+(Number(o.pax)||0);},0):s.pax;
  var mt=(moveMode||tableMoveMode)?' movetarget':'';
  var self=(moveMode&&selCast&&selCast.si===idx)?' moveself':'';
  var ct=(combineMode&&idx!==combinePrimary)?' combinetarget':'';
  var cprim=(combineMode&&idx===combinePrimary)?' combineprimary':'';
  var grp=isPrimary?' grouped':'';
  // 待機席 / 黒服席（旧軍師ポータルの席タイプ）
  if(st==='waiting'||st==='kurofuku'){
    var wlbl=st==='waiting'?'🪑 待機':'🖤 黒服';
    var wchips=(s.casts||[]).map(function(c,ci){return chipHtml(c.n,ci,idx,{mins:c.mins,status:'ok',wait:true});}).join('')||'<div class="empty">'+(st==='waiting'?'待機なし':'黒服なし')+'</div>';
    return '<div class="seat '+st+mt+ct+'" '+oc+'><div class="st"><span class="snm">'+wlbl+'</span><span class="pax">'+(s.casts?s.casts.length:0)+'名</span></div><div style="margin-top:2px">'+wchips+'</div></div>';
  }
  // 空席 / 予約
  if(st==='empty'){
    if(s.rsv){
      var rrqb=reqBadgeHtml(idx,s.rsv.cust);
      return '<div class="seat reserved'+mt+ct+grp+'" '+oc+'><div class="st"><span class="snm">'+esc(dispNm)+grpBadge+'</span><span class="rsv-tag">予約</span></div>'
        +'<div class="cust" style="color:#bcd8ff">'+esc(s.rsv.cust)+'様</div>'
        +'<div class="rsv-meta"><span class="rt">📅 '+esc(rsvArrT(s.rsv))+'〜</span>'+(s.rsv.tantou?'　担当 '+esc(s.rsv.tantou):'')+'</div>'
        +(rrqb?'<div class="tags" style="margin-top:4px">'+rrqb+'</div>':'')+'</div>';
    }
    var planB=(s.planList&&s.planList.length)?'<div class="rsv-meta" style="color:#c8a8f0;margin-top:3px">📋 予定 '+s.planList.map(esc).join('、')+'</div>':'';
    return '<div class="seat'+mt+ct+grp+'" '+oc+'><div class="st"><span class="snm">'+esc(dispNm)+grpBadge+'</span></div><div class="empty">空席</div>'+planB+'</div>';
  }
  var tags=(s.tags||[]).map(function(t){return '<span class="tg '+(TAGLABEL[t]?t:'')+'">'+(TAGLABEL[t]||esc(t))+'</span>';}).join('');
  var tantou=s.tantou;
  // 担当不在（接客者ゼロ）
  if(st==='nocast'){
    return '<div class="seat nocast'+mt+self+ct+cprim+grp+'" '+oc+'><div class="cnr">⚠ 担当不在</div>'
      +'<div class="st"><span class="snm">'+esc(dispNm)+grpBadge+coBadge+'</span><span class="pax">'+paxDisp+'名</span></div>'
      +((tags||reqBadgeHtml(idx,s.cust))?'<div class="tags">'+tags+reqBadgeHtml(idx,s.cust)+'</div>':'')
      +occupantsHtml(s)+seatInfoLine(s)+nextRsvLine_(s)
      +(tantou?'<div style="margin-top:3px">'+chipHtml(tantou,-1,idx,{away:true,awayMin:s.awayMin})+'</div>':'')+'</div>';
  }
  // 接客中
  var cnr=st==='over'?'🔴 超過':st==='warn'?'⏰ まもなく':'';
  var rqb=reqBadgeHtml(idx,s.cust);
  var chips='';
  // 下段は「実際についているキャスト」だけ（担当が抜けている場合は上の担当ラベルで表示）
  s.casts.forEach(function(c,ci){ chips+=chipHtml(c.n,ci,idx,{mins:c.mins,status:c.status,tantou:c.n===tantou}); });
  return '<div class="seat '+st+mt+self+ct+cprim+grp+'" '+oc+'>'+(cnr?'<div class="cnr">'+cnr+'</div>':'')
    +'<div class="st"><span class="snm">'+esc(dispNm)+grpBadge+coBadge+'</span><span class="pax">'+paxDisp+'名</span></div>'
    +((tags||rqb)?'<div class="tags">'+tags+rqb+'</div>':'')
    +occupantsHtml(s)+seatCastCtx(s)+seatInfoLine(s)+nextRsvLine_(s)+'<div style="margin-top:2px">'+chips+'</div></div>';
}
// 席カードの客名表示（相席=複数組なら各組を縦積み、単一なら従来通り）
function occupantsHtml(s){
  var occ=s.occupants||[];
  if(occ.length<=1){
    return '<div class="cust custrow"><span class="nm">'+esc(s.cust)+'</span>'+seatBillBtn_(occ[0]||s)+'</div>';
  }
  return '<div class="cust" style="line-height:1.45">'+occ.map(function(o){
    return '<div class="custrow"><span class="nm">'+esc(o.cust)+'様 <span style="font-size:10px;color:#8aa8c8">'+(o.pax||1)+'名'+(o.tantou?'・'+esc(o.tantou):'')+'</span></span>'
      +seatBillBtn_(o)+'</div>';
  }).join('')+'</div>';
}
/* 🧾 伝票ボタン。⚠️伝票は**組(rowIdx)単位**なので相席は組ごとに1つ出す（席単位にすると混ざる）。
   金額が出ていれば入力済み＝「伝票入力の確認」がホール状況のまま済む（ボス依頼）。
   ⚠️席カード自体のonclick(onSeatClick)を巻き込まないようstopPropagationする。 */
function seatBillBtn_(o){
  var rid=o&&o.rowIdx; if(!rid) return '';
  var p=bmPeek_(rid);
  return '<button class="bill-btn'+(p.total?' on':'')+'" onclick="event.stopPropagation();openBillFor('+rid+')">'
    +(p.closed?'✅':'🧾')+' 伝票'+(p.total?' <b>'+bmYen(p.total)+'</b>':'')+'</button>';
}
/* 保存済みの下書きから合計と会計済みかだけ覗く。⚠️BM.draftを触らない＝ホール描画で伝票の状態を変えない */
function bmPeek_(rowIdx){
  try{
    var raw=localStorage.getItem(bmStoreKey()); if(!raw) return {total:0,closed:false};
    var d=(JSON.parse(raw)||{})[String(rowIdx)]; if(!d) return {total:0,closed:false};
    if(!d.casts) d.casts={}; if(!d.orders) d.orders=[]; if(!d.pay) d.pay={};
    if(!d.guests||!d.guests.length) return {total:0,closed:false};
    return { total:bmCalc(d).total, closed:!!(d.closed&&d.closed.ts) };
  }catch(e){ return {total:0,closed:false}; }
}
/* ⚠️他端末で打った伝票は、この端末にまだ届いていないことがある（取り込みは非同期）。
   BM.wantに覚えておき、届いた時点で自動的に開く＝「開くを押したのに何も出ない」を防ぐ */
/* 🧾 席の「伝票」ボタンから開く。⚠️2026-08-28ボス指示＝**ポップアップで出してすぐ戻れる**ように。
   伝票管理タブ(viewMode==='bill')を自分で開いている時は、従来どおりその画面で切り替えるだけ。 */
function openBillFor(rowIdx){
  BM.key=String(rowIdx); BM.want=String(rowIdx);
  if(viewMode==='bill'){ bmRender(); return; }
  openBillPopup();
}
function openBillPopup(){
  document.body.classList.add('bill-pop');
  var t=document.getElementById('bmPopTtl');
  if(t){
    var b=(typeof bmBills==='function'?bmBills():[]).filter(function(x){return String(x.rowIdx)===String(BM.key);})[0];
    t.textContent=b?(bmTblLabel_(b.floor,b.table)+'　'+(b.cust||'')+' 様'):'伝票';
  }
  bmRender();
  /* ⚠️共有ポーリング(20秒)はポップアップの間だけ回す＝閉じたら必ず止める（通信を垂れ流さない） */
  if(typeof IS_GAS==='undefined'||IS_GAS!==false){ bmLoadStock(); bmPullStart(); }
}
function closeBillPopup(){
  if(!document.body.classList.contains('bill-pop')) return;
  document.body.classList.remove('bill-pop');
  bmPullStop();
  BM.slip=null; BM.pick=null;        // 開いたままの紙・帰属選びを持ち越さない
  renderHall();                       // 伝票ボタンの金額表示を最新にする
}
// 来店中の席に「次席予約(=後半に入った別の確定予約)」があれば予告する1行。席一覧の接客中/担当不在で共用（マップはmapFlags_の🔜）。
function nextRsvLine_(s){
  if(!s) return '';
  var h='';
  if(s.leavePlan) h+='<div class="rsv-meta" style="color:#ffc98a;margin-top:3px">🕛 空く予定 '+esc(s.leavePlan)+' 頃</div>';
  if(s.nextRsv) h+='<div class="rsv-meta" style="color:#ffc98a;margin-top:3px">🔜 次席予約 '+esc(rsvArrT(s.nextRsv))+'〜 '+esc(s.nextRsv.cust)+'様'+(s.nextRsv.tantou?'<span style="color:#8aa8c8;font-weight:600">・担当 '+esc(s.nextRsv.tantou)+'</span>':'')+'</div>';
  return h;
}
// 占有席に「空く予定」= その席に居る来店済み予約の退店予定時刻を付与（相席は最も遅い方＝最後に空く時刻）。
// 席状態3台帳には手を入れず、既に読み込んだ RSV（退店予定つき）と席をテーブル名で突き合わせる低リスク方式。
function annotateLeavePlan(){
  if(!SEATS||!RSV) return;
  var byCode={}; SEATS.forEach(function(s){ if(s)s.leavePlan=''; byCode[s.code]=s; });
  RSV.forEach(function(r){
    if(r.status!=='来店済み'||!r.checkTime||!r.table||r.table==='未定') return;
    String(r.table).split('、').forEach(function(t){
      var s=byCode[tblToCode(t.trim())]; if(!s) return;
      if(!s.leavePlan || r.checkTime>s.leavePlan) s.leavePlan=r.checkTime;
    });
  });
}
/* ---- 席・キャストのタップ操作（付け回し / 移動） ---- */
function onSeatClick(idx){
  if(moveMode){ placeCast(idx); return; }
  if(combineMode){ mergeSeat(idx); return; }
  if(tableMoveMode){ doTableMove(idx); return; }
  var s=SEATS[idx]; if(s.mergedTo!=null){ openSeat(s.mergedTo); return; }
  openSeat(idx);
}
/* ---- テーブルチェンジ（客ごと別テーブルへ移動） ---- */
function startTableMove(idx){ closeSheet(); tableMoveMode=true; tableMoveFrom=idx; renderHall(); showTableMoveBar(); }
function showTableMoveBar(){
  var p=SEATS[tableMoveFrom]; var b=document.getElementById('combinebar');
  b.className='castbar movemode show';
  b.innerHTML='<div class="cb-info">🔀 '+esc(p.floor+' '+shortNm(p.name))+(p.cust?'（'+esc(p.cust)+'）':'')+' の<b>移動先の空席</b>をタップ</div><div class="cb-btns"><button class="cb x" onclick="cancelTableMove()">キャンセル</button></div>';
}
function cancelTableMove(){ tableMoveMode=false; tableMoveFrom=null; hideCombineBar(); renderHall(); }
function doTableMove(destIdx){
  if(destIdx===tableMoveFrom){ return; }
  var from=SEATS[tableMoveFrom], to=SEATS[destIdx];
  if(to.type==='W'||to.type==='K'){ toast('待機/黒服席へは移動できません'); return; }
  var occupied=to.occupied||to.cust||(to.casts&&to.casts.length)||to.mergedTo!=null||(to.mergeWith&&to.mergeWith.length)||to.rsv;
  if(occupied){ toast('移動先は空席を選んでください'); return; }
  if(!confirm(from.floor+' '+shortNm(from.name)+(from.cust?'（'+from.cust+'）':'')+' を\n'+to.floor+' '+shortNm(to.name)+' へ移動します。よろしいですか？')) return;
  var fromCode=from.code, toCode=to.code;
  tableMoveMode=false; tableMoveFrom=null; hideCombineBar();
  toast('🔀 テーブルを移動しました');
  if(IS_GAS) gsr('kioskChangeTable',fromCode,toCode).then(function(r){ if(r&&r.ok===false){ toast('移動失敗: '+(r.error||'')); } loadAll(); }).catch(function(){ toast('移動に失敗'); loadAll(); });
  else renderAll();
}
/* ---- 席の結合 / 分割 ---- */
function startCombine(idx){ closeSheet(); combineMode=true; combinePrimary=idx; renderHall(); showCombineBar(); }
function showCombineBar(){ var p=SEATS[combinePrimary]; var b=document.getElementById('combinebar'); b.className='castbar movemode show'; b.innerHTML='<div class="cb-info">🔗 '+esc(p.floor+' '+shortNm(p.name))+' に結合する席をタップ</div><div class="cb-btns"><button class="cb cmb" onclick="finishCombine()">完了</button><button class="cb x" onclick="cancelCombine()">キャンセル</button></div>'; }
function hideCombineBar(){ document.getElementById('combinebar').className='castbar'; }
function mergeSeat(target){
  if(target===combinePrimary) return;
  var t=SEATS[target]; if(t.mergedTo!=null) return;
  var p=SEATS[combinePrimary]; p.mergeWith=p.mergeWith||[];
  if(p.mergeWith.indexOf(target)>=0) return;
  p.mergeWith.push(target); t.mergedTo=combinePrimary;
  if(t.cust){ p.pax=(p.pax||0)+(t.pax||0); if(t.casts&&t.casts.length) p.casts=(p.casts||[]).concat(t.casts); t.casts=[]; }
  else { t.casts=[]; }
  t.rsv=null;
  renderHall(); showCombineBar();
}
function finishCombine(){ var p=SEATS[combinePrimary]; var did=p.mergeWith&&p.mergeWith.length; var pc=p.code, others=(p.mergeWith||[]).map(function(mi){return SEATS[mi].code;}); combineMode=false; combinePrimary=null; hideCombineBar(); if(did) toast('🔗 席を結合しました'); renderAll(); if(IS_GAS&&did)gsr('kioskCombineSeats',pc,others).then(loadAll).catch(function(){loadAll();}); }
function cancelCombine(){ combineMode=false; combinePrimary=null; hideCombineBar(); renderHall(); }
function splitSeat(idx){
  var p=SEATS[idx]; if(!p.mergeWith||!p.mergeWith.length) return;
  p.mergeWith.forEach(function(mi){ SEATS[mi].mergedTo=null; });
  var pc=p.code;
  p.mergeWith=[]; closeSheet(); toast('✂️ 結合を解除しました'); renderAll();
  if(IS_GAS)gsr('kioskSplitSeat',pc).then(loadAll).catch(function(){loadAll();});
}
function tapCast(si,ci,ev){ if(ev)ev.stopPropagation(); if(moveMode){ placeCast(si); return; } selCast={si:si,ci:ci}; renderHall(); showCastBar(); }
function tapAway(ev){ if(ev)ev.stopPropagation(); toast('その担当は他卓で接客中です（つけまわしで管理）'); }
function closeBar(){ selCast=null; moveMode=false; document.getElementById('castbar').className='castbar'; }
function hideCastBar(){ closeBar(); renderHall(); }
function showCastBar(){
  var bar=document.getElementById('castbar');
  if(!selCast){ bar.className='castbar'; bar.innerHTML=''; return; }
  var s=SEATS[selCast.si], c=s.casts[selCast.ci], col=castColor(c.n);
  var av='<span class="ava" style="background:'+col+'">'+esc(c.n.charAt(0))+'</span>';
  if(moveMode){
    bar.className='castbar movemode show';
    bar.innerHTML='<div class="cb-info">'+av+'🔄 '+esc(c.n)+' を移動 <small>移動先の席をタップ</small></div><div class="cb-btns"><button class="cb x" onclick="cancelMove()">キャンセル</button></div>';
  }else{
    bar.className='castbar show';
    bar.innerHTML='<div class="cb-info">'+av+esc(c.n)+' <small>'+esc(s.floor+' '+s.name)+' ・ '+(c.mins<0?'超過'+(-c.mins)+'分':c.mins+'分')+'</small></div>'
      +'<div class="cb-btns"><button class="cb mv" onclick="startMove()">🔄 別の席へ移動</button><button class="cb x" onclick="hideCastBar()">✕</button></div>';
  }
}
function startMove(){ moveMode=true; renderHall(); showCastBar(); }
function cancelMove(){ hideCastBar(); }
function placeCast(targetSi){
  if(!selCast){ return; }
  if(targetSi===selCast.si){ hideCastBar(); return; }
  var src=SEATS[selCast.si];
  var castName=src.casts[selCast.ci]?src.casts[selCast.ci].n:''; var fromCode=src.code, toCode=SEATS[targetSi].code, toLabel=shortNm(SEATS[targetSi].name);
  var c=src.casts.splice(selCast.ci,1)[0]; if(!c){ closeBar(); renderAll(); return; }
  if(src.tantou===c.n) src.awayMin=0; // 担当が抜けた席は経過0からカウント
  c.mins=20; c.status='ok';
  var tgt=SEATS[targetSi]; if(!tgt.casts) tgt.casts=[]; tgt.casts.push(c);
  toast('🔄 '+c.n+' を '+tgt.floor+' '+shortNm(tgt.name)+' へ移動');
  closeBar(); renderAll();
  if(IS_GAS&&toCode)gsr('kioskRotateCast',castName,fromCode,toCode,toLabel).then(loadAll).catch(function(e){toast('保存エラー');loadAll();});
}

/* ============ RIGHT COLUMN: 予約 / つけまわし ============ */
var rightView='rsv';
function switchRight(v){rightView=v;renderRight();}
function renderRight(){
  var act=ROT.filter(needsAction).length;
  var haya=SHIFT.filter(function(s){return s.hayaagari;}).length;
  var tabs=[{k:'rsv',ic:'📋',t:'予約'},{k:'rot',ic:'🔄',t:'付け回し',b:act},{k:'shift',ic:'🗒',t:'シフト',b:haya}];
  var hd='<div class="rtoggle">'+tabs.map(function(t){
    return '<button class="rtg'+(rightView===t.k?' active':'')+'" onclick="switchRight(\''+t.k+'\')">'+t.ic+' '+t.t+(t.b?'<span class="b">'+t.b+'</span>':'')+'</button>';
  }).join('')+'</div>';
  setHtml('rsvHd',hd);
  if(rightView==='rsv') renderRsv(); else if(rightView==='rot') renderRotation(); else renderShift();
}

/* ---- つけまわしボード ---- */
function worstWait(c){var w=c.tables.filter(function(t){return !t.cur;});if(!w.length)return null;return w.slice().sort(function(a,b){return (b.wait||0)-(a.wait||0);})[0];}
function isMulti(c){return c.tables.length>=2;}
function rotInterval(c){return c.interval||15;}
function needsAction(c){
  var cur=c.tables.find(function(t){return t.cur;});
  if(cur&&cur.over)return true;
  if(!isMulti(c))return false;
  var iv=rotInterval(c);
  return c.tables.some(function(t){return !t.cur&&(t.alert||(t.wait||0)>=iv);});
}
function renderRotation(){
  var list=ROT.slice().sort(function(a,b){var d=(needsAction(b)?1:0)-(needsAction(a)?1:0);return d||(b.tables.length-a.tables.length);});
  var multi=ROT.filter(isMulti);
  var loadmap=multi.length?'<div class="loadmap">'+multi.slice().sort(function(a,b){return b.tables.length-a.tables.length;}).map(function(c){
      return '<div class="lm l'+(c.tables.length>=3?'3':'2')+'" onclick="scrollToCast(\''+esc(c.cast)+'\')">'+esc(c.cast)+' <span class="n">'+c.tables.length+'卓 / '+rotInterval(c)+'分</span></div>';
    }).join('')+'</div>':'';
  var html='<div class="rot-sum">🔄 担当キャストの巡回状況　掛け持ち <b style="color:#ffcf6a">'+multi.length+'名</b>　要付け回し <b>'+ROT.filter(needsAction).length+'件</b></div>'
    + loadmap + list.map(rcastHtml).join('');
  setHtml('rsvArea',html);
}
function scrollToCast(name){var el=document.getElementById('rcast-'+name);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
function rcastHtml(c){
  var ci=ROT.indexOf(c);
  var cur=c.tables.find(function(t){return t.cur;});
  var others=c.tables.filter(function(t){return !t.cur;});
  var multi=isMulti(c), iv=rotInterval(c), act=needsAction(c);
  var load=multi
    ? '<span class="rload l'+(c.tables.length>=3?'3':'2')+'">掛け持ち '+c.tables.length+'卓<span class="pip">'+Array(c.tables.length+1).join('●')+'</span></span>'
    : '<span class="rload l1">専任</span>';
  var rows='';
  if(cur){
    var left=iv-cur.min;
    var rt=cur.over?'超過 '+cur.min+'分'
         :multi?(left<=0?'交代時期・'+cur.min+'分':'接客中 '+cur.min+'分<span style="color:#8a9ac0"> / あと'+left+'分</span>')
         :'接客中 '+cur.min+'分';
    var cc=((multi&&left<=0)||cur.over)?'overw':'cur';
    rows+='<div class="rtab '+cc+'"><span class="tl">🎤 '+esc(cur.key)+' '+esc(cur.cust)+'</span><span class="tr">'+rt+'</span></div>';
  }
  others.forEach(function(t){
    var w=t.wait||0;
    var wc=(t.alert||w>=iv)?'overw':(w>=iv*0.6?'warnw':'wait');
    rows+='<div class="rtab '+wc+'"><span class="tl">⏳ '+esc(t.key)+' '+esc(t.cust)+'</span><span class="tr">抜けて'+w+'分'+(t.alert?'・'+esc(t.alert):(w>=iv?'・交代を':''))+'</span></div>';
  });
  var intctl=multi?'<div class="rint">⏱ 何分で回す<div class="ichips">'+[10,15,20,25].map(function(m){return '<div class="ic'+(iv===m?' sel':'')+'" onclick="setCastInterval('+ci+','+m+')">'+m+'</div>';}).join('')+'</div></div>':'';
  var actions='';
  if(others.length){
    var tgt=worstWait(c);
    var urg=(tgt.alert||(tgt.wait||0)>=iv)?' urg':'';
    actions='<div class="rcast-act"><div class="rbtn mv'+urg+'" onclick="rotateCast('+ci+',\''+esc(tgt.key)+'\')">→ '+esc(tgt.key)+' へ回す</div></div>';
  }
  var tag=act?' <span class="rcast-tag a">要付け回し</span>':'';
  return '<div class="rcast'+(act?' act':'')+'" id="rcast-'+esc(c.cast)+'"><div class="rcast-hd"><span class="rcast-nm">'+(act?'🔴 ':'🟢 ')+esc(c.cast)+tag+'</span>'+load+'</div>'+rows+intctl+actions+'</div>';
}
function setCastInterval(ci,m){ROT[ci].interval=m;renderAll();if(IS_GAS)gsr('kioskSetInterval',ROT[ci].cast,m).catch(function(){});}
function toast(msg){var t=document.getElementById('rotToast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show');},2200);}
/* 🔄付け回しタブからの移動。付ける前にNG関所を通す（ボス確定＝NGキャストは通さない） */
function rotateCast(ci,key){var c=ROT[ci];if(!c)return;var t0=(c.tables||[]).find(function(t){return t.key===key;});ngGate(t0?t0.code:'',c.cast,function(){rotateCastGo(ci,key);});}
function rotateCastGo(ci,key){var c=ROT[ci];var cur=c.tables.find(function(t){return t.cur;});var tgt=c.tables.find(function(t){return t.key===key;});var fromCode=cur?cur.code:'',toCode=tgt?tgt.code:'';if(cur){cur.cur=false;cur.wait=0;cur.over=false;}if(tgt){tgt.cur=true;tgt.min=0;tgt.wait=0;tgt.over=false;tgt.alert=null;}toast('🔄 '+c.cast+' を '+key+' へ付け回しました');renderAll();if(IS_GAS&&toCode)gsr('kioskRotateCast',c.cast,fromCode,toCode,key).then(function(res){ngServerReject(res);loadAll();}).catch(function(e){toast('保存エラー');loadAll();});}

/* 🍶 本日の予約ボトル：会員ボトルがある予約を"位置順"で一覧化＝開店前に棚を回って一括で出せる。行タップで予約詳細へ */

            : r.bottlePos
              ? '<div class="bp-pos">📍'+esc(r.bottlePos)+'</div>'
              : '<div class="bp-pos">📍<span style="color:#c69a6a">位置未登録</span></div>')
          +'<div class="bp-mid"><div class="bp-btl">🍶 '+esc(r.bottle)+'</div><div class="bp-cust">'+esc(r.cust)+'様'+(r.mem?' <span class="bp-mem">'+esc(r.mem)+'</span>':'')+(r.tantou?'・'+esc(r.tantou):'')+'</div></div>'
          +'<div class="bp-right">'+esc(rsvArrT(r))+' '+st+(r.table&&r.table!=='未定'?'<div class="bp-tbl">'+esc(r.table)+'</div>':'')+'</div>'

function outMin(s){return tmin(s.out);}
function setHaya(i){ var cur=SHIFT[i].hayaagari||''; var t=prompt(SHIFT[i].name+' の早上がり時刻（例 22:00 / 空欄で解除）', cur); if(t===null)return; t=String(t).trim(); SHIFT[i].hayaagari=t; renderShift(); renderAlerts(); if(IS_GAS)gsr('kioskSetHayaagari',SHIFT[i].name,t).catch(function(){}); }
function toggleOkuri(i){ SHIFT[i].okuri=!SHIFT[i].okuri; renderShift(); if(IS_GAS)gsr('kioskSetOkuri',SHIFT[i].name,SHIFT[i].okuri,'',SHIFT[i].okuriMode||'ドライバー').catch(function(){}); }
function toggleOkuriMode(i){ SHIFT[i].okuriMode=SHIFT[i].okuriMode==='ドライバー'?'自便':'ドライバー'; renderShift(); if(IS_GAS)gsr('kioskSetOkuriMode',SHIFT[i].name,SHIFT[i].okuriMode).catch(function(){}); }
function renderShift(){
  var haya=SHIFT.filter(function(s){return s.hayaagari;}), okuri=SHIFT.filter(function(s){return s.okuri;});
  var drv=okuri.filter(function(s){return s.okuriMode==='ドライバー';}).length, jib=okuri.length-drv;

/* 出退勤の打刻ステータス（勤怠ログ＝LINE「出勤」「退勤」＋iPad打刻）。表示のみ・タップ不可 */

/* 実効出勤の理由バッジ。シフト表の生値と実際の出勤が違う時だけ出す（＝14:00ラインナップLINEと同じ時刻を表示している根拠）。
   20:00シフトは20時出勤の依頼が無ければ実際は20:30着＝これが既定なのでバッジは出さない。 */
function arrBadge(s){
  var raw=s.rawShift?('　シフト表: '+s.rawShift):'';

  if(s.arrival==='ok')    return '<span class="sr-arr ok" title="20時出勤を了承済み'+esc(raw)+'">⚡ 20時了承</span>';

/* ⚠️予約カードの注意情報（NG）。予約が入った時点で黒服の目に必ず入る場所＝ここに出す。
   ⛔NGキャストが担当/予約/同伴に入っていたら、その場で赤く名指しする（付け回し前に気づける）。 */
function ngCardHtml(r){
  var ng=r&&r.ngInfo; if(!ng) return '';
  var L=[];
  var assigned=[r.tantou,r.yoyaku,r.dohan].filter(Boolean);
  var hitCast=(ng.ngCasts||[]).filter(function(n){return assigned.some(function(a){return ngNm(a)===ngNm(n);});});
  if(hitCast.length) L.push('<b>⛔ NGキャストが付いています：'+esc(hitCast.join('・'))+'</b>');
  else if((ng.ngCasts||[]).length) L.push('NGキャスト：'+esc((ng.ngCasts||[]).join('・')));
  if((ng.ngTypes||[]).length) L.push('苦手タイプ：'+esc((ng.ngTypes||[]).join('・')));
  if((ng.ngActs||[]).length) L.push('NG行為：'+esc((ng.ngActs||[]).join('・')));
  if((ng.ngCustomers||[]).length) L.push('同席NG：'+esc((ng.ngCustomers||[]).join('・'))+'様');
  if(!L.length) return '';
  return '<div class="rng">⚠️ '+L.join('　／　')+'</div>';
}
/* 名前の照合キー。全角半角の空白を全部落とす（normalizeName_の内部スペース罠と同じ轍を踏まない） */
function ngNm(s){ return String(s||'').replace(/[\s　]/g,'').replace(/(様|さま)$/,''); }
var UNDO_WINDOW_MS=10*60*1000; /* 来店から10分以内のみ来店前に戻せる */
function canUndoCheckin(r){ return !r.checkInAt || (Date.now()-r.checkInAt)<UNDO_WINDOW_MS; }
function statusBtns(r){
  var h;
  if(r.status==='来店済み'){
    var undo=canUndoCheckin(r)?'<button class="stundo" title="来店前に戻す（来店から10分以内）" onclick="setStatus('+r.id+',\'確定\')">↩</button>':'';
    h='<span class="stpill arr">🟢 来店中</span><button class="stact left" onclick="setStatus('+r.id+',\'退店済み\')">🚪 退店</button>'+undo;
  }else if(r.status==='退店済み'){
    h='<span class="stpill left">🚪 退店済</span><button class="stundo wide" onclick="setStatus('+r.id+',\'来店済み\')">↩ 来店中に戻す</button>';
  }else if(r.status==='キャンセル'){
    h='<span class="stpill cxl">🚫 キャンセル済</span>'; /* 削除ログ＝操作ボタンは出さない */
  }else{
    h='<span class="stpill wait">⏳ 来店前</span><button class="stact arr" onclick="setStatus('+r.id+',\'来店済み\')">✅ 来店</button>';
  }
  return '<div class="stbtns" onclick="event.stopPropagation()">'+h+'</div>';
}
function setStatus(id,s){
  var r=RSV.find(function(x){return x.id===id;}); if(!r)return;
  if(s==='確定'&&!canUndoCheckin(r)){ toast('来店から10分以上経過したため戻せません'); return; }
  // 来店(チェックイン)時、割り当て席に既に別の組が着席中なら「相席」になる旨を確認＝無言マージ防止（2026-07-21）。
  // 先客が後で退店する「次席予約(時間差)」なら、いまは来店にせず先客の退店後に来店させる運用へ誘導する。
  // 席設定側(submitSeatSession)の相席ガードと対称。相席を意図するなら従来どおりOKで通せる。
  if(s==='来店済み'){
    var _occ=[];
    rsvSeatCodes(r).forEach(function(code){
      var seat=SEATS.find(function(x){return x.code===code;}); if(!seat)return;
      (seat.occupants||[]).forEach(function(o){ if(o.rowIdx&&String(o.rowIdx)!==String(r.rowIdx||r.id)&&o.cust) _occ.push(o.cust); });
    });
    if(_occ.length){
      var _nm=_occ.filter(function(v,i,a){return a.indexOf(v)===i;}).map(function(n){return n+'様';}).join('、');
      if(!confirm('この予約席には既に '+_nm+' が着席中です。\n\nこのまま来店にすると、入れ替えではなく【相席】（同じ卓に2組）になります。\n\n先客が後で退店する「次席予約（時間差）」なら、いまは来店にせず、先客の退店後に来店させてください。\n\n相席として今すぐ来店にしますか？')) return;
    }
  }
  r.status=s;
  if(s==='来店済み') r.checkInAt=Date.now();          // 楽観的に来店時刻を記録（10分カウント開始）
  else if(s==='確定') r.checkInAt=null;               // 来店前に戻す＝時刻クリア
  applyRsvToHall(r,s); renderAll();
  if(IS_GAS) gsr('setKioskReservationStatus',r.rowIdx,s).then(function(res){
    if(res&&res.ok===false){ toast(res.error||'保存できません'); }
    loadAll();
  }).catch(function(e){ toast('保存エラー'); loadAll(); });
}
/* 予約テーブル文字列 → 席コード（バックエンド tableNameToSeatCode_ と同じ規則） */
function tblToCode(t){var m=String(t||'').match(/^(2F|5F)\s*(カウンター|ボックス)(\d+)$/);return m?(m[1]+'-'+(m[2]==='カウンター'?'C':'B')+m[3]):null;}
function rsvSeatCodes(r){return String(r.table||'').split(/[、,]/).map(function(t){return tblToCode(t.trim());}).filter(Boolean);}
/* 来店/退店をホールにローカル即反映（サーバ確定を待たない・ローカル優先）。loadAll で後追い上書き。 */
function applyRsvToHall(r,status){
  if(!r.table||r.table==='未定')return;
  rsvSeatCodes(r).forEach(function(code){
    var seat=SEATS.find(function(x){return x.code===code;});if(!seat)return;
    if(status==='来店済み'){
      if(!seat.casts||!seat.casts.length){ seat.cust=r.cust?r.cust+' 様':'ご来店'; if(r.pax)seat.pax=r.pax; seat.tantou=r.tantou||seat.tantou||''; }
      else if(!seat.cust){ seat.cust=r.cust?r.cust+' 様':'ご来店'; }
    }else if(status==='退店済み'){
      seat.cust=''; seat.tantou=''; seat.casts=[]; seat.mergeWith=[];
    }else{ /* 確定=来店前へ戻す */
      if(!seat.casts||!seat.casts.length){ seat.cust=''; seat.tantou=''; }
    }
  });
}

/* ============ SHEETS ============ */
function showSheet(title,html,wide){
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetBody').innerHTML=html;
  var sh=document.getElementById('sheet');
  sh.classList.toggle('wide',wide===true||wide==='wide');
  sh.classList.toggle('full',wide==='full');
  document.getElementById('scrim').classList.add('show');
  sh.classList.add('show');
}
function closeSheet(){document.getElementById('scrim').classList.remove('show');document.getElementById('sheet').classList.remove('show');}

/* ============ 🏆 表彰・匿名ピア投票（黒服・PIN確認済みの LOGIN で投票）============
   backend: gunshiAwardData(LOGIN) / gunshiAwardVote(LOGIN,catKey,pick,comment)（GUNSHI_API_FNS 登録要） */
var awGun=null;
function awEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openAwardVote(){
  closeMenu();
  if(!LOGIN){ showSheet('🏆 表彰投票','<div class="empty-msg">先にログインしてください</div>',false); return; }
  showSheet('🏆 表彰投票','<div class="empty-msg">読み込み中...</div>','full');
  gsr('gunshiAwardData', LOGIN).then(function(d){
    document.getElementById('sheetBody').innerHTML = renderAwardVoteHtml(d);
  }).catch(function(){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">取得に失敗しました</div>'; });
}
function renderAwardVoteHtml(d){
  awGun=d;
  if(!d || d.ok===false) return '<div class="empty-msg">'+awEsc(d&&d.error||'表彰データがありません')+'</div>';
  var cats=d.categories||[], cands=d.candidates||[], mine=d.myVotes||{}, yen=d.rewardYen||500;
  var done=cats.filter(function(c){return mine[c.key]&&mine[c.key].pick;}).length;
  var card='background:#17140d;border:1px solid rgba(214,183,120,.18);border-radius:12px;padding:13px 14px;margin-bottom:11px';
  var sel='width:100%;padding:11px;border-radius:9px;border:1px solid rgba(214,183,120,.3);background:#241d10;color:#f2ead9;font-size:15px;font-weight:600;box-sizing:border-box';
  var cmt='width:100%;margin-top:8px;padding:9px 11px;border-radius:9px;border:1px solid rgba(214,183,120,.16);background:#100d08;color:#f2ead9;font-size:13px;box-sizing:border-box';
  var opt=function(sv){ return '<option value="">未選択</option>'+cands.map(function(c){return '<option value="'+awEsc(c.id)+'"'+(c.id===sv?' selected':'')+'>'+awEsc(c.name)+'（'+awEsc(c.role)+'）</option>';}).join(''); };
  var h='<div style="padding:4px 2px 70px">';
  if(d.lastResult && d.lastResult.categories && d.lastResult.categories.length){
    h+='<div style="'+card+';border-color:rgba(214,183,120,.34)"><b style="color:#f4d98a">🎉 '+awEsc(d.lastResult.monthLabel)+'の受賞者</b><div style="margin-top:6px;font-size:14px;color:#e8dcc0;line-height:1.7">'+d.lastResult.categories.map(function(r){return awEsc((r.icon||'🏆')+' '+r.title+'：'+r.winner+' さん');}).join('<br>')+'</div>';
    if(d.myAwards && d.myAwards.length) h+='<div style="margin-top:8px;color:#f4d98a;font-weight:700">🏆 あなたは「'+d.myAwards.map(function(a){return awEsc(a.title);}).join('・')+'」を受賞！おめでとうございます</div>';
    h+='</div>';
  }
  if(!d.voteOpen){ h+='<div style="'+card+'">今は投票期間ではありません。</div></div>'; return h; }
  h+='<div style="'+card+';border-color:rgba(214,183,120,.42);background:linear-gradient(135deg,#2a2012,#15100a)"><b style="color:#f4d98a;font-size:15px">🎁 全部門に投票して ¥'+yen+' ゲット</b><div style="margin-top:4px;font-size:13px;color:#c7ae74">投票済み '+done+' / '+cats.length+' 部門　・　締切 '+awEsc(d.deadline||'今月末')+'</div></div>';
  h+='<div style="font-size:12.5px;color:#c7ae74;margin:0 2px 12px;line-height:1.6">🤫 完全匿名。あなたが誰に入れたかは本人にも他の人にも分かりません。一言を添えると匿名のまま本人に届きます。</div>';
  h+=cats.map(function(c){ var v=mine[c.key]||{};
    return '<div style="'+card+'"><div style="font-size:15px;font-weight:700;color:#f2ead9">'+awEsc((c.icon||'🏆')+' '+c.title)+'</div><div style="font-size:12px;color:#94886a;margin:2px 0 10px">'+awEsc(c.desc||'')+'</div>'
      +'<select style="'+sel+'" onchange="awGunPick(\''+c.key+'\',this.value)">'+opt(v.pick||'')+'</select>'
      +'<input style="'+cmt+'" id="awg-'+c.key+'" placeholder="一言そえる（任意・匿名で本人に届く）" value="'+awEsc(v.comment||'')+'" onblur="awGunComment(\''+c.key+'\')"></div>';
  }).join('');
  h+='</div>';
  return h;
}
function awGunPick(catKey, pick){
  if(!awGun) return;
  awGun.myVotes=awGun.myVotes||{}; var prev=awGun.myVotes[catKey]||{};
  awGun.myVotes[catKey]={pick:pick, comment:prev.comment||''};
  document.getElementById('sheetBody').innerHTML=renderAwardVoteHtml(awGun); // 進捗を即更新
  gsr('gunshiAwardVote', LOGIN, catKey, pick, prev.comment||'').catch(function(){});
}
function awGunComment(catKey){
  if(!awGun) return;
  var el=document.getElementById('awg-'+catKey); if(!el) return;
  awGun.myVotes=awGun.myVotes||{}; var v=awGun.myVotes[catKey]||{}; v.comment=el.value; awGun.myVotes[catKey]=v;
  gsr('gunshiAwardVote', LOGIN, catKey, v.pick||'', el.value).catch(function(){});
}

function openSeat(idx){
  var s=SEATS[idx];var body;
  if(s.mergedTo!=null){ openSeat(s.mergedTo); return; }
  if(s.type==='W'||s.type==='K'){
    var wc=(s.casts&&s.casts.length)?s.casts.map(function(c){return esc(c.n)+'（'+c.mins+'分）';}).join('、'):'なし';
    showSheet(s.type==='W'?'🪑 待機':'🖤 黒服','<div style="font-size:11px;color:#8a9ac0;margin-bottom:6px;font-weight:700">'+(s.type==='W'?'待機中のキャスト':'在席の黒服')+'</div><div class="kv"><span class="v">'+wc+'</span></div><div class="empty-msg" style="padding:14px 0;font-size:12px">キャストチップをタップ →「移動」で席へ付けられます</div>',false);
    return;
  }
  var title=s.floor+' '+shortNm(s.name)+((s.mergeWith&&s.mergeWith.length)?' ＋'+s.mergeWith.map(function(mi){return shortNm(SEATS[mi].name);}).join('＋'):'');
  var combBtn=(s.mergeWith&&s.mergeWith.length)
    ? '<div class="act" style="border-color:#2a7a7a;color:#8fe0e0" onclick="splitSeat('+idx+')">✂️ 結合を解除</div>'
    : '<div class="act" style="border-color:#2a7a7a;color:#8fe0e0" onclick="startCombine('+idx+')">🔗 席を結合（広げる）</div>';
  if(s.cust&&(!s.casts||!s.casts.length)){
    // 担当不在（客はいるがキャスト0）
    body=seatCustRowHtml(s,idx)
      +'<div class="kv"><span class="k">状態</span><span class="v" style="color:#ffbf6a">⚠ 担当不在（接客者なし）</span></div>'
      +(s.tantou?'<div class="kv"><span class="k">担当</span><span class="v">👤 '+esc(s.tantou)+' <span style="color:#ffbf6a;font-size:11px">⤴ 抜けて'+(s.awayMin!=null?s.awayMin:0)+'分</span></span></div>':'')
      +(s.leavePlan?'<div class="kv"><span class="k">空く予定</span><span class="v" style="color:#ffc98a">🕛 '+esc(s.leavePlan)+' 頃</span></div>':'')
      +(s.nextRsv?'<div class="kv"><span class="k">次席予約</span><span class="v" style="color:#ffc98a">🔜 '+esc(rsvArrT(s.nextRsv))+' '+esc(s.nextRsv.cust)+'様'+(s.nextRsv.tantou?'・担当 '+esc(s.nextRsv.tantou):'')+'</span></div>':'')
      +coSeatDetailHtml(s)
      +rotPickerHtml(idx)
      +'<div class="actions">'+posSeatBtnHtml(s)+seatCheckoutBtnHtml(s)+'<div class="act" style="border-color:#2a5a8a;color:#8fc0f0" onclick="openSeatSession('+idx+',\'rsv\')">👤 お客様を変更</div><div class="act" style="border-color:#7a5a2a;color:#e0b070" onclick="startTableMove('+idx+')">🔀 テーブル移動</div><div class="act" style="border-color:#2a6a5a;color:#8fe0c0" onclick="startCoSeat('+idx+')">👥 他の席と合わせる</div>'+combBtn+'<div class="act" onclick="closeSheet()">閉じる</div></div>';
    showSheet(title,body,false); return;
  }
  if(!s.casts||!s.casts.length){
    body='<div class="empty-msg" style="padding:24px 0">現在この席は空席です</div>';
    if(s.rsv) body+='<div class="kv"><span class="k">次の予約</span><span class="v" style="color:#ffcc55">'+esc(rsvArrT(s.rsv))+' '+esc(s.rsv.cust)+'様</span></div>';
    if(s.planList&&s.planList.length) body+='<div class="kv"><span class="k">予定キャスト</span><span class="v" style="color:#d8b8ff">📋 '+s.planList.map(esc).join('、')+'</span></div>';
    body+='<div class="actions"><div class="act pri" onclick="openSeatSession('+idx+',\'rsv\')">📋 予約客をこの席へ</div><div class="act pri" style="border-color:#2a6a44;background:#0d2618;color:#8ff0b0" onclick="openSeatSession('+idx+',\'new\')">✨ 飛び込み新規をこの席へ</div><div class="act" style="border-color:#6a4aa0;color:#d8b8ff" onclick="openPlanCast('+idx+')">📋 予定キャスト設定</div>'+combBtn+'<div class="act" onclick="closeSheet()">閉じる</div></div>';

      +(s.bottle?'<div class="kv"><span class="k">ボトル</span><span class="v">🍶 '+esc(s.bottle)+(s.bottlePos?'（'+esc(s.bottlePos)+'）':'')+'</span></div>':'')
      +(s.bday?'<div class="kv"><span class="k">誕生日</span><span class="v">🎂 '+esc(s.bday)+'</span></div>':'')
      +(s.nomikata?'<div class="kv"><span class="k">飲み方</span><span class="v">'+esc(s.nomikata)+'</span></div>':'')
      +'<div class="kv"><span class="k">担当</span><span class="v">'+tantouV+'</span></div>'
      +(s.dohan?'<div class="kv"><span class="k">同伴</span><span class="v">'+esc(s.dohan)+'</span></div>':'')
      +'<div class="kv"><span class="k">状態</span><span class="v">'+stLabel+'</span></div>'
      +(s.leavePlan?'<div class="kv"><span class="k">空く予定</span><span class="v" style="color:#ffc98a">🕛 '+esc(s.leavePlan)+' 頃</span></div>':'')
      +(s.nextRsv?'<div class="kv"><span class="k">次席予約</span><span class="v" style="color:#ffc98a">🔜 '+esc(rsvArrT(s.nextRsv))+' '+esc(s.nextRsv.cust)+'様'+(s.nextRsv.tantou?'・担当 '+esc(s.nextRsv.tantou):'')+'</span></div>':'')
      +((s.tags||[]).length?'<div class="kv"><span class="k">タグ</span><span class="v">'+s.tags.map(function(t){return TAGLABEL[t];}).join(' / ')+'</span></div>':'')
      +'<div style="font-size:11px;color:#8a9ac0;margin:14px 0 4px;font-weight:700">担当キャストと残り時間 <span style="color:#6a7a9a;font-weight:600">（タップで延長・抜く）</span></div>'
      +s.casts.map(function(c){var col=c.status==='over'?'#ee5a5a':c.status==='warn'?'#e6b23a':'#4dcc84';return '<div class="detcast" onclick="castAction('+idx+',\''+jsStr(c.n)+'\')" style="cursor:pointer"><span style="font-weight:700">'+esc(c.n)+'</span><span><span style="color:'+col+';font-weight:800">'+(c.mins<0?'超過 '+(-c.mins)+'分':'残り '+c.mins+'分')+'</span><span style="color:#5a6a8a;font-size:15px;margin-left:8px">›</span></span></div>';}).join('')
      +coSeatDetailHtml(s)
      +rotPickerHtml(idx)
      +'<div class="actions">'+posSeatBtnHtml(s)+seatCheckoutBtnHtml(s)+'<div class="act" style="border-color:#2a5a8a;color:#8fc0f0" onclick="openSeatSession('+idx+',\'rsv\')">👤 お客様を変更</div><div class="act" style="border-color:#7a5a2a;color:#e0b070" onclick="startTableMove('+idx+')">🔀 テーブル移動</div><div class="act" style="border-color:#2a6a5a;color:#8fe0c0" onclick="startCoSeat('+idx+')">👥 他の席と合わせる</div>'+combBtn+'<div class="act" onclick="closeSheet()">閉じる</div></div>';
  }
  showSheet(title,body,false);
}

/* 席詳細の「お客様」行。タップで席設定（お客様の設定・変更）を開く。
 * ⚠️客名が取れていない席は「ご来店」としか出ない（＝客名台帳RSRV_が失われたサイン。
 *   [[reference_seat_state_ledgers]]）。黒服がその場で正しいお客様に付け直せるよう、
 *   この行を必ずタップ可能にしておく。 */
function seatCustRowHtml(s,idx){
  var unknown=(String(s.cust||'').replace(/\s*様\s*$/,'').trim()==='ご来店');
  var chip='<span style="color:#8fc0f0;font-size:11px;font-weight:700;margin-left:8px;border:1px solid #2a4a7a;border-radius:6px;padding:2px 7px;white-space:nowrap">✎ 変更</span>';
  var nm='<span'+(unknown?' style="color:#ffbf6a"':'')+'>'+esc(s.cust)+'（'+s.pax+'名）</span>'+chip;
  var hint=unknown?'<div style="font-size:11px;color:#ffbf6a;font-weight:700;margin-top:3px">お客様が未設定です・タップして設定</div>':'';
  return '<div class="kv" onclick="openSeatSession('+idx+',\'rsv\')" style="cursor:pointer">'

/* ============ 👥 他の席と合わせる（相席・別伝票のまま同卓）============
 * 席詳細 → 合わせる相手（🟢来店中の組 / ⏳未来店の予約）を選ぶ → 合流先の席を選ぶ → 相席。
 * ・未来店の予約 = setupTableSession（checkInReservation_ が占有席でも upsert＝相席／バックエンド既存）
 * ・来店中の組  = kioskChangeTable(..,allowMerge=true)（占有席への移動＝相席／allowMerge新設）
 * 売上・伝票・来店回数は組ごとに別のまま（＝「分ける」運用。まとめる=1伝票化は非対応） */
var coSeatSel=null;
function coSeatCands(){
  var out=[]; SEATS.forEach(function(s,i){ if(!coSeatSel||i===coSeatSel.aIdx)return; if(s.type==='W'||s.type==='K')return; if(s.mergedTo!=null)return;
    var occ=(s.occupants&&s.occupants.length)||s.cust||(s.casts&&s.casts.length); if(occ)out.push({i:i,s:s}); }); return out;
}
function startCoSeat(idx){
  var s=SEATS[idx];
  coSeatSel={aIdx:idx,aCode:s.code,aLabel:s.floor+' '+shortNm(s.name),partner:null,pending:[]};
  renderCoSeatPick();
  if(IS_GAS){ gsr('getTodayPendingReservations').then(function(list){ if(coSeatSel){coSeatSel.pending=list||[];renderCoSeatPick();} }).catch(function(){ if(coSeatSel){coSeatSel.pending=[];renderCoSeatPick();} }); }
  else { coSeatSel.pending=RSV.filter(function(r){return r.status==='確定';}).map(function(r){return {rowIdx:r.id,customer:r.cust,memberId:r.mem,pax:r.pax,tantouCast:r.tantou,time:r.time,table:r.table};}); renderCoSeatPick(); }
}
function coSeatCancel(idx){ coSeatSel=null; openSeat(idx); }
function renderCoSeatPick(){
  if(!coSeatSel)return; var cs=coSeatSel; var occ=coSeatCands();
  var h='<div class="kv"><span class="k">ベース席</span><span class="v">🪑 '+esc(cs.aLabel)+'</span></div>'
    +'<div style="font-size:11px;color:#8a9ac0;margin:6px 0 12px">別々の伝票のまま、同じ卓に相席させます。まず<b>合わせる相手</b>を選んでください。</div>';
  h+='<div class="flabel">🟢 来店中の組と合わせる</div>';
  h+= occ.length? occ.map(function(o){return '<div class="af-res" onclick="coSeatPickSeat('+o.i+')"><div class="af-res-top"><span class="cc-nm">'+esc(o.s.cust||'来店中')+'</span> <span class="rb">'+esc(o.s.floor+' '+shortNm(o.s.name))+'</span>'+(o.s.pax?' <span class="rb">'+o.s.pax+'名</span>':'')+'</div></div>';}).join('') : '<div class="empty-msg" style="padding:10px;font-size:12px">他に来店中の席はありません</div>';
  h+='<div class="flabel" style="margin-top:14px">⏳ 未来店の予約と合わせる</div>';
  h+= cs.pending.length? cs.pending.map(function(r){return '<div class="af-res" onclick="coSeatPickRsv('+r.rowIdx+')"><div class="af-res-top"><span class="cc-nm">'+esc(r.customer)+' 様</span> <span class="rb">'+esc(rsvArrT(r))+'</span> <span class="rb">'+(r.pax||1)+'名</span>'+(r.tantouCast?' <span class="rb t">担当 '+esc(r.tantouCast)+'</span>':'')+'</div></div>';}).join('') : '<div class="empty-msg" style="padding:10px;font-size:12px">未来店の予約はありません</div>';
  h+='<div class="actions" style="margin-top:16px"><div class="act" onclick="coSeatCancel('+cs.aIdx+')">← 席の詳細へ戻る</div></div>';
  showSheet('👥 '+cs.aLabel+' に合わせる',h,false);
}
function coSeatPickSeat(bIdx){ var b=SEATS[bIdx]; coSeatSel.partner={type:'seat',idx:bIdx,code:b.code,label:b.floor+' '+shortNm(b.name),cust:b.cust||'来店中'}; renderCoSeatDest(); }
function coSeatPickRsv(rowIdx){ var r=coSeatSel.pending.filter(function(x){return x.rowIdx===rowIdx;})[0]; if(!r)return; coSeatSel.partner={type:'rsv',rowIdx:rowIdx,customer:r.customer,memberId:r.memberId,pax:r.pax,tantouCast:r.tantouCast,label:(r.customer||'')+'様'}; renderCoSeatDest(); }
function renderCoSeatDest(){
  var cs=coSeatSel,p=cs&&cs.partner; if(!p)return;
  var h='<div class="kv"><span class="k">ベース席</span><span class="v">🪑 '+esc(cs.aLabel)+'</span></div>'
    +'<div class="kv"><span class="k">合わせる相手</span><span class="v">'+(p.type==='rsv'?'⏳ ':'🟢 ')+esc(p.label)+'</span></div>'
    +'<div class="flabel" style="margin-top:10px">どの席にまとめますか？（別伝票のまま同卓）</div>';
  h+='<div class="act pri" onclick="coSeatExec(\''+jsStr(cs.aCode)+'\')">🪑 '+esc(cs.aLabel)+'（この席）にまとめる</div>';
  if(p.type==='seat') h+='<div class="act" style="margin-top:8px" onclick="coSeatExec(\''+jsStr(p.code)+'\')">🪑 '+esc(p.label)+'（相手の席）にまとめる</div>';
  h+='<div class="actions" style="margin-top:16px"><div class="act" onclick="renderCoSeatPick()">← 相手を選び直す</div></div>';
  showSheet('👥 合流先を選ぶ',h,false);
}
function coSeatExec(destCode){
  var cs=coSeatSel,p=cs&&cs.partner; if(!p)return;
  var dest=SEATS.filter(function(s){return s.code===destCode;})[0];
  var destLabel=dest?(dest.floor+' '+shortNm(dest.name)):destCode;
  var destTbl=codeToTbl(destCode);
  if(!confirm(p.label+' を '+destLabel+' に相席させます。\n売上・伝票は別々のままです。よろしいですか？')) return;
  if(!IS_GAS){ toast('（ローカル）'+destLabel+' に相席にしました'); coSeatSel=null; closeSheet(); return; }
  var tasks=[];
  if(p.type==='rsv'){
    tasks.push(gsr('setupTableSession',{rowIdx:p.rowIdx,customer:String(p.customer||'').replace(/\s*様\s*$/,''),memberId:p.memberId||'',pax:parseInt(p.pax)||1,tables:[destTbl].filter(Boolean),tantouCast:String(p.tantouCast||'').split('、').filter(Boolean),dohanCast:[],yoyakuCast:''}));
  } else {
    var loserIdx=(destCode===cs.aCode)?p.idx:cs.aIdx; var loser=SEATS[loserIdx];
    (loser.occupants||[]).forEach(function(o){ if(o.rowIdx) tasks.push(gsr('kioskChangeTable',loser.code,destCode,o.rowIdx,true)); });
    if(!tasks.length){ toast('相手の組を特定できませんでした（相席は予約行のある組のみ）'); return; }
  }
  coSeatSel=null; closeSheet(); toast('👥 相席にしています…');
  Promise.all(tasks).then(function(rs){ var bad=(rs||[]).filter(function(r){return r&&r.ok===false;})[0]; if(bad){ toast('相席に失敗: '+(bad.error||'')); } else { toast('✅ '+destLabel+' に相席にしました'); } loadAll(); }).catch(function(){ toast('相席に失敗しました'); loadAll(); });
}
/* 席詳細でキャストをタップ → 延長 / 抜く を選択 */
function castAction(idx,castName){
  var s=SEATS[idx]; if(!s)return;
  var c=(s.casts||[]).find(function(x){return x.n===castName;});
  var remain=c?(c.mins<0?'超過 '+(-c.mins)+'分':'残り '+c.mins+'分'):'';
  var body='<div style="text-align:center;margin:2px 0 4px"><div style="font-size:20px;font-weight:800;color:var(--txt)">'+esc(castName)+'</div><div style="color:var(--sub);font-size:13px;margin-top:4px">'+esc(shortNm(s.name))+(remain?'　/　'+remain:'')+'</div></div>'
    +'<div style="font-size:12px;color:#8a9ac0;margin:18px 0 6px;font-weight:700">⏳ 延長する（現状に加算）</div>'
    +'<div class="chips">'+[15,30].map(function(m){return '<div class="chip" style="border-color:#2a6a44;color:#8fe0b0" onclick="extendCast('+idx+',\''+jsStr(castName)+'\','+m+')">＋'+m+'分</div>';}).join('')+'</div>'
    +'<div class="actions" style="margin-top:20px"><div class="act dng" onclick="removeCast('+idx+',\''+jsStr(castName)+'\')">🚪 この席から抜く</div><div class="act" onclick="openSeat('+idx+')">← 戻る</div></div>';
  showSheet('キャスト操作',body,false);
}
function extendCast(idx,castName,mins){
  var s=SEATS[idx]; if(!s)return;
  var c=(s.casts||[]).find(function(x){return x.n===castName;});
  if(c){ c.mins=(c.mins||0)+mins; c.status=(c.mins<0?'over':c.mins<=5?'warn':'ok'); }
  renderAll();
  toast('⏳ '+castName+' を +'+mins+'分 延長しました'+(c?'（残り '+c.mins+'分）':''));
  openSeat(idx); // 席詳細に戻す（延長後の残り時間が見える）
  if(IS_GAS) gsr('kioskExtendAtendouAtSeat',s.code,castName,mins).then(function(res){ if(res&&res.ok===false){toast('延長できませんでした: '+(res.error||'')); } loadAll(); }).catch(function(e){toast('延長エラー: '+((e&&e.message)||e));loadAll();});
}
function removeCast(idx,castName){
  if(!confirm(castName+' さんをこの席から抜きますか？'))return;
  var s=SEATS[idx]; if(!s)return;
  s.casts=(s.casts||[]).filter(function(x){return x.n!==castName;});
  renderAll();
  if(IS_GAS) gsr('kioskEndAtendouAtSeat',s.code,castName).then(function(res){ if(res&&res.ok===false)toast('抜けませんでした: '+(res.error||'対象が見つかりません')); else toast('🚪 '+castName+' を抜きました'); loadAll(); openSeat(idx); }).catch(function(e){toast('抜くエラー: '+((e&&e.message)||e));loadAll();});
  else { toast('🚪 '+castName+' を抜きました'); openSeat(idx); }

/* ============ 📋 予定キャスト（開店前の付け回し予定） ============ */
var planSel=null;
function openPlanCast(idx){ var s=SEATS[idx]; planSel={idx:idx, code:s.code, sel:(s.planList||[]).slice()}; renderPlanCast(); }
function renderPlanCast(){

      +(on?'background:#2a1a4a;color:#e0c8ff;border:1px solid #7a5ac0;font-weight:700':'background:var(--panel2);color:var(--sub);border:1px solid var(--line)')+'">'+(on?'✓ ':'')+esc(n)+'</span>';
  }).join('')||'<div class="empty-msg" style="padding:14px 0;font-size:12px">出勤キャストが取得できていません</div>';
  var body='<div style="font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.6">営業開始時にこの席へ座る予定のキャストを選びます。<br>実際にお客様が付くと自動で消えます。</div>'
    +'<div style="line-height:2.4">'+chips+'</div>'

}
function togglePlanCast(n){ var i=planSel.sel.indexOf(n); if(i>=0)planSel.sel.splice(i,1); else planSel.sel.push(n); renderPlanCast(); }
function savePlanCast(){
  var code=planSel.code, sel=planSel.sel.slice(), s=SEATS[planSel.idx];
  // ⛔開店前の「予定」でもNGキャストは置かせない（当日そのまま座って事故る導線を先に潰す）
  var bad=[],warn=[];
  sel.forEach(function(n){ var r=ngCheckLocal(planSel.idx,n); if(r.blocked) bad=bad.concat(r.reasons); warn=warn.concat(r.warns); });
  if(bad.length){ alert('⛔ 予定に置けないキャストがいます\n\n'+bad.join('\n')+'\n\n外してから保存してください。'); return; }
  if(warn.length){ var uw=warn.filter(function(x,i){return warn.indexOf(x)===i;}); if(!confirm('⚠️ 注意があります\n\n'+uw.join('\n')+'\n\nこの予定で保存しますか？')) return; }
  if(s) s.planList=sel;        // ローカル即反映
  renderAll(); toast('📋 予定キャストを保存'); closeSheet();
  if(IS_GAS) gsr('setSeatPlanCast',code,sel).then(function(res){ngServerReject(res);loadAll();}).catch(function(){loadAll();});
}

/* ============ 🪑 席設定（テーブル設定：予約から / 飛び込み新規） ============ */
var seatSel=null;
function codeToTbl(code){var m=String(code||'').match(/^(2F|5F)-([CB])(\d+)$/);return m?(m[1]+' '+(m[2]==='C'?'カウンター':'ボックス')+m[3]):null;}
/* 表示中の予約(RSV)から「来店中」の組を席設定の候補として作る。
 * ⚠️getTodayPendingReservations は status==='確定'（未来店）しか返さない＝既に来店している組は選べない。
 *   客名を失った席（「ご来店」表示）を正しいお客様へ付け直すには来店中の組が要るので、
 *   サーバを増やさずクライアントのRSVから作る。同伴・予約キャストも持ち回して消さない。 */
function rsvSeatedList_(){
  return (RSV||[]).filter(function(r){return r.status==='来店済み'&&(r.rowIdx||r.id);}).map(function(r){
    return {rowIdx:r.rowIdx||r.id,customer:r.cust,memberId:r.mem,pax:r.pax,tantouCast:r.tantou,
            dohanCast:r.dohan,yoyakuCast:r.yoyaku,time:r.time,table:r.table,seated:true};
  });
}
function openSeatSession(idx, initMode){
  var s=SEATS[idx];
  var tbl=codeToTbl(s.code);
  var occupied=!!(s.cust||(s.casts&&s.casts.length));
  seatSel={seatIdx:idx,seatCode:s.code,seatLabel:s.floor+' '+shortNm(s.name),tblName:tbl,
    mode:initMode||null,rowIdx:0,customer:'',member:'',newCust:false,pax:2,tantou:[],dohan:[],yoyaku:'',
    pending:[],seated:rsvSeatedList_(),_busy:false};
  showSheet('🪑 '+seatSel.seatLabel+(occupied?' のお客様を設定・変更':' の席設定'),'<div class="empty-msg">読み込み中...</div>',false);
  if(IS_GAS){
    gsr('getTodayPendingReservations').then(function(list){ seatSel.pending=(list||[]); renderSeatSession(); }).catch(function(){ seatSel.pending=[]; renderSeatSession(); });
  }else{
    seatSel.pending=RSV.filter(function(r){return r.status==='確定';}).map(function(r){return {rowIdx:r.id,customer:r.cust,memberId:r.mem,pax:r.pax,tantouCast:r.tantou,dohanCast:r.dohan,yoyakuCast:r.yoyaku,time:r.time,table:r.table};});

/* キャストが今どの席にいるか（表示用ラベル） */
function castSeatLabel(name){ for(var i=0;i<SEATS.length;i++){ if((SEATS[i].casts||[]).some(function(c){return c.n===name;})) return shortNm(SEATS[i].name); } return ''; }
/* 席詳細内の付け回しピッカー（この席に付いていないキャストをチップ表示） */
function rotPickerHtml(idx){

  var pool=(WORKCASTS!=null&&WORKCASTS.length)?WORKCASTS:CASTS; /* 本日出勤＋当日派遣のみ（未取得時は全キャスト） */

}
/* ワンタップ付け回し: castName を toIdx の席へ（他席にいれば移動、いなければ新規配置）。ローカル優先。 */
/* ══ ⚠️付け回しのNG関所 ═══════════════════════════════════════════════════
   ボス確定（2026-08-19）：NGキャストは完全ブロック／苦手タイプ・NG行為・同フロアNG客は⚠️承知で続行。
   二段構え。①ローカル即判定＝通信ゼロで即座に止める（GASは応答の床が1.9秒＝黒服を待たせない）
             ②backend(ng.gs)が最終の門＝別端末の更新・キャストのタイプ判定・同フロアNG客はサーバが握る。
   ローカルで見えるのは予約一覧(RSV)に乗ってきた ngInfo＝席の同居組から予約行を引いて使う。 */
function ngRsvForOccupant(o){
  if(!o) return null;
  if(o.rowIdx){ var h=(RSV||[]).filter(function(r){return r.id===o.rowIdx;})[0]; if(h) return h; }
  var nm=ngNm(o.cust||o.customer||''); if(!nm) return null;
  return (RSV||[]).filter(function(r){return ngNm(r.cust)===nm;})[0]||null;
}
function ngSeatTargets(seatRef){
  var s=(typeof seatRef==='number')?SEATS[seatRef]:(SEATS||[]).filter(function(x){return x.code===seatRef;})[0];
  if(!s) return [];
  var out=[],seen={};
  var add=function(o){
    var r=ngRsvForOccupant(o); if(!r||!r.ngInfo) return;
    var k=r.id||ngNm(r.cust); if(seen[k]) return; seen[k]=1;
    out.push({cust:r.cust||'',ng:r.ngInfo});
  };
  (s.occupants||[]).forEach(add);
  if(s.rsv) add({cust:s.rsv.cust});
  if(s.nextRsv) add({cust:s.nextRsv.cust});
  return out;
}
/* 席に居る/来る客を全員返す（ngInfoの有無を問わない）。同席NGは片側だけの登録でも成立させるため、
   相手側にNG情報が無くても名前で突き合わせる必要がある。 */
function ngSeatOccupants(seatRef){
  var s=(typeof seatRef==='number')?SEATS[seatRef]:(SEATS||[]).filter(function(x){return x.code===seatRef;})[0];
  if(!s) return [];
  var out=[],seen={};
  var add=function(nm,o){
    nm=String(nm||'').replace(/\s*様\s*$/,'').trim(); if(!nm) return;
    var k=ngNm(nm); if(seen[k]) return; seen[k]=1;
    var r=ngRsvForOccupant(o||{cust:nm});
    out.push({cust:nm,ng:(r&&r.ngInfo)||null});
  };
  (s.occupants||[]).forEach(function(o){ add(o.cust,o); });
  if(s.cust) add(s.cust,null);
  if(s.rsv) add(s.rsv.cust,null);
  if(s.nextRsv) add(s.nextRsv.cust,null);
  return out;
}
/* 🚷 同フロアNG客の衝突を今の盤面から検出（通信ゼロ・backendのgunshiNgBoardと同じ判定）。
   ⚠️同じ卓は「相席の連れ」＝鳴らさない。待機席・黒服席は客席ではないので見ない。 */
function ngFloorConflictsLocal(){
  var byFloor={};
  (SEATS||[]).forEach(function(s){
    if(s.type!=='C'&&s.type!=='B') return;
    ngSeatOccupants(s.code).forEach(function(o){
      (byFloor[s.floor]=byFloor[s.floor]||[]).push({floor:s.floor,code:s.code,seat:shortNm(s.name),cust:o.cust,ng:o.ng});
    });
  });
  var out=[];
  Object.keys(byFloor).forEach(function(f){
    var L=byFloor[f];
    for(var i=0;i<L.length;i++) for(var j=i+1;j<L.length;j++){
      if(L[i].code===L[j].code) continue;
      var hit=(((L[i].ng||{}).ngCustomers)||[]).some(function(x){return ngNm(x)===ngNm(L[j].cust);})
           || (((L[j].ng||{}).ngCustomers)||[]).some(function(x){return ngNm(x)===ngNm(L[i].cust);});
      if(hit) out.push({floor:f,a:L[i],b:L[j]});
    }
  });
  return out;
}
function openSeatByCode(code){
  var idx=-1; (SEATS||[]).forEach(function(s,i){ if(s.code===code) idx=i; });
  if(idx>=0) openSeat(idx);
}
function ngCheckLocal(seatRef,castName){
  var res={blocked:false,reasons:[],warns:[]};
  if(!castName) return res;
  ngSeatTargets(seatRef).forEach(function(t){
    var ng=t.ng||{};
    (ng.ngCasts||[]).forEach(function(n){
      if(ngNm(n)&&ngNm(n)===ngNm(castName)){ res.blocked=true; res.reasons.push('⛔ '+t.cust+'様のNGキャスト＝'+castName); }
    });
    if((ng.ngTypes||[]).length) res.warns.push('⚠️ '+t.cust+'様が苦手なタイプ：'+(ng.ngTypes||[]).join('・'));
    if((ng.ngActs||[]).length)  res.warns.push('📋 '+t.cust+'様のNG行為：'+(ng.ngActs||[]).join('・'));
    if((ng.ngCustomers||[]).length) res.warns.push('🚷 '+t.cust+'様が同席NGにしているお客様：'+(ng.ngCustomers||[]).join('・')+'様');
  });
  return res;
}
/* 付ける直前の関所。通ったら go() を呼ぶ。ブロックは何があっても通さない */
function ngGate(seatRef,castName,go){
  var r=ngCheckLocal(seatRef,castName);
  if(r.blocked){ alert('⛔ このキャストは付けられません\n\n'+r.reasons.join('\n')+'\n\nお客様がNGに指定しているキャストです。'); return; }
  if(r.warns.length&&!confirm('⚠️ 注意があります\n\n'+r.warns.join('\n')+'\n\nこのまま付けますか？')) return;
  go();
}
/* backendが最後の門で弾いた時（別端末の更新・タイプ判定はサーバだけが知っている） */
function ngServerReject(res){
  if(res&&res.blocked){ alert('⛔ 付けられませんでした\n\n'+(res.error||'お客様のNGキャストです')); return true; }
  return false;
}

function quickRotate(toIdx,castName){ ngGate(toIdx,castName,function(){ quickRotateGo(toIdx,castName); }); }
function quickRotateGo(toIdx,castName){
  var to=SEATS[toIdx];
  var fromIdx=-1,fromCi=-1;
  SEATS.forEach(function(s,i){ (s.casts||[]).forEach(function(c,ci){ if(c.n===castName){fromIdx=i;fromCi=ci;} }); });
  var fromCode=(fromIdx>=0)?(SEATS[fromIdx].code||''):'';
  var moved=(fromIdx>=0)?SEATS[fromIdx].casts.splice(fromCi,1)[0]:{n:castName};
  moved.mins=moved.unlimited?0:30; moved.status='ok';
  to.casts=to.casts||[]; to.casts.push(moved);
  renderAll(); openSeat(toIdx); // 詳細を最新状態で再描画
  if(IS_GAS) gsr('kioskRotateCast',castName,fromCode,to.code,shortNm(to.name)).then(function(res){ngServerReject(res);loadAll();}).catch(function(){toast('保存エラー');loadAll();});
  else toast('🔄 '+castName+' を付けました');
}

/* ============================================================================
   🧾 伝票管理（自社POS本体・ホール状況の右）
   ----------------------------------------------------------------------------
   ■ 目的＝**TRUSTと同じ入力で同じ金額が出るか**を現場で並行テストできること。
   ■ 計算はTRUST-REGI-2の実機設定に一致（詳細は repo `TRUST仕様書.md`）:
       小計 = セット + 担当×回数 + 予約×回数 + 同伴×回数 + 注文（⚠️値引・値増は税サの**後**）
       税サ = 小計 × 20%（**消費税はサービス料に含まれる＝別途上乗せしない**）
       合計 = (小計+税サ) を **100円単位で切り上げ**
     実測4件で一致確認済（15,600 / 19,200 / 31,200 / 19,800）。
   ■ ⚠️**いまは端末内の下書き（localStorage）**。backend(`posAddOrders`等)は実装済みだが
     未デプロイのため保存されない。デプロイ後に `bmPush()` を差し替えれば本番保存になる。
     ＝この段階の目的は「金額がTRUSTと合うか」を確かめること。
   ■ 伝票の単位＝**予約行 rowIdx**（席ではない）。相席でも組ごとに割れる。
============================================================================ */
/* 🍽 TRUSTの商品マスタ（2026-08-08にボスがTRUST管理画面から出力したPDFを転記／全210品）。
   ⚠️2026-08-22 ボス確定：2部営業の廃止に伴い「2部営業 3,000円」を削除（実件数は bmItems_().length ＝画面に出る。手で足した品もここに合流する）。
   形式＝[品名, 価格, 種類]。種類はTRUSTの「Web集計用分類」＝ボトル系/単品系/つまみ系。
   ⚠️店舗用カテゴリー（ウィスキー/焼酎/シャンパン…）はこの一覧に含まれない＝**検索で引く**のが正。

var BM_SET_PRICES_DEFAULT=[13000,20833,20000,16666,10000,8330,7500,3000,100000,0];

var BM={key:null,want:null,kind:'全部',q:'',attr:'お客様',openGuest:-1,editPrices:false,castOpen:false,welOpen:false,tantouOpen:false,slip:null,draft:{}};

/* ⚠️POSは**営業日**で動く。`curDate`（画面で見ている日付）を使ってはいけない＝
   黒服が前日を開いたまま打つと、伝票が前日に保存され、閉店ゲートも前日を見に行って

function bmDateKey(){ return (typeof TODAY!=='undefined'&&TODAY)?TODAY:(typeof curDate!=='undefined'?curDate:''); }

function bmLoad(){ try{ BM.draft=JSON.parse(localStorage.getItem(bmStoreKey())||'{}'); }catch(e){ BM.draft={}; } }

/* ============================================================================
   ☁️ 端末間の共有（2026-08-08）。それまでは端末のlocalStorageだけ＝5Fで打った伝票が2Fから見えなかった。
   ■ 端末内保存は**残す**＝通信が落ちても打ち続けられる（GASは1.9秒の床があり、毎打鍵は送れない）。
   ■ サーバーへは**1.2秒まとめて**送る（打鍵ごとに送らない）。
   ■ 取り込みは**新しい方が勝ち**（各下書きが自分の更新時刻`_t`を持つ）。
     ⚠️同じ卓を2端末で同時に打つと片方が消える＝5Fと2Fは別の卓を見る運用が前提。
   ■ 🧪お試し伝票('demo')は**共有しない**＝検算用の落書きを店の記録に混ぜない。
============================================================================ */
var BM_MODE=null;            // 'test' | 'live' | null(未取得)
var BM_SYNC_ERR='';
var BM_PUSH_T=null, BM_PUSH_Q={}, BM_PULL_T=null;
function bmSave(){
  if(BM.key&&BM.draft[BM.key]){ BM.draft[BM.key]._t=Date.now(); BM_PUSH_Q[BM.key]=1; }
  bmStash_();
  bmPushSoon();
}
function bmPushSoon(){ if(BM_PUSH_T) clearTimeout(BM_PUSH_T); BM_PUSH_T=setTimeout(bmPushNow,1200); }
/* 通信が戻るまで自分で送り直す。⚠️打鍵のまとめ保存(1.2秒)とは別のタイマー＝
   打っている最中の保存を再送で潰さないため。 */
var BM_RETRY_T=null;
function bmRetrySoon(){ if(BM_RETRY_T) return; BM_RETRY_T=setTimeout(function(){ BM_RETRY_T=null; bmPushNow(); },15000); }
function bmPushNow(){
  BM_PUSH_T=null;
  var keys=Object.keys(BM_PUSH_Q); BM_PUSH_Q={};
  if(typeof gsr!=='function') return;
  keys.forEach(function(k){
    if(k==='demo') return;                                   // お試しは共有しない
    var d=BM.draft[k]; if(!d) return;
    gsr('posSaveBill',bmDateKey(),k,bmCalc(d).total,JSON.stringify(d),(typeof LOGIN!=='undefined'?LOGIN:''))
      .then(function(r){
        /* ⚠️2026-08-28追加＝サーバーが**受け取りを拒否**しても（会計済み／データが大きすぎ）
           ここは通信成功として素通りしていた＝端末は「共有できた」と思い込み、
           別端末で会計された伝票を自分だけ未会計だと信じ続ける。理由を出して状態を取り直す。 */
        if(r&&r.ok===false){
          var msg=String(r.error||'この伝票を保存できませんでした');
          var fk={}; fk[String(k)]=1;
          var p=bmPull(fk);                          // 会計済みなら他端末の結果を取り込んで画面を正す
          var show=function(){ BM_SYNC_ERR=msg; bmRenderIfIdle(); };
          if(p&&p.then) p.then(show,show); else show();
          return;
        }
        if(r&&r.mode){ BM_MODE=r.mode; } if(BM_SYNC_ERR){ BM_SYNC_ERR=''; bmRenderIfIdle(); }
      })
      .catch(function(e){
        /* ⚠️2026-08-28追加＝失敗したキーを**捨てていた**。次に何か打つまで再送されず、
           サーバーに一度も載らないまま会計されると**閉店ゲートがその伝票を知らない**
           （ゲートはサーバーの下書きを見る）＝未会計を素通りさせる穴になっていた。
           ⭐キューに戻して自分で再送する。間隔は15秒＝GASの床1.9秒とWAFを考えて連投しない。 */
        BM_PUSH_Q[k]=1;
        BM_SYNC_ERR='共有できていません（この端末には残っています・再送します）';
        bmRetrySoon(); bmRenderIfIdle();
      });
  });
}
/* 他端末の伝票を取り込む。⚠️入力中でも下書き自体は差し替わる（描画はbmRenderIfIdleが守る） */
/* force={rowIdx:1,…} を渡すと、その伝票だけは**更新日時に関係なくサーバーを採る**。
   ⚠️通常は「新しい方が勝ち」だが、**サーバーに書き込みを拒否された伝票**は自分の方が
   新しくても間違い（別端末で会計されている）＝ここで勝たせると会計済みが画面から消える。 */
function bmPull(force){
  if(typeof gsr!=='function') return null;
  /* ⚠️プロミスを返す＝呼び出し側が「取り直しが終わってから」表示を決められる
     （返さないと、保存拒否のメッセージをこの中の BM_SYNC_ERR='' が先に消してしまう） */
  return gsr('getPosBills',bmDateKey()).then(function(r){
    if(r&&r.mode) BM_MODE=r.mode;
    BM_SYNC_ERR='';
    bmLoad();
    var changed=false;
    ((r&&r.bills)||[]).forEach(function(b){
      if(!b||!b.data) return;
      var loc=BM.draft[b.rowIdx];
      var st=Number(b.data._t)||0, lt=Number(loc&&loc._t)||0;
      if(!loc||st>lt||(force&&force[String(b.rowIdx)])){ BM.draft[b.rowIdx]=b.data; changed=true; }
    });
    if(changed) bmStash_();
    bmRenderIfIdle();
  }).catch(function(e){ BM_SYNC_ERR='他の端末の伝票を取得できていません'; bmRenderIfIdle(); });
}
function bmPullStart(){ bmPull(); if(BM_PULL_T) clearInterval(BM_PULL_T); BM_PULL_T=setInterval(bmPull,20000); }
function bmPullStop(){ if(BM_PULL_T){ clearInterval(BM_PULL_T); BM_PULL_T=null; } }
/* モード表示＋切替。⚠️テスト=別シート(_TEST)に書く＝本番に上げた時に練習データが混ざらない */

    +'<div class="bm-row" style="margin-top:8px;align-items:center">'

        ?'⚠️<b>実機には送りません</b>。会計→控え→領収書の流れだけ確かめられます（発行控えは実物と同じように記録されます）。'
        :'TM-M30へ送ります。')+'</div>'
    +printLogHtml_()
    +'</div>';
}
function bmModeSwitch(){
  var live=(BM_MODE==='live'), next=live?'test':'live';
  var word=live?'テスト':'本番';
  var t=prompt('POSを【'+word+'モード】に切り替えます。\n'
    +(next==='live'?'ここからの入力が本番の記録になります。\n':'記録はテスト用シートに戻ります。\n')
    +'よければ「'+word+'」と入力してください。');
  if(String(t||'').trim()!==word) return;
  gsr('setPosMode',next,(typeof LOGIN!=='undefined'?LOGIN:'')).then(function(r){
    BM_MODE=(r&&r.mode)||next; bmLoad(); bmPull(); bmRender();
  }).catch(function(e){ alert('切り替えできませんでした：'+(e&&e.message||'通信エラー')); });
}
/* 伝票の下書きを取り出す（無ければ初期セット1本＝TRUSTが卓を開いた時に既定を自動投入するのと同じ） */
/* お客様n人ぶんのセット行を作る。⚠️単価は**客ごと**に持つ＝同じ席でも女性が混ざると単価が変わるため（ボス談） */
function bmNewGuests_(n){ var a=[],k=Math.max(1,Number(n)||1); for(var i=0;i<k;i++) a.push({price:BM_FEE.set}); return a; }
function bmGet(key,defPax){
  if(!BM.draft[key]) BM.draft[key]={guests:bmNewGuests_(defPax),casts:{},castSel:[],welcome:[],orders:[],discount:0,surcharge:0,pay:{cash:0,card:0,credit:0}};
  var d=BM.draft[key];
  // 端末に残った下書きを壊さないための移行：①sets配列(延長があった頃) → ②setPax/setUnit → ③guests(現行)
  if(d.sets){ d.setPax=d.sets.length||1; d.setUnit=(d.sets[0]&&Number(d.sets[0].price))||BM_FEE.set; delete d.sets; }
  if(d.setPax!=null||d.setUnit!=null){
    var np=Math.max(1,Number(d.setPax)||1), nu=(d.setUnit==null?BM_FEE.set:Number(d.setUnit)||0);
    d.guests=[]; for(var i=0;i<np;i++) d.guests.push({price:nu});
    delete d.setPax; delete d.setUnit;
  }
  if(!d.guests||!d.guests.length) d.guests=bmNewGuests_(defPax);
  if(!d.casts)d.casts={}; if(!d.orders)d.orders=[]; if(!d.pay)d.pay={cash:0,card:0,credit:0};
  if(d.pay.next==null)d.pay.next=0;
  if(!d.welcome)d.welcome=[];   // 🥂ウェルカム（無料）。古い下書きにも足す
  bmSeedTantou_(key,d);
  bmSeedCarry_(key,d);
  return d;
}
/* お客様に紐づく担当キャストを**伝票の担当に既定で乗せる**（ボス指示）。
   ⚠️1回だけ＝黒服が外したら戻ってこない（毎回入れ直すと消せない担当になる）。
   ⚠️席がまだ読めていない間はフラグを立てない＝次の描画で必ず入る。
   ⚠️担当は出勤していない場合もある＝候補が出勤者に限られていてはいけない（bmCastPool参照）。 */
function bmSeedTantou_(key,d){
  if(d.tantouSeeded) return;
  var b=bmBills().filter(function(x){ return String(x.rowIdx)===String(key); })[0];
  if(!b||b.gone) return;               // SEATS未取得／退店済み＝ここで上書きしない
  d.tantouSeeded=1;
  d._table=bmTblLabel_(b.floor,b.table);   // 閉店ゲートの一覧で「どの卓か」を出すため
  d._cust=String(b.cust||'');
  var nm=String(b.tantou||'').trim();
  if(!nm) return;
  if(!d.tantou) d.tantou=nm;           // ③担当カードの既定値
  if(!d.casts[nm]) d.casts[nm]={tanto:0,yoyaku:0,dohan:0};
  if(!(d.casts[nm].tanto>0)) d.casts[nm].tanto=1;
  if(!Array.isArray(d.castSel)) d.castSel=[];
  if(d.castSel.indexOf(nm)<0) d.castSel.unshift(nm);
}
/* ⚠️席名にフロアが入っていることがある（"2F BOX1"）＝素直に連結すると「2F 2F BOX1」になる。
   伝票一覧・伝票の印字・閉店ゲートで同じ崩れを3回踏んだので**1箇所に寄せる**。 */
/* 📅前回の未収を伝票へ自動で乗せる（ボス指示＝次回の伝票に自動的に前回分が追加される）。
   ⚠️出所は**顧客の「次回対応メモ」**に書いた【次回精算】タグ。予約行に nextMemo として届く。
   ⚠️担当のシードと同じで**1回だけ**（d.carrySeeded）＝黒服が外したら戻らない。
   ⚠️メモは人が手で編集する場所＝タグが壊れていたら金額を拾わない（黙って0にしない）。 */
function bmCarryParse_(memo){
  var m=String(memo||'').match(/【次回精算】\s*¥?\s*([0-9,]+)/);
  if(!m) return 0;
  var n=Number(String(m[1]).replace(/,/g,''))||0;
  return n>0?n:0;
}
function bmRsvOf_(key){
  var L=(typeof RSV!=='undefined'&&RSV)?RSV:[];
  for(var i=0;i<L.length;i++) if(String(L[i].rowIdx)===String(key)) return L[i];
  return null;
}
function bmSeedCarry_(key,d){
  if(d.carrySeeded) return;
  var r=bmRsvOf_(key); if(!r) return;              // 予約行がまだ届いていない＝次の描画で入る
  d.carrySeeded=1;
  var amt=bmCarryParse_(r.nextMemo);
  if(amt>0) d.carry={ amount:amt, memo:String(r.nextMemo||'') };
}
function bmCarryDrop(){
  if(bmLockedAlert_()) return;
  var d=bmGet(BM.key); if(!d.carry) return;
  if(!confirm('前回のお預かり '+bmYen(d.carry.amount)+' をこの伝票から外します。\n（顧客メモの記録は残ります＝次回また出ます）')) return;
  delete d.carry; bmSave(); bmRender();
}
function bmTblLabel_(floor,table){
  var t=String(table||''), f=String(floor||'');
  return ((f&&t.indexOf(f)!==0)?(f+' '+t):t).trim();
}
/* ホール状況の組（occupants）＝いま席にいる伝票。席ではなく組で並べる（相席は2件出る） */
function bmBills(){
  var out=[];
  // 🧪お試し伝票＝席に紐づかない検算用。**GASの応答を1回も待たずに**金額テストを始められる
  if(BM.draft&&BM.draft['demo']) out.push({rowIdx:'demo',table:'お試し',floor:'🧪',cust:'テスト伝票',pax:1,tantou:'',demo:true});
  (typeof SEATS!=='undefined'?SEATS:[]).forEach(function(s){
    if(!s||s.type==='W'||s.type==='K'||s.mergedTo!=null) return;
    (s.occupants||[]).forEach(function(o){
      if(!o||!o.rowIdx) return;
      out.push({rowIdx:o.rowIdx,table:shortNm(s.name),floor:s.floor,cust:o.cust||s.cust||'ご来店',pax:o.pax||s.pax||1,tantou:o.tantou||s.tantou||'',
                member:o.member||s.member||'',inT:o.inT||o.inTime||s.inT||s.inTime||''});   /* 店舗控え用。無ければ出さない */
    });
  });
  /* ⚠️**退店して席から消えた組の伝票**も出す。席(SEATS)だけを見ていると、未会計のまま
     お客様が帰った瞬間にその伝票へ二度と触れなくなる＝閉店ゲートが「開く」と言っても開けない。 */
  var seen={}; out.forEach(function(x){ seen[String(x.rowIdx)]=1; });
  Object.keys(BM.draft||{}).forEach(function(k){
    if(k==='demo'||seen[k]) return;
    var d=BM.draft[k]||{};
    if(!d.guests||!d.guests.length) return;
    out.push({rowIdx:k,table:(d._table||'伝票'+k),floor:'🚪',cust:(d._cust||'退店済み'),
              pax:(d.guests||[]).length,tantou:d.tantou||'',member:'',inT:'',gone:true});
  });
  return out;
}
/* 注文の帰属候補（ボス指示）＝**お客様／今日出勤のキャスト／黒服名／派遣**。
   ⚠️「スタッフ」という総称は廃止（誰の売上か分からない行を作らせない）。
   ⚠️派遣キャストは**個別名を出さず「派遣」1つに集約**する（castKubun()で判別）。 */
function bmAttrPool(){
  var casts=[],kuro=[],seen={};
  /* ⚠️まず**この伝票で選ばれているキャスト**を先頭に。出勤していない担当が付いた伝票でも
     その担当に注文を付けられるようにするため（出勤者だけの候補だと付けられない） */
  if(BM.key){
    bmCastShown(bmGet(BM.key)).forEach(function(nm){
      nm=String(nm||'').trim(); if(nm&&!seen[nm]){ seen[nm]=1; casts.push(nm); }
    });
  }
  var pool=(typeof WORKCASTS!=='undefined'&&WORKCASTS&&WORKCASTS.length)?WORKCASTS:(typeof CASTS!=='undefined'?CASTS:[]);
  pool.forEach(function(nm){
    nm=String(nm||'').trim(); if(!nm||seen[nm]) return;
    if(typeof castKubun==='function'&&castKubun(nm)==='派遣') return;   // 個別名は出さない
    seen[nm]=1; casts.push(nm);
  });
  // 在席の黒服（黒服席）＋いま軍師にログインしている本人
  (typeof SEATS!=='undefined'?SEATS:[]).forEach(function(s2){
    if(!s2||s2.type!=='K') return;
    (s2.casts||[]).forEach(function(c){ var nm=String(c.n||'').trim(); if(nm&&!seen[nm]){ seen[nm]=1; kuro.push(nm); } });
  });
  if(typeof LOGIN!=='undefined'&&LOGIN&&!seen[LOGIN]){ seen[LOGIN]=1; kuro.push(LOGIN); }
  return { casts:casts, kuro:kuro };
}
/* ③キャストの候補。⚠️**出勤者だけに絞らない**＝出勤していない担当のお客様が来店することがある（ボス談）。
   出勤を先頭、それ以外を「出勤外」として後ろに出す（普段の選びやすさは落とさない）。 */
function bmCastPool(){
  var work=[],rest=[],seen={};
  ((typeof WORKCASTS!=='undefined'&&WORKCASTS)?WORKCASTS:[]).forEach(function(n){
    n=String(n||'').trim(); if(n&&!seen[n]){ seen[n]=1; work.push(n); }
  });
  (typeof CASTS!=='undefined'?CASTS:[]).forEach(function(n){
    n=String(n||'').trim(); if(n&&!seen[n]){ seen[n]=1; rest.push(n); }
  });
  return { work:work, rest:rest, all:work.concat(rest) };
}
/* 🔥 計算エンジン。⚠️backendの posCalcTotal_ と**同じ式**であること（片方だけ直すと必ず割れる） */
function bmCalc(d){
  var setSum=(d.guests||[]).reduce(function(a,g){return a+(Number(g.price)||0);},0);   // セット＝お客様ごとの単価の合計
  var tc=0,yc=0,dc=0;
  Object.keys(d.casts).forEach(function(n){ var v=d.casts[n]||{}; tc+=v.tanto||0; yc+=v.yoyaku||0; dc+=v.dohan||0; });
  var ordSum=d.orders.reduce(function(a,o){return a+o.price*o.qty;},0);
  var base=setSum+tc*BM_FEE.tanto+yc*BM_FEE.yoyaku+dc*BM_FEE.dohan+ordSum;
  var tax=Math.floor(base*BM_FEE.service);
  /* ⚠️ボス確定(2026-08-08)＝**値引・値増は税サの後**。税サは値引前の小計に掛ける */
  var raw=base+tax-(Number(d.discount)||0)+(Number(d.surcharge)||0);
  var total=BM_FEE.roundUnit>0?Math.ceil(raw/BM_FEE.roundUnit)*BM_FEE.roundUnit:raw;
  /* ⚠️2026-08-28ボス指示＝**次回来店時払い**。
     `carry`＝前回の未収。**請求(due)にだけ足し、売上(total)には足さない**。
     前回の会計で total として既に売上計上しているので、次回また売上に乗せると**二重計上**になる。
     次回にやるのは「回収」＝お客様が払う額が増えるだけ。
     `pay.next`＝今回の請求のうち次回に回す額。これも受け取ったものとして unpaid を埋める
     （締められないと現場が回らない。回収漏れは顧客メモと次回の自動投入で防ぐ）。 */
  var carry=Math.max(0,Number(d.carry&&d.carry.amount)||0);
  var next=Math.max(0,Number(d.pay.next)||0);
  var due=total+carry;
  var paid=(Number(d.pay.cash)||0)+(Number(d.pay.card)||0)+(Number(d.pay.credit)||0)+next;
  return {setSum:setSum,tc:tc,yc:yc,dc:dc,ordSum:ordSum,base:base,tax:tax,raw:raw,total:total,
          carry:carry,due:due,next:next,paid:paid,unpaid:due-paid};
}

/* 品名からマスタ行を引く。⚠️臨時商品はマスタに無いのでnull＝ボトル判定しない */
/* 📦在庫との連携（**読み取り専用**）。ボス指示＝実際の在庫はいじらない状態で連携する。
   既存API `getStockList`（GUNSHI_API_FNS登録済み）を1回だけ読み、出庫後の残数を**表示するだけ**。
   ⚠️書き込みは一切しない。実際に減らすのはbackend実装＋ボスの号令のあと。 */
var BM_STOCK=null, BM_STOCK_ERR='';
function bmNorm_(s){ return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　・,、。()（）「」【】\-ー_\/／\\]/g,''); }
function bmLoadStock(){
  if(BM_STOCK!==null||BM_STOCK==='loading') return;
  BM_STOCK='loading';
  gsr('getStockList').then(function(list){
    BM_STOCK=Array.isArray(list)?list:[]; bmRenderIfIdle();
  }).catch(function(e){ BM_STOCK=[]; BM_STOCK_ERR='在庫を取得できませんでした'; bmRenderIfIdle(); });
}
/* POS品名→在庫品名は**完全一致のみ**。⚠️あいまい照合は「山崎」と「山崎12年」を同じ物と誤判定する
   （[[project_menu_drop_status]]で実データ50品で確認済みの地雷）。一致しなければ「未登録」と出す。 */
function bmStockOf(name){
  if(!BM_STOCK||BM_STOCK==='loading') return null;
  var k=bmNorm_(name), hit=[];
  BM_STOCK.forEach(function(it){ if(bmNorm_(it.name)===k) hit.push(it); });
  if(!hit.length) return null;
  return { name:hit[0].name, qty:hit.reduce(function(a,x){ return a+(Number(x.qty)||0); },0),
           floors:hit.map(function(x){ return (x.floor||'')+' '+(Number(x.qty)||0); }) };
}

/* 🍾今日出たボトル＝端末の全伝票の下書きを横断して「ボトル系」だけ集計する。
   ⚠️在庫の自動マイナスと発注はbackend（GAS）が要る＝ここは**本数の可視化まで**。
      在庫へ流すには POS品名 → 在庫品名 の紐づけが必要（既存の`店舗メニュー`シートの仕組みを使う）。 */
function bmBottlesToday(){
  bmLoad();
  var bills=bmBills(), map={}, order=[], total=0, amount=0;
  Object.keys(BM.draft).forEach(function(key){
    /* ⚠️2026-08-28追加＝🧪お試し伝票（検算用）のボトルが在庫の出庫集計に乗っていた。
       締めで実物と合わなくなる＝共有もしない物は数えない。 */
    if(key==='demo') return;
    var d=BM.draft[key]; if(!d||!d.orders) return;
    var b=null; bills.forEach(function(x){ if(String(x.rowIdx)===String(key)) b=x; });
    var where=b?((b.floor||'')+' '+(b.table||'')):(key==='demo'?'🧪お試し':'伝票'+key);
    d.orders.forEach(function(o){
      var it=bmItem_(o.name);
      // 在庫上「ボトル」に丸まる物＋**都度開封の単品**（Wビール等）。グラスは入らない
      if(!it) return;
      if(BM_GENRE_STOCK[it[3]]!=='ボトル'&&!BM_OPEN_ALWAYS[o.name]) return;
      if(!map[o.name]){ map[o.name]={name:o.name,qty:0,amount:0,where:[]}; order.push(o.name); }
      map[o.name].qty+=o.qty; map[o.name].amount+=o.price*o.qty; map[o.name].where.push(where);
      total+=o.qty; amount+=o.price*o.qty;
    });
    /* 🥂ウェルカムの「開封あり」も同じ表に混ぜる＝在庫から見れば有料も無料も同じ1本。
       ⚠️金額は0（無料）なので合計金額は動かない。品名は有料側と同名で合算＝在庫照合の名前を壊さない */
    (d.welcome||[]).forEach(function(w){
      if(!w||!w.stock||!(w.qty>0)) return;
      if(!map[w.name]){ map[w.name]={name:w.name,qty:0,amount:0,where:[]}; order.push(w.name); }
      map[w.name].qty+=w.qty; map[w.name].where.push(where+'(🥂)');
      total+=w.qty;
    });
  });

  return { list:order.map(function(nm){return map[nm];}), total:total, amount:amount };
}
