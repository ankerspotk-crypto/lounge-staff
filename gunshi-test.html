/* ============ HELPERS ============ */
function tmin(hhmm){var p=String(hhmm).split(':');var h=parseInt(p[0]);if(h<6)h+=24;return h*60+(parseInt(p[1])||0);}
function fmtTime(hhmm){var p=String(hhmm).split(':');var h=parseInt(p[0]);return h>=24?('翌'+(h-24)+':'+p[1]):hhmm;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var TAGLABEL={vip:'VIP',bottle:'🍶ボトル',bday:'🎂誕生日',ng:'⚠NG'};
function parseKey(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function dateLabel(s){var d=parseKey(s);var w=['日','月','火','水','木','金','土'][d.getDay()];return (d.getMonth()+1)+'/'+d.getDate()+'（'+w+'）';}
function shortNm(n){return n.replace('カウンター','カウ').replace('ボックス','BOX');}
function seatIdx(s){return SEATS.indexOf(s);}
function seatStatus(s){if(s.type==='W')return 'waiting';if(s.type==='K')return 'kurofuku';if(!s.casts||!s.casts.length)return s.cust?'nocast':'empty';if(s.casts.some(function(c){return c.status==='over';}))return 'over';if(s.casts.some(function(c){return c.status==='warn';}))return 'warn';return 'ok';}
function overMins(s){return -Math.min.apply(null,s.casts.map(function(c){return c.mins;}));}
function warnMin(s){return Math.min.apply(null,s.casts.filter(function(c){return c.status==='warn';}).map(function(c){return c.mins;}));}

/* ============ CLOCK / DATE ============ */
function tickClock(){var d=new Date();var hh=('0'+d.getHours()).slice(-2),mm=('0'+d.getMinutes()).slice(-2);document.getElementById('clock').innerHTML='<b>'+hh+':'+mm+'</b><span class="upd"><br>更新 '+hh+':'+mm+'</span>';}
function shiftDay(n){var d=parseKey(curDate);d.setDate(d.getDate()+n);curDate=fmtKey(d);renderAll();}
function goToday(){curDate=TODAY;renderAll();}

/* ============ ALERT BAR ============ */
function nowBizMin(){var n=new Date();var h=n.getHours();if(h<6)h+=24;return h*60+n.getMinutes();}
// 同伴予約は20:30来店として扱う（顧客名に「同伴」を含む予約が対象）
function rsvArrT(r){return /同伴/.test((r.cust||r.customer||'')+' '+(r.time||''))?'20:30':(r.time||'');}
// 遅延分は「表示中の営業日(curDate)の予約時刻」からの実経過で測る。nowBizMin()だけで
// 測ると、深夜0〜6時に翌営業日を表示した際、未来の予約が「◯分超過」と誤検知される
// （例: 00:09に翌7/20を表示すると20:30予約が219分超過と出た）。0〜5時の予約は営業日の翌暦日。
function rsvLateMin(r){var hhmm=rsvArrT(r);var p=String(hhmm).split(':');var h=parseInt(p[0]);if(isNaN(h))return NaN;var mi=parseInt(p[1])||0;var d=parseKey(curDate);if(h<6)d.setDate(d.getDate()+1);d.setHours(h,mi,0,0);return Math.round((Date.now()-d.getTime())/60000);}
// 退店予定（チェック予定）超過の分。rsvLateMinと同じくcurDate基準＝深夜0〜5時に翌営業日を表示しても誤発火しない。
function rsvLeaveLateMin(r){var hhmm=String((r&&r.checkTime)||'');if(!/^\d{1,2}:\d{2}$/.test(hhmm))return NaN;var p=hhmm.split(':');var h=parseInt(p[0]);var mi=parseInt(p[1])||0;var d=parseKey(curDate);if(h<6)d.setDate(d.getDate()+1);d.setHours(h,mi,0,0);return Math.round((Date.now()-d.getTime())/60000);}
function buildTimeline(){
  var t=[];
  // 今：来店予定を15分超過（確定・未来店）→ 担当に来店確認（赤点滅）
  RSV.forEach(function(r){ if(r.status!=='確定')return; var late=rsvLateMin(r); if(late>=15) t.push({g:0,kind:'now-crit',blink:true,ic:'🕘',time:'今',min:-1000-late,title:r.cust+'様 来店'+late+'分超過',sub:(r.tantou?'担当 '+r.tantou+' に来店確認':'担当に来店確認')+'（'+rsvArrT(r)+'予約）',act:'editRsv('+r.id+')'}); });
  // 今：チェック予定を超過（来店済み・退店操作なし）→ 退店 or 延長の確認
  RSV.forEach(function(r){ if(r.status!=='来店済み'||!r.checkTime)return; var ov=rsvLeaveLateMin(r); if(!isNaN(ov)&&ov>=5) t.push({g:1,kind:'now-leave',ic:'🕛',time:'今',min:-500-ov,title:r.cust+'様 チェック予定'+ov+'分超過',sub:'退店操作なし（'+esc(r.checkTime)+'予定）→ 退店 or 延長確認',act:'editRsv('+r.id+')'}); });
  // 今：超過
  SEATS.forEach(function(s,idx){
    var st=seatStatus(s);
    if(st==='over') t.push({g:0,kind:'now-crit',ic:'🔴',time:'今',min:-overMins(s),title:s.floor+' '+shortNm(s.name)+' '+s.cust,sub:overMins(s)+'分超過',act:'openSeat('+idx+')'});
  });
  // 🚷 今：同じフロアに居合わせてはいけないお客様が居る（ボス確定＝判定はフロア単位）。
  //    通信ゼロ＝いま画面が持っている席と予約から出す。backend(gunshiNgBoard)と同じ判定。
  ngFloorConflictsLocal().forEach(function(cf){
    t.push({g:0,kind:'now-ng',blink:true,ic:'🚷',time:'今',min:-2000,
      title:cf.a.cust+'様 と '+cf.b.cust+'様 が同じ'+cf.floor,
      sub:cf.a.seat+' と '+cf.b.seat+'・同席NG',act:'openSeatByCode(\''+jsStr(cf.a.code)+'\')'});
  });
  // 今：付け回し要
  ROT.forEach(function(c){if(!isMulti(c))return;var w=worstWait(c),iv=rotInterval(c);if(w&&(w.alert||(w.wait||0)>=iv))t.push({g:1,kind:'now-rot',ic:'🔄',time:'今',min:-(w.wait||0),title:c.cast+' → '+w.key+' '+w.cust,sub:'抜けて'+(w.wait||0)+'分・付け回し',act:'switchRight(\'rot\')'});});
  // まもなく：超過が近い席
  SEATS.forEach(function(s,idx){if(seatStatus(s)==='warn')t.push({g:2,kind:'soon',ic:'⏰',time:'まもなく',min:warnMin(s),title:s.floor+' '+shortNm(s.name)+' '+s.cust,sub:'あと'+warnMin(s)+'分で超過',act:'openSeat('+idx+')'});});
  // 予告：席未定の予約（時刻までに席決定）※30分超過は上の対応チケットへ
  RSV.forEach(function(r){if(r.status==='確定'&&r.table==='未定'&&rsvLateMin(r)<15)t.push({g:3,kind:'todo',ic:'📌',time:rsvArrT(r),min:tmin(rsvArrT(r)),title:r.cust+'様('+r.pax+'名)',sub:'席未定 → 席を決定',act:'editRsv('+r.id+')'});});
  // 予告：来店予定（📅）は要対応から撤去（クラッタ削減・ユーザー要望 2026-07-09）。15分超過すると上の来店確認チケットに出る。
  // 予告：キャスト早上がり（実シフトデータ由来）
  SHIFT.forEach(function(s){if(s.hayaagari)t.push({g:3,kind:'preview-cast',ic:'🚪',time:s.hayaagari,min:tmin(s.hayaagari),title:s.name+' 早上がり',sub:'担当の引き継ぎ準備を',act:'switchRight(\'shift\')'});});
  // 予告：送り予定チケットは撤去（送り管理ボード/LINE送りサマリで十分・要対応キューの水増し防止 2026-07-08）
  t.sort(function(a,b){return a.g!==b.g?a.g-b.g:(a.min||0)-(b.min||0);});
  return t;
}
/* 内容が変わった時だけinnerHTMLを更新（30秒ごとの無駄な再描画＝ちらつき・スクロールリセットを防止） */
var _htmlCache={};
function setHtml(id,html){var el=document.getElementById(id);if(!el||_htmlCache[id]===html)return;_htmlCache[id]=html;el.innerHTML=html;}
var TASKS=[]; /* 要対応キュー（時間タスク＋呼び出し）。押して完了で消える */
function completeTask(id,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  TASKS=(TASKS||[]).filter(function(t){return t.id!==id;}); // 楽観的に除去
  renderAlerts(); renderHome();
  if(typeof toast==='function')toast('✅ 完了しました');
  if(IS_GAS) gsr('completeKioskTask',id).catch(function(){ loadAll(); });
}
/* 黒服タスクの全文詳細ポップアップ（チケットは1行省略されるため） */
function showTaskDetail(id){
  var t=(TASKS||[]).find(function(x){return x.id===id;}); if(!t)return;
  var body='<div class="tdetail">'
    +'<div class="td-title">'+esc(t.title)+'</div>'
    +(t.memo?'<div class="td-memo">'+esc(t.memo).replace(/\n/g,'<br>')+'</div>':'')
    +((t.by||t.at)?'<div class="td-meta">'+(t.by?'追加：'+esc(t.by):'')+(t.at?'　'+esc(t.at):'')+'</div>':'')
    +'<div class="td-actions"><button class="td-done" onclick="completeTaskFromDetail(\''+jsStr(id)+'\')">✅ 完了にする</button>'
    +(t.deferred?'':'<button class="td-close" onclick="closeSheet();cfDefer(\''+jsStr(id)+'\')">➡️ 明日へ持ち越す</button>')
    +'<button class="td-close" onclick="closeSheet()">閉じる</button></div></div>';
  showSheet('📋 タスク詳細',body,false);
}
function completeTaskFromDetail(id){ closeSheet(); completeTask(id); }

function applyFeeRenewal(id){
  if(!IS_GAS){ closeSheet(); toast('（ローカル）反映はスキップ'); return; }
  gsr('applyFeeRenewalTicket',id).then(function(r){
    if(r&&r.ok){ TASKS=(TASKS||[]).filter(function(t){return t.id!==id;}); closeSheet(); renderAlerts(); renderHome(); toast('✅ '+(r.cust||'お客様')+' の会費更新を反映しました'); }
    else { toast((r&&r.error)||'反映に失敗しました',true); }
  }).catch(function(){ toast('通信エラー',true); });
}
function feeRenewDismiss(id){
  closeSheet();
  TASKS=(TASKS||[]).filter(function(t){return t.id!==id;});
  renderAlerts(); renderHome(); toast('却下しました');
  if(IS_GAS) gsr('completeKioskTask',id).catch(function(){ loadAll(); });
}
function renderAlerts(){
  var list=buildTimeline();
  var q=TASKS||[];
  var nowCount=list.filter(function(x){return x.g<=1;}).length + q.length;
  var lead='<div class="alert-lead '+(nowCount?'busy':'calm')+'"><div class="big">'+(nowCount||'0')+'</div><div class="cap">要対応</div></div>';
  // キュー（時間タスク・呼び出し・黒服タスク）を先頭に。呼び出しは押すと完了、黒服タスクは押すと詳細ポップアップ
  var qHtml=q.map(function(t){
    if(t.type==='admin'){
      return '<div class="ticket k-task k-admin" onclick="showTaskDetail(\''+jsStr(t.id)+'\')">'
        +'<div class="tk-time">📋 タスク'+(t.by?'・'+esc(t.by):'')+'</div>'
        +'<div class="tk-body"><span class="tk-ic">'+esc(t.icon)+'</span><span class="tk-tx"><span class="tk-title">'+esc(t.title)+'</span><span class="tk-sub">タップで全文・完了</span></span></div>'
        +'<div class="tk-done">詳細 ›</div></div>';
    }
    if(t.type==='feerenew'){
      return '<div class="ticket k-task k-admin" onclick="showFeeRenewDetail(\''+jsStr(t.id)+'\')">'
        +'<div class="tk-time">💳 会費更新</div>'
        +'<div class="tk-body"><span class="tk-ic">'+esc(t.icon)+'</span><span class="tk-tx"><span class="tk-title">'+esc(t.title)+'</span><span class="tk-sub">タップで反映／却下</span></span></div>'
        +'<div class="tk-done">確認 ›</div></div>';
    }
    return '<div class="ticket k-task" onclick="completeTask(\''+jsStr(t.id)+'\',event)">'
      +'<div class="tk-time">'+esc(t.type==='call'?'呼出':(t.sub||''))+'</div>'
      +'<div class="tk-body"><span class="tk-ic">'+esc(t.icon)+'</span><span class="tk-tx"><span class="tk-title">'+esc(t.title)+'</span><span class="tk-sub">'+esc(t.type==='call'?(t.sub||'席へ'):'タップで完了')+'</span></span></div>'
      +'<div class="tk-done">✓完了</div></div>';
  }).join('');
  var tickets=list.map(function(x){
    return '<div class="ticket k-'+x.kind+(x.blink?' tk-blink':'')+'"'+(x.act?' onclick="'+x.act+'"':'')+'>'
      +'<div class="tk-time">'+esc(x.time)+'</div>'
      +'<div class="tk-body"><span class="tk-ic">'+x.ic+'</span><span class="tk-tx"><span class="tk-title">'+esc(x.title)+'</span><span class="tk-sub">'+esc(x.sub)+'</span></span></div></div>';
  }).join('');
  setHtml('alertbar',lead+'<div class="tl-scroll">'+((qHtml+tickets)||'<div class="alert-none">✓ タスクはありません</div>')+'</div>');
}

/* 既存の buildTimeline()/TASKS/SEATS/ROT/RSV/SHIFT を流用。加算のみ・既存ロジックは不変 */
var viewMode='dash';                 // 'home' | 'dash'。リロード時は必ずホール状況（見取り図）に戻す
var homePhaseOverride='';            // '' なら時刻で自動。'pre'/'mid'/'post' で手動固定
var HOME_STATUS={opening:false,cash:false};   // 開店/閉店チェックの提出状況（バックエンド由来）
/* 営業フェーズの境界（27時制・分）。店の営業時間に合わせて調整可 */
var PH_OPEN_MIN=18*60+30;   // これ以前＝開店前
var PH_CLOSE_MIN=24*60+30;  // これ以降＝閉店処理
function autoPhase(){var m=nowBizMin();if(m<PH_OPEN_MIN)return'pre';if(m>=PH_CLOSE_MIN)return'post';return'mid';}
function curPhase(){return homePhaseOverride||autoPhase();}

/* 手動チェックオフ（その日のみ・端末内保存）。開店/閉店チェックはバックエンド状況が優先 */
function homeCheckKey(){return 'gunshi_home_chk_'+curDate;}
function homeChecks(){try{return JSON.parse(localStorage.getItem(homeCheckKey())||'{}')||{};}catch(e){return{};}}
function toggleHomeCheck(id,ev){if(ev&&ev.stopPropagation)ev.stopPropagation();var c=homeChecks();c[id]=!c[id];try{localStorage.setItem(homeCheckKey(),JSON.stringify(c));}catch(e){}renderHome();}

function homeItemDone(it){return !!((it.status&&HOME_STATUS[it.status])||homeChecks()[it.id]);}

function setViewMode(m){
  viewMode=m;
  if(m==='home')hvCat='';   /* 業務メニューは必ず第1階層から。前の人が開いた階層を残さない */
  document.body.classList.toggle('home-on',m==='home');
  document.body.classList.toggle('bill-on',m==='bill');
  var h=document.getElementById('vt-home'),d=document.getElementById('vt-dash'),b=document.getElementById('vt-bill');
  if(h)h.classList.toggle('on',m==='home'); if(d)d.classList.toggle('on',m==='dash'); if(b)b.classList.toggle('on',m==='bill');
  if(m==='bill'){ bmRender(); if(typeof IS_GAS==='undefined'||IS_GAS!==false){ bmLoadStock(); bmPullStart(); } return; }   // 伝票管理は独自描画
  bmPullStop();   // 伝票管理から離れたら共有ポーリングを止める
  renderAll();
  // 既定がdashになったので、ホームの提出状況は起動時に読まれない。切替時に取りに行かないと
  // loadAll(30秒間隔)が来るまで開店/金銭チェックが「未提出」に誤表示される。
  if(m==='home'&&BOOTED){loadHandover();loadOrderAlerts();loadPunch();var ph=curPhase();if(ph==='pre'||ph==='post')loadHomeStatus();if(ph==='pre')loadOpeningPrep();if(ph==='post'){loadChecklistConfig();loadClosingFlow(false);}}
}
function setHomePhase(p){homePhaseOverride=p;renderHome();if(p==='pre'||p==='post')loadHomeStatus();if(p==='pre')loadOpeningPrep();if(p==='post')loadChecklistConfig();}
function gotoDash(tab){setViewMode('dash');if(tab)switchRight(tab);}   // ホーム→現場の該当タブへ

/* ===== 1日の進行バー（🌅開店前 → 🔥営業中 → 🌙閉店）＝黒服業務タブの背骨 =====
   ⭐タブを「3つのボタン」ではなく1日の流れとして読ませる＝各タブに 時間帯／そこで何をやるか／残り を載せる。
   ⚠️「選択中のフェーズ」と「いまの時刻のフェーズ」は別物。手動で他を見ている時に迷子にならないよう
     両方を示す（選択中＝色と太枠／いまの時刻＝●いま チップ）。
   ⛔状態行のために gsr を呼ぶな＝既にロード済みのグローバルだけを見る
     （GASは応答の床が1.9秒・ホームは30秒ごとに再描画される）。取れないフェーズは黙る＝0件と嘘をつかない。 */
var PHASE_DEF=[
  {p:'pre', em:'🌅', t:'開店前', job:'現金セット・仕込み'},
  {p:'mid', em:'🔥', t:'営業中', job:'付け回し・会計'},
  {p:'post',em:'🌙', t:'閉店',   job:'現金・日払い・締め'}   /* ⛔ここに「送り」を書くな＝送りは締めの工程から外れている（ボス確定 2026-08-26。締めの時点で送りはもう終わっている） */
];
/* 時間帯の文字は PH_OPEN_MIN/PH_CLOSE_MIN から出す＝定数を変えたら表示も自動で追従する（二重管理しない）。
   24時超えはそのまま「24:30」と出す＝営業日の感覚に合わせる（0:30と書くと前夜か翌夜か迷う）。 */
function phMinLabel_(m){ var h=Math.floor(m/60), mm=m%60; return h+':'+(mm<10?'0':'')+mm; }
function phaseSpan_(p){
  if(p==='pre') return '〜'+phMinLabel_(PH_OPEN_MIN);
  if(p==='mid') return phMinLabel_(PH_OPEN_MIN)+'〜'+phMinLabel_(PH_CLOSE_MIN);
  return phMinLabel_(PH_CLOSE_MIN)+'〜';
}
function phaseName_(p){ var n=''; PHASE_DEF.forEach(function(d){ if(d.p===p)n=d.t; }); return n; }
/* そのフェーズの残り。データが手元に無ければ '' ＝何も出さない。 */
function phaseStatLine_(p){
  try{
    if(p==='pre'){
      if(!OPPREP) return '';                                 /* 準備リスト未取得＝総数が確定しない */
      var t=1, d=(HOME_STATUS&&HOME_STATUS.opening)?1:0;     /* 1＝開店チェック（レジ現金） */
      OPPREP.items.forEach(function(it){
        if(it.common){ t+=1; if(it.c.done)d++; }
        else { t+=2; if(it.f2.done)d++; if(it.f5.done)d++; }
      });
      return (d>=t) ? '<span class="ok">✓ 準備OK</span>' : '残り '+(t-d)+'件';
    }
    if(p==='mid'){
      var n=(TASKS||[]).length;
      if(typeof buildTimeline==='function') n+=buildTimeline().filter(function(x){return x.g<=1;}).length;
      return n ? '対応待ち '+n+'件' : '<span class="ok">✓ 対応待ちなし</span>';
    }
    if(p==='post'){
      if(!CLOSE_FLOW||!CLOSE_FLOW.at) return '';             /* 閉店データを一度も読んでいない＝黙る */
      var left=cfSteps_().filter(function(x){return x.state!=='done';}).length;
      return left ? '残り '+left+'件' : '<span class="ok">✓ 退勤OK</span>';
    }
  }catch(e){ return ''; }
  return '';
}
function hvPhaseBar(cur){
  var real=autoPhase();
  var h='<div class="hv-phasebar">'+PHASE_DEF.map(function(d){
    var st=phaseStatLine_(d.p);
    return '<div class="hv-ptab'+(cur===d.p?' on '+d.p:'')+'" onclick="setHomePhase(\''+d.p+'\')">'
      +(real===d.p?'<span class="nowchip">●&nbsp;いま</span>':'')
      +'<span class="em">'+d.em+'</span>'
      +'<span class="nm">'+d.t+'</span>'
      +'<span class="sp">'+phaseSpan_(d.p)+'</span>'
      +'<span class="jb">'+d.job+'</span>'
      +(st?'<span class="stt">'+st+'</span>':'')
      +'</div>';
  }).join('')+'</div>';
  h+='<div class="hv-auto">'+(homePhaseOverride
    ? '✋ 手動で「'+phaseName_(cur)+'」を見ています（いまの時刻は「'+phaseName_(real)+'」）　'
      +'<span class="lnk" onclick="setHomePhase(\'\')">いまの時刻に戻す</span>'
    : '⏱ '+phMinLabel_(nowBizMin())+'　いまの時刻から「'+phaseName_(real)+'」を表示中（タブで切り替えられます）')
    +'</div>';
  return h;
}
function renderHomeMid(){

      if(t.type==='feerenew')return hvCard({ic:t.icon||'💳',title:t.title,sub:'タップで反映／却下',act:'showFeeRenewDetail(\''+jsStr(t.id)+'\')'},'call',false);
      return hvCard({ic:t.icon||'🔔',title:t.title,sub:t.type==='call'?(t.sub||'席へ'):'タップで完了',act:'completeTask(\''+jsStr(t.id)+'\',event)'},'call',false);

    +'<div class="hv-qbtn" onclick="gotoDash(\'rsv\')"><span class="em">📋</span><div class="t">予約'+(undecided?'<span class="bg">'+undecided+'</span>':'')+'</div></div>'
    +'</div>';
  var occ=SEATS.filter(function(s){var st=seatStatus(s);return st==='ok'||st==='warn'||st==='over'||st==='nocast';}).length;
  var emptyN=SEATS.filter(function(s){return seatStatus(s)==='empty';}).length;
  var working=(WORKCASTS!=null&&WORKCASTS.length!=null)?WORKCASTS.length:(SHIFT?SHIFT.length:0);
  h+='<div class="hv-mini">'

/* 🔢 TRUST入力の画面（締めワークフローの「TRUSTに日払い・経費を入力」から開く）
   ⚠️以前はここから閉店の現金画面へ飛ばしていた＝「TRUSTに入力」と書いてあるのにTRUSTと関係ない画面が出る、
   という導線の嘘だった（ボス指摘 2026-08-25）。この工程に必要なものだけをここに集める：

   自己申告は端末に営業日ごとで持ち、閉店チェックのゲートと共有する（別々に持つと片方だけONになる）。 */
function trustSelfKey_(){ var d=(CLOSE_FLOW&&CLOSE_FLOW.cash&&CLOSE_FLOW.cash.dateKey)||(cashState&&cashState.dateKey)||''; return 'trustSelf_'+d; }
function trustSelfGet_(){ try{ return localStorage.getItem(trustSelfKey_())==='1'; }catch(e){ return false; } }

  var kei=all.filter(function(x){return !/日払/.test(String(x.category||''));});

  var t=F.gate&&F.gate.today;
  var rows=function(list,empty){
    if(!list.length) return '<div style="font-size:12px;color:var(--dim);padding:4px 0">'+empty+'</div>';

    +'今日ぶんを <b style="color:#ffcf7a">TRUST</b> に入力してください。下は軍師が持っている伝票＝<b>これと同じ額</b>をTRUSTに入れます。</div>';
  h+='<div class="flabel">💴 日払い　<span style="color:var(--gold)">計 ¥'+sum(hib).toLocaleString()+'</span>（'+hib.length+'件）</div>'
    +'<div class="cc-slip">'+rows(hib,'今日の日払いはありません')+'</div>';
  h+='<div class="flabel">🧾 経費　<span style="color:var(--gold)">計 ¥'+sum(kei).toLocaleString()+'</span>（'+kei.length+'件）</div>'
    +'<div class="cc-slip">'+rows(kei,'今日の経費はありません')+'</div>';
  h+='<div class="act pri" style="margin-top:14px" onclick="openTrustSite()">🔗 TRUSTを開く</div>';

  // 突合の状態
  if(t&&t.hasTrust&&t.matched){
    h+='<div class="ck-banner ok" style="margin-top:14px">✅ TRUSTと一致しています'+(t.perPerson?'（人別）':'（合計）')
      +'<div style="font-size:11.5px;color:var(--dim);margin-top:3px">この工程は完了です</div></div>';
  }else if(t&&t.hasTrust){
    h+='<div class="ck-banner warn" style="margin-top:14px">⚠️ TRUSTと合っていません'
      +'<div style="font-size:12px;margin-top:5px;line-height:1.6">'+(t.lines||[]).map(esc).join('<br>')+'</div>'
      +'<div style="font-size:11.5px;color:var(--dim);margin-top:5px">TRUSTを直したら「🔄 取り直す」で再確認してください</div></div>'
      +'<div class="act" style="margin-top:8px" onclick="loadClosingFlow(true);setTimeout(trustEntryRefresh_,1200)">🔄 取り直す</div>';
  }else{
    var on=trustSelfGet_();
    h+='<div style="border:2px solid '+(on?'#3ea06a':'#e05050')+';background:'+(on?'rgba(62,160,106,.12)':'rgba(224,80,80,.10)')+';border-radius:12px;padding:12px 14px;margin-top:14px">'
      +'<label style="display:flex;gap:11px;align-items:flex-start;cursor:pointer">'
      +'<input type="checkbox" '+(on?'checked':'')+' style="width:22px;height:22px;margin-top:1px;flex:0 0 auto;accent-color:#3ea06a" onchange="trustSelfSet_(this.checked);trustEntryRefresh_()">'
      +'<span style="font-size:14.5px;font-weight:700;color:var(--txt);line-height:1.45">TRUSTに入力しました'
      +'<div style="font-size:11.5px;font-weight:400;color:var(--dim);margin-top:3px">TRUSTの数字はまだ取り込めていません。今夜はこの申告で進めますが、<b style="color:#ffcf7a">翌日の取り込みで必ず突き合わせます</b>（合わなければ翌日の閉店が止まります）。</div></span>'
      +'</label></div>';
  }
  h+='<div class="act" style="margin-top:10px" onclick="closeSheet()">閉じる</div>';
  return h;
}

/* --- 💴 日払いの不明分（まとめて仕訳） -------------------------------------
   ボス指示 2026-08-26。受取人が空欄／名簿にも名寄せにも無い伝票を月ごとに一覧し、その場で仕訳する。
   ⚠️直し方が2通りあり意味が違う（画面でも言い分ける）：
     A「この表記のままでOK」→ 名寄せに登録＝以後この表記は自動で寄る（本名署名など・根治）
     B「表記を直す」        → 受取人セルを書き換え（OCR誤読・空欄）＋必要なら名寄せも登録
   金額はここでは触らない（金額の訂正は閉店チェックの伝票欄）。 */
var HBU=null, HBU_MONTH='', HBU_BUSY={};   /* ⚠️busyは行ごとに持つ。1つのフラグを全カードで共有すると、
   GASの応答(床1.9秒)の間に別のカードを押しても【黙って何も起きない】＝現場では固まったように見える。 */
function openHibaraiUnknown(ym){
  closeMenu();
  HBU_MONTH=ym||HBU_MONTH||'';
  showSheet('💴 日払いの不明分','<div class="empty-msg">読み込み中...</div>',false);
  if(!IS_GAS){ var b0=document.getElementById('sheetBody'); if(b0)b0.innerHTML='<div class="empty-msg">（ローカル）本番でご確認ください</div>'; return; }
  gsr('getHibaraiUnknown',HBU_MONTH).then(function(r){
    if(!r||r.ok===false){ var b1=document.getElementById('sheetBody'); if(b1)b1.innerHTML='<div class="empty-msg">'+esc((r&&r.error)||'読み込みエラー')+'</div>'; return; }
    HBU=r; if(!HBU_MONTH&&(r.months||[]).length) HBU_MONTH=r.months[0];
    hbuRender();
  }).catch(function(){ var b2=document.getElementById('sheetBody'); if(b2)b2.innerHTML='<div class="empty-msg">通信エラー</div>'; });
}
function hbuMonth(v){ HBU_MONTH=v; openHibaraiUnknown(v); }
function hbuRender(){
  var b=document.getElementById('sheetBody'); if(!b||!HBU)return;
  var rows=HBU.rows||[], months=HBU.months||[];
  var sum=rows.reduce(function(t,x){return t+Number(x.amount||0);},0);
  var opts=months.map(function(m){return '<option value="'+esc(m)+'"'+(m===HBU_MONTH?' selected':'')+'>'+esc(m)+'</option>';}).join('');
  var h='<div class="toolbar"><span class="cnt">対象月</span>'
    +'<select class="finput" style="width:130px;margin:0" onchange="hbuMonth(this.value)">'+opts+'</select>'
    +'<span class="cnt">'+rows.length+'件 ・ 計 ¥'+sum.toLocaleString()+'</span></div>';
  if(!rows.length){
    h+='<div class="ck-banner ok">✅ この月の不明分はありません</div>';
    b.innerHTML=h+hbuGuide(); return;
  }
  h+='<div style="font-size:12px;color:var(--dim);line-height:1.6;margin:8px 0">'
    +'受取人が分からない日払い伝票です。<b>誰の日払いか決まらないとTRUSTと突き合わせられず、給与の控除も合いません。</b>'
    +'📷で受領書の署名を確認してから決めてください。</div>';
  h+=rows.map(hbuCard).join('');
  b.innerHTML=h+hbuGuide();
}
function hbuGuide(){
  return '<div style="font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.7;border-top:1px solid var(--line2);padding-top:10px">'
    +'<b>「この表記でOK」</b>＝署名どおりの表記です。誰のことかを選ぶと<b>名寄せに登録</b>され、次からこの表記は自動で寄ります（本名で署名する人はこれ）。<br>'
    +'<b>「表記を直す」</b>＝読み取りが間違っている・空欄のときに使います。受取人そのものを書き換えます。<br>'

function hbuCard(x){
  var id=x.rowIdx;
  var img=(x.img&&x.img!=='#')?'<a href="'+esc(x.img)+'" target="_blank" class="dp-img" style="padding:2px 8px">📷 受領書</a>':'<span class="dp-img" style="opacity:.4;padding:2px 8px">📷 なし</span>';

    +(x.payee?'<button class="bm-btn sm" style="border-color:#3ea06a;color:#8fe0ac" onclick="hbuKeep('+id+')">✅ この表記でOK（名寄せに登録）</button>':'')

function hbuSel_(id){ var s=document.getElementById('hbu-sel-'+id); return s?String(s.value||'').trim():''; }
function hbuMsg_(id,t,err){ var m=document.getElementById('hbu-msg-'+id); if(m){ m.style.color=err?'#ff9a9a':'#8fe0ac'; m.textContent=t; } }
/* A: 表記はそのまま＝名寄せに登録して根治 */
function hbuKeep(id){
  var to=hbuSel_(id);

  hbuSend_(id,'',to);

/* B: 表記そのものを直す（OCR誤読・空欄）。ついでに名寄せも登録できる */
function hbuRewrite(id){
  var cur=(HBU.rows||[]).filter(function(r){return r.rowIdx===id;})[0]||{};
  var to=hbuSel_(id);
  var def=to||cur.payee||'';
  var v=prompt('受取人を入力してください（受領書の署名どおりに）',def);
  if(v==null) return;
  v=String(v).trim();
  if(!v){ hbuMsg_(id,'受取人が空のままです',true); return; }
  hbuSend_(id,v,to);   // 選択があれば名寄せも同時に登録
}
function hbuSend_(id,text,to){
  if(HBU_BUSY[id]){ hbuMsg_(id,'保存中です。少しお待ちください'); return; }
  HBU_BUSY[id]=true;
  hbuMsg_(id,'保存中…');
  var by=(typeof LOGIN!=='undefined'&&LOGIN)?String(LOGIN):'';
  gsr('hibaraiResolveUnknown',id,text,to,by).then(function(r){
    delete HBU_BUSY[id];
    if(!r||r.ok===false){ hbuMsg_(id,(r&&r.error)||'保存に失敗しました',true); return; }
    var card=document.getElementById('hbu-'+id);
    if(card){
      card.style.opacity='.55';
      card.innerHTML='<div style="font-size:13px;color:#8fe0ac">✅ '+esc(r.payee||'')+(r.mapped?'　→ 名寄せ「'+esc(r.mapped)+'」に登録しました':'　（受取人を書き換えました）')+'</div>';
    }
    HBU.rows=(HBU.rows||[]).filter(function(x){return x.rowIdx!==id;});
    if(typeof toast==='function')toast('✅ 仕訳しました');
  }).catch(function(){ delete HBU_BUSY[id]; hbuMsg_(id,'通信エラー。もう一度押してください',true); });
}

/* ============================================================================
   📋 日報（TRUSTの「日報登録」を軍師へ持ち直したもの）
   ----------------------------------------------------------------------------
   ボス確定 2026-08-28：TRUSTを置き換える**正本**／初回からバック自動計算まで入れる。
   backend＝nippo.gs（getNippo / saveNippo / confirmNippo / reopenNippo）。

   ⭐設計の芯＝**黒服にゼロから打たせない**。
     出勤者はシフトから、時刻は打刻から、時給は名簿から、バックは売上から、日払いは伝票から。
     画面ですることは「確認して、違うところだけ直す」。ここが崩れたら日報は入力作業に戻る。
   ⚠️TRUSTの27列をそのまま横に並べない（iPadで読めない）。1人1枚のカードに畳んで、
     マイナス・ボーナスは0のとき閉じておく＝実データではほとんどが0。
   ⚠️ここの計算は backend の nippoCalcRow_ と**同じ式**。画面は速さのために持っているだけで、
     正本はサーバが計算し直す。ズレは tests/nippo の契約テストで機械検証している。
     ⛔片方だけ直すな。直したら必ず `node tests/nippo/run.js` を通すこと。
   ⚠️読み込みは「最後に投げた1本だけ採用」（連番）。busyフラグで塞ぐと日付を連打したときに
     永久「読み込み中」になる（[[reference_async_stale_guard_trap]]）。塞ぐのは保存だけ。
============================================================================ */
var NP=null, NP_DATE='', NP_SEQ=0, NP_BUSY=false, NP_DIRTY=false, NP_MORE={};

function npYen(n){ return '¥'+(Number(n)||0).toLocaleString(); }
/* 「¥1,000」「１０００」空欄 に耐える整数パース（backendの nippoYen_ と同じ規則） */
function npNum(v){
  if(v==null||v==='') return 0;
  var s=String(v).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/[，,¥￥円\s　]/g,'');
  var n=parseFloat(s); return isNaN(n)?0:Math.round(n);
}
function npHhmmMin(v){
  var s=String(v==null?'':v).trim().replace(/[０-９：]/g,function(c){return c==='：'?':':String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  var m=s.match(/^(\d{1,2})\s*:\s*(\d{1,2})$/); if(!m) return null;
  var h=parseInt(m[1],10), mi=parseInt(m[2],10);
  if(h>47||mi>59) return null;
  return h*60+mi;
}
/* ⚠️終了が開始より小さければ翌日跨ぎ。深夜営業なのでここが本線（20:30→00:00 は 3時間30分） */
function npWorkMin(start,end,adj){
  var a=npHhmmMin(start), b=npHhmmMin(end);
  if(a==null||b==null) return 0;
  var d=b-a; if(d<0) d+=24*60;
  d+=(Number(adj)||0);
  return d>0?d:0;
}
function npWorkLabel(m){ m=Number(m)||0; return m<=0?'なし':(Math.floor(m/60)+'時間'+(m%60)+'分'); }

function npBackCalc(t,c){
  var g=function(k){ return Number((t||{})[k])||0; };
  var parts=[
    {k:'tantoSub',t:'担当小計',pct:c.tantoPct,base:g('tantoSales'),amt:Math.round(g('tantoSales')*c.tantoPct/100)},
    {k:'dohanSub',t:'同伴小計',pct:c.dohanPct,base:g('dohanSales'),amt:Math.round(g('dohanSales')*c.dohanPct/100)},
    {k:'tanto', t:'担当',    cnt:g('tantoCnt'), unit:c.tantoYen, amt:g('tantoCnt')*c.tantoYen},
    {k:'yoyaku',t:'予約',    cnt:g('yoyakuCnt'),unit:c.yoyakuYen,amt:g('yoyakuCnt')*c.yoyakuYen},
    {k:'dohan', t:'同伴',    cnt:g('dohanCnt'), unit:c.dohanYen, amt:g('dohanCnt')*c.dohanYen},
    {k:'drink', t:'ドリンク',cnt:g('drinkCnt'), unit:c.drinkYen, amt:g('drinkCnt')*c.drinkYen},
    {k:'bottle',t:'ボトル',  cnt:g('bottleCnt'),unit:c.bottleYen,amt:g('bottleCnt')*c.bottleYen},
    {k:'food',  t:'フード',  cnt:g('foodCnt'),  unit:c.foodYen,  amt:g('foodCnt')*c.foodYen}
  ];
  var total=parts.reduce(function(s,p){return s+(Number(p.amt)||0);},0);
  return {total:total,parts:parts};
}
/* 1人ぶんの再計算。⛔backendの nippoCalcRow_ と同じ式にすること（契約テストで検証） */
function npCalcRow(r,conf){
  r.workMin=npWorkMin(r.start,r.end,r.adj);
  r.workText=npWorkLabel(r.workMin);
  r.jikan=Math.round(npNum(r.wage)*r.workMin/60);
  var auto=npBackCalc(r.tally,conf);
  var ov=(r.backOver===''||r.backOver==null)?null:npNum(r.backOver);
  r.backAuto=auto.total; r.backParts=auto.parts; r.backOver=ov;
  r.back=(ov==null)?auto.total:ov;
  r.minus=npNum(r.okuri)+npNum(r.kojin)+npNum(r.shukuhaku)+npNum(r.hayaagari);
  r.bonus=npNum(r.soge)+npNum(r.zangyo)+npNum(r.urihan)+npNum(r.unei);
  r.total=r.jikan+r.back+r.bonus;
  r.nokori=r.total-npNum(r.hibarai)-r.minus;
  return r;
}
function npTotals(){
  var s=function(f){ return (NP.rows||[]).reduce(function(t,r){return t+(Number(f(r))||0);},0); };
  var c=function(a){ return (a||[]).reduce(function(t,x){return t+npNum(x.amount);},0); };
  return { people:(NP.rows||[]).length, jikan:s(function(r){return r.jikan;}), back:s(function(r){return r.back;}),
           bonus:s(function(r){return r.bonus;}), minus:s(function(r){return r.minus;}),
           hibarai:s(function(r){return npNum(r.hibarai);}), total:s(function(r){return r.total;}),
           nokori:s(function(r){return r.nokori;}), cashIn:c(NP.cashIn), cashOut:c(NP.cashOut) };
}

/* 日付の足し引き（文字列のまま。Dateに通すとタイムゾーンで前日に化ける） */
function npShiftDate(d,n){
  var p=String(d).split('-');
  var x=new Date(+p[0],(+p[1])-1,+p[2]);
  x.setDate(x.getDate()+n);
  var mm=x.getMonth()+1, dd=x.getDate();
  return x.getFullYear()+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;
}
function npDateLabel(d){
  var p=String(d).split('-'); if(p.length<3) return d;
  var x=new Date(+p[0],(+p[1])-1,+p[2]);
  return (+p[1])+'月'+(+p[2])+'日('+['日','月','火','水','木','金','土'][x.getDay()]+')';
}

function openNippo(d){
  closeMenu();
  npGo(d||NP_DATE||(typeof TODAY!=='undefined'?TODAY:''),true);
}
/* 日付移動。⚠️直しかけを黙って捨てない＝確認してから動く */
function npGo(d,skipConfirm){
  if(!skipConfirm&&NP_DIRTY&&!confirm('保存していない変更があります。破棄して移動しますか？')) return;
  NP_DATE=d; NP_DIRTY=false; NP_MORE={};
  var seq=++NP_SEQ;
  showSheet('📋 日報','<div class="empty-msg">読み込み中...</div>','full');
  if(typeof IS_GAS!=='undefined'&&!IS_GAS){
    var b0=document.getElementById('sheetBody');
    if(b0)b0.innerHTML='<div class="empty-msg">（ローカル）本番/テスト環境でご確認ください</div>';
    return;
  }
  gsr('getNippo',d).then(function(r){
    if(seq!==NP_SEQ) return;                       // 連打された＝古い応答は捨てる（最後の1本だけ採用）
    var b=document.getElementById('sheetBody'); if(!b) return;
    if(!r||r.ok===false){ b.innerHTML='<div class="empty-msg">'+esc((r&&r.error)||'読み込みエラー')+'</div>'; return; }
    NP=r;
    (NP.rows||[]).forEach(function(x){ npCalcRow(x,NP.backConf); });
    npRender();
  }).catch(function(){
    if(seq!==NP_SEQ) return;
    var b2=document.getElementById('sheetBody');
    if(b2)b2.innerHTML='<div class="empty-msg">通信エラー。もう一度開いてください</div>';
  });
}
function npPrev(){ npGo(npShiftDate(NP_DATE,-1)); }
function npNext(){ npGo(npShiftDate(NP_DATE, 1)); }
function npPick(v){ if(/^\d{4}-\d{2}-\d{2}$/.test(v)) npGo(v); }

function npRender(){
  var b=document.getElementById('sheetBody'); if(!b||!NP) return;

  var lock=!!NP.locked;
  var h='';

  /* ── 日付と状態 ───────────────────────────────────────────── */
  h+='<div class="toolbar" style="flex-wrap:wrap;gap:8px">'
    +'<button class="bm-btn sm" onclick="npPrev()">◀ 前日</button>'

    +'<span style="font-size:15px;font-weight:800;color:var(--txt)">'+esc(npDateLabel(NP.date))+'</span>'
    +'<button class="bm-btn sm" onclick="npNext()">翌日 ▶</button>'
    +'<span style="flex:1"></span>'
    /* ⚠️どのシートに書かれるかは黒服にとって一番大事な情報＝必ず出す。
       ボス確定＝9/1から本番。それまでは練習であることが一目で分かるようにする。 */
    +(NP.isTest
       ? '<span class="np-chip" style="border-color:#7a3f10;color:#e6a35a">🧪 練習（'+esc(NP.liveFrom||'2026-09-01')+'から本番記録）</span>'
       : '<span class="np-chip" style="border-color:#3ea06a;color:#8fe0ac">📗 本番記録</span>')
    +'<span class="np-chip" style="'+(lock?'border-color:#3ea06a;color:#8fe0ac':'')+'">'+(lock?'🔒 確定済み':'✏️ 作成中')+'</span>'
    +'</div>';

  if(lock){
    h+='<div class="ck-banner ok" style="margin-bottom:10px">🔒 この日は確定済みです（'+esc(NP.fixedBy||'')+' '+esc(NP.fixedAt||'')+'）。直すには下の「確定を解除」を押してください。</div>';
  }

  /* ── その日の合計。⭐一番上に置く＝黒服が最後に見るのはこの数字 ── */
  h+='<div class="np-sum">'
    +npSumCell('出勤',t.people+'名')

    +npSumCell('残り支給額',npYen(t.nokori),'gold')
    +'</div>';

  /* ── バックの出典。⚠️どこから数えたかを必ず出す（混ざっていないことを黒服が見て分かる） ── */
  var srcTxt = NP.backSrc==='POS' ? '自社POSの会計から自動計算'
             : NP.backSrc==='TRUST伝票' ? 'TRUST取込の伝票から自動計算'
             : '売上の材料がまだありません（バックは0のまま。あとで取り込めば自動で入ります）';
  h+='<div class="np-note">🧮 バックの出典：<b>'+esc(srcTxt)+'</b>　'
    +'<span style="color:var(--dim)">単価＝予約 '+npYen(NP.backConf.yoyakuYen)+'/回・同伴 '+npYen(NP.backConf.dohanYen)+'/回'
    +(NP.backConf.tantoPct?'・担当小計 '+NP.backConf.tantoPct+'%':'')+'</span></div>';

  if(NP.slipHibaraiCount){
    var diff=t.hibarai-(Number(NP.slipHibaraiTotal)||0);
    h+='<div class="np-note" style="'+(diff?'border-color:#7a3020;color:#ff9a9a':'')+'">'
      +'💴 閉店チェックの日払い伝票 '+NP.slipHibaraiCount+'件 計'+npYen(NP.slipHibaraiTotal)
      +'　→　日報の日払い合計 '+npYen(t.hibarai)
      +(diff?'　⚠️ '+npYen(Math.abs(diff))+'の差があります':'　✅ 一致')+'</div>';
  }

  /* ── 人 ─────────────────────────────────────────────────── */
  if(!(NP.rows||[]).length){
    h+='<div class="empty-msg">この日の出勤者が見つかりません。シフトが入っているか確認してください</div>';
  }else{

  /* ── メモ ───────────────────────────────────────────────── */
  h+='<div class="np-sec"><div class="np-sec-h">📝 メモ</div>'

  /* ── 保存・確定 ─────────────────────────────────────────── */
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px;align-items:center;padding:0 2px">'
    +(lock

      : '<button class="bm-btn" id="np-save" style="border-color:#3ea06a;color:#8fe0ac" onclick="npSave()">💾 保存する</button>'
        +'<button class="bm-btn" onclick="npConfirm()">🔒 確定する</button>')
    /* ⚠️ここに flex:1 のスペーサーを入れて右端へ寄せると、最後の1文字が必ず切れる（実機で確認）。
       ボタンの隣に置く＝どの幅でも読める。 */
    +'<span id="np-msg" style="font-size:12px;color:var(--dim)">'
      +(NP.savedAt?'最終保存 '+esc(NP.savedAt)+'　'+esc(NP.savedBy||''):'まだ保存されていません')+'</span>'
    +'</div>'
    +'<div class="np-note" style="color:var(--dim)">「確定」＝この日の給与の素はこれで正しい、の宣言。'
    +'確定した日は解除するまで書き換えられません。</div>';

  b.innerHTML=h;
}
function npSumCell(label,val,tone){
  return '<div class="np-sum-c"><div class="np-sum-l">'+esc(label)+'</div>'
    +'<div class="np-sum-v"'+(tone==='gold'?' style="color:var(--gold)"':'')+'>'+esc(val)+'</div></div>';
}

function npCard(r,i){

    +'</div>';

    +'<span class="np-lbl">勤怠</span>'
    +'<input type="time" class="np-in np-time" value="'+esc(r.start||'')+'"'+dis+' onchange="npSet('+i+',\'start\',this.value)">'
    +'<span class="np-arrow">→</span>'
    +'<input type="time" class="np-in np-time" value="'+esc(r.end||'')+'"'+dis+' onchange="npSet('+i+',\'end\',this.value)">'
    +'<span class="np-lbl2">時間外</span>'

    +(slip?'<span class="np-calc'+(slip===hb?'':' warn')+'">伝票 '+npYen(slip)+(slip===hb?' ✅':' ⚠️ 食い違い')+'</span>':'')

    +'<button class="np-more" onclick="npMore('+i+')">'+(more?'▲ 閉じる':'▼ 内訳・マイナス・ボーナス')+'</button>'
    +'</div>';

  /* 0のときは畳んでおく＝実データではほとんどが0。開いた時だけTRUSTと同じ全項目を出す */

    h+='<div class="np-row np-sub">'
      +(r.minus?'<span class="np-lbl2">マイナス</span><b>-'+npYen(r.minus)+'</b>':'')

      +npMoney(i,'shukuhaku','宿泊代',r.shukuhaku,dis)+npMoney(i,'hayaagari','早上がり',r.hayaagari,dis)

      +' onchange="npSet('+i+',\'backOver\',this.value)">'

  }

  h+='<div class="np-foot">支給額合計 <b>'+npYen(r.total)+'</b>　−　日払い '+npYen(hb)

function npMoney(i,key,label,val,dis){

    +'<input type="tel" inputmode="numeric" class="np-in np-money" value="'+(npNum(val)||'')+'"'+dis

function npBackText(r){
  var live=(r.backParts||[]).filter(function(p){ return (p.cnt||p.base)&&(p.amt||p.cnt||p.base); });
  if(!live.length) return '<span style="color:var(--dim)">売上の材料なし</span>';
  return live.map(function(p){
    if(p.pct!=null) return esc(p.t)+' '+npYen(p.base)+'×'+p.pct+'% ＝ '+npYen(p.amt);
    return esc(p.t)+' '+p.cnt+'回×'+npYen(p.unit)+' ＝ '+npYen(p.amt);
  }).join('　/　')+'　自動計 <b>'+npYen(r.backAuto)+'</b>';
}
function npMore(i){ NP_MORE[i]=!NP_MORE[i]; npRender(); }

/* 値を1つ直す。⚠️再計算してから丸ごと描き直す＝合計とカードが食い違う状態を作らない */
function npSet(i,key,val){
  if(!NP||NP.locked) return;
  var r=NP.rows[i]; if(!r) return;
  if(key==='start'||key==='end') r[key]=String(val||'');

  else r[key]=Math.max(0,npNum(val));   /* ⚠️金額は0以上に丸める（負号で二重に引かれるのを防ぐ） */
  npCalcRow(r,NP.backConf);
  NP_DIRTY=true;

/* 保存＝ここだけ二重送信を塞ぐ。⚠️成功でも失敗でも必ずフラグを戻す（塞ぎっぱなしで押せなくなる） */
function npSave(cb){
  if(!NP||NP.locked) return;
  /* ⛔まだ来ていない営業日は保存させない（サーバも弾くが、画面で止めた方が親切）。
     テスト期間中に未来日を開いて保存すると、練習のデータが本番シートに入る。 */
  if(typeof TODAY!=='undefined' && TODAY && NP.date > TODAY){
    npMsg('まだ来ていない営業日は保存できません（'+NP.date+'）',true); return;
  }
  if(NP_BUSY){ npMsg('保存中です。少しお待ちください'); return; }
  NP_BUSY=true;
  var btn=document.getElementById('np-save'); if(btn){ btn.disabled=true; btn.style.opacity='.5'; }
  npMsg('保存中…');
  var by=(typeof LOGIN!=='undefined'&&LOGIN)?String(LOGIN):'';
  var payload={ dateKey:NP.date, by:by, memo:NP.memo||'', backSrc:NP.backSrc||'',
    rows:(NP.rows||[]).map(function(r){
      return { name:r.name, kubun:r.kubun, start:r.start, end:r.end, adj:r.adj, wage:r.wage,
               hibarai:r.hibarai, okuri:r.okuri, kojin:r.kojin, shukuhaku:r.shukuhaku, hayaagari:r.hayaagari,
               soge:r.soge, zangyo:r.zangyo, urihan:r.urihan, unei:r.unei,
               backOverride:(r.backOver==null?'':r.backOver), tally:r.tally };
    }),
    cashIn:NP.cashIn||[], cashOut:NP.cashOut||[] };
  gsr('saveNippo',payload).then(function(res){
    NP_BUSY=false;
    if(btn){ btn.disabled=false; btn.style.opacity=''; }
    if(!res||res.ok===false){ npMsg((res&&res.error)||'保存に失敗しました',true); return; }
    NP_DIRTY=false;
    NP.savedAt=res.savedAt; NP.savedBy=res.savedBy;
    npMsg('✅ 保存しました　'+res.savedAt);
    if(typeof toast==='function') toast('✅ 日報を保存しました');
    if(cb) cb();
  }).catch(function(){
    NP_BUSY=false;
    if(btn){ btn.disabled=false; btn.style.opacity=''; }
    npMsg('通信エラー。もう一度押してください',true);
  });
}

/* --- 🌙 締めワークフロー（閉店の入口をここ1つにする） ------------------------
   ボス指示 2026-08-25:「入口を一箇所に。順番が多少変わっても、締めが全部完了しないと帰れない」。
   これまで閉店の作業はランチャーが4つ並ぶだけで、チェックは端末のlocalStorage＝実態と無関係だった。
   ここでは**機械が見られるものは機械が見て**、残り件数と「帰れるかどうか」を一番上に大きく出す。
   ⚠️順不同。どれから触ってもよく、全部 ✅ になった時だけ 🚪退勤OK になる。 */
var CLOSE_FLOW={loading:false,at:0,cash:null,pos:null,gate:null,denpyo:null,extra:null,err:''};
function loadClosingFlow(force){
  if(!IS_GAS||CLOSE_FLOW.loading)return;
  if(!force&&CLOSE_FLOW.at&&(Date.now()-CLOSE_FLOW.at)<20000)return;   // 20秒はキャッシュ（GASの床1.9秒を毎回払わない）
  CLOSE_FLOW.loading=true;
  Promise.all([
    gsr('getCashCheckInit').catch(function(){return null;}),
    gsr('getPosDayStatus').catch(function(){return null;}),
    gsr('kioskGetDenpyoDay').catch(function(){return null;})
  ]).then(function(r){
    CLOSE_FLOW.cash=r[0]; CLOSE_FLOW.pos=(r[1]&&r[1].ok!==false)?r[1]:null; CLOSE_FLOW.denpyo=r[2];
    var slips=readSlipsFromDenpyo(r[2]).filter(function(x){return Number(x.amount)>0;})
      .map(function(x){return {category:x.category,payee:x.payee,amount:Number(x.amount)||0};});
    var dk=(r[0]&&r[0].dateKey)||'';
    /* ⚠️ゲート（帰宅をブロックする条件）と警告ブロックは並列で取る＝GASの床1.9秒を2回払わない。
       ⚠️警告が取れなくても締めは進める＝extra は null のまま「警告が出ないだけ」に留める。 */
    return Promise.all([
      gsr('ccGateStatus',dk,slips).catch(function(){return null;}),
      gsr('getClosingExtras',dk).catch(function(){return null;})
    ]);
  }).then(function(rr){
    var g=rr[0], ex=rr[1];
    CLOSE_FLOW.extra=(ex&&ex.ok!==false)?ex:null;
    CLOSE_FLOW.gate=(g&&g.ok!==false)?g:null;
    CLOSE_FLOW.err=CLOSE_FLOW.gate?'':'TRUSTの状態を確認できませんでした';
    CLOSE_FLOW.loading=false; CLOSE_FLOW.at=Date.now();
    if(viewMode==='home'&&curPhase()==='post')renderHome();
  }).catch(function(){
    CLOSE_FLOW.loading=false; CLOSE_FLOW.at=Date.now(); CLOSE_FLOW.err='締めの状態を確認できませんでした';
    if(viewMode==='home'&&curPhase()==='post')renderHome();
  });
}
/* 締めの工程。state: 'done' 完了 / 'todo' これから / 'wait' 自分では動かせない待ち */
function cfSteps_(){
  var F=CLOSE_FLOW, cash=F.cash||{}, pos=F.pos, gate=F.gate;
  var submitted=!!cash.reportSubmitted, approved=!!cash.approved;
  var S=[];
  // ① POS
  var posOk=!pos||!pos.enforce||!!pos.ready;
  var posWhy='';
  if(pos&&pos.enforce&&!pos.ready){
    var m=[]; if((pos.open||[]).length)m.push('未会計 '+pos.open.length+'件');
    if((pos.invoice||[]).length)m.push('請求書の依頼 '+pos.invoice.length+'件');
    posWhy=m.join(' / ');
  }else if(!pos){ posWhy='確認中'; }
  S.push({id:'cf_pos',em:'🧾',t:'POSを締める',s:posOk?'未会計・請求書の依頼なし':posWhy,
    state:posOk?'done':'todo',act:"setViewMode('bill')"});
  // ② 日払い伝票を整える（受取人・金額）
  var slips=readSlipsFromDenpyo(F.denpyo).filter(function(x){return Number(x.amount)>0&&/日払/.test(String(x.category||''));});
  var known=(gate&&gate.payees)||null;
  var noName=slips.filter(function(x){return !String(x.payee||'').trim();});
  var unknown=slips.filter(function(x){
    var n=String(x.payee||'').replace(/[\s　]/g,'').trim(); if(!n)return false; if(!known)return false;
    return !known.some(function(p){return String(p||'').replace(/[\s　]/g,'').trim()===n;});
  });
  var slipOk=(noName.length===0&&unknown.length===0);
  S.push({id:'cf_slip',em:'💴',t:'日払い伝票を整える',
    s:slipOk?(slips.length?('日払い '+slips.length+'件 すべて受取人あり'):'今日の日払いはありません')
      :((noName.length?'受取人が空欄 '+noName.length+'件':'')+(noName.length&&unknown.length?' / ':'')+(unknown.length?'名簿に無い名前 '+unknown.length+'件':'')),
    state:slipOk?'done':'todo',act:'openCashCheck()'});
  // ③ TRUSTへの入力（自己申告のみ。自動突合は 2026-08-27 に撤去）
  /* ⚠️閉店チェック側のゲート(ccGateConds_)と判定を必ず揃えること。同じ条件を2箇所に書いて食い違わせ、
     【送信は通ったのに工程が✅にならず永久に帰れない】を2026-08-25に2回踏んでいる。
     いまはどちらも「submitted || 自己申告」だけ。片方だけ条件を足さないこと。 */
  /* ⚠️自己申告(trustSelfGet_)も「この工程は終わった」に数える。黒服は送信より先に入力してチェックする＝
     送信を条件にすると、やったのに❌のままで「まだ帰れません」と言われる（実測で踏んだ）。 */
  var selfOk=trustSelfGet_();
  var trustOk=submitted||selfOk;
  var trustS;
  if(submitted) trustS='入力済みとして送信しました';
  else if(selfOk) trustS='入力したと申告済み';
  else trustS='タップ→TRUSTを開いて入力→「入力しました」にチェック';
  S.push({id:'cf_trust',em:'🔢',t:'TRUSTに日払い・経費を入力',s:trustS,state:trustOk?'done':'todo',act:'openTrustEntry()'});
  // ④ 手作業（端末チェック）
  // ⛔送りは締めの工程に置かない（ボス確定 2026-08-26）＝締めの時点で送りはもう終わっている。
  //   終わっている作業をチェックさせると「あと N 件」が実態とズレて、警告そのものが読まれなくなる。
  //   画面は業務メニュー「🚗 送り管理」から常時開ける＝導線は消えていない。
  S.push({id:'safe', em:'🔐',t:'金庫へ収納・出金確認',s:'残金の収納と臨時出金',state:homeChecks()['safe']?'done':'todo',act:'openSafeWithdrawal()',manual:true});
  /* 🍶 酒屋への発注（ボス指示 2026-08-27）。ボス確定＝①必須工程（帰れない）②毎日出す③画面は持たずチェックだけ。
     ⚠️「今日は発注する日か」の判断を黒服に任せて出し分けると必ず抜ける＝日払い0件の日も常時出す既存方針と同じく毎晩出す。
        発注が要らない夜も同じチェックで閉じる＝「確かめた」の記録であって「発注した」の記録ではない。
     ⛔ここに在庫の判定（発注点割れ等）を足さないこと。必須工程は cfSteps_・気づかせる系は cfWarnItems_ で分ける
        （同じ条件を2箇所で判定して締めが詰む事故を2026-08-25に2回踏んでいる）。品目を見るなら業務メニュー📋在庫発注管理。 */
  var sakeOk=!!homeChecks()['cf_sake'];
  /* 📦 届いていない発注＝1件ずつ何かを選ばせる（見えているだけでは片付かなかった）
     ⚠️未ロードは done にせず wait ＝勝手に通さない。通信失敗時は loadOrderAlerts の catch が
       空を入れて通す（GASが不調な夜に誰も帰れなくなるのを防ぐ）。 */
  var oaRows=oaRows_(), oaPend=triPending_(oaRows,'oa');
  S.push({id:'cf_order',em:'📦',t:'届いていない発注を片付ける',
    s:(ORDER_ALERTS==null)?'確認中…':triSummary_(oaRows,'oa','未着はありません'),
    state:(ORDER_ALERTS==null)?'wait':(oaPend.length?'todo':'done'),
    act:'openOrderTriage()'});
  /* ⚠️今日中に片付けること＝旧「警告ブロック」を必須へ格上げ（ボス指示 2026-08-27
     「基本すべてのタスクを放置できないようにしてほしい」）。
     ⛔ここに出す条件を自前で書き直すな＝正本は cfWarnItems_ の1箇所。
       同じ条件を2箇所で判定すると必ずズレて「送信済みなのに永久に帰れない」が起きる。
     ⚠️CLOSE_FLOW.extra が未取得のうちは cfWarnItems_ が経費ぶんしか返さない＝件数が後から増える。
       それでも done で固定しない（毎回作り直す）ので、取れた時点で正しく todo に戻る。 */
  var waRows=waRows_(), waPend=triPending_(waRows,'wa');
  S.push({id:'cf_warn',em:'⚠️',t:'今日中に片付けることを決める',
    s:triSummary_(waRows,'wa','片付けるものはありません'),
    state:waPend.length?'todo':'done',
    act:'openWarnTriage()'});
  S.push({id:'cf_sake',em:'🍶',t:'酒屋へ発注する',
    s:sakeOk?'確認しました':'足りない酒を確かめて発注（発注が要らない日もチェック）',
    state:sakeOk?'done':'todo',act:"toggleHomeCheck('cf_sake')",manual:true});
  // ⑥ 残っているタスクを決める（対応した or 明日へ持ち越す）
  var pend=(TASKS||[]).filter(function(x){return !x.deferred;});
  S.push({id:'cf_task',em:'📋',t:'残っているタスクを決める',
    s:pend.length?(pend.length+'件が未決（対応するか、明日へ持ち越すか決めてください）'):'すべて決まっています',
    state:pend.length?'todo':'done',act:'openCloseTasks()'});
  // ⑦ 現金を数えて送信（ここが関所）
  S.push({id:'cf_cash',em:'💰',t:'現金を数えて閉店チェックを送信',
    s:submitted?('提出済み　報告者 '+(cash.reporterName||'')):'4袋を数えて送信（締めの条件が全部そろわないと送れません）',
    state:submitted?'done':'todo',act:'openCashCheck()'});
  // ⑦ 追加タスク（コンソールで編集）
  if(CLOSING_TASKS&&CLOSING_TASKS.length){
    CLOSING_TASKS.forEach(function(x){
      S.push({id:x.id,em:'🪧',t:x.label,s:x.sub||'',state:homeChecks()[x.id]?'done':'todo',act:"toggleHomeCheck('"+x.id+"')",manual:true});
    });
  }
  // ⑧ 管理者の承認（黒服では動かせない）
  S.push({id:'cf_appr',em:'✅',t:'管理者の承認',
    s:approved?('承認済み　'+(cash.approver||'')):(submitted?'承認待ちです（管理コンソールから承認されます）':'閉店チェックの送信後に承認されます'),
    state:approved?'done':'wait',act:'openCashCheck()'});
  return S;
}
function cfCanGoHome_(){ return cfSteps_().every(function(s){return s.state==='done';}); }
/* ⚠️「今日中に片付けたいこと」＝退勤はブロックしない警告（ボス確定 2026-08-26「まずは警告表示から」）。
   ⛔ここに出す条件を cfSteps_ 側にも書かないこと。同じ条件を2箇所で判定すると必ずズレて
      「送信済みなのに永久に帰れない」が起きる（2026-08-25に2回踏んだ）。必須はcfSteps_・警告はここ、で分ける。 */
function openKaikeiIssues(){ closeMenu(); showSheet('🧾 お客様の伝票 要確認', kkIssuesHtml_(), false); }

/* ⚠️busyは行ごとに持つ。1つのフラグを全カードで共有すると、GASの応答(床1.9秒)の間に別カードを押した時に
   黙って無反応になる（💴日払いの不明分で実測して踏んだ）。 */
var KK_BUSY={};
function kkResolve(rowIdx){
  if(KK_BUSY[rowIdx]){ alert('保存中です'); return; }

  gsr('resolveKaikeiCheck',rowIdx,LOGIN||'').then(function(r){
    KK_BUSY[rowIdx]=false;
    if(!r||r.ok===false){ alert('保存できませんでした'+((r&&r.error)?'：'+r.error:'')); return; }
    if(CLOSE_FLOW.extra&&CLOSE_FLOW.extra.kaikei)
      CLOSE_FLOW.extra.kaikei=CLOSE_FLOW.extra.kaikei.filter(function(x){return Number(x.rowIdx)!==Number(rowIdx);});
    var el=document.getElementById('sheetBody'); if(el)el.innerHTML=kkIssuesHtml_();
    if(viewMode==='home')renderHome();
  }).catch(function(){ KK_BUSY[rowIdx]=false; alert('通信エラー'); });
}
function cfWarnItems_(){
  var F=CLOSE_FLOW, ex=F.extra, W=[];
  /* ③ 当日の経費（領収書）＝日払いと同じ現金袋から出るのに、これまで受取人も金額も無検査だった */
  var keihi=readSlipsFromDenpyo(F.denpyo).filter(function(x){return Number(x.amount)>0&&!/日払/.test(String(x.category||''));});
  var kNo=keihi.filter(function(x){return !String(x.payee||'').trim();});

   ⚠️逃げ道は必ず残す＝[🙅 社員がいない][➡️ 明日でいい]。塞ぐと現場が詰み、閉店そのものが回らなくなる。
     ⭐「社員がいない」は超過日数に関わらず常に出す＝バイトだけの夜は催促も欠品判断もできない。
   ⚠️記録はその日限り(homeChecks)＝翌日また訊く。だから「持ち越し」は消滅ではない。
   ⛔新しいGAS関数を作らない＝既にロード済みの ORDER_ALERTS / CLOSE_FLOW だけを読む
     （GASは応答の床が1.9秒・ホームは30秒ごとに再描画される）。 */
var TRI_LATE_LIMIT_=7;   /* これを超えた未着は「明日でいい」を出さない */
var TRI_OPEN='';         /* いま開いているトリアージ（'oa'=未着 / 'wa'=今日中に片付けること） */
function triKey_(pfx,id){ return 'tri_'+pfx+'_'+id; }
function triGet_(pfx,id){ return homeChecks()[triKey_(pfx,id)]||''; }
function triPending_(rows,pfx){ return (rows||[]).filter(function(r){ return !triGet_(pfx,r.id); }); }
/* 内訳（社員不在／明日でいい）を分けて数える＝どちらも翌日へ持ち越すが意味が違う。
   社員不在＝やりたくてもできない／明日でいい＝黒服が判断した。 */
function triCountBy_(rows,pfx,how){
  var n=0; (rows||[]).forEach(function(r){ if(triGet_(pfx,r.id)===how) n++; }); return n;
}
function triMark(pfx,id,how){
  var c=homeChecks(); c[triKey_(pfx,id)]=how;
  try{ localStorage.setItem(homeCheckKey(),JSON.stringify(c)); }catch(e){}
  /* ⚠️描き直すのは「いま開いているシート」＝pfxで判断すると、別の一覧を開いている時に
     中身がすり替わる（タイトルは⚠️なのに中身が📦になる）。開いた側を TRI_OPEN で覚える。 */
  var b=document.getElementById('sheetBody');
  if(b&&TRI_OPEN) b.innerHTML=(TRI_OPEN==='oa')?oaTriageHtml():waTriageHtml();
  renderHome();
  toast(how==='push'?'📞 催促したと記録しました'
    :(how==='fixed'?'✅ 片付けたと記録しました'
    :(how==='nostaff'?'🙅 社員不在で翌日へ持ち越しました':'➡️ 明日へ持ち越しました')));
}
function triLbl_(how){
  return how==='push'?'📞 催促したと記録しました'
    :(how==='fixed'?'✅ 片付けたと記録しました'
    :(how==='nostaff'?'🙅 社員がいないため翌日へ持ち越しました'
    :(how==='tomo'?'➡️ 明日へ持ち越しました':'')));
}
/* 行の共通描画。r={id,em,t,s,act,actLabel,mainHow,canTomo} */
function triRowHtml_(r,pfx){
  var st=triGet_(pfx,r.id), lbl=triLbl_(st);
  return '<div class="cc-slip">'
    +'<div style="font-size:13.5px;font-weight:700;color:var(--txt)">'+r.em+' '+r.t+'</div>'
    +(r.s?'<div style="font-size:11.5px;color:var(--dim);margin-top:3px">'+r.s+'</div>':'')
    +(lbl?'<div style="font-size:12px;color:var(--green);margin-top:6px">'+lbl+'</div>':'')
    +'<div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center">'
      +'<button class="bm-btn sm" onclick="'+r.act+'">'+r.actLabel+'</button>'
      +(r.mainHow?'<button class="bm-btn sm" onclick="triMark(\''+pfx+'\',\''+r.id+'\',\''+r.mainHow+'\')">'
         +(r.mainHow==='push'?'📞 催促した':'✅ 片付けた')+'</button>':'')
      /* ⭐社員不在は常に出す＝ここを塞ぐと対応不能な夜に逃げ道がゼロになる */
      +'<button class="bm-btn sm" onclick="triMark(\''+pfx+'\',\''+r.id+'\',\'nostaff\')">🙅 社員がいない</button>'
      +(r.canTomo
        ? '<button class="bm-btn sm" onclick="triMark(\''+pfx+'\',\''+r.id+'\',\'tomo\')">➡️ 明日でいい</button>'
        : '<span style="font-size:11.5px;color:#ff9a9a;line-height:1.5">'+TRI_LATE_LIMIT_+'日超過＝「明日でいい」では送れません。<br>催促するか、在庫発注管理で欠品・終売に。社員がいない夜は「🙅 社員がいない」を。</span>')
    +'</div></div>';
}
function triSummary_(rows,pfx,noneMsg){
  var pend=triPending_(rows,pfx), ns=triCountBy_(rows,pfx,'nostaff');
  if(!rows.length) return noneMsg;
  if(pend.length) return pend.length+'件が未対応（片付けるか、翌日へ持ち越すか決めてください）';
  return '全'+rows.length+'件に対応しました'+(ns?'（うち'+ns+'件は社員不在で翌日へ）':'');
}

function orderAlertCardHtml(){

  var vrows=vod.map(function(it){

      +'<div class="oa-sub">納品希望 '+esc(it.eta||'—')+'　<b class="oa-late">'+it.overdueDays+'日超過</b>'+part+'</div>'
      +'</div><div class="oa-go">確認 ›</div></div>';

  // 手タップ発注ログ基点（①②）の未着＝フロア＋承認者
  var rows=od.map(function(it){
    return '<div class="oa-row" onclick="openOrderAlert('+it.rowIdx+')"><div class="oa-bd">'
      +'<div class="oa-nm">'+esc(it.name)+(it.qty?' ×'+esc(it.qty):'')+' <span class="oa-fl">['+esc(it.floor)+']</span></div>'
      +'<div class="oa-sub">予定 '+esc(it.eta||'—')+'　<b class="oa-late">'+it.overdueDays+'日超過</b>'+(it.approver?'　承認 '+esc(it.approver):'')+'</div>'

/* ===== ⏱ 出退勤の打刻 =====
   時刻はサーバが採る＝端末の時計ズレを持ち込まない（フロントから時刻を送ってはいけない）。
   未打刻のときだけ大きく出し、済んだら1行に畳む＝申し送りを押しのけない。 */
var PUNCH=null, _pnLoading=false, _pnBusy=false;
function loadPunch(){
  if(!IS_GAS){ PUNCH={bizDate:'(ローカル)',me:{name:LOGIN||'テスト',in:'',out:'',plan:'18:00～26:00'},list:[]}; if(viewMode==='home')renderHome(); return; }
  if(_pnLoading)return; _pnLoading=true;
  gsr('gunshiPunchStatus',LOGIN||'').then(function(r){
    _pnLoading=false; PUNCH=r||{error:true}; if(viewMode==='home')renderHome();
  }).catch(function(){
    // ⚠️エラーでもフラグとPUNCHを必ず埋める＝「読み込み中…」で永久に固まらせない
    _pnLoading=false; PUNCH={error:true}; if(viewMode==='home')renderHome();
  });
}
function pnKey_(s){ return String(s==null?'':s).replace(/[\s　]/g,''); }
function fmtStartDate_(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(parseInt(m[2],10)+'月'+parseInt(m[3],10)+'日'):(s||'8月1日'); }
function punchCardHtml(){
  if(!PUNCH) return '<div class="pn-card"><div class="pn-mini">⏱ 打刻を読み込み中…</div></div>';
  if(PUNCH.error) return '<div class="pn-card"><div class="pn-mini">⏱ 打刻の状態を取得できませんでした<button class="pn-re" onclick="loadPunch()">再試行</button></div></div>';
  var me=PUNCH.me;
  if(!me||me.exempt) return '';   // 管理者・テストは打刻対象外＝カードごと出さない
  // 制度開始前は予告カード＝打刻ボタンを出さない（サーバのbeforeStart判定＝端末時計に依存しない）
  if(PUNCH.beforeStart){
    var sd=fmtStartDate_(PUNCH.startDate);
    return '<div class="pn-card"><div class="pn-head"><span class="pn-t">🗓 出退勤の打刻は '+sd+' から</span></div>'
      +'<span class="pn-oth">'+sd+'より、このカードの出勤・退勤ボタンで打刻します。それまで操作は不要です。</span></div>';
  }
  var others=(PUNCH.list||[]).filter(function(s){ return pnKey_(s.name)!==pnKey_(me.name); });
  var yet=others.filter(function(s){ return !s.in; }).length;
  var sub=others.length?('<span class="pn-oth">他の黒服 '+(others.length-yet)+'/'+others.length+' 出勤済み</span>'):'';
  var plan=me.plan?'<span class="pn-plan">予定 '+esc(me.plan)+'</span>':'';
  if(!me.in){
    return '<div class="pn-card pn-in"><div class="pn-head"><span class="pn-t">⏱ 出勤の打刻</span>'+plan+'</div>'
      +'<button class="pn-btn go"'+(_pnBusy?' disabled':'')+' onclick="doPunch(\'出勤\')">🟢 出勤</button>'+sub+'</div>';
  }
  if(!me.out){
    return '<div class="pn-card"><div class="pn-mini"><span class="pn-dot">●</span>'+esc(me.in)+' 出勤中'+plan+'</div>'
      +'<button class="pn-btn out"'+(_pnBusy?' disabled':'')+' onclick="doPunch(\'退勤\')">🔴 退勤</button>'+sub+'</div>';
  }
  return '<div class="pn-card pn-done"><div class="pn-mini">⏱ 本日 '+esc(me.in)+' 〜 '+esc(me.out)+' 打刻済み</div></div>';
}
function doPunch(type){
  if(_pnBusy)return;
  if(!IS_GAS){ alert('ローカルでは打刻できません'); return; }
  if(type==='退勤'&&!confirm('退勤を打刻します。よろしいですか？'))return;
  _pnBusy=true; if(viewMode==='home')renderHome();
  gsr('gunshiPunch',LOGIN||'',type).then(function(r){
    _pnBusy=false;
    if(!r||!r.ok){ alert('⚠️ '+((r&&r.error)||'打刻できませんでした')); loadPunch(); return; }
    var msg='✅ '+r.type+'を記録しました（'+r.time+'）';
    if(r.lateMin>0) msg+='\n\n⚠️ 予定 '+r.plan+' に対して '+r.lateMin+'分の遅刻として記録されます。\nやむを得ない事情があった場合は責任者に申告してください。';
    if(r.earlyMin>0) msg+='\n\n⚠️ 予定 '+r.plan+' より '+r.earlyMin+'分早い退勤です。';
    alert(msg); loadPunch();
  }).catch(function(){ _pnBusy=false; alert('⚠️ 通信に失敗しました。もう一度お試しください'); loadPunch(); });
}

/* ===== 📋 黒服 日次申し送り（引き継ぎボード）===== */
var HANDOVER=null, _hoLoading=false;
function loadHandover(){
  if(!IS_GAS){ HANDOVER={memo:'（ローカル）申し送りは本番のみ',todos:[]}; if(viewMode==='home')renderHome(); return; }
  if(_hoLoading)return; _hoLoading=true;
  gsr('gunshiGetHandover').then(function(r){ _hoLoading=false; HANDOVER=r||{memo:'',todos:[]}; if(viewMode==='home')renderHome(); })

}
function handoverCardHtml(){
  if(!HANDOVER){ return '<div class="ho-card"><div class="ho-head">📋 今日の申し送り</div><div class="ho-loading">読み込み中…</div></div>'; }
  var memo=(HANDOVER.memo||'').trim();
  var todos=HANDOVER.todos||[];
  var open=todos.filter(function(t){return !t.done;}).length;
  var todoHtml=todos.map(function(t){
    return '<div class="ho-t'+(t.done?' done':'')+'" onclick="toggleHandoverTodo(\''+esc(String(t.id))+'\')">'
      +'<span class="ho-box">'+(t.done?'☑':'☐')+'</span><span class="ho-tx">'+esc(t.text)+'</span>'
      +(t.carried?'<span class="ho-carry">昨日から</span>':'')+'</div>';
  }).join('');
  var body='';
  if(memo) body+='<div class="ho-memo">'+esc(memo).replace(/\n/g,'<br>')+'</div>';
  if(todos.length) body+='<div class="ho-sec">今日やること<span class="ho-cnt">残り '+open+'</span></div>'+todoHtml;
  if(!memo && !todos.length) body='<div class="ho-empty">まだ申し送りはありません。<br>閉店時などに「✍️書く/編集」で残してください。</div>';
  return '<div class="ho-card"><div class="ho-head"><span>📋 今日の申し送り</span>'
    +'<button class="ho-edit" onclick="openHandoverEdit()">✍️ 書く/編集</button></div>'+body+'</div>';
}
function toggleHandoverTodo(id){
  if(!HANDOVER||!HANDOVER.todos)return;
  var hit=HANDOVER.todos.filter(function(t){return String(t.id)===String(id);})[0];
  if(!hit)return;
  hit.done=!hit.done;
  if(viewMode==='home')renderHome();
  saveHandoverNow_();
}
function saveHandoverNow_(){
  if(!IS_GAS||!HANDOVER)return;
  gsr('gunshiSaveHandover',{memo:HANDOVER.memo||'',todos:HANDOVER.todos||[],by:LOGIN||''})
    .then(function(r){ if(r&&r.todos){HANDOVER=r; if(viewMode==='home')renderHome();} }).catch(function(){});
}
function hoEditRow_(t){
  t=t||{}; var id=t.id||('t'+Date.now()+Math.floor(Math.random()*1000));
  return '<div class="ho-erow" data-id="'+esc(String(id))+'">'
    +'<input type="checkbox" class="ho-eck"'+(t.done?' checked':'')+'>'
    +'<input type="text" class="ho-etx" value="'+esc(t.text||'')+'" placeholder="やること">'
    +'<button class="ho-del" onclick="this.parentNode.remove()">×</button></div>';

function hoAddRow(){ var c=document.getElementById('ho-todos'); if(c)c.insertAdjacentHTML('beforeend',hoEditRow_({})); }
function openHandoverEdit(){
  var h=HANDOVER||{memo:'',todos:[]};
  var rows=(h.todos||[]).map(hoEditRow_).join('');
  var html='<div class="ho-ed">'
    +'<label class="ho-lbl">メモ（今日の出来事・注意点・共有）</label>'
    +'<textarea id="ho-memo" class="ho-ta" rows="5" placeholder="例）3番のボトル次回入れ替え。◯◯様、次回は静かな席希望。">'+esc(h.memo||'')+'</textarea>'
    +'<label class="ho-lbl" style="margin-top:12px">今日やること（未完了は翌営業日へ自動で持ち越し）</label>'
    +'<div id="ho-todos">'+rows+'</div>'
    +'<button class="ho-add" onclick="hoAddRow()">＋ 項目を追加</button>'
    +'<button class="ho-save" onclick="saveHandoverEdit()">保存</button></div>';

function saveHandoverEdit(){
  var memo=((document.getElementById('ho-memo')||{}).value||'');
  var todos=[].slice.call(document.querySelectorAll('#ho-todos .ho-erow')).map(function(row){
    var tx=((row.querySelector('.ho-etx')||{}).value||'').trim();
    return {id:row.getAttribute('data-id'),text:tx,done:!!(row.querySelector('.ho-eck')||{}).checked,carried:false};
  }).filter(function(t){return t.text;});
  if(!IS_GAS){ HANDOVER={memo:memo,todos:todos}; closeSheet(); if(viewMode==='home')renderHome(); return; }
  gsr('gunshiSaveHandover',{memo:memo,todos:todos,by:LOGIN||''}).then(function(r){
    HANDOVER=r||{memo:memo,todos:todos}; closeSheet(); if(viewMode==='home')renderHome(); toast('申し送りを保存しました');
  }).catch(function(){ toast('保存に失敗しました',true); });
}

function parseBottlePos_(pos){
  var raw=String(pos||'').trim();

  var floor;
  if(/2\s*F/i.test(h)){ floor='2F'; section=null; }        // 2Fは細かい位置を持たない＝全体（文字があっても無視）
  else if(/5\s*F/i.test(h)) floor='5F';
  else if(section) floor='5F';                             // アルファベットは全部5F
  else if(/冷蔵|冷/.test(raw)) floor='倉庫';

function bsvResolveZone_(p){

function bsvHudCode_(r){

function bsvReticleSvg_(R, L, SWp, SHp){

  var dim='<path class="bsv-ret-dim" fill-rule="evenodd" d="M0 0 H'+SWp+' V'+SHp+' H0 Z M'+x+' '+y+' H'+(x+w)+' V'+(y+h)+' H'+x+' Z"/>';

    +'<g class="bsv-ret-br">'+brackets+'</g>'

}

// 手順: transition無しで全景を置く→強制リフローで基準を確定→transitionを戻して対象へ＝ズームがアニメする。

function bsvSwitchFloor_(floor){

/* ---- 描画キャンバス＝各フロアで席が実際に占めている範囲（bbox）だけを映す ----
 * デフォルメ後は2F・5Fとも席が0,0〜368,470を埋める＝bboxはキャンバスと一致し、中央寄せは実質ゼロになる。
 * 仕組みは残す＝席を動かした時に切り抜きが勝手に追従する（手で維持する表を持たないため）。
 * ⚠️bboxはSEAT_POSから自動算出。⚠️MAP_W/MAP_Hは全フロアの最大値＝2Fと5Fを同じ縮尺で映すため。
 * ⚠️縦の予算は実測で決まっている＝この縦横比(368/470)は**画面に入る上限**。MAP_Hを増やすと下がはみ出す
 *   （実測 2026-07-16：iPad横1180で描画高471px/余地491px・1024で405px/余地431px）。 */
var MAP_VIEW=(function(){
  var v={};
  Object.keys(SEAT_POS).forEach(function(code){
    var fl=code.slice(0,2), p=SEAT_POS[code], o=v[fl];
    if(!o){ v[fl]={x0:p.x, y0:p.y, x1:p.x+p.w, y1:p.y+p.h}; return; }
    o.x0=Math.min(o.x0,p.x); o.y0=Math.min(o.y0,p.y);
    o.x1=Math.max(o.x1,p.x+p.w); o.y1=Math.max(o.y1,p.y+p.h);
  });
  Object.keys(v).forEach(function(fl){ var o=v[fl]; o.w=o.x1-o.x0; o.h=o.y1-o.y0; });
  return v;
})();
var MAP_W=Math.max.apply(null,Object.keys(MAP_VIEW).map(function(fl){return MAP_VIEW[fl].w;}));
var MAP_H=Math.max.apply(null,Object.keys(MAP_VIEW).map(function(fl){return MAP_VIEW[fl].h;}));
/* 目印（入口・バー）はボス指示で廃止＝席だけを出す。
 * フロアのbboxがMAP_W×MAP_Hより小さい場合は中央寄せ（＝余りを左右/上下に等分）。 */
function mapBox_(p,fl){
  var v=MAP_VIEW[fl], ox=v.x0-(MAP_W-v.w)/2, oy=v.y0-(MAP_H-v.h)/2;
  return 'left:'+((p.x-ox)/MAP_W*100).toFixed(3)+'%;top:'+((p.y-oy)/MAP_H*100).toFixed(3)+'%;'
       + 'width:'+(p.w/MAP_W*100).toFixed(3)+'%;height:'+(p.h/MAP_H*100).toFixed(3)+'%;';
}
/* 客に付くフラグ（リクエスト/NG/誕生日/VIP/ボトル）。マップでは席名の右に短く出す。
 * ⚠️一覧のTAGLABELは「🍶ボトル」等の語つき＝マップの122px幅では3個で3行に折り返し、
 *   タグだけで42px（＝キャストの居場所）を食う。マップは記号だけにして1行に収める。
 * ⚠️客名と同じ行に置かない。122pxに「客名＋フラグ3個」は入らず、削れるのは必ず客名の側だった
 *   （実測2026-07-15：「鈴木 様」→「鈴..」）。客名は黒服が一番読む情報＝絶対に削らせない。
 * ⚠️順は「今すぐ効く順」。枠に入らない時はCSSで後ろから欠ける＝呼び出しとNGが最後まで残る。 */
/* ⚠️語や数字を足さない＝1個30pxになり、2個で客名の行まで押し出す。記号1文字で約20px。
 *   未対応/対応済みは色で出す（f-req.un＝橙で点滅）＝文字で持つ必要がない。件数はタップで見る。 */
var MAP_TAG={ng:'⚠',bday:'🎂',vip:'👑',bottle:'🍶'};
function mapFlags_(s,idx){
  var f='';
  if(s.leavePlan) f+='<span class="mflag f-next" title="空く予定 '+esc(s.leavePlan)+' 頃">🕛'+esc(s.leavePlan)+'</span>';
  if(s.nextRsv) f+='<span class="mflag f-next" title="次席予約 '+esc(rsvArrT(s.nextRsv))+' '+esc(s.nextRsv.cust)+'様">🔜'+esc(rsvArrT(s.nextRsv))+'</span>';
  var rq=reqsForCust(s.cust);
  if(rq&&rq.length){
    var un=rq.filter(function(r){return !r.handled;}).length;
    f+='<span class="mflag f-req'+(un?' un':'')+'" title="リクエスト'+(un?' 未対応'+un+'件':' 対応済み')
      +'" onclick="openReqForSeat('+idx+',event)">📣</span>';
  }
  Object.keys(MAP_TAG).forEach(function(k){
    if((s.tags||[]).indexOf(k)<0) return;
    f+='<span class="mflag f-'+k+'" title="'+esc(TAGLABEL[k]||k)+'">'+MAP_TAG[k]+'</span>';
  });
  return f?'<span class="mflags">'+f+'</span>':'';
}
/* ---- マップのセル専用の圧縮描画（カウンター=2段／ボックス=3段） ----
 * 一覧のseatHtmlは幅330px・高さ可変の一覧向けで、マップの枠には構造的に入らない。
 *   実測(2026-07-15)：2F-BOX1は枠100pxに対し146px必要＝46pxぶんキャストが黙って切れていた。
 * 枠に合わせて作る。段の構成：
 *   1段目 席名 ＋ 右肩（カウンター=残り時間／ボックス=人数。超過は赤・まもなくは橙・予約は来店時刻）
 *   2段目 客名 ＋ フラグ（カウンターはキャストのアバターも。フラグは客に付く情報なので客名の隣）
 *   3段目 ボックスのみ＝キャストのチップ（chipHtmlを流用＝名前と残り時間が1人ずつ読める）
 * ⚠️クリック契約(onSeatClick/tapCast)と状態クラス(movetarget等)はseatHtmlと同一＝付け回し/結合はそのまま効く。
 * ⚠️段を足す/文字を上げる時は必ず実測で追う。枠(カウンター約56px・ボックス80〜102px)を超えると黙って切れる。 */
function mapSeatCell_(s,tall,wide){
  var st=seatStatus(s), idx=seatIdx(s), nm=shortNm(s.name);
  // 未対応キャストリクエスト＝卓ごと橙で光らせる（席名右の小フラグだけでは埋もれる）。
  // 来店中(s.cust)だけでなく来店前の予約席(s.rsv.cust)も対象＝予約に付いたリクエストを来店前から出す。reqsForCustは客名キー照合。
  var reqCust=s.cust||(s.rsv&&s.rsv.cust)||'';
  var reqUn=reqCust?reqsForCust(reqCust).filter(function(r){return !r.handled;}).length:0;
  var rqc=reqUn?' hasreq':'';
  var reqCorner=reqUn?'<span class="req-corner" title="未対応リクエスト'+reqUn+'件" onclick="openReqForSeat('+idx+',event)">📣 リクエスト</span>':'';
  var oc='onclick="onSeatClick('+idx+')"', size=tall?' box':' mini';
  if(s.mergedTo!=null){
    return '<div class="seat mergedcell'+size+'" '+oc+'><div class="mini-r1"><b>'+esc(nm)+'</b></div>'
      +'<div class="mini-r2"><span class="mini-c">🔗 '+esc(shortNm(SEATS[s.mergedTo].name))+'へ</span></div></div>';
  }
  var isPrimary=s.mergeWith&&s.mergeWith.length;
  var dispNm=isPrimary?nm+'＋'+s.mergeWith.length:nm;
  var mt=(moveMode||tableMoveMode)?' movetarget':'';
  var self=(moveMode&&selCast&&selCast.si===idx)?' moveself':'';
  var ct=(combineMode&&idx!==combinePrimary)?' combinetarget':'';
  var cprim=(combineMode&&idx===combinePrimary)?' combineprimary':'';
  var grp=isPrimary?' grouped':'';
  var coSeat=(s.occupants&&s.occupants.length>1);   // 相席（同一卓に複数予約）
  var paxDisp=coSeat?s.occupants.reduce(function(a,o){return a+(Number(o.pax)||0);},0):s.pax;
  var r1='<b>'+esc(dispNm)+'</b>'+(coSeat?'<span class="mini-p">👥'+s.occupants.length+'</span>':'')
        +(st==='empty'?'':mapFlags_(s,idx));
  var r2='', r3='', cls='';
  if(st==='empty'){
    if(s.rsv){
      cls='reserved';
      r1+='<span class="mini-t rsv">'+esc(rsvArrT(s.rsv))+'</span>';
      r2='<span class="mini-c rsv">'+esc(s.rsv.cust)+'様</span>';
      // 担当はボックス(3段)なら3段目へ。デフォルメで幅が広がったカウンターは2段目の余りに置ける
      if(tall&&s.rsv.tantou) r3='<span class="mini-sub">担当 '+esc(s.rsv.tantou)+'</span>';
      else if(wide&&s.rsv.tantou) r2+='<span class="mini-sub">担当 '+esc(s.rsv.tantou)+'</span>';
    } else {
      r2='<span class="mini-e">空席</span>';
    }
  } else if(st==='nocast'){
    cls='nocast';
    r1+='<span class="mini-t warn">⚠不在</span>';
    r2='<span class="mini-c">'+esc(s.cust||'')+'</span>';
    if(tall&&s.tantou) r3=chipHtml(s.tantou,-1,idx,{away:true,awayMin:s.awayMin});
    // 幅が広がったカウンターは「誰が何分抜けているか」も2段目に入る（従来は⚠不在だけで担当が読めなかった）
    else if(wide&&s.tantou) r2+='<span class="mini-cc">'+chipHtml(s.tantou,-1,idx,{away:true,awayMin:s.awayMin})+'</span>';
  } else {
    cls=st;
    var cs=s.casts||[];
    if(tall){
      r1+='<span class="mini-p">'+paxDisp+'名</span>';
      r2='<span class="mini-c">'+esc(s.cust||'')+'</span>';
      // ボックスは背が高い＝キャストは名前と残り時間を1人1行で出す（切れる時はCSSで下から隠れる）
      r3=cs.map(function(c,ci){ return chipHtml(c.n,ci,idx,{mins:c.mins,status:c.status,tantou:c.n===s.tantou}); }).join('');
    } else {
      // カウンターは2段しかない＝先頭キャストの残り時間は右肩へ（席を縦に読む時に数字が同じ位置に揃う）
      var c=cs[0]||null;
      if(c){
        var tm=c.unlimited?'∞':(c.mins<0?'超'+(-c.mins)+'分':'残'+c.mins+'分');
        r1+='<span class="mini-t '+(c.status==='over'?'over':c.status==='warn'?'warn':'')+'">'+tm+'</span>';
      }
      // デフォルメで帯になったカウンター(368px)は客名の隣にキャスト名を出す＝122px時代は色アバター1文字しか
      // 置けず「誰が付いているか」がマップから読めなかった。2人目以降も「+1」ではなく名前で出る。
      // ⚠️残り時間はチップに入れない(notime)＝右肩と二重になる。狭い席(5Fカウ6)は入らないので従来の色アバター。
      if(!wide&&c) r2='<i class="mini-av" style="background:'+castColor(c.n)+'">'+esc(c.n.charAt(0))+'</i>';
      r2+='<span class="mini-c">'+esc(s.cust||'')+'</span>';
      if(wide&&cs.length){
        r2+='<span class="mini-cc">'+cs.map(function(c2,ci){
          return chipHtml(c2.n,ci,idx,{notime:true,status:c2.status,tantou:c2.n===s.tantou});
        }).join('')+'</span>';
      } else if(cs.length>1) r2+='<span class="mini-p">+'+(cs.length-1)+'</span>';
    }
  }
  return '<div class="seat'+size+' '+cls+mt+self+ct+cprim+grp+rqc+'" '+oc+'>'
    +'<div class="mini-r1">'+r1+'</div><div class="mini-r2">'+r2+'</div>'
    +(r3?'<div class="mini-r3">'+r3+'</div>':'')+reqCorner+'</div>';
}
/* 3段目に入り切らなかったキャストを「+N」で明示する。
 * ⚠️切れた事実を黙って捨てない＝黒服が「ついているはずのキャストが居ない」と誤読する。
 *   キャストが多いボックス（背の低い5Fボックスに3人など）でだけ出る。
 * 枠の高さは描画後にしか分からない（画面幅→縮尺→セル高の順に決まる）ので、描画後に実測して印を足す。
 * ⚠️必ず先に消してから足す（＝冪等）。setHtmlは前回と同じHTMLなら書き換えを省くので、
 *   消さずに足すとポーリングのたびにDOMへ+Nが積み上がる。画面回転で枠が変わった時もこれで測り直る。 */
function markMapOverflow_(){
  document.querySelectorAll('.hall-map .mini-more').forEach(function(b){ b.remove(); });
  document.querySelectorAll('.hall-map .mini-r3').forEach(function(r3){
    var chips=r3.querySelectorAll('.castchip');
    if(!chips.length) return;
    // ⚠️offsetTopは使わない＝基準が.mini-r3ではなく位置指定された祖先(.seatpos)になり、全部隠れている判定になる
    var lim=r3.getBoundingClientRect().top+r3.clientHeight, shown=0;
    for(var i=0;i<chips.length;i++){ if(chips[i].getBoundingClientRect().bottom<=lim+1) shown++; }
    var hid=chips.length-shown;
    if(!hid) return;
    var r1=r3.parentNode.querySelector('.mini-r1');
    if(r1) r1.insertAdjacentHTML('beforeend','<span class="mini-p mini-more">+'+hid+'</span>');
  });
}
/* ⚠️2026-08-28ボス指示＝**ホール状況はリスト表示だけ**にする（マップ/リストの切替をやめる）。
   マップの描画関数(mapHtml/mapFloorHtml/mapSeatCell_/SEAT_POS)は**残してある**＝
   ポータルの予約フォームの席選択が同じ座標(SEAT_POS)を見ており、消すと巻き添えになる。
   戻したくなったら hallView を 'map' にできる状態のまま、入口だけ塞いでいる。 */
var hallView='list';
function setHallView(v){ hallView='list'; renderHall(); }   // 切替は封じた（常にリスト）
function hallViewTglHtml(){ return ''; }
// 2F・5Fを横並びで同時表示（リストの.floorsと同じ骨格）
function mapHtml(){ return '<div class="floors">'+mapFloorHtml('2F')+mapFloorHtml('5F')+'</div>'; }
function mapFloorHtml(fl){
  var seats=SEATS.filter(function(s){return s.floor===fl;});
  var placed=seats.filter(function(s){return SEAT_POS[s.code];});
  var rest=seats.filter(function(s){return !SEAT_POS[s.code];});   // 待機・黒服＝物理席でないので帯に
  var cb=seats.filter(function(s){return s.type==='C'||s.type==='B';});
  var occ=cb.filter(function(s){return s.casts&&s.casts.length;}).length;
  // 背の低いセル(カウンター)は2段、背の高いボックスは3段（キャストを1人1行で出せる）
  // nw=幅いっぱいの帯にできなかった狭い席（5Fカウ6＝角／2Fボックス3）。同じ文字だと客名が削れるので少しだけ落とす
  // ⚠️しきい値150はSEAT_POSの単位=px相当が前提（帯は368・狭い席は110〜140）。座標系を変えたらここも動く
  var cells=placed.map(function(s){
    var p=SEAT_POS[s.code], tall=p.h>=60;
    return '<div class="seatpos'+(tall?'':' sm')+(p.w<150?' nw':'')+'" style="'+mapBox_(p,fl)+'">'+mapSeatCell_(s,tall,p.w>=150)+'</div>';
  }).join('');
  return '<div class="floor">'
       + '<div class="floor-hd"><span class="fl">'+fl+'</span><span class="meta">稼働 '+occ+'/'+cb.length+'</span></div>'
       // 縦横比はMAP_W/MAP_Hから直接引く＝CSSに数字を焼くと切り抜きを変えた時に黙ってズレる
       + '<div class="hall-map" style="aspect-ratio:'+MAP_W+'/'+MAP_H+'">'+cells+'</div>'
       + (rest.length?'<div class="map-side">'+rest.map(seatHtml).join('')+'</div>':'')
       + '</div>';
}

function floorHtml(fl){

    +'</div>';
