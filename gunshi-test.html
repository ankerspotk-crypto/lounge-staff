/* ============================================================================
   🧾 請求書払い＝**発行依頼まで出して初めて終わり**（ボス確定）。
   ⚠️請求書は「請求先」を選ばないと出せない（会社名/宛先が要る）＝POSだけでは完結しない。
     そこで**既存の請求書入力画面を、この伝票の金額を載せた状態で開く**。送信が通ったら
     この伝票に「依頼済み」を刻む＝閉店ゲートがそれを見る。
   ⚠️刻まないと閉店報告が止まる＝出し忘れが構造的に検知される（それが狙い）。
============================================================================ */
var SK_FROM_POS=null;      // {key} 請求書画面をPOSから開いた印
function bmSeikyuHtml(d,c){
  /* ⚠️2026-08-28修正＝`payMethod==='invoice'`で判定していたので、**分割で一部だけ売掛**のとき
     このブロックが出なかった。backendの閉店ゲートは`pay.credit>0`で請求依頼を要求する＝
     「ゲートは要求するのに、依頼を出すボタンが画面に無い」で閉店できなくなる。
     ⭐判定は必ず**金額(pay.credit)**で行う。payMethodは代表を覚えているだけの飾り。 */
  if(!(Number((d.pay||{}).credit)>0)) return '';
  if(d.seikyuRequested){
    return '<div class="bm-sum" style="margin-top:8px"><div class="r"><span style="color:var(--green)">✅ 請求書の発行依頼 済み</span>'
      +'<b style="font-size:11px;color:var(--sub)">'+esc(d.seikyuRequested.ts||'')+'</b></div></div>';
  }
  return '<div class="bm-warn" style="margin-top:8px">🧾 <b>請求書払い</b>です。<b>発行依頼がまだ</b>です。'
    +'<div style="margin-top:3px">閉店報告までに出してください（残っていると閉店チェックを送れません）。</div>'
    +'<div class="bm-row" style="margin-top:7px"><button class="bm-btn pri sm" onclick="bmSeikyuRequest()">🧾 請求書の発行を依頼する</button></div></div>';
}
function bmSeikyuRequest(){
  var d=bmGet(BM.key), c=bmCalc(d);
  var b=bmBills().filter(function(x){ return String(x.rowIdx)===String(BM.key); })[0]||{};
  if(typeof openSeikyu!=='function'){ alert('請求書の画面が見つかりません'); return; }
  SK_FROM_POS={ key:String(BM.key) };
  openSeikyu();
  /* 金額と摘要を入れておく。⚠️請求先はボス/黒服が選ぶ＝ここでは決められない */
  setTimeout(function(){
    try{
      var nm=String(b.cust||'').replace(/\s*様\s*$/,'').trim();
      SK_ITEMS=[{name:(nm?nm+' 様　':'')+'ご利用分（'+(bmDateKey()||'')+'）',amount:c.total}];
      SK_NOTE=(b.floor||'')+' '+(b.table||'')+'　'+nm+' 様　'+bmYen(c.total);
      SK_NOTE_TOUCHED=true;
      if(typeof renderMenu==='function') renderMenu();
    }catch(e){}
  },350);
}
/* 請求書の送信が通ったらPOS側に刻む。⚠️skSubmitの成功時から呼ばれる */
function bmSeikyuDone_(){
  if(!SK_FROM_POS) return;
  var k=SK_FROM_POS.key; SK_FROM_POS=null;
  bmLoad();
  var d=BM.draft[k]; if(!d) return;
  /* ⚠️金額も一緒に覚える＝会計をやり直して金額が変わったら「出し直し」を要求するため */
  d.seikyuRequested={ ts:bmNowStr_(), by:(typeof LOGIN!=='undefined'?LOGIN:''), total:bmCalc(d).total };
  var keep=BM.key; BM.key=k; bmSave(); BM.key=keep;
  if(typeof POS_DAY!=='undefined'&&document.getElementById('cc-pos-gate')) ccPosLoad();
}
/* ============================================================================
   🖨 お会計伝票（お客様に見せる紙）＝TRUSTが刷っていた「会計伝票」の置き換え。
   ----------------------------------------------------------------------------
   ■ **会計の前**に刷ってお客様に確認してもらう紙。領収書とは別物＝「領収いたしました」は書かない。
   ■ 実物（TRUST出力）の並び：店名/住所/TEL → 会計伝票 → テーブル・人数 →
     [同伴/担当・予約] → [セット] → [注文] → 小計・税サ → 合計（お一人様）→ 未領収金 → 登録番号。
   ■ ⚠️**キャストへの帰属（誰に付けたか）は刷らない**。お客様に見せる紙に内部の売上配分は出さない。
     ウェルカムは「無料」と出す＝出した事実は見せるが金額は立てない。
   ■ 桁組みは**半角48桁**（TM-M30の80mm・フォントA）。日本語は2桁で数える（bmW_）。
     ⚠️実機で折り返すようなら BM_SLIP_COLS を下げる。ここだけ直せば全体が揃う。
============================================================================ */
var BM_SLIP_COLS=48;
var BM_SLIP_TEL='052-228-1544';
function bmW_(s){ var n=0; s=String(s||''); for(var i=0;i<s.length;i++) n+=(s.charCodeAt(i)>0x7f?2:1); return n; }
function bmCut_(s,max){ var o='',n=0; s=String(s||''); for(var i=0;i<s.length;i++){ var w=(s.charCodeAt(i)>0x7f?2:1); if(n+w>max) break; o+=s[i]; n+=w; } return o; }
function bmPadR_(s,w){ s=bmCut_(s,w); var d=w-bmW_(s); return s+(d>0?new Array(d+1).join(' '):''); }
function bmPadL_(s,w){ s=bmCut_(s,w); var d=w-bmW_(s); return (d>0?new Array(d+1).join(' '):'')+s; }
/* 明細1行＝品名 / 単価 / 点数 / 金額。名前が長いときは名前だけ先に1行出す（実物と同じ挙動） */
function bmSlipItem_(name,unit,qty,amt){
  var C=BM_SLIP_COLS, nameW=C-30;                                  // 単価10 / 点数8 / 金額12
  var right=bmPadL_(unit,10)+bmPadL_(qty,8)+bmPadL_(amt,12);
  var nm=' '+String(name||'');
  if(bmW_(nm)<=nameW) return bmPadR_(nm,nameW)+right;
  return [nm, bmPadR_('',nameW)+right];
}
function bmSlipSep_(ch){ return new Array(BM_SLIP_COLS+1).join(ch||'-'); }
/* 伝票の中身を行の配列で返す。{t:本文, a:'l'|'c', big:1} */
/* mode: 'check'=会計伝票（会計前にお客様へ）/ 'guest'=お客様控え / 'store'=店舗控え
   ⚠️**店舗控えだけ**が内部情報（会員番号・注文の帰属）を載せる。お客様に渡す2枚には出さない。 */
function bmSlipLines_(d,c,bill,mode){
  mode=mode||'check';
  var store=(mode==='store'), guest=(mode==='guest');
  var L=[], pax=(d.guests||[]).length||1;
  L.push({t:RCPT_ISSUER.name,a:'c',big:1});
  if(!store){
    if(RCPT_ISSUER.addr) L.push({t:RCPT_ISSUER.addr,a:'c'});
    L.push({t:'TEL '+(RCPT_ISSUER.tel||BM_SLIP_TEL),a:'c'});
  }
  L.push({t:'',a:'l'});
  L.push({t:(store?'店 舗 控 え':(guest?'お 客 様 控 え':'会 計 伝 票')),a:'c',big:1});
  L.push({t:bmSlipSep_('='),a:'l'});
  if(store){
    L.push({t:'印字　　：'+bmNowStr_(),a:'l'});
    L.push({t:'登録番号：'+RCPT_ISSUER.invoiceNo,a:'l'});
    if(bill.inT)    L.push({t:'来店　　：'+bill.inT,a:'l'});
    if(bill.member) L.push({t:'会員番号：'+bill.member,a:'l'});
    L.push({t:'お客様　：'+(bill.cust||''),a:'l'});
  }
  L.push({t:bmPadR_('テーブル： '+bmTblLabel_(bill.floor,bill.table),BM_SLIP_COLS-14)+bmPadL_('人数： '+pax+'名',14),a:'l'});
  if(!store) L.push({t:bmNowStr_(),a:'l'});   /* 店舗控えは冒頭の「印字」が同じ役目＝2回出さない */
  /* ⚠️ボス指示＝**担当・予約は名前だけ**（金額も点数も出さない）。いえやすは担当¥0・予約¥0＝
     ¥0と0点を並べても紙が読みにくくなるだけ。金額が立つ同伴は別ブロックで明細として出す。 */
  var tan=[],yoy=[],doh=[];
  Object.keys(d.casts||{}).forEach(function(n){
    var v=d.casts[n]||{};
    if(v.tanto)  tan.push(n);
    if(v.yoyaku) yoy.push(n);
    if(v.dohan)  doh.push([n,v.dohan]);
  });
  /* ⚠️実物（店舗控え）は**同伴が先・担当が後**。順番を合わせる＝金額が立つ物から見せる */
  if(doh.length){
    L.push({t:'',a:'l'}); L.push({t:'[ 同伴 ]',a:'l'});
    doh.forEach(function(x){
      var r=bmSlipItem_(x[0],bmYen(BM_FEE.dohan),x[1]+'点',bmYen(BM_FEE.dohan*x[1]));
      (r instanceof Array?r:[r]).forEach(function(t){ L.push({t:t,a:'l'}); });
    });
  }
  if(tan.length||yoy.length){
    L.push({t:'',a:'l'}); L.push({t:'[ 担当 / 予約 ]',a:'l'});
    tan.forEach(function(n){ L.push({t:' 担当　'+n,a:'l'}); });
    yoy.forEach(function(n){ L.push({t:' 予約　'+n,a:'l'}); });
  }
  // セット＝同額はまとめる（実物が「120分 ¥13,000 2点 ¥26,000」と出しているのと同じ）
  var byPrice={},order=[];
  (d.guests||[]).forEach(function(g){ var p=Number(g.price)||0; if(!byPrice[p]){byPrice[p]=0;order.push(p);} byPrice[p]++; });
  if(order.length){
    L.push({t:'',a:'l'}); L.push({t:'[ セット ]',a:'l'});
    order.forEach(function(p){
      var r=bmSlipItem_(BM_FEE.setMinutes+'分',bmYen(p),byPrice[p]+'点',bmYen(p*byPrice[p]));
      (r instanceof Array?r:[r]).forEach(function(t){ L.push({t:t,a:'l'}); });
    });
  }
  if((d.orders||[]).length){
    L.push({t:'',a:'l'}); L.push({t:'[ 注文 ]',a:'l'});
    d.orders.forEach(function(o){
      /* ⚠️帰属（誰に付けたか）は**店舗控えだけ**。お客様に渡す紙に内部の売上配分は出さない */
      if(store){
        L.push({t:' '+o.name,a:'l'});
        var r2=bmSlipItem_('  '+bmAttrOf(o),bmYen(o.price),o.qty+'点',bmYen(o.price*o.qty));
        (r2 instanceof Array?r2:[r2]).forEach(function(t){ L.push({t:t,a:'l'}); });
      }else{
        /* 🍹キャストドリンクだけは、お客様に渡す紙にもキャスト名を出す（ボス指示 2026-08-28）。
           ⚠️他の品の帰属は従来どおり店舗控えだけ＝お客様に内部の売上配分は見せない。
             キャストドリンクは「誰に出した1杯か」がお客様にとっても意味のある情報なので例外にする。
           ⚠️「お客様」に付けた分は名前を出さない（自分の名前を書いても意味がない）。
           ⚠️genre は注文行に保存済み。古い下書きには入っていないことがある＝その時は従来どおり出ない。 */
        var onm=o.name;
        if(bmIsCastDrink_(o.genre)){
          var who=bmAttrOf(o).split('・').filter(function(x){ return x&&x!=='お客様'; }).join('・');
          /* 区切りは半角スペース＝品名欄は18桁しかない。全角にすると1桁ぶん余計に食って
             「カシスソーダ まや」(18桁)ですら金額が次の行に回る。名前が長い品は従来どおり2行に折れる。 */
          if(who) onm+=' '+who;
        }
        var r=bmSlipItem_(onm,bmYen(o.price),o.qty+'点',bmYen(o.price*o.qty));
        (r instanceof Array?r:[r]).forEach(function(t){ L.push({t:t,a:'l'}); });
      }
    });
  }
  if((d.welcome||[]).length){
    L.push({t:'',a:'l'}); L.push({t:'[ ウェルカムドリンク ]',a:'l'});
    d.welcome.forEach(function(w){
      var r=bmSlipItem_(w.name,'',w.qty+'点','無料');
      (r instanceof Array?r:[r]).forEach(function(t){ L.push({t:t,a:'l'}); });
    });
  }
  L.push({t:'',a:'l'}); L.push({t:bmSlipSep_('-'),a:'l'});
  L.push({t:bmPadR_('小計',BM_SLIP_COLS-14)+bmPadL_(bmYen(c.base),14),a:'l'});
  L.push({t:bmPadR_('税サ別商品の税サ等',BM_SLIP_COLS-14)+bmPadL_(bmYen(c.tax),14),a:'l'});
  if(Number(d.discount)) L.push({t:bmPadR_('値引',BM_SLIP_COLS-14)+bmPadL_('-'+bmYen(d.discount),14),a:'l'});
  if(Number(d.surcharge)) L.push({t:bmPadR_('値増',BM_SLIP_COLS-14)+bmPadL_(bmYen(d.surcharge),14),a:'l'});
  L.push({t:bmSlipSep_('-'),a:'l'});
  /* ⚠️合計は**3倍角**（ボス指示で大きく）。3倍角は半角16桁しか入らない＝この行だけ桁組みが別物。
     ここを48桁のまま組むと実機で折り返す。 */
  L.push({t:bmPadR_('合計',6)+bmPadL_(bmYen(c.total),10),a:'l',big:2});
  L.push({t:bmPadL_('（お一人様 '+bmYen(Math.round(c.total/pax))+'）',BM_SLIP_COLS),a:'l'});
  /* 📅前回のお預かりは**合計の外**に出す＝今回の売上と混ぜない。紙でもお客様に見える形にする */
  if(c.carry>0){
    L.push({t:'',a:'l'});
    L.push({t:bmPadR_('前回のお預かり',BM_SLIP_COLS-14)+bmPadL_(bmYen(c.carry),14),a:'l'});
    /* ⚠️3倍角は半角16桁しか入らない＝「ご請求合計」(10桁)＋金額(10桁)で溢れる。
       大きい行のラベルは「請求」(4桁)にして、説明は下の通常サイズの行に出す。 */
    L.push({t:bmPadR_('請求',6)+bmPadL_(bmYen(c.due),10),a:'l',big:2});
    L.push({t:bmPadL_('（前回のお預かりを含むご請求合計）',BM_SLIP_COLS),a:'l'});
  }
  if(c.next>0){
    L.push({t:'',a:'l'});
    L.push({t:bmPadR_('次回来店時のお支払い',BM_SLIP_COLS-14)+bmPadL_(bmYen(c.next),14),a:'l'});
  }
  L.push({t:'',a:'l'});
  /* ⚠️ボス指示＝**未領収金は出さない**（合計が分かれば足りる）。
     会計伝票（会計前）は支払欄も出さない＝まだ払っていないため。控え2枚には出す。
     ⚠️2026-08-28修正＝`c.paid>0`だけで判定していたので、**⑧に支払を入れた後に会計伝票を出し直すと
       お客様に見せる紙にお預り／お釣りが載っていた**。判定は必ず**mode**で切る（金額の状態で切らない）。 */
  if((guest||store)&&c.paid>0){
    if(d.pay.cash)   L.push({t:bmPadR_('お預り（現金）',BM_SLIP_COLS-14)+bmPadL_(bmYen(d.pay.cash),14),a:'l'});
    if(d.pay.card)   L.push({t:bmPadR_('カード',BM_SLIP_COLS-14)+bmPadL_(bmYen(d.pay.card),14),a:'l'});
    if(d.pay.credit) L.push({t:bmPadR_('請求書払い',BM_SLIP_COLS-14)+bmPadL_(bmYen(d.pay.credit),14),a:'l'});

function bmSlipXml_(){
  var NL='&#10;', L=[];
  L.push('<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">');
  L.push('<text lang="ja"/>');
  (BM.slip||[]).forEach(function(l){
    L.push('<text align="'+(l.a==='c'?'center':'left')+'"/>');
    var _sz=(l.big===2?3:(l.big?2:1));

    L.push('<text>'+esc(l.t||' ')+NL+'</text>');
  });
  L.push('<text width="1" height="1" em="false"/>');
  L.push('<feed unit="40"/><cut type="feed"/></epos-print>');
  return L.join('');
}

function bmPayMethod(k){
  if(bmLockedAlert_()) return;
  var d=bmGet(BM.key), c=bmCalc(d);
  d.payMethod=k;
  d.pay={cash:0,card:0,credit:0,next:0};
  /* ⚠️入れるのは**請求額(due)**＝前回の未収も含めた「お客様が払う額」。totalだと前回分が埋まらない */
  if(k==='cash') d.pay.cash=c.due;
  else if(k==='card') d.pay.card=c.due;
  else if(k==='next') d.pay.next=c.due;   // 📅次回来店時払い＝今回は受け取らない
  else d.pay.credit=c.due;                // 請求書払い＝売掛

/* 領収書＝既存の発行画面を開いて、宛名と金額を入れておく。
   ⚠️カード払いは印紙不要の判定が変わるのでRCPT_CASHも合わせる */
function bmOpenReceipt(){
  var d=bmGet(BM.key), c=bmCalc(d);
  var b=bmBills().filter(function(x){ return String(x.rowIdx)===String(BM.key); })[0]||{};
  if(typeof openReceipt!=='function'){ alert('領収書の画面が見つかりません'); return; }
  openReceipt();
  /* ⚠️2026-08-28修正＝`payMethod!=='card'` で現金/カードを決めていた。payMethodは**最後に押した
     チップを覚えているだけ**なので、分割払い（一部現金・一部カード）で必ず狂う。
       ・現金チップ→金額だけ分けた → 全額が現金扱い＝**要らない印紙を貼る**
       ・カードチップ→現金も受け取った → 印紙0＝**貼るべき印紙を貼らない**（過怠税）
     ⭐渡すのは**実際の内訳**。現金は「売上に充当した額」＝お預り(釣り銭込み)ではない。 */
  var cardAmt=Number(d.pay&&d.pay.card)||0, creditAmt=Number(d.pay&&d.pay.credit)||0;
  var cashApplied=Math.max(0, c.total-cardAmt-creditAmt);
  if(typeof RCPT_SPLIT!=='undefined') RCPT_SPLIT={cash:cashApplied, card:cardAmt, other:creditAmt};
  /* 複数枚に割るときの基準＝この会計の金額と内訳。⚠️超過（二重領収書）を止めるのに使う */
  if(typeof RCPT_BASE!=='undefined'){ RCPT_BASE=c.total; RCPT_BASEPAY={cash:cashApplied, card:cardAmt, other:creditAmt}; }
  if(typeof rcptSetCash==='function') rcptSetCash(cashApplied>0, true, true);   // 表示のトグルも合わせる
  else if(typeof RCPT_CASH!=='undefined') RCPT_CASH=(cashApplied>0);
  var nm=String(b.cust||'').replace(/\s*様\s*$/,'').trim();
  setTimeout(function(){
    var a=document.getElementById('rcpt-atena'), m=document.getElementById('rcpt-amt');
    if(a&&nm){ a.value=nm+' 様'; if(typeof RCPT_ATENA!=='undefined') RCPT_ATENA=nm+' 様'; }
    if(m) m.value=c.total;
    if(typeof rcptSetCash==='function') rcptSetCash(cashApplied>0, true, true);  // 描画後にトグルの見た目を合わせる
    if(typeof rcptCalc==='function') rcptCalc();
  },350);
}

/* ⚠️送信中フラグ。会計ボタンは**必ず連打される**（反応が無いともう一度押す）。
   backendは二重会計を弾くが、弾いたエラーが客前で出るのは事故に見える＝手前で止める。 */
/* ============================================================================
   📅 次回来店時払いを**顧客の「次回対応メモ」**に残す（ボス指示＝回収漏れをなくす）
   ----------------------------------------------------------------------------
   ■ メモは予約一覧に📌として出る＝次に来た時に黒服の目に必ず入る。
     さらに伝票を開くと bmSeedCarry_ が金額を拾って自動で請求に乗せる。
   ⚠️`kioskSaveNextVisitMemo` は**上書き**＝既存メモを読んで書き戻すこと（消すと事故）。
   ⚠️回収し終わったら**古いタグを必ず消す**。残すと次回また請求してしまう。
   ⚠️タグは人が手で編集できる場所に置く＝壊れていたら金額を拾わない（黙って0にしない）。
============================================================================ */
function bmNextTag_(amount,dateKey,where){
  return '【次回精算】¥'+(Number(amount)||0).toLocaleString('ja-JP')+'（'+(dateKey||'')+' '+(where||'')+'）';
}
function bmSaveNextMemo_(key,d,c,bill){
  try{
    var r=bmRsvOf_(key)||{};
    var no=String((bill&&bill.member)||r.mem||'').trim();
    var nm=String((bill&&bill.cust)||r.cust||'').trim();
    if(!no&&!nm) return;                                   // 誰の記録か決まらない＝書かない
    var cur=String(r.nextMemo||(d.carry&&d.carry.memo)||'');
    /* 古い【次回精算】は消す＝回収済みを残すと次回また請求する */
    var base=cur.replace(/【次回精算】[^\n]*/g,'').replace(/\n{2,}/g,'\n').trim();
    var memo=base;
    if(c.next>0){
      var where=String((d._table||(bill&&bmTblLabel_(bill.floor,bill.table))||'')).trim();
      memo=(base?base+'\n':'')+bmNextTag_(c.next,bmDateKey(),where);
    }
    if(memo===cur) return;
    gsr('kioskSaveNextVisitMemo',no,nm,memo).then(function(res){
      if(res&&res.ok){
        if(r) r.nextMemo=memo;                             // 手元の予約行にも反映（すぐ📌に出る）
        if(typeof toast==='function') toast(c.next>0?'📌 次回精算をお客様のメモに記録しました':'📌 前回のお預かりを回収済みにしました');
      }else if(typeof toast==='function') toast('⚠️ 次回精算のメモを保存できませんでした（手で控えてください）');
    }).catch(function(){ if(typeof toast==='function') toast('⚠️ 次回精算のメモを保存できませんでした（手で控えてください）'); });
  }catch(e){}
}
var BM_CLOSING=false;
function bmClose(){
  if(BM_CLOSING) return;
  var d=bmGet(BM.key),c=bmCalc(d);
  if(bmClosed_(d)) return;
  if(c.due<=0){ alert('金額が0円です。'); return; }
  if(c.unpaid>0){ alert('お預りが'+bmYen(c.unpaid)+'不足しています。\n現金／カード／売掛／次回来店時で'+bmYen(c.due)+'を埋めてください。'); return; }
  /* 🧪お試し伝票も会計を押せるようにする（ボス指示 2026-08-28）＝会計の流れと控えの出方をそのまま試せる。
     ⛔ただし backend(posCloseBill) には**送らない**。検算の落書きを店の会計記録に混ぜないため
        （お試しは共有もしていない＝この方針で一貫させる）。画面上だけ会計済みにして控えまで出す。 */
  if(BM.key==='demo'){
    if(!confirm('🧪 お試し伝票の会計です。\n合計 '+bmYen(c.total)+'\n\n※検算用なので店の記録には残りません。\nよろしいですか？')) return;
    var dm=bmGet('demo');
    dm.closed={ ts:bmNowStr_(), by:(typeof LOGIN!=='undefined'?LOGIN:''), total:c.total, demo:true };

    bmSlipPreview('guest');   // 本番と同じ流れ＝会計→お客様控え
    return;
  }
  var b=bmBills().filter(function(x){ return String(x.rowIdx)===String(BM.key); })[0]||{};
  if(!confirm('会計します。\n合計 '+bmYen(c.total)+'\nお預り 現金 '+bmYen(d.pay.cash||0)+' ／ カード '+bmYen(d.pay.card||0)+' ／ 売掛 '+bmYen(d.pay.credit||0)
      +(c.unpaid<0?('\nお釣り '+bmYen(-c.unpaid)):'')+'\n\nよろしいですか？')) return;
  var rec={ floor:b.floor||'', table:b.table||'', cust:b.cust||'', pax:(d.guests||[]).length,
            tantou:d.tantou||'', uriban:d.uriban?1:0,
            setSum:c.setSum, tanto:c.tc*BM_FEE.tanto, yoyaku:c.yc*BM_FEE.yoyaku, dohan:c.dc*BM_FEE.dohan,
            ordSum:c.ordSum, welCount:(d.welcome||[]).reduce(function(a,w){return a+(w.qty||0);},0),
            discount:Number(d.discount)||0, surcharge:Number(d.surcharge)||0,
            base:c.base, tax:c.tax, total:c.total,
            /* ⚠️現金は**お預り**と**売上に充当した額**を分けて渡す。混ぜると現金売上の集計が釣り銭ぶん過大になる */
            cash:Number(d.pay.cash)||0, card:Number(d.pay.card)||0, credit:Number(d.pay.credit)||0,
            /* ⚠️現金列は「**今回の売上**に充当した現金」。前回のお預かり(carry)の回収分も
               次回に回した分(next)も入れない＝現金売上の集計が狂う。
               お釣り＝受け取った現金 −（現金で払うべき額＝請求 − カード − 売掛 − 次回）。 */
            cashApplied:Math.max(0,Math.min(Number(d.pay.cash)||0,
                          c.total-(Number(d.pay.card)||0)-(Number(d.pay.credit)||0)-c.next)),
            change:Math.max(0,(Number(d.pay.cash)||0)-(c.due-(Number(d.pay.card)||0)-(Number(d.pay.credit)||0)-c.next)),
            /* backendは今この2つを読まない（列が無い）＝無視される。下書きJSON(POS_伝票)には残るので
               「合計 −（現金+カード+売掛）＝次回来店時払い」で後から追える。列を足すのは次の段。 */
            carry:c.carry, nextPay:c.next };
  /* ⚠️`bmRender()`を挟むと`bmLoad()`が下書きを**作り直す**＝ここで掴んでいる`d`は死ぬ。
     成功後は必ずキーから取り直すこと（これで一度「会計済みが記録されない」を踏んだ） */
  var key=String(BM.key);
  BM_CLOSING=true; bmRender();
  gsr('posCloseBill',bmDateKey(),key,rec,(typeof LOGIN!=='undefined'?LOGIN:''))
    .then(function(r){
      BM_CLOSING=false;
      if(!r||!r.ok){ alert('会計できませんでした：'+((r&&r.error)||'不明')); bmRender(); return; }
      bmLoad();

      dd.closed={ ts:r.ts, by:(typeof LOGIN!=='undefined'?LOGIN:''), total:c.total };
      /* ⚠️2026-08-28追加＝会計を取り消して**金額を直して締め直した**のに、請求書の依頼済みの印が
         残っていた＝閉店ゲートが請求依頼を要求しないまま、**古い金額の請求書が出たまま**になる。
         金額が変わっていたら印を外して出し直させる。変わっていなければ二重請求を作らない。 */
      if(Number(dd.pay&&dd.pay.credit)>0&&dd.seikyuRequested&&Number(dd.seikyuRequested.total||0)!==c.total){

      }

      if(c.next>0||dd.carry) bmSaveNextMemo_(key,dd,c,b);
      if(dd.carry) delete dd.carry;      // 回収したので伝票からは落とす（記録は会計行と控えに残る）
      BM.key=key; bmSave(); bmRender();
      bmSlipPreview('guest');   // 決済が終わったら、まずお客様控えを出す（ボスの流れ）
    })
    .catch(function(e){ BM_CLOSING=false; bmRender(); alert('会計できませんでした：'+((e&&e.message)||'通信エラー')+'\nもう一度お試しください。'); });

      if(!r||!r.ok){ alert('取り消せませんでした：'+((r&&r.error)||'不明')); bmRender(); return; }
      bmLoad();
      var dd=BM.draft[rkey]; if(dd) delete dd.closed;
      BM.key=rkey; bmSave(); bmRender();
    })
    .catch(function(e){ BM_CLOSING=false; bmRender(); alert('取り消せませんでした：'+((e&&e.message)||'通信エラー')); });
}

function bmTantouChips_(nm,pool){

    return '<div class="chips" style="margin-top:3px">'+list.map(function(n){

function bmTantouOpen(){ BM.tantouOpen=!BM.tantouOpen; bmRender(); }
/* 担当を差し替える。⚠️④キャストの「担当」回数も一緒に動かす＝2箇所で食い違わせない */
function bmTantouSet(n){ if(bmLockedAlert_()) return;
  var d=bmGet(BM.key), old=String(d.tantou||'').trim();
  n=String(n||'').trim();
  if(old&&d.casts[old]) d.casts[old].tanto=0;
  d.tantou=n;
  if(n){
    if(!d.casts[n]) d.casts[n]={tanto:0,yoyaku:0,dohan:0};
    d.casts[n].tanto=Math.max(1,d.casts[n].tanto||0);
    if(!Array.isArray(d.castSel)) d.castSel=[];
    if(d.castSel.indexOf(n)<0) d.castSel.unshift(n);
  }
  BM.tantouOpen=false; bmSave(); bmRender();
}
function bmUriban(v){ if(bmLockedAlert_()) return; var d=bmGet(BM.key); d.uriban=v?1:0; bmSave(); bmRender(); }

/* 候補チップ。出勤／出勤外を分けて出す（出勤外＝担当だけ来店するケース用） */
function bmCastChips_(d,pool){
  function chips(list){
    return '<div class="chips" style="margin-top:3px">'+list.map(function(n){
      var on=bmCastShown(d).indexOf(n)>=0;
      return '<div class="chip cast'+(on?' sel':'')+'" onclick="bmCastPick(\''+jsStr(n)+'\')">'+esc(n)+'</div>';
    }).join('')+'</div>';
  }
  return (pool.work.length?'<div class="bm-note" style="margin-top:5px">本日出勤</div>'+chips(pool.work):'')
    +(pool.rest.length?'<div class="bm-note" style="margin-top:6px">出勤外（担当だけ来店する場合はここから）</div>'+chips(pool.rest):'');
}
/* 画面に出すキャスト＝**選んだ人だけ**。⚠️回数が入っている人は選び忘れでも必ず出す
   （出さないと金額だけ生きて見えない伝票になる） */
function bmCastShown(d){
  if(!Array.isArray(d.castSel)) d.castSel=[];
  Object.keys(d.casts||{}).forEach(function(n){
    var v=d.casts[n]||{};
    if(((v.tanto||0)+(v.yoyaku||0)+(v.dohan||0))>0&&d.castSel.indexOf(n)<0) d.castSel.push(n);
  });
  return d.castSel;
}
function bmCastOpen(){ BM.castOpen=!BM.castOpen; bmRender(); }
function bmCastPick(n){ if(bmLockedAlert_()) return;
  var d=bmGet(BM.key),a=bmCastShown(d);
  if(a.indexOf(n)>=0){ bmCastDrop(n); return; }
  a.push(n); bmSave(); bmRender();
}
function bmCastDrop(n){ if(bmLockedAlert_()) return;
  var d=bmGet(BM.key),a=bmCastShown(d),i=a.indexOf(n);
  if(i>=0) a.splice(i,1);
  if(d.casts) delete d.casts[n];   // 回数も一緒に消す
  bmSave(); bmRender();
}
function bmCnt(n,key,label,cls,val){
  return '<div class="bm-cnt"><span class="k '+cls+'">'+label+'</span>'
    +'<button onclick="bmBump(\''+jsStr(n)+'\',\''+key+'\',-1)">−</button><span>'+val+'</span>'
    +'<button onclick="bmBump(\''+jsStr(n)+'\',\''+key+'\',1)">＋</button></div>';
}

function bmDelPrice(num){ if(bmLockedAlert_()) return;
  var a=bmPrices().filter(function(x){return x!==num;});

function bmGuestPrice(i,v,full){ if(bmLockedAlert_()) return;

/* 🔥品をタップ→**すぐカートに入れず**「誰に付けるか」を選ばせる（ボス依頼）。
   帰属を先に選ぶ方式だと、切り替え忘れで**別のキャストの売上に付く事故**が起きるため。
   ⚠️複数選べる＝1本を複数キャストで折半できる（TRUSTは1行1帰属なのでこれができない）。
   ⭐ただし🍹キャストドリンクだけは折半しない（ボス指示 2026-08-28）＝各自が1杯もらう物なので
     **選んだ人それぞれに1杯ずつ**入れる。⚠️お客様の請求は人数ぶん増える（従来は1杯を分けていた）。 */
function bmIsCastDrink_(genre){ return String(genre||'')==='キャストドリンク'; }
/* いま選んでいる内容が「人数ぶん」になるか（＝キャストドリンクを2人以上に付ける時） */
function bmPickEach_(pk){ return !!(pk && bmIsCastDrink_(pk.genre) && (pk.attrs||[]).length>1); }
function bmPick(nm,pr){ if(bmLockedAlert_()) return;
  var it=bmItem_(nm);
  BM.pick={ name:nm, price:pr, qty:1, attrs:[], genre:(it?it[3]:'') };
  bmRender();
}
function bmPickCancel(){ BM.pick=null; bmRender(); }
function bmPickQty(delta){ if(!BM.pick)return; BM.pick.qty=Math.max(1,BM.pick.qty+delta); bmRender(); }
function bmPickPrice(v,full){ if(!BM.pick)return; BM.pick.price=Math.max(0,Number(v)||0); if(full) bmRender(); }
function bmPickAttr(a){
  if(!BM.pick)return;
  var i=BM.pick.attrs.indexOf(a);
  if(i>=0) BM.pick.attrs.splice(i,1); else BM.pick.attrs.push(a);
  bmRender();
}
function bmPickConfirm(){ if(bmLockedAlert_()) return;
  var pk=BM.pick; if(!pk) return;
  if(!pk.attrs.length){ alert('誰に付けるかを選んでください。\n（お客様／スタッフ／キャスト名）'); return; }
  /* ⚠️2026-08-28追加＝マスタに価格0の品が実在する（TRUSTから転記した「出前」）。
     そのまま確定すると**0円の注文行**が静かに入る＝売上が欠ける。単価を入れさせる。
     （無料で出す物は⑤🥂ウェルカムに入っている＝有料側に0円は要らない） */
  if(!(Number(pk.price)>0)){ alert('単価を入れてください。\n（この品はマスタに価格が入っていません）'); return; }
  var d=bmGet(BM.key);
  /* キャストドリンク＝1人1行（それぞれに1杯）／それ以外＝従来どおり1行に複数帰属（折半） */
  var groups = bmPickEach_(pk) ? pk.attrs.map(function(a){ return [a]; }) : [pk.attrs.slice()];
  groups.forEach(function(at){
    var key=at.join('・'), hit=-1;
    d.orders.forEach(function(o,i){ if(o.name===pk.name&&bmAttrOf(o)===key&&o.price===pk.price) hit=i; });
    if(hit>=0) d.orders[hit].qty+=pk.qty;
    else d.orders.push({name:pk.name,genre:pk.genre,price:pk.price,qty:pk.qty,attrs:at});
  });
  BM.pick=null; bmSave(); bmRender();
}
/* 旧形式(attr単一文字列)の下書きとの互換。表示・突合はこの関数を通す */
function bmAttrOf(o){ return (o.attrs&&o.attrs.length)?o.attrs.join('・'):String(o.attr||''); }
/* 「誰に付けるか」ポップアップ本体 */
function bmPickHtml(){
  var pk=BM.pick; if(!pk) return '';
  var ap=bmAttrPool();
  return '<div class="bm-modal-bg" onclick="bmPickCancel()"></div>'
    +'<div class="bm-modal">'
    +'<div style="font-size:16px;font-weight:800">'+esc(pk.name)+(pk.genre?' <span style="font-size:10.5px;color:var(--sub);font-weight:600">'+esc(bmGenreLabel_(pk.genre))+'</span>':'')+'</div>'
    +'<div class="bm-row" style="margin-top:10px"><span class="lb">単価</span>'
    +'<input type="number" class="bm-in" value="'+pk.price+'" oninput="bmPickPrice(this.value)" onchange="bmPickPrice(this.value,1)">'
    +'<span class="lb" style="min-width:auto">数量</span>'
    +'<button class="bm-btn" onclick="bmPickQty(-1)">−</button>'
    +'<span style="font-weight:800;min-width:26px;text-align:center;font-size:15px">'+pk.qty+'</span>'
    +'<button class="bm-btn" onclick="bmPickQty(1)">＋</button>'
    +'<span style="margin-left:auto;color:var(--gold);font-weight:800;font-size:16px">'+bmYen(pk.price*pk.qty*(bmPickEach_(pk)?pk.attrs.length:1))
      +(bmPickEach_(pk)?'<span style="font-size:11px;color:var(--sub);font-weight:700">　'+pk.attrs.length+'人分</span>':'')+'</span></div>'
    +'<div class="bm-note" style="margin-top:10px;font-size:12px;color:var(--accent);font-weight:700">'
      +(bmIsCastDrink_(pk.genre)
        ? '誰に付けますか？（🍹キャスドリ＝選んだ人それぞれに1杯ずつ入ります）'
        : '誰に付けますか？（複数選ぶと折半）')+'</div>'
    +'<div class="chips" style="margin-top:5px">'
    +'<div class="chip'+(pk.attrs.indexOf('お客様')>=0?' sel':'')+'" onclick="bmPickAttr(\'お客様\')">お客様</div>'
    +'</div>'
    +(ap.casts.length?'<div class="bm-note" style="margin-top:7px">キャスト</div><div class="chips" style="margin-top:3px">'
       +ap.casts.map(function(a){ return '<div class="chip cast'+(pk.attrs.indexOf(a)>=0?' sel':'')+'" onclick="bmPickAttr(\''+jsStr(a)+'\')">'+esc(a)+'</div>'; }).join('')+'</div>':'')
    +(ap.kuro.length?'<div class="bm-note" style="margin-top:7px">黒服</div><div class="chips" style="margin-top:3px">'
       +ap.kuro.map(function(a){ return '<div class="chip'+(pk.attrs.indexOf(a)>=0?' sel':'')+'" onclick="bmPickAttr(\''+jsStr(a)+'\')">'+esc(a)+'</div>'; }).join('')+'</div>':'')
    /* 派遣は個別名を出さず1ボタン。ボス指示で**一番下**に固定（キャスト・黒服より後） */
    +'<div class="chips" style="margin-top:9px">'
    +'<div class="chip cast'+(pk.attrs.indexOf('派遣')>=0?' sel':'')+'" onclick="bmPickAttr(\'派遣\')">派遣</div>'
    +'</div>'
    +'<div class="bm-row" style="margin-top:14px">'
    +'<button class="bm-btn pri" style="flex:1;padding:12px" onclick="bmPickConfirm()">✅ この内容で入れる</button>'
    +'<button class="bm-btn" onclick="bmPickCancel()">キャンセル</button></div>'
    +'</div>';
}
function bmAdhoc(){ if(bmLockedAlert_()) return;
  var nm=(document.getElementById('bmAdNm').value||'').trim(),pr=Number(document.getElementById('bmAdPr').value)||0;
  if(!nm){ alert('品名を入れてください'); return; }
  bmPick(nm,pr);   // 臨時商品も同じポップアップを通す
}
/* 注文1行の単価を都度変更（ボス依頼＝ボトルは値付けがその場で変わる）。
   既定はマスタの登録価格のまま。⚠️打っている最中に全描画するとカーソルが飛ぶので確定(onchange)で整える。 */
function bmOrdPrice(i,v,full){ if(bmLockedAlert_()) return;
  var d=bmGet(BM.key); if(!d.orders[i]) return;
  d.orders[i].price=Math.max(0,Number(v)||0); bmSave();
  if(full) bmRender(); else bmTouch();
}
function bmQty(i,delta){ if(bmLockedAlert_()) return;
  var d=bmGet(BM.key); d.orders[i].qty+=delta;
  if(d.orders[i].qty<=0) d.orders.splice(i,1);
  bmSave(); bmRender();
}
/* ⚠️2026-08-28＝TRUSTとの照合（bmVerdictHtml/bmHint_/bmLog*）はボス指示で撤去。
   TRUSTと切り離した本番を想定するため。復活させるならgit履歴から。 */
function bmTouch(){
  if(!BM.key) return;
  var d=bmGet(BM.key), c=bmCalc(d), e;
  var setSum=(d.guests||[]).reduce(function(a,g){return a+(Number(g.price)||0);},0);
  if(e=document.getElementById('bmSetSum')) e.textContent=bmYen(setSum);
  if(e=document.getElementById('bmSetRow')) e.textContent=bmYen(setSum);
  if(e=document.getElementById('bmSub'))    e.textContent=bmYen(c.base);
  if(e=document.getElementById('bmTax'))    e.textContent=bmYen(c.tax);
  if(e=document.getElementById('bmGrand'))  e.textContent=bmYen(c.total);
  if(e=document.getElementById('bmPaid'))   e.textContent=bmYen(c.paid);
  if(e=document.getElementById('bmUnpaid')){ e.textContent=bmYen(c.unpaid); e.style.color=(c.unpaid===0?'var(--green)':'var(--red)'); }
}
/* ⚠️2026-08-28修正＝`Number(v)||0`だけだったので**マイナスがそのまま入っていた**。
   値引に -10,000 を打つと合計が10,000増える（＝お客様への過大請求）。値増も同じ。
   さらに値引が大きすぎると合計がマイナス（実測 -99,968,700）になり、紙にも出る。
   ⭐入口で丸める。**計算式(bmCalc)は触らない**＝backendのposCalcTotal_と割れるため。 */
/* ⚠️2026-08-28＝TRUST照合の撤去に伴い「会計後も打てる例外」は無くなった＝会計済みなら一律ロック。 */
function bmField(k,v){
  if(bmLockedAlert_()) return;
  var d=bmGet(BM.key);
  var n=Math.max(0,Number(v)||0);
  if(k==='discount'){
    /* 合計がマイナスになる値引は受け付けない＝値引の上限は「税サまで込みの金額」 */
    var keep=d.discount; d.discount=0; var c0=bmCalc(d); d.discount=keep;
    n=Math.min(n, c0.base+c0.tax+(Number(d.surcharge)||0));
  }
  d[k]=n;
  bmSave(); bmTouch();
}
/* ⚠️2026-08-28修正＝マイナスのお預りが入っていた。現金-50,000でも会計が通り、
   会計行の「お預り」列に負の額が残る＝現金の集計が狂う。入口で0以上に丸める。 */
function bmPay(k,v){ if(bmLockedAlert_()) return; var d=bmGet(BM.key); d.pay[k]=Math.max(0,Number(v)||0); bmSave(); bmTouch(); }
function bmFillCash(){ if(bmLockedAlert_()) return; var d=bmGet(BM.key); d.pay.cash=bmCalc(d).due; d.pay.card=0; d.pay.credit=0; d.pay.next=0; bmSave(); bmRender(); }
/* ⚠️サーバーからも消さないと、間違えて作った伝票が閉店ゲートに永久に残る */
function bmClearServer_(k){
  if(typeof gsr!=='function'||k==='demo') return;
  gsr('posDeleteBill',bmDateKey(),k,(typeof LOGIN!=='undefined'?LOGIN:''))
    .catch(function(){ BM_SYNC_ERR='下書きの取り下げが共有できていません'; bmRenderIfIdle(); });
}
function bmClear(){ if(bmLockedAlert_()) return;
  if(!confirm('この伝票の下書きを消します。よろしいですか？')) return;
  var k=String(BM.key);
  delete BM.draft[k]; bmStash_(); bmClearServer_(k); BM.key=null; bmRender();
}

/* ============ 🍽 自社POS（Phase1: オーダー入力〜伝票明細〜会計サマリ）============
 * backend: getPosOpenBills / getPosBill / getPosMenu / posAddOrders / posVoidOrder
 *          （すべて GUNSHI_API_FNS 登録必須）
 * ■ 伝票の単位＝予約行 rowIdx。席ではない＝相席でも組ごとに伝票が割れる／テーブル移動でも迷子にならない。
 * ■ キャストは注文1行に複数（ボス確定）。既定は席の担当キャスト、行ごとに上書き可。
 *   ⚠️後から遡って足せないデータ＝「誰の売上か」は打った瞬間に確定させる。
 * ■ 画面遷移: 伝票一覧 → 伝票 → ➕注文（カート）→ 確定 → 伝票へ戻る
 */
var POS={menu:null,cats:[],cat:'',tax:null,bill:null,cart:[],defCasts:[],busy:false};
function posYen(n){ return '¥'+(Number(n)||0).toLocaleString('ja-JP'); }
/* この伝票でキャストとして選べる顔ぶれ＝席の担当/同伴 ＋ 本日出勤。重複は落として担当を先頭に。 */
function posCastPool(){
  var out=[],seen={};
  var add=function(n){ n=String(n||'').trim(); if(!n||seen[n])return; seen[n]=1; out.push(n); };
  var r=(POS.bill&&POS.bill.rsv)||{};
  String(r.tantou||'').split(/[、,]/).forEach(add);
  String(r.dohanCast||'').split(/[、,]/).forEach(add);
  ((WORKCASTS!=null&&WORKCASTS.length)?WORKCASTS:CASTS).forEach(add);
  return out;
}
/* ---- ① 伝票一覧（POSのトップ） ---- */
function openPos(){
  closeMenu();
  showSheet('🍽 POS｜伝票一覧','<div class="empty-msg">読み込み中...</div>','full');
  gsr('getPosOpenBills').then(function(d){
    if(!d||!d.ok){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">'+esc((d&&d.error)||'取得できませんでした')+'</div>'; return; }
    document.getElementById('sheetBody').innerHTML=posBillsHtml(d);
  }).catch(function(){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">通信エラー</div>'; });
}
function posBillsHtml(d){
  if(!d.bills.length) return '<div class="empty-msg" style="padding:30px 0">いま席にいる組がありません<div style="font-size:11px;color:var(--sub);margin-top:8px">席にお客様を設定すると、ここに伝票が出ます</div></div>';
  return '<div class="flabel">'+esc(d.date)+'（'+d.bills.length+'組）</div><div class="pos-bills">'
    + d.bills.map(function(b){
        return '<div class="pos-bill" onclick="posOpenBill('+b.rowIdx+')">'
          +'<div class="pb-tbl">'+esc(b.table)+'</div>'
          +'<div class="pb-cust">'+esc(b.cust||'ご来店')+'<span style="font-size:11px;color:var(--sub);font-weight:600"> '+(b.pax||1)+'名</span></div>'
          +'<div class="pb-sub">'+(b.tantou?'担当 '+esc(b.tantou):'担当なし')+(b.time?'・'+esc(b.time)+'〜':'')+'</div>'
          +'<div class="pb-amt">'+posYen(b.sub)+'</div>'
          +'<div class="pb-sub" style="text-align:right">注文'+posYen(b.orderSum)+' / 席料'+posYen(b.seatFee)+'</div>'
          +'</div>';
      }).join('')+'</div>';
}
/* ---- ② 伝票（明細＋会計サマリ） ---- */
function posOpenBill(rowIdx){
  showSheet('🧾 伝票','<div class="empty-msg">読み込み中...</div>','full');
  gsr('getPosBill',rowIdx).then(function(b){
    if(!b||!b.ok){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">'+esc((b&&b.error)||'伝票を開けませんでした')+'</div>'; return; }
    POS.bill=b; posRenderBill();
  }).catch(function(){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">通信エラー</div>'; });
}
function posRenderBill(){
  var b=POS.bill,r=b.rsv||{};
  document.getElementById('sheetTitle').textContent='🧾 '+(r.table||'')+' '+(r.cust||'ご来店')+'様';
  document.getElementById('sheetBody').innerHTML=posBillHtml(b);
}
function posBillHtml(b){

        +'<span style="flex:1"><b>'+esc(o.name)+'</b> <span style="color:var(--sub)">×'+o.qty+'</span>'
        +(o.casts.length?'<div style="font-size:10.5px;color:#79e0a8;font-weight:700;margin-top:2px">👤 '+o.casts.map(esc).join('・')+(o.casts.length>1?'（折半）':'')+'</div>'
                        :'<div style="font-size:10.5px;color:#ff9a5a;font-weight:700;margin-top:2px">👤 キャスト未設定</div>')
        +'</span>'
        +'<span style="min-width:70px;text-align:right;font-weight:800;color:#e6d2a8">'+posYen(o.amount)+'</span>'
        +(voided?'<span style="font-size:10px;color:var(--sub);min-width:40px;text-align:right">取消</span>'
                :'<span style="font-size:11px;color:#f08080;min-width:40px;text-align:right;cursor:pointer" onclick="posVoid(\''+jsStr(o.id)+'\',\''+jsStr(o.name)+'\')">取消</span>')
        +'</div>';

  }
  h+='<div class="pos-sum">'

    +'<div class="ps-row"><span>席料</span><span>'+posYen(c.seatFee)+'</span></div>'
    +'<div class="ps-row"><span>同伴料</span><span>'+posYen(c.dohanFee)+'</span></div>'
    +(c.service?'<div class="ps-row"><span>サービス料</span><span>'+posYen(c.service)+'</span></div>':'')
    +'<div class="ps-row"><span>小計</span><span>'+posYen(c.sub+c.service)+'</span></div>'
    +'<div class="ps-row"><span>消費税（'+Math.round(c.taxRate*100)+'%'+(c.taxInclusive?'・内税':'')+'）</span><span>'+posYen(c.tax)+'</span></div>'
    +'<div class="ps-row total"><span>合計</span><span>'+posYen(c.total)+'</span></div>'
    +'</div>'
    +'<div class="actions">'
    +'<div class="act pri" onclick="posOrderStart('+b.rowIdx+')">➕ 注文を追加</div>'

function posVoid(id,name){
  if(!confirm('「'+name+'」の注文を取り消しますか？\n（明細には取消として残ります）')) return;
  gsr('posVoidOrder',id,LOGIN).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'取り消せませんでした'); return; }
    if(r.bill){ POS.bill=r.bill; posRenderBill(); toast('🗑 取り消しました'); }
    else posOpenBill(POS.bill.rowIdx);
  }).catch(function(){ alert('通信エラー'); });
}
/* ---- ③ 注文パネル（メニュー→カート→確定） ---- */
function posOrderStart(rowIdx){
  POS.cart=[];
  POS.defCasts=String(((POS.bill&&POS.bill.rsv)||{}).tantou||'').split(/[、,]/).map(function(s){return s.trim();}).filter(Boolean);
  if(POS.menu){ POS.cat=POS.cats[0]||''; posRenderOrder(); return; }
  showSheet('🍽 注文','<div class="empty-msg">メニュー読み込み中...</div>','full');
  gsr('getPosMenu').then(function(d){
    if(!d||!d.ok){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">'+esc((d&&d.error)||'メニューを取得できませんでした')+'</div>'; return; }
    POS.menu=d.items; POS.cats=d.cats; POS.tax=d.tax; POS.cat=d.cats[0]||'';
    posRenderOrder();
  }).catch(function(){ document.getElementById('sheetBody').innerHTML='<div class="empty-msg">通信エラー</div>'; });

function posRenderOrder(){
  var r=(POS.bill&&POS.bill.rsv)||{};

function posPanelUpdate(){ var el=document.getElementById('posPanel'); if(el) el.innerHTML=posOrderHtml(); }
function posOrderHtml(){
  if(!POS.menu||!POS.menu.length) return '<div class="empty-msg" style="padding:24px 0">メニューが登録されていません<div style="font-size:11px;color:var(--sub);margin-top:8px">管理コンソールの「店舗メニュー」に品名と価格を登録してください</div></div>';
  var items=POS.menu.filter(function(m){return m.category===POS.cat;});
  var inCart={}; POS.cart.forEach(function(l){ inCart[l.name]=l.qty; });
  var h='<div class="pos-cats">'+POS.cats.map(function(c){
      return '<div class="chip'+(c===POS.cat?' sel':'')+'" onclick="posSetCat(\''+jsStr(c)+'\')">'+esc(c||'その他')+'</div>';
    }).join('')+'</div>'
    +'<div class="pos-grid">'+items.map(function(m){
      var q=inCart[m.name]||0;
      return '<div class="pos-item'+(q?' incart':'')+'" onclick="posPick(\''+jsStr(m.name)+'\')">'
        +'<div class="pi-nm">'+esc(m.name)+(q?' <span style="color:#79e0a8">×'+q+'</span>':'')+'</div>'
        +'<div class="pi-pr'+(m.price?'':' zero')+'">'+(m.price?posYen(m.price):'要価格')+'</div>'
        +'</div>';
    }).join('')+'</div>';
  // カート
  h+='<div class="pos-cart">';
  if(!POS.cart.length){
    h+='<div class="empty-msg" style="padding:14px 0;font-size:12px">品をタップしてカートに入れてください</div>';
  }else{
    var pool=posCastPool();

function posSetCat(c){ POS.cat=c; posPanelUpdate(); }
function posPick(name){
  var m=null; POS.menu.forEach(function(x){ if(x.name===name) m=x; });
  if(!m) return;
  var hit=-1; POS.cart.forEach(function(l,i){ if(l.name===name&&!l.custom) hit=i; });
  if(hit>=0) POS.cart[hit].qty++;
  else POS.cart.push({name:m.name,category:m.category,price:m.price,qty:1,casts:[],custom:false,editing:false});
  posPanelUpdate();
}
function posQty(i,d){
  var l=POS.cart[i]; if(!l) return;
  l.qty+=d;
  if(l.qty<=0) POS.cart.splice(i,1);
  posPanelUpdate();
}
function posLineCasts(l){ return l.custom?l.casts:POS.defCasts; }
function posToggleDefCast(c){
  var i=POS.defCasts.indexOf(c);
  if(i>=0) POS.defCasts.splice(i,1); else POS.defCasts.push(c);
  posPanelUpdate();
}
function posLineEdit(i){
  var l=POS.cart[i]; if(!l) return;
  if(!l.custom){ l.casts=POS.defCasts.slice(); l.custom=true; }   // 個別編集に入った時点で全体から切り離す
  l.editing=!l.editing;
  posPanelUpdate();
}
function posToggleLineCast(i,c){
  var l=POS.cart[i]; if(!l) return;
  l.custom=true;
  var j=l.casts.indexOf(c);
  if(j>=0) l.casts.splice(j,1); else l.casts.push(c);
  posPanelUpdate();
}
function posLineReset(i){
  var l=POS.cart[i]; if(!l) return;
  l.custom=false; l.casts=[]; l.editing=false;
  posPanelUpdate();
}
function posSubmit(){
  if(POS.busy) return;                                  // 連打ガード＝二重に注文を通さない
  if(!POS.cart.length) return;
  var items=POS.cart.map(function(l){ return {name:l.name,category:l.category,price:l.price,qty:l.qty,casts:posLineCasts(l)}; });
  var noCast=items.filter(function(it){ return !it.casts.length; }).length;
  var sum=POS.cart.reduce(function(a,l){return a+l.price*l.qty;},0);
  var msg='この内容で注文を通しますか？\n\n'+POS.cart.map(function(l){return '・'+l.name+' ×'+l.qty;}).join('\n')+'\n\n計 '+posYen(sum);
  if(noCast) msg+='\n\n⚠️ キャスト未設定が '+noCast+' 件あります（後から誰の売上か分からなくなります）';
  if(!confirm(msg)) return;
  POS.busy=true;
  var rowIdx=POS.bill.rowIdx;
  gsr('posAddOrders',rowIdx,items,LOGIN).then(function(r){
    POS.busy=false;
    if(!r||!r.ok){ alert((r&&r.error)||'注文を通せませんでした'); return; }
    POS.cart=[];
    if(r.bill){ POS.bill=r.bill; posRenderBill(); } else posOpenBill(rowIdx);
    toast('🍽 注文を通しました');
  }).catch(function(){ POS.busy=false; alert('通信エラー'); });
}

function rsvActor_(){ var n=(typeof LOGIN!=='undefined'&&LOGIN)?String(LOGIN):''; return n? n+'（'+TERM+'端末）' : TERM+'端末'; }
function submitRsv(){
  afSyncInputs();
  if(addSel.custMode==='new'){ var nm=(addSel.name||'').replace(/\s*様\s*$/,'').trim(); if(nm){ addSel.name=nm; addSel.newCust=true; } }
  var name=(addSel.name||'').replace(/\s*様\s*$/,'').trim();
  if(!name){ alert(addSel.custMode==='search'?'お客様を検索して選択してください':'既存のお客様を検索するか、新規のお名前を入力してください'); return; }
  // ⚠️予約時の注意（ボス指示 2026-08-19）。担当/同伴/予約キャストと卓のフロアを見て判定＝正本はbackend。
  //   ⛔NGキャストは担当に置けない／苦手タイプ・NG行為・同フロアNG客は⚠️承知で続行。
  //   判定対象（客・卓・キャスト）が変わったら必ず取り直す＝担当を差し替えて再送信した時に素通りしない。
  if(IS_GAS){
    var ngCasts=[].concat(addSel.tantou||[],addSel.dohan||[],addSel.yoyaku||[]).filter(Boolean);
    var ngSig=[addSel.member||'',name,(addSel.tables||[]).join('、'),ngCasts.join('、')].join('|');
    if(addSel._ngSig!==ngSig){
      if(addSel._ngBusy) return; addSel._ngBusy=true;
      gsr('gunshiNgCheckReservation',addSel.member||'',name,(addSel.tables||[]).join('、'),ngCasts).then(function(r){

function renewStatus(fd){
  if(!fd) return 'none';
  var p=String(fd).split(/[\/\-\.]/); if(p.length<2)return 'none';
  var fy=parseInt(p[0]), fm=parseInt(p[1]); if(!(fy>1900&&fm>=1))return 'none';
  var n=new Date();
  var ms=(n.getFullYear()*12+(n.getMonth()+1))-(fy*12+fm); // 前回更新からの経過月数
  if(ms>=13) return 'expired';   // 13か月以上 → 会員更新切れ
  if(ms>=12) return 'thismonth'; // 12か月ちょうど（更新月） → 今月更新
  return 'ok';
}
// 会員情報の算出（月単位）: ◯年目 / 会員期限(前回更新+1年) / ステータス
//  前回更新からの経過月数で判定: 12か月ちょうど(＝更新月)=🟡今月更新 / 13か月以上=🔴会員更新切れ / それ未満=🟢有効
function membershipInfo(joined, feeDate){
  var info={yearLabel:'', renewalStr:'', status:'none', monthsSince:null, statusLabel:'', shortLabel:''};
  if(joined){ var jy=parseInt(String(joined).split(/[\/\-\.]/)[0]); if(jy>1900){ var y=(new Date()).getFullYear()-jy+1; if(y>=1) info.yearLabel=y+'年目'; } }
  if(feeDate){
    var p=String(feeDate).split(/[\/\-\.]/);
    if(p.length>=2){
      var ry=parseInt(p[0]), rm=parseInt(p[1]);
      if(ry>1900&&rm>=1){
        var today=new Date();
        var ms=(today.getFullYear()*12+(today.getMonth()+1))-(ry*12+rm); // 経過月数
        info.monthsSince=ms;
        info.renewalStr=(ry+1)+'/'+rm; // 更新期限（前回更新+1年）
        if(ms>=13){ info.status='expired'; info.statusLabel='🔴 会員更新切れ'; info.shortLabel='更新切れ'; }
        else if(ms>=12){ info.status='thismonth'; info.statusLabel='🟡 今月更新'; info.shortLabel='今月更新'; }
        else { info.status='ok'; info.statusLabel='🟢 有効会員'; info.shortLabel='有効会員'; }
      }
    }
  }
  if(info.status==='none'){ info.statusLabel='⚪ 未会員'; info.shortLabel='未会員'; } // 会費・登録日なし＝未会員
  return info;
}

/* ============================================================================
   💰 会計金額を領収書に既定で入れる（ボス指示 2026-08-28）
   ----------------------------------------------------------------------------
   ■ 伝票の⑧から開いた時は元から入る。**メニューから開いて「予約伝票を選ぶ」で選んだ時**が
     宛名だけで金額が空だった＝毎回手打ちしていた。
   ■ 金額の正は**その日のPOS伝票**（`getPosBills`＝会計済みなら締めた金額）。
   ⚠️予約伝票の行はPOSの伝票行(rowIdx)を持っていない＝**客名の完全一致でしか結べない**。
     だから**同名が2件以上あるときは結ばない**（他人の金額を入れる方が手打ちより悪い）。
     [[reference_visit_attribution_matching]]＝名字フォールバックで同名別人を混線させた前科がある。
   ■ 画面には結んだ金額を必ず出す＝黒服が押す前に目で確かめられる。
============================================================================ */
var RCPT_POS=null;   // その日のPOS伝票（null=未取得）
/* ⚠️宛名と金額は**入力欄の中だけ**に持っていたので、発行店を変える等の全再描画で消えていた。
   状態として持ち、初期値に使う＝何度描き直しても同じ物が出る。 */
var RCPT_ATENA='';
function rcptLoadPosBills_(){
  if(!IS_GAS){ RCPT_POS=[]; return; }
  var dk=(typeof bmDateKey==='function')?bmDateKey():'';
  gsr('getPosBills',dk).then(function(r){
    RCPT_POS=(r&&r.bills)?r.bills:[];
    if(menuView==='receipt'){ var dl=document.getElementById('rcpt-denlist'); if(dl)dl.innerHTML=rcptDenListHtml_(); }
  }).catch(function(){ RCPT_POS=[]; });
}
/* 予約伝票の行 → POS伝票。⚠️客名の完全一致・かつ1件だけの時しか結ばない */
function rcptPosFor_(d){
  if(!RCPT_POS||!RCPT_POS.length||!d) return null;
  var nm=String(d.name||'').trim(); if(!nm) return null;
  var hit=RCPT_POS.filter(function(b){
    return b&&b.data&&String(b.data._cust||'').trim()===nm&&String(b.rowIdx)!=='demo';
  });
  if(hit.length!==1) return null;                 // 0件＝結べない／2件以上＝同名で危険
  var b=hit[0], pay=(b.data&&b.data.pay)||{}, total=Number(b.total)||0;
  var card=Number(pay.card)||0, credit=Number(pay.credit)||0;
  return { rowIdx:b.rowIdx, total:total, closed:!!(b.data&&b.data.closed),
           pay:{ cash:Math.max(0,total-card-credit), card:card, other:credit } };
}
function rcptDenListHtml_(){
  if(RCPT_DENPYO===null) return '<div class="rcpt-den-loading">読み込み中…</div>';
  if(!RCPT_DENPYO.length) return '<div class="rcpt-den-empty">本日の予約伝票はありません（宛名は手入力で発行できます）</div>';
  return RCPT_DENPYO.map(function(d,i){
    var rn=d.ryoshuName?d.ryoshuName:(d.company?d.company+' 御中':((d.name&&d.name!=='ご新規')?d.name+' 様':'（宛名なし）'));
    return '<div class="rcpt-den'+(i===RCPT_SEL?' on':'')+'" onclick="rcptPick('+i+')">'
      +'<div><div class="rcpt-den-nm">'+(d.time?'<span class="rcpt-den-no">'+esc(d.time)+'</span> ':'')+esc(d.seat||'')+'　'+esc(d.name||'')+(d.no?' <span class="rcpt-den-no">#'+esc(d.no)+'</span>':'')+'</div>'
      +'<div class="rcpt-den-sub">領収書名：'+esc(rn)+'</div></div>'
      +'<div class="rcpt-den-amt" style="font-size:12px;color:var(--sub)">'+rcptDenAmtHtml_(d)+'</div></div>';
  }).join('');
}
/* 行の右肩＝結べた会計金額。⚠️結べない時は「選ぶ▸」のまま＝手打ちに任せる（黙って0を入れない） */
function rcptDenAmtHtml_(d){
  var p=rcptPosFor_(d);
  if(!p||!(p.total>0)) return '選ぶ ▸';
  return '<b style="color:'+(p.closed?'var(--gold)':'#8aa8c8')+';font-size:13px">'+rcptYen_(p.total)+'</b>'
    +'<div style="font-size:10px;color:var(--sub)">'+(p.closed?'会計済み':'未会計')+'</div>';
}
/* ===== 📜 発行履歴（発行済み領収書/受領書の控え一覧・軍師） ===== */

var RCPT_HIST=null;        // 履歴データ（null=未取得）
var RCPT_HIST_F='';        // 種別フィルタ（''=全部 / '領収書' / '日払い受領書' / '月払い受領書'）
var RCPT_HIST_Q='';        // 検索語（宛名・通し番号）

function rcptHistBadgeColor_(t){ return t==='領収書'?'#3b6fb0':(t==='月払い受領書'?'#8a5bb0':'#3f8a5a'); }

  return head+rows.map(function(x){
    return '<div style="border:1px solid var(--line,#2a3550);border-radius:10px;padding:9px 12px;margin-bottom:8px;background:var(--card,#0e1626)">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">'
        +'<span style="font-weight:800;font-size:13px">'+esc(x.serial||'')+'</span>'
        +'<span style="background:'+rcptHistBadgeColor_(x.docType)+';color:#fff;font-size:11px;padding:1px 7px;border-radius:6px;font-weight:700">'+esc(x.docType||'')+'</span>'
        +'<span style="margin-left:auto;font-weight:800;font-size:15px">'+rcptYen_(x.amount)+'</span></div>'
      +'<div style="font-size:13px;margin-bottom:2px">'+esc(x.atena||'（宛名なし）')+(x.tada?'　<span style="color:var(--sub)">'+esc(x.tada)+'</span>':'')+'</div>'
      +'<div style="font-size:11px;color:var(--sub)">発行日 '+esc(x.issueDate||'')+'　'+esc(x.pay||'')+(Number(x.inshi)>0?'　印紙'+rcptYen_(x.inshi):'')+'　発行者 '+esc(x.by||'?')+'　'+esc(x.at||'')+'</div>'
      +'</div>';
  }).join('');
}
/* ============================================================================
   🧾 複数枚の発行＝**発行キュー**（ボス確定 2026-08-28「A・B・C 全部起きる」）
   ----------------------------------------------------------------------------
   A 同じ内容をもう1枚（刷り直し＝紙詰まり・紛失）  → 「もう1枚（刷り直し）」ボタン
   B 金額を割って複数枚（割り勘）                    → 「均等に割る」
   C 宛名も金額も1枚ずつ（会社と個人で分ける）        → 行を足して1行ずつ書く
   ■ 作り＝**1枚ずつ既存の発行画面に載せて刷る**。プレビューも印字も1枚用のまま＝
     ここで作りを増やさない（紙の組み方は実機で検証済みの物を触らない）。
   ⚠️**合計が会計金額を超える領収書は出さない**＝二重領収書になる。刷る手前で止める。
     不足は警告だけ（「会社宛に一部だけ」は実務で在る）。
   ⚠️**収入印紙は1枚ごとに判定する**。割ると1枚あたりが5万円未満になって印紙が不要になることがある
     ＝枚数と配分は印紙額を動かす。だから行ごとに支払種別（現金/カード/請求書）を持つ。
     Aの刷り直しは金額を増やさない＝合計には数えない。
============================================================================ */
var RCPT_QUEUE=null;      // null=1枚だけ（従来どおり）／[{atena,amount,pay,done}]
var RCPT_QIDX=-1;         // いま発行画面に載っている行
var RCPT_BASE=0;          // 元の会計金額（超過チェックの基準。0=基準なし＝手打ち発行）
var RCPT_BASEPAY=null;    // 会計の内訳 {cash,card,other}

function rcptQSum_(){ return (RCPT_QUEUE||[]).reduce(function(a,r){ return a+(Number(r.amount)||0); },0); }
function rcptQPayLabel_(p){ return (p==='card')?'カード':((p==='other')?'請求書':'現金'); }
function rcptQAmtNow_(){ return parseInt((((document.getElementById('rcpt-amt')||{}).value)||'0').replace(/[^0-9]/g,''),10)||0; }
function rcptQAtenaNow_(){ return (((document.getElementById('rcpt-atena')||{}).value)||'').trim(); }
/* ⚠️キューを触るたびに全再描画すると、**宛名と金額の入力欄が作り直されて中身が飛ぶ**
   （実ブラウザで踏んだ。単体テストはrcptRerender_を殺していたので通ってしまった）。
   キューの箱だけ差し替え、入力欄には値を書き戻す。 */
function rcptQRefresh_(){
  var el=document.getElementById('rcpt-queue'); if(el)el.innerHTML=rcptQueueHtml_();
  rcptQFill_(); rcptQApply_();
  if(typeof rcptCalc==='function') rcptCalc();
}
/* いま載っている行の宛名・金額を入力欄へ書き戻す */
function rcptQFill_(){
  if(!RCPT_QUEUE||RCPT_QIDX<0||!RCPT_QUEUE[RCPT_QIDX]) return;
  var r=RCPT_QUEUE[RCPT_QIDX];
  var ae=document.getElementById('rcpt-atena'); if(ae)ae.value=r.atena||'';
  var me=document.getElementById('rcpt-amt');   if(me)me.value=Number(r.amount)||0;
}

/* 会計の内訳から行ごとの支払種別を埋める（現金→カード→請求書の順に充当）。
   ⚠️1行が2つの方法にまたがる場合は先に埋まる方を採る＝黒服が直せる（既定を置くだけ） */
function rcptQSeedPay_(){
  var bp=RCPT_BASEPAY||{}, left={cash:Number(bp.cash)||0, card:Number(bp.card)||0, other:Number(bp.other)||0};
  var any=(left.cash+left.card+left.other)>0;
  (RCPT_QUEUE||[]).forEach(function(r){
    if(!any){ r.pay=r.pay||'cash'; return; }
    var a=Number(r.amount)||0;
    var k=(left.cash>=a&&left.cash>0)?'cash':((left.card>=a&&left.card>0)?'card':((left.other>=a&&left.other>0)?'other'
         :(left.cash>0?'cash':(left.card>0?'card':(left.other>0?'other':'cash')))));
    r.pay=k; left[k]=Math.max(0,left[k]-a);
  });
}
/* B＝均等に割る。⚠️端数は1枚目に寄せる＝合計は必ず元の金額とぴったり一致させる */
function rcptQSplit(n){
  n=Math.max(1,Math.min(20,Math.floor(Number(n)||0)));
  var base=RCPT_BASE||rcptQAmtNow_();
  if(!(base>0)){ alert('先に金額を入れてください。'); return; }
  var atena=rcptQAtenaNow_();
  var each=Math.floor(base/n), rem=base-each*n;
  RCPT_QUEUE=[];
  for(var i=0;i<n;i++) RCPT_QUEUE.push({atena:atena, amount:each+(i===0?rem:0), pay:'cash', done:0});
  rcptQSeedPay_(); RCPT_QIDX=0; rcptQRefresh_();
}
function rcptQOff(){ RCPT_QUEUE=null; RCPT_QIDX=-1; RCPT_SPLIT=null; rcptQRefresh_(); }
/* C＝1行足す。金額0で置いて黒服が書く */
function rcptQAdd(){
  if(!RCPT_QUEUE) RCPT_QUEUE=[{atena:rcptQAtenaNow_(), amount:rcptQAmtNow_(), pay:'cash', done:0}];
  RCPT_QUEUE.push({atena:rcptQAtenaNow_(), amount:0, pay:'cash', done:0});
  RCPT_QIDX=RCPT_QUEUE.length-1; rcptQRefresh_();
}
function rcptQDel(i){
  if(!RCPT_QUEUE) return;
  RCPT_QUEUE.splice(i,1);
  if(!RCPT_QUEUE.length){ rcptQOff(); return; }
  if(RCPT_QIDX>=RCPT_QUEUE.length) RCPT_QIDX=RCPT_QUEUE.length-1;
  rcptQRefresh_();
}
function rcptQPick(i){ RCPT_QIDX=i; rcptQRefresh_(); }
function rcptQSet(i,k,v){
  if(!RCPT_QUEUE||!RCPT_QUEUE[i]) return;
  RCPT_QUEUE[i][k]=(k==='amount')?Math.max(0,parseInt(String(v).replace(/[^0-9]/g,''),10)||0):v;
  rcptQRefresh_();
}
/* いま載っている行を発行画面へ流し込む。⚠️印紙は**その1枚の支払種別**で判定する */
function rcptQApply_(){
  if(!RCPT_QUEUE||RCPT_QIDX<0||!RCPT_QUEUE[RCPT_QIDX]){ return; }
  var r=RCPT_QUEUE[RCPT_QIDX], a=Number(r.amount)||0;
  RCPT_SPLIT={ cash:(r.pay==='cash')?a:0, card:(r.pay==='card')?a:0, other:(r.pay==='other')?a:0 };
  RCPT_CASH=(r.pay==='cash');
}
/* 刷り終わった1枚に印を付けて、次の未発行へ進める */
function rcptQDone_(){
  if(!RCPT_QUEUE||RCPT_QIDX<0||!RCPT_QUEUE[RCPT_QIDX]) return;
  RCPT_QUEUE[RCPT_QIDX].done=1;
  for(var i=0;i<RCPT_QUEUE.length;i++){ if(!RCPT_QUEUE[i].done){ RCPT_QIDX=i; break; } }
  setTimeout(rcptQRefresh_,60);
}
/* ⚠️行ごとの支払種別の合計が、会計の内訳とズレていないか。
   ズレたまま刷ると**収入印紙を多く貼る／貼り忘れる**（印紙は現金分に掛かるため）。 */
function rcptQPayWarn_(){
  var bp=RCPT_BASEPAY; if(!bp||!RCPT_QUEUE) return '';
  var q={cash:0,card:0,other:0};
  RCPT_QUEUE.forEach(function(r){ q[r.pay||'cash']+=(Number(r.amount)||0); });
  var d=[];
  ['cash','card','other'].forEach(function(k){
    var a=Number(bp[k])||0; if(q[k]!==a) d.push(rcptQPayLabel_(k)+' 会計'+rcptYen_(a)+'→領収書'+rcptYen_(q[k]));
  });
  if(!d.length) return '';
  return '<div class="row" style="border-bottom:0"><span style="color:#ffcf7a;font-size:11.5px">⚠️支払方法の内訳が会計と違います（印紙は現金分に掛かります）<br>'+esc(d.join('　／　'))+'</span><span></span></div>';
}
function rcptQueueHtml_(){
  var sum=rcptQSum_(), base=RCPT_BASE||0, over=(base>0&&sum>base), short=(base>0&&sum<base);
  var h='<div class="flabel">発行する枚数</div>';
  if(!RCPT_QUEUE){
    h+='<div class="bm-row" style="gap:6px;flex-wrap:wrap">'
      +'<button class="bm-btn sm" onclick="rcptQSplit(2)">2枚に割る</button>'

function rcptPick(i){

  RCPT_ATENA=atena;

  /* ⚠️2026-08-28ボス指示＝**会計した金額を既定で入れる**（それまで宛名だけで毎回手打ちだった）。
     結べた時だけ入れる。結べない時は空のまま＝黙って0や他人の金額を入れない。
     複数枚に割るときの基準(RCPT_BASE)と支払内訳(印紙の判定)も一緒に渡す。 */

    if(typeof rcptSetCash==='function') rcptSetCash(p.pay.cash>0,true,true);
    RCPT_QUEUE=null; RCPT_QIDX=-1;      // 伝票を選び直したら枚数の割り方はやり直す
  }

function rcptCalc(){
  var amount=parseInt((((document.getElementById('rcpt-amt')||{}).value)||'0').replace(/[^0-9]/g,''),10)||0;
  var atena=(((document.getElementById('rcpt-atena')||{}).value)||'').trim();
  var tada=(((document.getElementById('rcpt-tada')||{}).value)||'').trim();
  var iso=(((document.getElementById('rcpt-date')||{}).value))||rcptToday_();
  var taxExcl=Math.round(amount/(1+RCPT_TAX));
  var tax=amount-taxExcl;
  /* ⚠️印紙は**現金受取額**で判定する（全額ではない）。内訳が無ければ従来どおり全額×RCPT_CASH */
  var sp=RCPT_SPLIT;
  var cashAmt=sp?Math.min(Math.max(0,Number(sp.cash)||0),amount):(RCPT_CASH?amount:0);
  var cardAmt=sp?Math.max(0,Number(sp.card)||0):(RCPT_CASH?0:amount);
  var otherAmt=sp?Math.max(0,Number(sp.other)||0):0;
  var inshi=rcptInshi_(Math.round(cashAmt/(1+RCPT_TAX)),cashAmt>0);

      paper.innerHTML='<img alt="領収書プレビュー" src="'+_lc.toDataURL()+'" style="width:100%;display:block;background:#fff">';

      :'<span class="rcpt-badge stamp">印紙 '+rcptYen_(inshi)+'</span>';
    var splitRow=(sp&&(cardAmt>0||otherAmt>0)&&cashAmt>0)
      ? '<div class="row"><span>内訳（印紙は現金分で判定）</span><span>現金 '+rcptYen_(cashAmt)+' ／ カード '+rcptYen_(cardAmt)+(otherAmt>0?' ／ 請求書 '+rcptYen_(otherAmt):'')+'</span></div>'
      : '';
    bd.innerHTML='<div class="row"><span>領収金額（税込）</span><span>'+rcptYen_(amount)+'</span></div>'
      +'<div class="row"><span>税抜金額</span><span>'+rcptYen_(taxExcl)+'</span></div>'
      +'<div class="row"><span>消費税（10%）</span><span>'+rcptYen_(tax)+'</span></div>'
      +splitRow
      +'<div class="row"><span>収入印紙（現金分の税抜で判定）</span><span>'+rcptYen_(inshi)+' '+badge+'</span></div>'
      +'<div class="big"><span>お預り</span><span>'+rcptYen_(amount)+'</span></div>';
  } else {
    paper.className='rcpt-paper';
    if(paper.parentNode)paper.parentNode.classList.remove('land');
    paper.innerHTML='<div class="c title" style="letter-spacing:.45em">受領書</div>'

      +((RCPT_MODE==='M')
         ? '<div class="issuer" style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><span style="font-size:13px;font-weight:800;color:#1a1a1a">'+(atena?esc(atena):'')+'</span><b>'+esc(RCPT_ISSUER.name)+'</b></div>'   // 月払い＝左下にキャスト名／右下に店名
         : '<div class="issuer"><b>'+esc(RCPT_ISSUER.name)+'</b></div>');

function rcptBuildXmlLandscape_(o){
  // 横向き領収証（ePOSページモード・90度回転）。★実機の試し刷りで下の TUNE を微調整（dir/AW/AH/top/left/base/gap）。
  var TUNE={ dir:'right', AW:512, AH:980, top:14, left:14, base:22, gap:8 };
  var esc2=function(s){ return esc(String(s)); };
  var rows=[];
  var add=function(size,em,text){ rows.push({s:size,em:em,t:text}); };
  add(3,true,'領 収 証');
  add(1,false,'No. '+rcptNo_(o.iso)+'     '+rcptDateStr_(o.iso));
  add(2,true,(o.atena||'')+'　');
  add(4,true,'￥ '+(o.amount||0).toLocaleString('ja-JP')+' 也');
  add(1,false,'但し  '+(o.tada||'')+'  上記正に領収いたしました');
  if(o.cardAmt>0||o.otherAmt>0) add(1,false,'内訳  現金 '+rcptYen_(o.cashAmt)+' ／ クレジット '+rcptYen_(o.cardAmt)+(o.otherAmt>0?' ／ 請求書 '+rcptYen_(o.otherAmt):''));
  if(!(o.cashAmt>0)) add(1,false,'※クレジットカード利用のため収入印紙不要');
  else if(o.inshi===0) add(1,false,'※現金受取分が税抜5万円未満につき収入印紙不要（非課税）');
  else add(1,false,'収入印紙 '+rcptYen_(o.inshi)+' 貼付');

function rcptCorner_(g,cx,cy,sx,sy){
  g.save(); g.translate(cx,cy); g.scale(sx,sy);
  g.strokeStyle='#000'; g.fillStyle='#000'; g.lineCap='round';
  g.lineWidth=2.4; g.beginPath(); g.moveTo(6,64); g.bezierCurveTo(6,24,24,6,64,6); g.stroke();
  g.lineWidth=1.6; g.beginPath(); g.moveTo(16,64); g.bezierCurveTo(16,32,32,16,64,16); g.stroke();
  g.lineWidth=1.6;
  g.beginPath(); g.arc(64,11,5.5,-Math.PI/2,Math.PI*0.9,true); g.stroke();     // 水平端の渦
  g.beginPath(); g.arc(11,64,5.5,0,Math.PI*1.4,true); g.stroke();              // 垂直端の渦
  g.beginPath(); g.arc(27,27,3,0,Math.PI*2); g.fill();                         // 飾りドット
  g.beginPath(); g.arc(42,42,2,0,Math.PI*2); g.fill();

}
function rcptLandscapeCanvas_(o){

function rcptCanvasToEposXml_(c){
  var w=c.width, h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data;
  var bpr=Math.ceil(w/8), R=new Uint8Array(bpr*h);
  // サーマルのかすれ対策：①閾値を上げてアンチエイリアスの縁も黒に拾う（濃く）②右・下へ1px太らせる（細り防止）
  var ink=new Uint8Array(w*h);
  for(var y=0;y<h;y++){ for(var x=0;x<w;x++){ var i=(y*w+x)*4; if(d[i+3]>96 && (d[i]+d[i+1]+d[i+2])/3<184) ink[y*w+x]=1; } }
  for(var y=0;y<h;y++){ for(var x=0;x<w;x++){
    if(ink[y*w+x] || (x>0&&ink[y*w+x-1]) || (y>0&&ink[(y-1)*w+x])) R[y*bpr+(x>>3)] |= (0x80>>(x&7));
  } }
  var s=''; for(var k=0;k<R.length;k++) s+=String.fromCharCode(R[k]);
  return '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">'
    +'<image width="'+w+'" height="'+h+'" color="color_1" mode="mono" align="center">'+btoa(s)+'</image>'
    +'<feed unit="24"/><cut type="feed"/></epos-print>';
}
function rcptLandscapePrintXml_(o){
  var c=rcptLandscapeCanvas_(o);
  var r=document.createElement('canvas'); r.width=c.height; r.height=c.width;   // 90度回転
  var rg=r.getContext('2d'); rg.fillStyle='#fff'; rg.fillRect(0,0,r.width,r.height);
  rg.translate(r.width,0); rg.rotate(Math.PI/2); rg.drawImage(c,0,0);
  return rcptCanvasToEposXml_(r);
}
function rcptPrint(reissue){

/* 本日の予約（キャンセルは出さない・時刻順）。RSV は起動時に読み込み済み＝追加のGAS呼び出し無し */
function tslipList_(){
  return (RSV||[]).filter(function(r){ return String(r.status||'').indexOf('キャンセル')<0; })
    .slice().sort(function(a,b){ return String(a.time||'').localeCompare(String(b.time||'')); });
}
function tslipSel_(){ var L=tslipList_(); return (TSLIP_MODE==='rsv'&&TSLIP_SEL>=0&&L[TSLIP_SEL])?L[TSLIP_SEL]:null; }
/* 卓名 → {f,t,n}。バックエンド normTable_/tableNameToSeatCode_ と同じ規則の写し
   （スペース有無・全角・BOX/カウ略称・「離れ」=5F を吸収）。⚠️置換の並び順に意味あり＝長い語が先。
   ⛔「、」区切りの複数卓は必ず先に split してから渡す（正規化で「、」を落とすため）。→ reference_table_naming */
function tslipSeat_(name){
  var s=String(name||'').toLowerCase()
    .replace(/[０-９]/g,function(d){return String.fromCharCode(d.charCodeAt(0)-0xFEE0);})
    .replace(/[\s　,、・]/g,'')
    .replace(/ボックス|ぼっくす/g,'box')
    .replace(/カウンター|かうんたー|カウ|かう/g,'counter')
    .replace(/離れ|はなれ|ハナレ/g,'5f');
  var m=s.match(/^([25])f(counter|box)(\d+)$/);
  return m?{f:m[1]+'F', t:(m[2]==='counter'?'C':'B'), n:Number(m[3])}:null;
}
function tslipSeats_(tableStr){
  return String(tableStr||'').split(/[、,]/).map(function(t){return tslipSeat_(t);}).filter(Boolean);
}
/* 年会費まわりの注意書き。判定は membershipInfo に一任＝判定式を増やさない
   （軍師の各画面と必ず同じ結論になる。→ reference_customer_master_y3 の「全員会員切れ誤表示」の轍） */
function tslipWarn_(o){
  if(!o) return null;
  var mi=membershipInfo(o.joined,o.feeDate);
  if(mi.status==='expired')   return {inv:true, t:'年会費の更新が切れています', s:'更新期限 '+mi.renewalStr+'　お客様にご案内をお願いします', mark:true};
  if(mi.status==='thismonth') return {inv:true, t:'今月が年会費の更新月です',   s:'更新期限 '+mi.renewalStr+'　更新の確認をお願いします',   mark:true};
  if(!String(o.mem||'').trim())return {inv:false,t:'ご新規（会員登録なし）',     s:'公式ライン登録・来店ポイント・ネック作成をご確認ください', mark:false};
  return null;
}
/* 白紙伝票／予約を差し込んだ伝票を canvas に描く。返り値＝canvas（幅576・高さは中身から自動算出） */
function tslipCanvas_(){
  var o=tslipSel_(), warn=tslipWarn_(o), mi=o?membershipInfo(o.joined,o.feeDate):null;
  var W=TSLIP_W, ML=20, MR=20, CW=W-ML-MR;
  var C1=296, C2=76, C3=CW-C1-C2;                    // 列幅：品名 / 数量 / 備考
  var RH=42, HH=36;                                  // 行の高さ / 見出し行の高さ
  var nRow=0; TSLIP_ROWS.forEach(function(r){ nRow+=(r.sub?r.sub.length:1); });
  // ── 縦位置を先に決める（canvasは高さを先に確定させる必要がある）──
  var yTitle=52,yDate=92,yTbl1=134,yTbl2=166,yPax=214,yCust=254,yCast=294,yMem=334;
  var warnTop=352, warnH=warn?62:0;
  var gridTop=warn?(warnTop+warnH+14):366;
  var memoH=Math.round(TSLIP_MEMO_MM*8);              // メモ欄（白紙）。⚠️ここはラスタで送らない＝tslipXml_が紙送りに振り替える
  var H=Math.ceil((gridTop+HH+RH*nRow+34+memoH)/8)*8;

  var g=c.getContext('2d');

  var dot=function(y){ g.setLineDash([4,4]); line(ML,y,W-MR,y,1.4); g.setLineDash([]); };
  var right=function(t,x,y,f){ g.textAlign='right'; g.font=f; g.fillText(t,x,y); g.textAlign='left'; };
  // 該当テーブルを丸で囲む（サーマルは白黒のみ＝色分けが使えないので囲みが一番強い）
  var ring=function(cx,cy,rx,ry){ g.lineWidth=2.4; g.beginPath();

    g.fillRect(x-1.6,y-s*0.42,3.2,s*0.66); g.fillRect(x-1.8,y+s*0.36,3.6,3.6);
    g.strokeStyle='#000'; g.fillStyle='#000'; g.lineWidth=1.6; };
  // ── 見出し「お会計伝票」（左に伝票アイコンを線画で）＋ 右に予約時刻 ──
  g.lineWidth=2.2; g.strokeRect(ML+2,yTitle-27,26,32);
  for(var i0=0;i0<3;i0++) line(ML+8,yTitle-19+i0*8,ML+24,yTitle-19+i0*8,1.6);
  g.font='bold 30px "Hiragino Mincho ProN","YuMincho",serif';
  g.fillText('お会計伝票', ML+42, yTitle);
  if(o&&o.time) right(String(o.time), W-MR-4, yTitle, 'bold 27px sans-serif');
  // ── 日付 ──
  g.font='bold 21px sans-serif'; g.fillText('日付', ML+4, yDate);
  g.fillText('年', 300, yDate); g.fillText('月', 396, yDate); g.fillText('日', 492, yDate);
  if(TSLIP_DATE==='today'){
    var d=new Date();
    right(String(d.getFullYear()), 296, yDate, 'bold 23px sans-serif');
    right(String(d.getMonth()+1),  392, yDate, 'bold 23px sans-serif');
    right(String(d.getDate()),     488, yDate, 'bold 23px sans-serif');
  }
  dot(yDate+14);
  // ── テーブル番号（席マスタ ALL_SEATS のとおり。⚠️「離れ」は使わない＝5Fに統一〔ボス確定 2026-08-19〕。
  //    呼び名は軍師の見取り図と同じ略称「カウ / BOX」で揃える）──
  var seats = o?tslipSeats_(o.table):[];
  var hit=function(f,t,n){ return seats.some(function(s){ return s.f===f&&s.t===t&&s.n===n; }); };
  g.font='bold 19px sans-serif'; g.fillText('テーブル番号', ML+4, yTbl1);
  [ {f:'2F', y:yTbl1, c:4, b:3, bx:390, bnx:440},
    {f:'5F', y:yTbl2, c:6, b:2, bx:440, bnx:490} ].forEach(function(r){
    var i,x;
    g.font='bold 21px sans-serif'; g.fillText(r.f, 160, r.y);
    g.font='bold 19px sans-serif'; g.fillText('カウ', 200, r.y); g.fillText('BOX', r.bx, r.y);
    g.font='bold 20px sans-serif';
    for(i=0;i<r.c;i++){ x=252+i*30; g.fillText(String(i+1), x, r.y); if(hit(r.f,'C',i+1)) ring(x+6,r.y-7,17,15); }
    for(i=0;i<r.b;i++){ x=r.bnx+i*30; g.fillText(String(i+1), x, r.y); if(hit(r.f,'B',i+1)) ring(x+6,r.y-7,17,15); }
  });
  // ⚠️右寄せにすると5FのBOX番号(x=490,520)に被る＝ラベル下の空きに置く（実測で被りを確認して移した）
  if(o && !seats.length){ g.font='bold 18px sans-serif'; g.fillText('（席 未定）', ML+4, yTbl2); }
  dot(yTbl2+14);
  // ── 人数（男女の内訳は手書き。予約人数は参考として右に）──

  if(o) right('予約 '+(o.pax||'')+'名', W-MR-4, yPax, 'bold 18px sans-serif');

  // ── 担当 / 同伴 / 予約者 ──

  g.fillText('同伴', 220, yCast);    if(o) { g.font='bold 21px sans-serif'; g.fillText(String(o.dohan||''), 288, yCast); g.font='bold 19px sans-serif'; }
  g.fillText('予約', 400, yCast);    if(o) { g.font='bold 21px sans-serif'; g.fillText(String(o.yoyaku||''), 462, yCast); }
  dot(yCast+14);
  // ── 会員（在籍年数・更新期限・状態）──
  g.font='bold 19px sans-serif'; g.fillText('会員', ML+4, yMem);
  if(o){
    var mtxt=[];
    if(mi.yearLabel) mtxt.push(mi.yearLabel);
    if(mi.renewalStr) mtxt.push('更新期限 '+mi.renewalStr);
    g.font='bold 20px sans-serif'; g.fillText(mtxt.join('　／　')||'—', 120, yMem);
    right(mi.shortLabel||'', W-MR-4, yMem, 'bold 20px sans-serif');
  }
  dot(yMem+14);
  // ── 注意帯（年会費・ご新規）。反転（黒地に白抜き）＝サーマルで一番強い ──
  if(warn){
    if(warn.inv){
      g.fillStyle='#000'; g.fillRect(ML,warnTop,CW,warnH); g.fillStyle='#fff';
      bang(ML+34, warnTop+26, 15, '#fff');
      g.fillStyle='#fff';   // ⚠️bang() は最後に塗り色を黒へ戻す＝ここで白に戻さないと黒地に黒文字で消える
      g.font='bold 25px sans-serif'; g.fillText(warn.t, ML+60, warnTop+31);
      g.font='bold 16px sans-serif'; g.fillText(warn.s, ML+60, warnTop+53);
      g.fillStyle='#000';
    }else{
      g.setLineDash([6,4]); g.lineWidth=2.2; g.strokeRect(ML,warnTop,CW,warnH); g.setLineDash([]); g.lineWidth=1.6;
      bang(ML+34, warnTop+26, 15, '#000');
      g.font='bold 23px sans-serif'; g.fillText(warn.t, ML+60, warnTop+30);
      g.font='bold 15px sans-serif'; g.fillText(warn.s, ML+60, warnTop+52);
    }
  }
  // ── 明細グリッド ──
  var x1=ML, x2=ML+C1, x3=ML+C1+C2, x4=ML+CW;
  var top=gridTop, bottom=gridTop+HH+RH*nRow;

/* canvas → ePOS-Print XML（1bitラスタ）。サーマルのかすれ対策＝閾値184＋右下1px太らせ */
function tslipXml_(){
  var c=tslipCanvas_(), w=c.width, h=c.height;

  var ink=new Uint8Array(w*h);
  for(var y=0;y<h;y++){ for(var x=0;x<w;x++){ var i=(y*w+x)*4; if(d[i+3]>96 && (d[i]+d[i+1]+d[i+2])/3<184) ink[y*w+x]=1; } }
  // ⚠️末尾の白紙行（＝メモ欄の余白）はラスタで送らず紙送り(<feed>)に振り替える。
  //   3cmを画像で送ると約28KB増えて印字URLが約164KBになる＝iOSのURLスキーム上限に近づく。
  //   紙の出方は同じで、送るデータだけ減る（白い行を1bitで送っても白いだけ＝情報がない）。
  var last=h-1, any;
  while(last>=0){ any=false; for(var xa=0;xa<w;xa++){ if(ink[last*w+xa]){ any=true; break; } } if(any)break; last--; }
  var hh=Math.max(1,last+1), feedDots=24+(h-hh);
  var bpr=Math.ceil(w/8), R=new Uint8Array(bpr*hh);
  for(var y2=0;y2<hh;y2++){ for(var x2=0;x2<w;x2++){
    if(ink[y2*w+x2] || (x2>0&&ink[y2*w+x2-1]) || (y2>0&&ink[(y2-1)*w+x2])) R[y2*bpr+(x2>>3)] |= (0x80>>(x2&7));
  } }
  var s=''; for(var k=0;k<R.length;k++) s+=String.fromCharCode(R[k]);
  // ⚠️<feed unit> は 0〜255 が上限＝240ドット+仕上げ分は1本に収まらないので分割して並べる
  var fx='', rest=feedDots; while(rest>0){ var u=Math.min(255,rest); fx+='<feed unit="'+u+'"/>'; rest-=u; }
  return '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">'
    +'<image width="'+w+'" height="'+hh+'" color="color_1" mode="mono" align="center">'+btoa(s)+'</image>'
    +fx+'<cut type="feed"/></epos-print>';
}

function custFilterFn(c){
  if(custF.expired && membershipInfo(c.joined,c.feeDate).status!=='expired') return false;

function fmtVisitDate(d){
  var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return String(d||'');
  var y=+m[1], mo=+m[2], da=+m[3];
  return (y===(new Date()).getFullYear())?(mo+'/'+da):(y+'/'+mo+'/'+da);
}

// 編集可能な項目（ラベル＝マスタ見出し / key＝updateCustomerのペイロード）

  {label:'カード記載名',key:'card'},{label:'氏名',key:'name'},{label:'よみがな',key:'yomigana'},
  {label:'会員番号',key:'no'},{label:'担当',key:'tantou'},{label:'ボトル種類',key:'bottle'},

// 年月のみ("2026/07")も年月日("2026-07-01")も date入力用 yyyy-MM-dd に正規化（日が無ければ1日）
function toDateInput(v){ var m=String(v||'').match(/(\d{4})[-\/.](\d{1,2})(?:[-\/.](\d{1,2}))?/); return m?(m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+(m[3]||'1')).slice(-2)):''; }
function custValByLabel(label){
  var n=function(s){return String(s||'').replace(/\s/g,'');};
  var hit=(custDetailFields||[]).filter(function(f){return n(f.k).indexOf(n(label))>=0;})[0];
  return hit?hit.v:'';
}
function cvDateVal(v){ var m=String(v||'').match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); return m?(m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2)):''; }
function startCustEdit(){
  var el=document.getElementById('cust-detail-body'); if(!el)return;
  var h=CUST_EDIT_FIELDS.map(function(f){
    var v=custValByLabel(f.label), input;
    // 会員日付は詳細ヘッダー（解決済み）の値を優先してプレフィル
    if(f.key==='feeDate') v=(custDetailCur&&custDetailCur.feeDate)||v;
    else if(f.key==='memberSince') v=(custDetailCur&&custDetailCur.joined)||v;
    if(f.type==='area') input='<textarea id="ce-'+f.key+'" class="finput" rows="3" style="resize:none;width:100%;box-sizing:border-box">'+esc(v)+'</textarea>';
    else if(f.type==='date') input='<input id="ce-'+f.key+'" class="finput" type="date" style="width:100%;box-sizing:border-box" value="'+esc(toDateInput(v))+'">';
    else if(f.key==='tantou'){
      // 担当は在籍キャストのプルダウン（新規フォームと同じ CASTS 由来）
      var opts='<option value="">（未設定）</option>', found=false;
      (CASTS||[]).forEach(function(c){ var sel=(c===v); if(sel)found=true;
        opts+='<option value="'+esc(c)+'"'+(sel?' selected':'')+'>'+esc(c)+'</option>'; });
      // 在籍リストに無い現在値（退職担当など）は消さず先頭に残して selected ＝非破壊
      if(v && !found) opts='<option value="'+esc(v)+'" selected>'+esc(v)+'</option>'+opts;
      input='<select id="ce-'+f.key+'" class="finput" style="width:100%;box-sizing:border-box">'+opts+'</select>';
    }
    else input='<input id="ce-'+f.key+'" class="finput" style="width:100%;box-sizing:border-box" value="'+esc(v)+'">';
    return '<div style="margin:9px 0"><div style="color:var(--dim);font-size:12px;margin-bottom:3px">'+esc(f.label)+'</div>'+input+'</div>';
  }).join('');
  el.innerHTML='<div style="padding:2px 0"><div style="font-size:13px;color:var(--accent);font-weight:800;margin-bottom:8px">✏️ 顧客情報の編集</div>'+h
    +'<div style="display:flex;gap:8px;margin-top:14px"><button class="nmemo-save" style="flex:1" onclick="saveCustEdit()">💾 保存</button>'
    +'<button class="menu-btn" style="flex:1" onclick="renderCustDetailFields(custDetailFields)">キャンセル</button></div></div>';
}
function saveCustEdit(){
  if(!custDetailRowIdx){alert('対象の顧客が特定できません');return;}
  var payload={};
  CUST_EDIT_FIELDS.forEach(function(f){ var e=document.getElementById('ce-'+f.key); if(e)payload[f.key]=e.value; });
  // 会員日付は空欄なら送らない（既存の入会日・年会費更新を誤って消さないため）
  if(!payload.feeDate) delete payload.feeDate;
  if(!payload.memberSince) delete payload.memberSince;
  var btn=document.querySelector('#cust-detail-body .nmemo-save'); if(btn){btn.disabled=true;btn.textContent='保存中...';}
  if(IS_GAS){
    gsr('kioskUpdateCustomer',custDetailRowIdx,payload).then(function(res){
      if(res&&res.ok){
        toast('✅ 顧客情報を更新しました');
        // 手元の表示も更新して再描画（ヘッダーと詳細を最新に）
        var c=custDetailCur; if(c){ c.name=payload.name||c.name; c.card=payload.card||c.card; c.member=payload.no||c.member; c.tantou=payload.tantou; c.bottle=payload.bottle; c.bottlePos=payload.pos; c.nomikata=payload.drink; c.tabako=payload.tabaco; c.ng=payload.ng; c.note=payload.note; if(payload.memberSince)c.joined=payload.memberSince; if(payload.feeDate)c.feeDate=payload.feeDate; }
        openCustDetail(custDetailIdx);
      } else { alert('更新エラー: '+((res&&res.error)||'')); if(btn){btn.disabled=false;btn.textContent='💾 保存';} }
    }).catch(function(e){ alert('更新エラー: '+((e&&e.message)||e)); if(btn){btn.disabled=false;btn.textContent='💾 保存';} });
  }else{ toast('✅ 更新（ローカル）'); renderCustDetailFields(custDetailFields); }
}

function bcCount(){ var t=((document.getElementById('bc-msg')||{}).value)||''; var c=document.getElementById('bc-count'); if(c)c.textContent=t.length+' 文字'; }
function bcSend(){
  var msg=(((document.getElementById('bc-msg')||{}).value)||'').trim();

  if(!IS_GAS){ toast('（ローカル）送信は本番のみ'); return; }

     ①未会計の伝票が残っている ②請求書払いなのに請求書の発行依頼を出していない
   ■ ⚠️**テストモードでは止めない**（backendの`enforce`）。練習データで本物の閉店報告を止めるのは事故。
   ■ ⚠️判定はサーバー（POS_伝票×POS_会計）＝**他の端末で打った伝票も含める**。

var POS_DAY=null;          // getPosDayStatusの結果（null=未取得）

    POS_DAY=(r&&r.ok!==false)?r:null;
    if(!POS_DAY) POS_DAY_ERR='POSの状態を取得できませんでした';

/* --- 🔒 締めの条件ゲート（毎日・全部そろわないと送信できない） ------------------
   ボス確定 2026-08-25。自己申告チェック1つでは止まらなかった（押せば通る）ので、
   機械で判定できるものは機械で止める。TRUSTが取れない夜だけ自己申告に落とし、
   その日は「未照合」として記録して**翌日の閉店チェックを止める**＝逃げ道を残さない。 */
var CC_GATE=null, CC_GATE_ERR='';
function ccGateLoad(){
  if(typeof gsr!=='function'){ CC_GATE_ERR='取得できません'; return; }
  var dk=(cashState&&cashState.dateKey)||'';
  var slips=(cashState&&cashState.slips||[]).filter(function(x){ return x.include!==false&&Number(x.amount)>0; })
    .map(function(x){ return {category:x.category,payee:x.payee,amount:Number(x.amount)||0}; });
  gsr('ccGateStatus',dk,slips).then(function(r){
    CC_GATE=(r&&r.ok!==false)?r:null;
    if(!CC_GATE) CC_GATE_ERR=(r&&r.error)||'締め条件を確認できませんでした';
    ccGateRefresh();
  }).catch(function(){ CC_GATE_ERR='締め条件を確認できませんでした'; ccGateRefresh(); });
}
function ccDayPaySlips_(){ var st=cashState||{}; return (st.slips||[]).filter(function(x){ return x.include!==false&&Number(x.amount)>0&&/日払/.test(String(x.category||'')); }); }
/* 受取人の照合キー。TRUSTの「P.本名.源氏名」表記はドットで割って各パートも本人として扱う＝
   伝票に源氏名だけ書いてあっても、TRUST表記のまま書いてあっても同じ人だと分かる。
   ⚠️あいまい照合はしない（部分一致で別人に寄せない）＝割った上での完全一致だけを見る。
   ⚠️1文字のパートは捨てる（「P」や偶然の一致で別人を通さない）。 */
function ccNameKeys_(s){
  var n=String(s||'').replace(/[\s　]/g,'').trim(); if(!n) return [];
  var out=[n];   /* 元の表記はそのまま（1文字の源氏名「海」等を落とさない） */
  var add=function(x){ x=String(x||'').trim(); if(x.length>=2&&x!=='ｐ'&&out.indexOf(x)<0) out.push(x); };
  /* 受領伝票には「派遣 みな」のように頭に"派遣"を付けて署名する（ボス指示 2026-08-29
     ＝派遣は派遣として処理する）。外した形でも見る＝「派遣 みな」と「みな」が同じ人だと分かる。 */
  var bare=n.replace(/^(派遣|派)/,''); if(bare!==n) add(bare);
  if(/[.．]/.test(n)) n.split(/[.．]/).forEach(add);
  return out;
}
/* 受取人の署名が派遣さんのものか（頭に"派遣"／"派"が付く＝現場の書き方） */
function ccIsHaken_(s){ var n=String(s||'').replace(/[\s　]/g,'').trim(); return /^(派遣|派)./.test(n); }
var _ccPayeeSet=null,_ccPayeeSrc=null;
function ccPayeeSet_(){
  var list=(CC_GATE&&CC_GATE.payees)||[];
  if(_ccPayeeSrc===list&&_ccPayeeSet) return _ccPayeeSet;
  var set={}; list.forEach(function(p){ ccNameKeys_(p).forEach(function(k){ set[k]=1; }); });
  _ccPayeeSrc=list; _ccPayeeSet=set; return set;
}
/* 受取人が「ちゃんと決まっている」か。空欄と、名簿にも名寄せにもTRUSTにも無い名前はNG。
   ⚠️名簿を取れていない時（CC_GATE=null）は空欄だけを見る＝通信不良で全部NGにしない。 */
function ccPayeeKnown_(name){
  var keys=ccNameKeys_(name); if(!keys.length) return false;
  if(!CC_GATE||!(CC_GATE.payees||[]).length) return true;
  var set=ccPayeeSet_();
  return keys.some(function(k){ return !!set[k]; });
}
/* 🆕 名簿にない受取人を、その場で名寄せ台帳に登録する。
   ⭐初めて来た派遣さんの夜に、誰も閉店できなくなるのを防ぐ唯一の逃げ道。
   ⚠️寄せ先（TRUSTのどの名前か）は決めない＝月次の💴日払い照合でボスが結び付ける。 */
function ccRegPayee(i){
  var s=(cashState.slips||[])[i]; if(!s)return;
  var nm=String(s.payee||'').trim(); if(!nm){ alert('先に受取人（署名の名前）を入れてください'); return; }
  if(!confirm('「'+nm+'」を受取人として登録しますか？\n\n初めて来た派遣さんなど、名簿に無い人のための登録です。\n署名のとおりに入っているか、写真をもう一度確かめてください。\n（TRUSTのどの名前と同じ人かは、後でコンソールの💴日払い照合で結び付けます）'))return;
  gsr('ccRegisterPayee',{userId:KIOSK_USER_ID,name:nm}).then(function(r){
    if(r&&r.ok){
      if(CC_GATE){ CC_GATE.payees=(CC_GATE.payees||[]).concat([nm]); _ccPayeeSrc=null; _ccPayeeSet=null; }
      toast(r.already?'すでに登録されています':'✅ 登録しました');
      ccRenderSlips(); ccGateRefresh();
    }else alert('登録できませんでした: '+((r&&r.error)||'不明'));
  }).catch(function(){ alert('登録に失敗しました（通信エラー）'); });
}
/* 締めの条件。hard=true は満たさないと送信できない */
function ccGateConds_(){
  var st=cashState||{}, dp=ccDayPaySlips_(), C=[];
  // ① 受取人
  var noName=dp.filter(function(s){ return !String(s.payee||'').trim(); });
  var unknown=dp.filter(function(s){ return String(s.payee||'').trim()&&!ccPayeeKnown_(s.payee); });
  var pd='';
  if(noName.length) pd+='受取人が空欄 '+noName.length+'件（'+noName.map(function(s){return '¥'+Number(s.amount).toLocaleString();}).join('・')+'）';
  if(noName.length&&unknown.length) pd+=' / ';
  if(unknown.length) pd+='名簿に無い名前 '+unknown.map(function(s){return '「'+esc(s.payee)+'」';}).join('・');
  if(pd) pd+=' — 誰の日払いか決まらないとTRUSTと突き合わせられません。伝票でない写真（金種メモ・画面のスクショ）は「含める」を外してください。';
  C.push({key:'payee', hard:true, ok:(noName.length===0&&unknown.length===0),
    label:'日払い伝票の受取人がすべて決まっている', detail:pd});
  // ② 金額の食い違い
  var bad=(st.slips||[]).filter(function(s){ return s.source==='read'&&s.include!==false&&s.mismatch&&!s.amountOk; });
  C.push({key:'amount', hard:true, ok:bad.length===0,
    label:'金額とお金が合わない伝票を確認した',
    detail: bad.length?('未確認 '+bad.length+'件 — 受領書の写真を開いて、正しい金額に直すか「確認しました」を押してください。'):'' });
  // ③ TRUSTとの突合
  var t=CC_GATE&&CC_GATE.today;
  if(t&&t.hasTrust){
    C.push({key:'trust', hard:true, ok:!!t.matched,
      label:'TRUSTの日払いと一致している'+(t.perPerson?'（人別）':'（合計）'),
      detail: t.matched?'' : ((t.lines||[]).join(' / ')||('伝票 ¥'+Number(t.slipTotal||0).toLocaleString()+' ／ TRUST ¥'+Number(t.trustTotal||0).toLocaleString()))
        +' — TRUSTを直してから「TRUSTを取り直す」を押してください。' });
  }else{
    C.push({key:'trust', hard:true, ok:!!st.trustConfirmed, selfDeclare:true,
      label:'日払い・経費を TRUST に入力した',
      detail:'TRUSTの数字をまだ取り込めていません。今夜は自己申告で送信できますが、<b style="color:#ffcf7a">「未照合」として記録され、翌日の取り込みで必ず突き合わせます</b>（合わなければ翌日の閉店チェックが止まります）。' });
  }
  // ④ 過去の未照合日
  var un=(CC_GATE&&CC_GATE.unresolved)||[];
  C.push({key:'past', hard:true, ok:un.length===0,
    label:'過去に未照合の日が残っていない',
    detail: un.length?(un.map(function(u){ return u.dateKey.slice(5)+'（'+((u.lines&&u.lines.length)?u.lines.join(' / '):(u.hasTrust?('差 ¥'+Number(u.diff||0).toLocaleString()):'TRUST未取得'))+'）'; }).join('　')
      +' — 管理者にコンソール「📥TRUST取込」で日払いを取り直してもらってください。合えば自動で解けます。'):'' });
  return C;
}

function submitCash(){
  var st=cashState; if(!st.reporterName){ alert('報告者を選択してください'); return; }
  if(!ccGateReady_()){ alert(ccGateBlockMsg_()); var g=document.getElementById('cc-trust-gate'); if(g&&g.scrollIntoView)g.scrollIntoView({behavior:'smooth',block:'center'}); return; }

    alert(ccPosBlockMsg_());

    ? {trustStatus:'照合済み',trustDiff:0,note:(_t.perPerson?'人別':'合計')+'で一致'}
    : {trustStatus:'未照合',trustDiff:(_t&&_t.hasTrust)?Number(_t.diff||0):0,note:(_t&&_t.hasTrust)?'差異あり':'TRUST未取得（黒服の自己申告で送信）'};

    gsr('getCashCheckInit',CC_TARGET_DATE||'').then(function(d){ cashState.init=d; cashState.formMode=false; renderCashCheck(); });

}
